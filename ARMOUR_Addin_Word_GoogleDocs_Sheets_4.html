    /* the icon tile picks the gradient up */
    .pbx-out-ic{
      background:linear-gradient(135deg,#6c4ef5,#c44ec9);color:#fff;
      box-shadow:0 2px 8px -2px #6c4ef56b;
    }
    .pbx-out-ic svg{color:#fff}

    /* the action pill is the gradient at full strength */
    .pbx-out-open{
      background:linear-gradient(120deg,#6c4ef5,#c44ec9);color:#fff;
      box-shadow:0 2px 8px -2px #6c4ef561;
    }
    .pbx-out:hover .pbx-out-open{
      background:linear-gradient(120deg,#5a3ce0,#b23bb8);color:#fff;
    }

    /* once it exists, the gradient cools to green — same language,
       different state, so a made thing never looks like a draft */
    .pbx-result{
      background:
        linear-gradient(var(--panel),var(--panel)) padding-box,
        linear-gradient(115deg,#1fa971 0%,#3fa9a0 55%,#6c4ef5 100%) border-box;
      border:1px solid transparent;
    }
    .pbx-result::before{background:linear-gradient(115deg,#1fa97114 0%,#6c4ef50f 100%)}
    .pbx-result:hover{box-shadow:0 10px 26px -12px #1fa9714d,0 0 0 1px #1fa97133}
    .pbx-result .pbx-result-ic{background:linear-gradient(135deg,#1fa971,#3fa9a0);color:#fff}
    .pbx-result .pbx-result-ic svg{color:#fff}
    .pbx-result .pbx-out-open{background:linear-gradient(120deg,#1fa971,#3fa9a0);color:#fff}
    .pbx-result:hover .pbx-out-open{background:linear-gradient(120deg,#17945f,#2f978f)}

    /* while it's being written the gradient runs, rather than sitting */
    .pbx-result.working{
      background:
        linear-gradient(var(--panel),var(--panel)) padding-box,
        linear-gradient(115deg,#6c4ef5,#c44ec9,#6c4ef5) border-box;
      background-size:auto, 220% 100%;
      animation:pbxFlow 2.4s linear infinite;
    }
    @keyframes pbxFlow{to{background-position:0 0, -220% 0}}
    .pbx-result.working .pbx-result-ic{background:var(--panel);color:var(--accent);box-shadow:none}
    .pbx-result.working::before{background:linear-gradient(115deg,#6c4ef50d,#e2497f0d)}
    .pbx-aux-bar i{background:linear-gradient(90deg,#6c4ef5,#c44ec9,#e2497f)}

    /* the eyebrow gets the accent too */
    .pbx-artifact-lab{color:var(--accent)}
    .pbx-artifact-lab svg{color:var(--accent)}

    /* the uploaded document, as the trigger's own artifact */
    .sd-docfile{
      display:flex;align-items:center;gap:13px;padding:15px 16px;margin-bottom:16px;
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
    }
    .sd-docfile-ic{
      width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(135deg,#6c4ef5,#c44ec9);color:#fff;
      box-shadow:0 2px 10px -3px #6c4ef56b;
    }
    .sd-docfile-ic svg{width:18px;height:18px;color:#fff}
    .sd-docfile-body{flex:1;min-width:0}
    .sd-docfile-t{display:block;font:600 14px var(--font-sans);color:var(--ink)}
    .sd-docfile-s{display:block;font:500 12px var(--font-sans);color:var(--ink-3);margin-top:3px}

    /* ═══════════════════════════════════════════════════════════
       ASSIGNED TASKS — the assignee never saw the run, so the task
       carries the ask, the agent's reasoning and the actions with it.
    ═══════════════════════════════════════════════════════════ */
    .pbx-av-p{
      width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(135deg,#6c4ef5,#c44ec9);color:#fff;
      font:700 10.5px var(--font-sans);letter-spacing:.02em;
    }

    /* runner side: who has it */
    .pbx-assign{
      display:flex;align-items:center;gap:11px;padding:11px 13px;
      border:1px dashed var(--line-strong);border-radius:var(--r-lg);background:var(--surface);
    }
    .pbx-assign-body{flex:1;min-width:0}
    .pbx-assign-t{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .pbx-assign-s{display:block;font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .pbx-assign-s.ok{color:var(--green)}
    .pbx-assign-s.q{color:var(--accent)}
    .pbx-assign-s.r{color:var(--pb-orange)}
    .pbx-assign .pbx-btn{padding:6px 12px;font-size:11.5px}

    /* the task strip inside the record */
    .tk{
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
      padding:16px;margin-bottom:16px;
    }
    .tk.mine{
      border-color:#6c4ef53d;background:linear-gradient(135deg,#6c4ef50a,#e2497f08);
      box-shadow:0 0 0 3px #6c4ef514;
    }
    .tk.done{border-color:#1fa97133;background:var(--green-soft);box-shadow:none}
    .tk-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .tk-kind{
      font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;
    }
    .tk-sp{flex:1}
    .tk-state{font:600 11.5px var(--font-sans);color:var(--pb-orange)}
    .tk-state.done{color:var(--green)}
    .tk-title{font:600 17px 'Fraunces',serif;color:var(--ink);letter-spacing:-.01em}
    .tk-meta{display:flex;align-items:center;gap:9px;margin-top:9px;font:500 12px var(--font-sans);color:var(--ink-2)}
    .tk-meta b{color:var(--ink);font-weight:600}
    .tk-sum{font:500 13px var(--font-sans);color:var(--ink-2);line-height:1.7;margin:12px 0 4px}
    .tk-sum b{color:var(--ink);font-weight:600}
    .tk-reason-toggle{margin-top:6px}
    .tk-note{
      margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel);
      border-left:3px solid var(--accent);font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.6;
    }
    .tk-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .tk-wait{
      display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 12px;border-radius:10px;
      background:var(--panel-3);font:500 12px var(--font-sans);color:var(--ink-3);
    }
    .tk-wait svg{width:13px;height:13px;flex:none}

    /* ── Task Center ── */
    .tc{display:none;flex-direction:column;flex:1;min-height:0;background:var(--bg)}
    .tc-head{
      flex:none;display:flex;align-items:flex-start;gap:16px;padding:26px 28px 18px;
      border-bottom:1px solid var(--line);background:var(--panel);
    }
    .tc-title{font:600 22px 'Fraunces',serif;color:var(--ink);letter-spacing:-.015em}
    .tc-sub{font:500 12.5px var(--font-sans);color:var(--ink-3);margin-top:4px}
    .tc-body{flex:1;min-height:0;overflow-y:auto;padding:20px 28px 40px;max-width:900px}
    .tc-group{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
    .tc-group:first-child{margin-top:0}
    .tc-group-t{font:700 10.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
    .tc-group-n{font:600 11px var(--font-sans);color:var(--ink-3);background:var(--panel-3);padding:1px 7px;border-radius:999px}
    .tc-empty{
      border:1px dashed var(--line);border-radius:var(--r-lg);padding:16px;
      font:500 12.5px var(--font-sans);color:var(--ink-3);
    }
    .tc-row{
      display:flex;align-items:center;gap:13px;width:100%;text-align:left;
      padding:15px 16px;border:1px solid var(--line);border-radius:var(--r-lg);
      background:var(--panel);box-shadow:var(--shadow-card);transition:all .15s;
    }
    .tc-row:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-hover)}
    .tc-row-ic{
      width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .tc-row-ic svg{width:16px;height:16px}
    .tc-row-b{flex:1;min-width:0}
    .tc-row-t{display:block;font:600 13.5px var(--font-sans);color:var(--ink)}
    .tc-row-s{display:block;font:500 12px var(--font-sans);color:var(--ink-3);margin-top:3px}
    .tc-row-meta{flex:none;text-align:right}
    .tc-pill{
      display:inline-block;font:700 10px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;
      padding:3px 9px;border-radius:999px;background:var(--pb-orange-soft);color:var(--pb-orange);
    }
    .tc-pill.done{background:var(--green-soft);color:var(--green)}
    .tc-pill.q{background:var(--accent-soft);color:var(--accent)}
    .tc-pill.r{background:var(--magenta-soft);color:var(--magenta)}
    .tc-row-due{display:block;font:500 11px var(--font-sans);color:var(--ink-3);margin-top:5px}

    /* the persona switcher — a mock affordance, not a real login */
    .pbx-persona{
      margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;
      padding:8px 12px;border:1px solid var(--line);border-radius:999px;
      background:var(--panel);cursor:pointer;transition:border-color .15s;
    }
    .pbx-persona:hover{border-color:var(--accent)}
    .pbx-persona.alt{border-color:#6c4ef53d;background:var(--accent-soft)}
    .pbx-persona-b{min-width:0}
    .pbx-persona-n{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .pbx-persona-r{display:block;font:500 11px var(--font-sans);color:var(--ink-3);margin-top:1px}
    .pbx-persona-sw{font:700 10.5px var(--font-sans);color:var(--accent);white-space:nowrap}

    /* the task as a disclosure: name and instructions, no second set
       of actions competing with the section bar's one */
    .tk{padding:0;overflow:hidden}
    .tk-bar{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      padding:12px 14px;
    }
    .tk-bar:hover{background:var(--hover)}
    .tk-chev{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--ink-3);transition:transform .18s}
    .tk-chev svg{width:11px;height:11px}
    .tk.open .tk-chev{transform:rotate(180deg)}
    .tk-name{font:600 13px var(--font-sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tk-open{display:none;padding:0 14px 15px}
    .tk.open .tk-open{display:block}
    .tk-meta{margin-top:2px}
    .tk-sum{margin:10px 0 0}
    .tk-inst{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
    .tk-inst li{font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.6}
    .tk-inst b{color:var(--ink);font-weight:600}

    /* the artifact and its assignment as one object */
    .pbx-artifact.has-foot .pbx-out{
      border-bottom-left-radius:0;border-bottom-right-radius:0;
    }
    .pbx-artifact.has-foot .pbx-assign{
      margin-top:-1px;border:1px solid var(--line);border-top:none;
      border-radius:0 0 var(--r-lg) var(--r-lg);border-style:solid;
      background:var(--panel);
    }
    .pbx-artifact.has-foot{gap:7px}
    .pbx-artifact.has-foot .pbx-out + .pbx-assign{margin-top:0}

    /* the rail row for a gate someone else owns */
    .pbx-plan-step.owned .pbx-plan-dot{
      background:linear-gradient(135deg,#6c4ef5,#c44ec9);border-color:transparent;color:#fff;
      font:700 9px var(--font-sans);letter-spacing:.02em;
    }
    .pbx-plan-step.owned .pbx-plan-state{background:var(--accent-soft);color:var(--accent)}

    /* the open-task banner at the top of the record */
    .sd-taskbar{
      display:flex;align-items:center;gap:12px;width:100%;text-align:left;
      padding:12px 18px;border-bottom:1px solid var(--line);
      background:linear-gradient(90deg,#d9822b14,#d9822b06);
      transition:background .15s;
    }
    .sd-taskbar:hover{background:linear-gradient(90deg,#d9822b1f,#d9822b0a)}
    .sd-taskbar.mine{background:linear-gradient(90deg,#6c4ef518,#e2497f0a)}
    .sd-taskbar.mine:hover{background:linear-gradient(90deg,#6c4ef524,#e2497f12)}
    .sd-taskbar-b{flex:1;min-width:0}
    .sd-taskbar-t{display:block;font:600 13px var(--font-sans);color:var(--ink)}
    .sd-taskbar-s{display:block;font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .sd-taskbar-pill{
      flex:none;font:700 10.5px var(--font-sans);letter-spacing:.03em;padding:4px 10px;border-radius:999px;
      background:var(--pb-orange-soft);color:var(--pb-orange);white-space:nowrap;
    }
    .sd-taskbar.mine .sd-taskbar-pill{background:var(--accent-soft);color:var(--accent)}

    /* the record's own group, set apart from the run's steps */
    .sd-jump-split{height:1px;background:var(--line-strong);margin:16px 8px 4px}
    .sd-jump-group.record{color:var(--ink-2)}
    .sd-jump-group.record i{background:var(--ink-3)}

    /* the matter rail item names the matter it points at */
    .sd-jump-link{flex-direction:column;align-items:flex-start;gap:2px;padding-top:7px;padding-bottom:7px}
    .sd-jump-lab{
      font:700 9px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    }
    .sd-jump-link{white-space:normal;line-height:1.35}

    /* clickable list rows */
    .sdg-click{cursor:pointer}
    .sdg-click:hover{background:var(--hover)}
    .sdg.hold-list{min-width:820px}
    .sdg.hold-list .sdg-row{grid-template-columns:2fr 1fr .8fr .9fr .9fr 40px}
    .sdg.coll-list{min-width:860px}
    .sdg.coll-list .sdg-row{grid-template-columns:2fr 1fr .7fr .8fr .9fr 40px}

    /* a record section is not a step — no gate colouring */
    .sd-step.plain .sd-step-bar{background:var(--surface)}
    .sd-step.plain .sd-step-pill{background:var(--panel-3);color:var(--ink-3)}

    /* notes */
    .sd-notes{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
    .sd-note{display:flex;gap:11px;background:var(--panel);padding:13px 14px}
    .sd-note-av{
      width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-2);font:700 10px var(--font-sans);
    }
    .sd-note-b{flex:1;min-width:0}
    .sd-note-h{display:flex;align-items:baseline;gap:9px}
    .sd-note-h b{font:600 12.5px var(--font-sans);color:var(--ink)}
    .sd-note-w{font:500 11px var(--font-sans);color:var(--ink-3);margin-left:auto}
    .sd-note-t{display:block;font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.6;margin-top:4px}

    /* ═══════════════════════════════════════════════════════════
       SECTION-PRIMARY RAIL — the record lists what it HAS, and where
       the run got to is a status on the row. Provenance sits under it,
       because a human status and an agent status must not be the same
       field with no way to tell them apart.
    ═══════════════════════════════════════════════════════════ */
    .sd-jump{width:210px;padding:14px 10px;gap:1px}
    .sd-jump-label{
      font:700 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);padding:0 10px 8px;
    }
    .sd-row{
      display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;
      padding:9px 10px;border-radius:10px;transition:background .13s;
    }
    .sd-row:hover{background:var(--hover)}
    .sd-row.current{background:var(--accent-soft)}
    .sd-row-t{
      grid-column:1;display:flex;align-items:center;gap:7px;min-width:0;
      font:600 12.5px var(--font-sans);color:var(--ink);
    }
    .sd-row.current .sd-row-t{color:var(--accent)}
    .sd-row.idle .sd-row-t{color:var(--ink-3);font-weight:500}
    .sd-row-n{font:600 10.5px var(--font-sans);color:var(--ink-3)}
    .sd-row.current .sd-row-n{color:var(--accent)}
    .sd-row-st{
      grid-column:2;justify-self:end;white-space:nowrap;
      font:600 10.5px var(--font-sans);color:var(--ink-3);
    }
    .sd-row-st.done{color:var(--green)}
    .sd-row-st.gate{color:var(--pb-orange)}
    .sd-row-st.warn{color:var(--magenta)}
    .sd-row-by{
      grid-column:1 / -1;font:500 10px var(--font-sans);color:var(--ink-3);opacity:.8;margin-top:-1px;
    }
    .sd-row.idle .sd-row-st{opacity:.7}

    /* the rail row: a dot, a name, a count — nothing else */
    .sd-row{
      display:flex;align-items:center;gap:9px;width:100%;text-align:left;
      padding:9px 10px;border-radius:10px;transition:background .13s;
    }
    .sd-row-t{flex:1;min-width:0;font:600 12.5px var(--font-sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sd-row.idle .sd-row-t{color:var(--ink-3);font-weight:500}
    .sd-row-n{flex:none;font:600 10.5px var(--font-sans);color:var(--ink-3)}
    .sd-row-st,.sd-row-by{display:none}

    .sd-dot{
      width:8px;height:8px;flex:none;border-radius:50%;background:var(--line-strong);
      transition:background .2s,box-shadow .2s;
    }
    .sd-dot.done{background:var(--green)}
    .sd-dot.live{background:var(--pb-orange);box-shadow:0 0 0 3px #d9822b26}
    .sd-dot.idle{background:var(--line-strong)}
    .sd-dot.rec{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)}

    .sd-rail-more{
      display:block;padding:8px 10px 2px;font:500 10.5px var(--font-sans);color:var(--ink-3);opacity:.8;
    }

    /* Task Center hosted as an app pane */
    #pbxTaskPane.tc{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg);padding:0}
    #pbxTaskPane .tc-head{padding:20px 22px 16px}
    #pbxTaskPane .tc-body{padding:18px 22px 40px}

    /* the record's task table */
    .tsk-sum{
      display:flex;flex-wrap:wrap;gap:20px;margin-bottom:14px;padding:12px 14px;
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
      font:500 12px var(--font-sans);color:var(--ink-3);
    }
    .tsk-sum b{font:600 15px var(--font-sans);color:var(--ink);margin-right:5px}
    .tsk-sum .bad b{color:var(--magenta)}
    .sdg.tsk{min-width:1120px}
    .sdg.tsk .sdg-row{grid-template-columns:2.1fr .9fr 1.1fr .9fr 1.1fr .7fr 1.2fr .9fr}
    .sdg-row.tsk-live{background:#6c4ef50a}
    .tsk-who{
      display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
      background:var(--panel-3);color:var(--ink-2);font:700 9px var(--font-sans);margin-right:7px;vertical-align:-4px;
    }
    .sdg-v.bad{color:var(--magenta);font-weight:600}
    .list-status.danger{background:var(--magenta-soft);color:var(--magenta)}

    .bm-nav-badge{
      margin-left:auto;background:var(--magenta);color:#fff;
      font:700 9.5px var(--font-sans);padding:1px 6px;border-radius:999px;
    }
    .tc-blank{
      display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
      padding:48px 24px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);
    }
    .tc-blank svg{width:26px;height:26px;color:var(--ink-3);margin-bottom:4px}
    .tc-blank-t{font:600 14px var(--font-sans);color:var(--ink)}
    .tc-blank-s{font:500 12.5px var(--font-sans);color:var(--ink-3);max-width:340px;line-height:1.6}

    /* ═══════════════════════════════════════════════════════════
       RUN RAIL — one loud thing. The spine fills with colour up to
       where the run has reached, settled rows trade their chip for an
       elapsed time, the live row breathes and says what it's doing,
       and skipped rows step out of the way.
    ═══════════════════════════════════════════════════════════ */
    .pbx-plan-step:not(:last-child) .pbx-plan-rail::after{
      background:var(--line-strong);transition:background .4s var(--std);
    }
    /* the filled portion of the spine */
    .pbx-plan-step.reached:not(:last-child) .pbx-plan-rail::after{
      background:linear-gradient(180deg,#6c4ef5,#c44ec9);
    }
    .pbx-plan-step.isLive:not(:last-child) .pbx-plan-rail::after{
      background:linear-gradient(180deg,#c44ec9,var(--line-strong));
    }

    .pbx-plan-step{padding:8px 0;transition:opacity .2s}
    .pbx-plan-main{flex-direction:column;align-items:stretch;gap:3px}
    .pbx-plan-row{display:flex;align-items:center;gap:8px;min-width:0}

    /* settled: a check and a duration, no chip */
    .pbx-plan-step.done .pbx-plan-dot{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
    .pbx-plan-took{
      flex:none;margin-left:auto;font:500 10.5px var(--font-sans);color:var(--ink-3);
      font-variant-numeric:tabular-nums;
    }

    /* live: taller, haloed, and saying what it's doing */
    .pbx-plan-step.isLive{padding:11px 0}
    .pbx-plan-step.isLive .pbx-plan-title{font-weight:700;color:var(--ink)}
    .pbx-plan-step.live .pbx-plan-dot{
      background:var(--accent);border-color:var(--accent);color:#fff;
      box-shadow:0 0 0 4px #6c4ef524;
    }
    .pbx-plan-step.gate .pbx-plan-dot{box-shadow:0 0 0 4px #d9822b24}
    .pbx-plan-note{
      font:500 10.5px var(--font-sans);color:var(--ink-3);line-height:1.4;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .pbx-plan-state{margin-left:auto}

    /* skipped: out of the way, reason still on the icon */
    .pbx-plan-step.skipped{opacity:.42}
    .pbx-plan-step.skipped:hover{opacity:1}
    .pbx-plan-step.skipped .pbx-plan-title{text-decoration:line-through;text-decoration-color:var(--line-strong)}

    /* queued: quiet, no chip until it starts */
    .pbx-plan-step.queued .pbx-plan-state{display:none}

    /* the finish line */
    .pbx-plan-fin{
      display:flex;align-items:center;gap:9px;margin:14px 2px 0;padding:11px 12px;
      border-radius:12px;background:var(--green-soft);border:1px solid #1fa97133;
      font:500 11px var(--font-sans);color:var(--ink-2);line-height:1.5;
    }
    .pbx-plan-fin b{display:block;font:700 12px var(--font-sans);color:var(--green)}
    .pbx-plan-fin svg{width:14px;height:14px;flex:none;color:var(--green)}
    .pbx-vrail.collapsed .pbx-plan-fin{display:none}

    /* automatic sub-results: an attestation, not an artifact */
    .pbx-auto{display:flex;flex-direction:column;gap:1px;background:var(--line);
      border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
    .pbx-auto-row{display:flex;align-items:flex-start;gap:10px;background:var(--panel);padding:11px 13px}
    .pbx-auto-row svg{width:14px;height:14px;flex:none;margin-top:1px}
    .pbx-auto-row.ok svg{color:var(--green)}
    .pbx-auto-row.bad svg{color:var(--magenta)}
    .pbx-auto-row span{font:500 11.5px var(--font-sans);color:var(--ink-3);line-height:1.5}
    .pbx-auto-row b{display:block;font:600 12.5px var(--font-sans);color:var(--ink);margin-bottom:2px}
    .pbx-auto-row code{
      font-family:var(--font-mono);font-size:11px;background:var(--panel-3);
      padding:1px 5px;border-radius:5px;color:var(--ink-2);
    }
    .pbx-auto-row.bad b{color:var(--magenta)}

    /* ═══════════════════════════════════════════════════════════
       THE TWO RAILS ARE ONE RUN — the thread rail is the order it
       happened in, the record rail is what it produced. Hovering
       either marks its partner; clicking crosses over.
    ═══════════════════════════════════════════════════════════ */
    .pbx-plan-step.link{cursor:pointer;border-radius:8px;transition:background .13s}
    .pbx-plan-step.link:hover{background:var(--hover)}
    .pbx-plan-step.link .pbx-plan-title{text-decoration-color:transparent}

    /* the marked partner on either side */
    .pbx-plan-step.linked,
    .sd-row.linked{
      background:var(--accent-soft);
      box-shadow:inset 2px 0 0 var(--accent);
    }
    .pbx-plan-step.linked{border-radius:8px}

    /* the small link glyph on a section that a step produced */
    .sd-row-run{
      flex:none;width:16px;height:16px;display:grid;place-items:center;
      color:var(--ink-3);opacity:0;transition:opacity .14s,color .14s;
    }
    .sd-row:hover .sd-row-run{opacity:1}
    .sd-row-run:hover{color:var(--accent)}
    .sd-row-run svg{width:12px;height:12px}

    /* ═══════════════════════════════════════════════════════════
       RECORD TABS — one body, three side surfaces. The request reads
       as a single page; the jump row is a shortcut, not the only way
       in. The vertical rail is gone.
    ═══════════════════════════════════════════════════════════ */
    .sd-tabs{
      flex:none;display:flex;align-items:center;gap:2px;padding:0 22px;
      border-bottom:1px solid var(--line);background:var(--panel);
      overflow-x:auto;scrollbar-width:none;
    }
    .sd-tabs::-webkit-scrollbar{height:0}
    .sd-tab{
      flex:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
      padding:12px 13px;margin-bottom:-1px;border-bottom:2px solid transparent;
      font:600 13px var(--font-sans);color:var(--ink-2);
    }
    .sd-tab:hover{color:var(--ink)}
    .sd-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
    .sd-tab-n{font:600 10.5px var(--font-sans);color:var(--ink-3);background:var(--panel-3);padding:1px 6px;border-radius:999px}
    .sd-tab.on .sd-tab-n{color:var(--accent);background:var(--accent-soft)}
    .sd-tab-dot{width:6px;height:6px;border-radius:50%;background:var(--pb-orange)}

    /* the page scrolls as one */
    .sd-body{display:block}
    .sd-scroll{display:block;overflow-y:auto;padding:0 22px 60px}
    .sd-step{flex:none;min-height:0}
    .sd-step-body{overflow:visible;flex:none}

    /* the jump row — deliberately quiet */
    .sd-jumprow{
      position:sticky;top:0;z-index:8;display:flex;flex-wrap:wrap;gap:6px;
      padding:12px 0 10px;background:var(--panel);
    }
    .sd-jumpchip{
      display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
      font:500 11px var(--font-sans);color:var(--ink-3);border:1px solid transparent;
    }
    .sd-jumpchip:hover{color:var(--ink);border-color:var(--line);background:var(--panel-3)}
    .sd-jumpchip .sd-dot{width:6px;height:6px}

    /* ── jump: a dropdown, not a band of chips ── */
    .sd-jumpbar{
      position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;
      padding:10px 0 8px;background:var(--panel);
    }
    .sd-jumpwrap{position:relative}
    .sd-jumpbtn{
      display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
      border:1px solid var(--line);background:var(--panel);font:500 11.5px var(--font-sans);color:var(--ink-2);
    }
    .sd-jumpbtn:hover{border-color:var(--line-strong);color:var(--ink)}
    .sd-jumpbtn-l{color:var(--ink-3)}
    .sd-jumpbtn-v{font-weight:600;color:var(--ink)}
    .sd-jumpbtn svg{width:10px;height:10px;color:var(--ink-3);transition:transform .18s}
    .sd-jumpwrap.open .sd-jumpbtn svg{transform:rotate(180deg)}
    .sd-jumpmenu{
      display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:190px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow-hover);padding:5px;
    }
    .sd-jumpwrap.open .sd-jumpmenu{display:block}
    .sd-jumpitem{
      display:flex;align-items:center;gap:9px;width:100%;text-align:left;
      padding:7px 10px;border-radius:8px;font:500 12px var(--font-sans);color:var(--ink-2);
    }
    .sd-jumpitem:hover{background:var(--hover);color:var(--ink)}
    .sd-jumphint{font:500 11px var(--font-sans);color:var(--ink-3)}

    /* collapsed sections: header only */
    .sd-step.collapsed{margin:8px 0}
    .sd-step.collapsed .sd-step-bar{border-bottom-color:transparent;border-radius:var(--r-lg)}
    .sd-step.collapsed .sd-step-body{display:none}
    .sd-step.collapsed .sd-step-bar:hover{background:var(--hover)}
    .sd-step.open{margin:8px 0 18px}

    /* the section you were sent to */
    .sd-step.sd-flash{box-shadow:0 0 0 2px var(--accent),var(--shadow-hover)}

    /* ═══════════════════════════════════════════════════════════
       FORMS READ AS ROWS — one field per line, label left, value
       right. A four-across grid of stacked label-over-input cards
       made 18 fields look like a wall; a single column of rows reads
       like a record and scans in one pass.
    ═══════════════════════════════════════════════════════════ */
    .sdf-grid{
      display:flex;flex-direction:column;gap:0;
      border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
      background:var(--panel);
    }
    .sdf{
      display:grid;grid-template-columns:210px minmax(0,1fr);
      align-items:center;gap:18px;
      padding:9px 14px;border-bottom:1px solid var(--line);
    }
    .sdf:last-child{border-bottom:none}
    .sdf:hover{background:var(--surface)}
    .sdf.wide{grid-column:auto}

    /* the label sits in its own column, no longer stacked above */
    .sdf-lab{
      align-self:center;gap:8px;flex-wrap:wrap;
      font:500 12.5px var(--font-sans);color:var(--ink-3);letter-spacing:0;text-transform:none;
    }

    /* the value column */
    .sdf input,.sdf textarea,.sdf-view{width:100%;margin-left:0}
    .sdf-view{border-bottom:none;padding:2px 0}
    .sdf textarea{min-height:60px;padding:8px 10px}

    /* boxed mode keeps its field borders, just inside the row */
    .sdf-grid.boxed{background:var(--panel)}
    .sdf-grid.boxed input,.sdf-grid.boxed textarea{padding:8px 11px}

    /* the source-file strip is a row too, spanning both columns */
    .sdf-doc{grid-template-columns:1fr;display:flex;margin:0;border:none;border-radius:0;background:var(--surface)}

    /* the notice body and other long text keep their own full-width block */
    #pbxWorkSlot .sd-notice{margin-top:8px}

    @media (max-width:1080px){
      .sdf{grid-template-columns:150px minmax(0,1fr);gap:12px}
      .sdf-lab{font-size:12px}
    }

    /* ═══════════════════════════════════════════════════════════
       The record scrolls again. Flattening the body to a block broke
       the flex chain that gave the scroller its height, so the page
       grew instead of scrolling.
    ═══════════════════════════════════════════════════════════ */
    .sd-body{flex:1;min-height:0;display:block;overflow:hidden}
    .sd-scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:14px 22px 60px}

    /* the jump control lives on the tab row */
    .sd-tabs{padding-right:16px}
    .sd-tabs-sp{flex:1}
    .sd-tabs .sd-jumpwrap{flex:none;margin-left:8px}
    .sd-tabs .sd-jumpbtn{padding:4px 10px}
    .sd-tabs .sd-jumpmenu{left:auto;right:0}
    .sd-jumpbar{display:none}

    /* ═══════════════════════════════════════════════════════════
       RUN RAIL SURFACE — the hard grey border and flat panel fill made
       it read as a separate pane bolted on. White, with a very faint
       wash toward the thread, and no divider on the right.
    ═══════════════════════════════════════════════════════════ */
    .pbx-vrail{
      border-right:none;
      background:linear-gradient(180deg,#6c4ef50a 0%,var(--panel) 42%,var(--panel) 100%);
    }
    :root[data-theme="dark"] .pbx-vrail{
      background:linear-gradient(180deg,#8b6dff14 0%,var(--panel) 42%,var(--panel) 100%);
    }
    .pbx-vrail-head{border-bottom:none;margin-bottom:2px}
    .pbx-vrail-foot{border-top:none}

    /* the run's own header sheds its rule too */
    .pbx-body{padding-top:36px}

    /* ═══════════════════════════════════════════════════════════
       STEP CARDS — nine identical white rows carried no information
       beyond their labels. Each now states its condition through a
       tinted left edge, a filled mark, a duration, and a wash that
       fades out across the card rather than filling it.
    ═══════════════════════════════════════════════════════════ */
    .pbx-step{
      position:relative;overflow:hidden;
      border-color:var(--line);
      box-shadow:0 1px 2px #1b1a3208,0 1px 1px #1b1a3205;
      transition:box-shadow .16s,border-color .16s,transform .16s;
    }
    .pbx-step::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--line-strong);
    }
    .pbx-step:hover{box-shadow:0 6px 18px -8px #1b1a3226,0 0 0 1px #1b1a320f}

    /* done: green edge, a wash that dies out by a third across */
    .pbx-step.done::before{background:linear-gradient(180deg,#1fa971,#3fa9a0)}
    .pbx-step.done .pbx-step-head{background:linear-gradient(90deg,#1fa9710f,transparent 38%)}
    .pbx-step.done .pbx-step-mark{
      background:linear-gradient(135deg,#1fa971,#3fa9a0);color:#fff;
      box-shadow:0 1px 4px -1px #1fa9715c;
    }
    .pbx-step.done .pbx-step-mark svg{color:#fff}

    /* waiting: amber edge, and the head keeps its tint */
    .pbx-step.gate::before{background:linear-gradient(180deg,#d9822b,#e0902f)}
    .pbx-step.gate .pbx-step-head{background:linear-gradient(90deg,#d9822b1f,#d9822b08 46%,transparent)}
    .pbx-step.gate .pbx-step-mark{
      background:linear-gradient(135deg,#d9822b,#e0a13f);color:#fff;box-shadow:0 1px 4px -1px #d9822b5c;
    }
    .pbx-step.gate .pbx-step-mark svg{color:#fff}

    /* running: accent edge */
    /* only a row that is actually running gets the accent edge —
       :not(.done):not(.gate) also caught every queued row, which is
       why not-started looked the same as in-progress */
    .pbx-step:not(.done):not(.gate):not(.queued)::before{background:linear-gradient(180deg,#6c4ef5,#c44ec9)}
    .pbx-step:not(.done):not(.gate):not(.queued) .pbx-step-head{background:linear-gradient(90deg,#6c4ef512,transparent 40%)}

    .pbx-step-head{padding-left:19px}
    .pbx-step-body{padding-left:19px}
    .pbx-step-title{font-weight:600}
    .pbx-step-took{
      margin-left:auto;font:500 11px var(--font-sans);color:var(--ink-3);
      font-variant-numeric:tabular-nums;
    }
    .pbx-step-state{margin-left:0}

    /* skipped: no edge, no card — it didn't happen */
    .pbx-skip{
      position:relative;padding-left:19px;background:none;
      border-style:dashed;border-color:var(--line);box-shadow:none;
    }
    .pbx-skip::before{
      content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
      background:repeating-linear-gradient(180deg,var(--line-strong) 0 3px,transparent 3px 7px);
    }

    /* the merged header: step name leads, section title and count
       ride underneath as a subline rather than a second bar */
    .sd-step-bar2{align-items:center}
    .sd-step-titles{display:flex;flex-direction:column;gap:1px;min-width:0}
    .sd-step-bar2 .sd-step-name{font-size:15px}
    .sd-step-sub{font:500 11.5px var(--font-sans);color:var(--ink-3)}
    .sd-step-sub i{font-style:normal;color:var(--ink-3)}
    .sd-step-bar2 .pbx-out-open,
    .sd-step-bar2 .sdf-conf{}

    /* ═══════════════════════════════════════════════════════════
       MERGED RUN LIST — the sidebar rail and the chat thread used to
       carry the same plan twice: a dot per step on the left, a card
       per step in the middle, both saying the same title and state.
       One list now. Every step has a row from the moment the run
       starts; running a step upgrades its own row in place.
    ═══════════════════════════════════════════════════════════ */
    .pbx-runhead{
      flex:none;display:flex;align-items:center;gap:10px;padding:44px 20px 12px;
      border-bottom:1px solid var(--line);background:var(--panel);
    }
    .pbx-runhead-name{font:700 13px var(--font-sans);color:var(--ink)}
    .pbx-runhead-state{font:600 12px var(--font-sans);color:var(--ink-2)}
    .pbx-runhead-sp{flex:1}
    .pbx-runhead-btn{
      width:26px;height:26px;flex:none;border-radius:8px;color:var(--ink-3);
      display:grid;place-items:center;transition:background .14s,color .14s;
    }
    .pbx-runhead-btn:hover{background:var(--hover);color:var(--ink)}
    .pbx-runhead-btn svg{width:13px;height:13px}

    /* the body is one column now — the map still overlays it. It must
       stay a flex column: display:block killed the context that gave
       .pbx-scroll its height, so the list grew instead of scrolling. */
    .pbx-body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
    .pbx-scroll{flex:1;min-height:0;width:100%;overflow-y:auto}

    /* a step nobody has reached yet: one quiet line, not clickable */
    .pbx-step.queued{
      box-shadow:none;border-color:var(--line);opacity:.68;cursor:default;
    }
    .pbx-step.queued::before{background:var(--line-strong)}
    .pbx-step.queued .pbx-step-head{cursor:default;background:none}
    .pbx-step.queued .pbx-step-head:hover{background:none}
    .pbx-step.queued .pbx-step-mark{background:var(--panel-3);color:var(--ink-3)}
    .pbx-step.queued .pbx-step-chev{display:none}
    .pbx-step.queued .pbx-step-title{font-weight:500;color:var(--ink-2)}

    /* running in place, before it has real content — the row itself
       pulses rather than a separate "thinking…" bubble owning it */
    .pbx-step.queued.isLive{opacity:1;border-color:#6c4ef53d}
    .pbx-step.queued.isLive::before{background:linear-gradient(180deg,#6c4ef5,#c44ec9)}
    .pbx-step.queued.isLive .pbx-step-mark{
      background:linear-gradient(135deg,#6c4ef5,#c44ec9);color:#fff;
      box-shadow:0 0 0 4px #6c4ef524;
    }
    .pbx-step.queued.isLive .pbx-step-title{color:var(--ink);font-weight:700}
    .pbx-step-note{
      display:block;padding:0 16px 10px 19px;margin-top:-4px;
      font:500 11px var(--font-sans);color:var(--ink-3);
    }

    /* the branch condition sits right beside a queued title, quietly */
    .pbx-step-cond{
      display:inline-flex;align-items:center;gap:5px;margin-left:9px;
      font:600 10.5px var(--font-sans);color:var(--t-play);
    }
    .pbx-step-cond svg{width:10px;height:10px;flex:none}

    /* the whole list is a touch tighter now that every row is always
       present — eleven full-size cards would be a lot of scroll */
    .pbx-in{gap:8px}
    .pbx-step.queued .pbx-step-head{padding:9px 16px 9px 19px}

    /* ═══════════════════════════════════════════════════════════
       STEP TYPE + STATE — a row should answer two questions before
       you read it: what kind of work is this, and where is it. Type
       is a chip (constant for the life of the run); state is the
       card's colour (changes as it runs).
    ═══════════════════════════════════════════════════════════ */
    .pbx-type{
      display:inline-flex;align-items:center;gap:5px;flex:none;
      padding:2px 8px;border-radius:999px;
      font:600 10px var(--font-sans);letter-spacing:.02em;white-space:nowrap;
    }
    .pbx-type svg{width:10px;height:10px}
    .pbx-type.t-event {background:var(--panel-3);color:var(--ink-3)}
    .pbx-type.t-agent {background:#6c4ef514;color:#6c4ef5}
    .pbx-type.t-human {background:#d9822b1a;color:#b86a1d}
    .pbx-type.t-notify{background:#1fa9711a;color:#178a5c}
    .pbx-type.t-system{background:#3fa9a01f;color:#2b8c85}
    .pbx-step.queued .pbx-type{opacity:.6}

    /* ── STATE COLOUR, one language across all three ── */
    /* not started: no fill, grey edge, nothing shouting */
    .pbx-step.queued{
      background:var(--panel);border-color:var(--line);opacity:1;
    }
    .pbx-step.queued::before{background:var(--line-strong)}
    .pbx-step.queued .pbx-step-head{background:none}
    .pbx-step.queued .pbx-step-state{background:var(--panel-3);color:var(--ink-3)}
    .pbx-step.queued .pbx-step-title{color:var(--ink-3);font-weight:500}

    /* in progress: accent edge and a live tint that actually reads */
    .pbx-step.queued.isLive{
      border-color:#6c4ef54d;background:linear-gradient(90deg,#6c4ef50f,transparent 55%);
      box-shadow:0 0 0 3px #6c4ef514;
    }
    .pbx-step.queued.isLive .pbx-step-state{background:#6c4ef51f;color:#6c4ef5}

    /* waiting on a person: amber, distinct from both */
    .pbx-step.gate .pbx-step-state{background:#d9822b1f;color:#b86a1d}

    /* completed: green edge, quiet fill */
    .pbx-step.done .pbx-step-state{background:#1fa9711a;color:#178a5c}

    /* ── MANUAL TASK TEMPLATE — no agent, no reasoning, no artifact.
       A recap of what you're deciding on, one question, two answers. ── */
    .pbx-manual{
      border:1px solid var(--line);border-radius:var(--r-lg);
      background:var(--surface);padding:14px;
    }
    .pbx-manual-recap{
      border:1px solid var(--line);border-radius:12px;background:var(--panel);
      padding:11px 13px;margin-bottom:14px;
    }
    .pbx-manual-recap-t{
      font:700 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:8px;
    }
    .pbx-manual-row{
      display:flex;align-items:baseline;gap:12px;padding:4px 0;
      font:500 12px var(--font-sans);color:var(--ink-3);
    }
    .pbx-manual-row span{min-width:110px;flex:none}
    .pbx-manual-row b{font-weight:600;color:var(--ink)}
    .pbx-manual-q{font:600 13.5px var(--font-sans);color:var(--ink);margin-bottom:10px}
    .pbx-manual-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
    .pbx-manual-opt{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      padding:10px 13px;border:1px solid var(--line);border-radius:11px;
      background:var(--panel);font:500 13px var(--font-sans);color:var(--ink);
    }
    .pbx-manual-opt:hover{border-color:var(--line-strong)}
    .pbx-manual-opt.on{border-color:#d9822b;background:#d9822b0f;font-weight:600}
    .pbx-manual-radio{
      width:15px;height:15px;flex:none;border-radius:50%;
      border:1.7px solid var(--line-strong);display:grid;place-items:center;
    }
    .pbx-manual-opt.on .pbx-manual-radio{border-color:#d9822b}
    .pbx-manual-opt.on .pbx-manual-radio::after{
      content:'';width:7px;height:7px;border-radius:50%;background:#d9822b;
    }
    .pbx-manual-actions{display:flex;align-items:center;gap:11px}
    .pbx-manual-hint{font:500 11px var(--font-sans);color:var(--ink-3)}
    .pbx-manual-done{
      display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
      font:500 11.5px var(--font-sans);
    }
    .pbx-manual-done.ok{background:#1fa9711a;color:var(--ink-2)}
    .pbx-manual-done.no{background:#d9822b1a;color:var(--ink-2)}
    .pbx-manual-done b{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .pbx-manual-done svg{width:15px;height:15px;flex:none}
    .pbx-manual-done.ok svg{color:#178a5c}
    .pbx-manual-done.no svg{color:#b86a1d}

    /* not started: neutral through and through, and visibly lighter
       than anything that has actually happened */
    .pbx-step.queued{background:var(--surface);border-color:var(--line)}
    .pbx-step.queued::before{background:var(--line);width:3px}
    .pbx-step.queued .pbx-step-mark{
      background:none;box-shadow:inset 0 0 0 1.5px var(--line-strong);color:transparent;
    }
    .pbx-step.queued .pbx-step-title{color:var(--ink-3)}
    /* except when it is the one running — that keeps the accent */
    .pbx-step.queued.isLive{background:linear-gradient(90deg,#6c4ef50f,transparent 55%)}
    .pbx-step.queued.isLive::before{background:linear-gradient(180deg,#6c4ef5,#c44ec9)}
    .pbx-step.queued.isLive .pbx-step-mark{
      background:linear-gradient(135deg,#6c4ef5,#c44ec9);color:#fff;box-shadow:0 0 0 4px #6c4ef524;
    }
    .pbx-step.queued.isLive .pbx-step-title{color:var(--ink)}

    /* a row that leads somewhere says so on hover */
    .pbx-step.opens-right .pbx-step-head{cursor:pointer}
    .pbx-step.opens-right .pbx-step-chev{transform:rotate(-90deg)}
    .pbx-step.opens-right:hover{border-color:var(--accent)}

    /* the approval task at the head of the record's Tasks tab */
    .tsk-appr{
      border:1px solid #d9822b3d;border-radius:var(--r-lg);
      background:linear-gradient(180deg,#d9822b0a,transparent 60%);
      padding:14px;margin-bottom:18px;
    }
    .tsk-appr-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .tsk-appr-t{font:600 15px 'Fraunces',serif;color:var(--ink)}
    .tsk-appr-pill{
      margin-left:auto;font:600 10.5px var(--font-sans);padding:3px 9px;border-radius:999px;
      background:#d9822b1f;color:#b86a1d;
    }
    .tsk-appr .pbx-manual{border:none;background:none;padding:0}

    /* skipped: the same row shape as everything else, just quieter —
       dashed edge, muted mark, struck title, reason behind the fold */
    .pbx-step.skipped{
      background:var(--surface);border-color:var(--line);border-style:dashed;
      box-shadow:none;opacity:.72;
    }
    .pbx-step.skipped:hover{opacity:1;border-color:var(--line-strong)}
    .pbx-step.skipped::before{
      background:repeating-linear-gradient(180deg,var(--line-strong) 0 3px,transparent 3px 7px);
    }
    .pbx-step.skipped .pbx-step-mark{
      background:none;box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--ink-3);
    }
    .pbx-step.skipped .pbx-step-mark svg{width:11px;height:11px}
    .pbx-step.skipped .pbx-step-title{
      color:var(--ink-3);font-weight:500;
      text-decoration:line-through;text-decoration-color:var(--line-strong);
    }
    .pbx-step.skipped .pbx-step-state{background:var(--panel-3);color:var(--ink-3)}
    .pbx-step.skipped .pbx-step-body{padding-top:2px}
    .pbx-step.skipped .pbx-skip-why{
      font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.55;margin-bottom:6px;
    }
    .pbx-step.skipped .pbx-skip-cond{
      display:flex;align-items:center;gap:6px;font:600 11px var(--font-sans);color:var(--ink-3);
    }
    .pbx-step.skipped .pbx-skip-cond svg{width:11px;height:11px;flex:none}

    /* section pills, right on the tab row — no dropdown, one click */
    .sd-tabs .sd-jumpwrap{
      display:flex;align-items:center;gap:4px;margin-left:8px;
      overflow-x:auto;scrollbar-width:none;max-width:60%;
    }
    .sd-tabs .sd-jumpwrap::-webkit-scrollbar{height:0}
    .sd-jumpitem{
      display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;
      padding:5px 11px;border-radius:999px;border:1px solid transparent;
      font:500 11.5px var(--font-sans);color:var(--ink-3);
    }
    .sd-jumpitem:hover{color:var(--ink);border-color:var(--line)}
    .sd-jumpitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .sd-jumpitem .sd-dot{width:6px;height:6px}
    /* the retired dropdown shell — kept harmless if anything still refs it */
    .sd-jumpbtn,.sd-jumpmenu{display:none}

    /* ═══════════════════════════════════════════════════════════
       CARD TEMPLATES — the sub-line is the same slot in every type;
       only what it states changes.
    ═══════════════════════════════════════════════════════════ */
    .pbx-step-meta:empty{display:none}
    .pbx-step-meta{padding:0 16px 10px 19px;margin-top:-5px}
    .pbx-meta{font:500 11.5px var(--font-sans);color:var(--ink-3);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

    /* notification: an unread marker, because "new" is the point */
    .pbx-new{
      font:700 9px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;
      background:#6c4ef5;color:#fff;padding:2px 6px;border-radius:999px;
    }

    /* system action: did it work */
    .pbx-sysres{font:700 9.5px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
    .pbx-sysres.ok{background:#1fa9711a;color:#178a5c}
    .pbx-sysres.bad{background:var(--magenta-soft);color:var(--magenta)}

    /* agent + task: two statuses, because they answer different
       questions — what the machine did, and whether a person agreed */
    .pbx-dual{display:inline-flex;gap:16px;flex-wrap:wrap}
    .pbx-dual-i{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-sans);color:var(--ink-3)}
    .pbx-dual-i b{font-weight:600;color:var(--ink-3)}
    .pbx-dual-v{font-weight:700;padding:1px 7px;border-radius:999px;background:var(--panel-3);color:var(--ink-3)}
    .pbx-dual-v.ok{background:#1fa9711a;color:#178a5c}
    .pbx-dual-v.live{background:#6c4ef51f;color:#6c4ef5}
    .pbx-dual-v.wait{background:#d9822b1f;color:#b86a1d}

    /* the human's brief, above the agent's narration */
    .pbx-brief{
      border:1px solid #d9822b30;border-radius:12px;
      background:linear-gradient(180deg,#d9822b0d,transparent 70%);
      padding:11px 13px;
    }
    .pbx-brief-h{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
    .pbx-brief-t{font:700 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:#b86a1d}
    .pbx-brief-who{margin-left:auto;font:500 11px var(--font-sans);color:var(--ink-3)}
    .pbx-brief-b{font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.6}

    /* the status pane retired — a one-line "Scope · waiting on you ·
       7 done · 1 skipped" summary said less than the flow map already
       shows accurately. What's left is a thin strip for the two
       controls that still earn a place here. */
    .pbx-runhead.pbx-runhead-slim{
      padding:16px 14px 8px;border-bottom:none;background:transparent;
    }


    /* ═══════════════════════════════════════════════════════
       THE RUN VIEW

       A subpoena arrives and a workflow picks it up. This is the
       person watching it work. One spine; finished steps are one
       line each, the one that needs them is open and holds the only
       thing on screen they can act on.
    ═══════════════════════════════════════════════════════ */
    /* ═══════════════════════════════════════════════════════
       THE RUN — a quiet grey page with white cards on it, the same
       shape the hold builder uses for its sections. A run is a thing
       made of parts you work through, and it should look like one.
    ═══════════════════════════════════════════════════════ */
    .rn{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--panel)}
    .rn-top{display:flex;align-items:center;gap:12px;padding:10px 26px;flex:none;
      background:var(--panel);border-bottom:1px solid var(--line)}
    .rn-back{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
      border-radius:50%;border:0;background:none;color:var(--ink-3);cursor:pointer}
    .rn-back svg{width:15px;height:15px}
    .rn-back:hover{background:var(--hover);color:var(--ink)}
    /* the route, merged out of the panel head and onto the title line */
    .rn-route{display:flex;align-items:center;gap:6px;flex:none;
      font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .rn-route button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
    .rn-route button:hover{color:var(--accent)}
    .rn-route i{font-style:normal;opacity:.45}
    /* the record owns its whole header, controls included */
    .armour-library-panel.rn-owns-head .armour-library-panel-head{display:none}
    .rn-title{flex:0 1 auto;min-width:0;font-family:var(--font-display,inherit);
      font-size:18px;font-weight:650;letter-spacing:-.02em;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rn-badge{flex:none;font-size:10.5px;font-weight:650;letter-spacing:.02em;padding:2px 9px;
      border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent)}
    /* the deadline is the number that actually matters */
    .rn-due{display:inline-flex;align-items:center;gap:7px;flex:none;padding:5px 12px;
      border-radius:var(--r-pill);background:var(--pb-orange-soft);color:var(--pb-orange);
      font:600 12px var(--font-sans);white-space:nowrap}
    .rn-due svg{width:13px;height:13px;flex:none}
    .rn-due b{font-weight:750}
    .rn-prog{display:flex;align-items:center;gap:9px;flex:none}
    .rn-prog-n i{font-style:normal;opacity:.45;margin:0 1px}
    .rn-prog-track{display:block;width:96px;height:4px;border-radius:3px;background:var(--track)}
    .rn-prog-track i{display:block;height:100%;border-radius:3px;
      background:linear-gradient(90deg,var(--orange),var(--magenta));
      transition:width .45s var(--enter)}
    .rn-prog-n{font-size:12px;color:var(--ink-3)}
    .rn .rn-sp{flex:1 1 auto}
    /* one cluster with hairlines between, rather than four identical
       outlined pills sitting in a row */
    .rn-tabs{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:var(--r-pill);
      background:var(--surface);overflow:hidden}
    .rn-tabs button{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:0;
      border-left:1px solid var(--line);background:none;cursor:pointer;white-space:nowrap;
      font:600 12px var(--font-sans);color:var(--ink-3)}
    .rn-tabs button:first-child{border-left:0}
    .rn-tabs button svg{width:14px;height:14px;flex:none;opacity:.85}
    .rn-tabs button b{font-weight:750;font-size:10.5px;padding:1px 6px;border-radius:var(--r-pill);
      background:var(--panel-3);color:var(--ink-3)}
    .rn-tabs button:hover{background:var(--hover);color:var(--ink)}
    .rn-tabs button.on{background:var(--accent-soft);color:var(--accent)}
    .rn-tabs button.on b{background:#7a4fd621;color:var(--accent)}
    @media (max-width:1240px){
      .rn-tabs button>span{display:none}
      .rn-tabs button{padding:7px 11px}
    }

    .rn-scroll{flex:1;min-height:0;overflow-y:auto;padding:20px 26px 140px}
    /* ═══ THE CASE, AND ITS STEPS ═══
       The request states itself once at the top; the steps hang off
       it on a spine, so they read as belonging to it rather than as
       fifteen loose cards on a grey field. */
    /* the case reads as a hero the way the hold detail's does — a
       tinted band it owns, rather than text floating on the page */
    .cs{max-width:1000px;margin:12px auto 0;padding:20px 24px 22px;position:relative;
      overflow:hidden;border:1px solid var(--line);border-radius:var(--r-xl);
      background:linear-gradient(135deg,#7a4fd612 0%,#e23d7d0a 46%,#7a4fd603 100%),var(--panel-3)}
    .cs:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
      background:linear-gradient(180deg,var(--orange),var(--magenta))}
    .cs-t{margin:0 0 8px;font-family:var(--font-display,inherit);font-size:25px;font-weight:650;
      letter-spacing:-.026em;color:var(--ink);line-height:1.18}
    .cs-s{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2);max-width:88ch}
    .cs-due{font-weight:650;color:var(--pb-orange);white-space:nowrap}
    .rn-lead{max-width:1000px;margin:26px auto 12px;padding:0 26px;
      display:flex;align-items:baseline;gap:11px}
    .rn-lead-t{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
    .rn-lead-s{font-size:12px;color:var(--ink-3)}

    .rn-list{list-style:none;margin:0 auto;padding:0 4px;max-width:1000px;
      display:flex;flex-direction:column;gap:8px;position:relative}

    /* the card */
    .rc{position:relative;padding-left:30px}
    .rc:before{content:"";position:absolute;left:13px;top:-8px;bottom:-8px;width:1.5px;
      background:var(--line)}
    .rc:first-child:before{top:24px}
    .rc:last-child:before{bottom:auto;height:32px}
    .rc-in{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
      padding:15px 20px;border:1px solid var(--line);border-radius:var(--r-lg);
      background:var(--panel);color:var(--ink);
      transition:background var(--fast) var(--std),border-color var(--standard) var(--std)}
    .rc-in:hover:not(:disabled){background:var(--surface);border-color:var(--line-strong)}
    .rc-in:disabled{cursor:default;background:none;border-style:dashed}
    /* the mark sits on the spine, half outside the card */
    .rc-mark{position:absolute;left:0;top:50%;transform:translateY(-50%);
      width:27px;height:27px;flex:none;border-radius:50%;display:flex;align-items:center;
      justify-content:center;background:var(--panel-3);color:var(--ink-3);
      box-shadow:0 0 0 4px var(--panel)}
    .rc-mark svg{width:14px;height:14px}
    .rc.done .rc-mark{background:var(--green);color:#fff}
    .rc.gate .rc-mark{background:var(--pb-orange);color:#fff}
    .rc.live .rc-mark{background:var(--accent-soft);color:var(--accent)}
    .rc.skipped .rc-mark{background:var(--panel-3);color:var(--ink-3)}
    .rc-pip{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
    .rc-b{display:flex;flex-direction:column;gap:5px;flex:1 1 auto;min-width:0}
    .rc-t{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:650;
      letter-spacing:-.012em;color:var(--ink)}
    .rc-pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--r-pill);
      background:var(--green-soft);color:var(--green)}
    .rc-pill.wait{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .rc-s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
    .rc.ahead .rc-t{color:var(--ink-3);font-weight:600}
    .rc.skipped .rc-t{color:var(--ink-3);text-decoration:line-through}
    .rc-act{flex:none;font-size:13px;font-weight:650;color:var(--accent)}
    .rc-act.go{color:var(--pb-orange)}
    .rc-act.live{color:var(--accent);font-weight:600}
    .rc.gate .rc-in{border-color:#e0902f7a;box-shadow:0 0 0 3px var(--pb-orange-soft);
      background:linear-gradient(180deg,#e0902f0a,#fff0)}
    .rc.live .rc-in{border-color:#7a4fd659}

    .rn-foot{display:flex;align-items:flex-start;gap:10px;max-width:1000px;margin:20px auto 0;
      padding:0 4px 0 34px;font-size:12.5px;line-height:1.5;color:var(--ink-3)}
    .rn-foot svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--green)}

    /* ═══ A STEP IS A PLACE ═══
       Four blocks, always the same order: the task, the output the
       run produced, and the decision. Each one announces itself, so
       the page has a shape before anyone reads a word of it. */
    /* the trail runs into the title on the same line, so it ends with
       its own separator rather than a current segment */
    .rn-crumb{display:flex;align-items:center;gap:7px;flex:none}
    .rn-crumb:after{content:"/";color:var(--line-strong);font-size:12px;
      margin-left:1px;user-select:none}
    .rn-crumb-l{font-size:12px;font-weight:600;color:var(--ink-3);background:none;border:0;
      padding:3px 6px;border-radius:var(--r-sm);cursor:pointer}
    .rn-crumb-l:hover{color:var(--accent);background:var(--accent-soft)}
    .rn-crumb-s{color:var(--line-strong);font-size:12px;user-select:none}
    .rn-crumb-c{font-size:12px;font-weight:650;color:var(--ink)}

    /* A step page holds its shape: the question stays at the top, the
       commitment stays at the foot, and only the thing you are
       reviewing moves. Scrolling a form away from the button that
       submits it is how people lose their place. */
    /* A step is one thing. The header, the task, what the agent made
       and the decision are its parts — so they share a surface and
       are divided by rules, not floated apart as separate cards. */
    /* One card. The header, the task, what the agent made and the
       decision are its parts — bounded together, with the decision
       as the card's own footer rather than something pinned to the
       bottom of the window with a gap above it. */
    .rn-stage{flex:1;min-height:0;display:flex;justify-content:center;background:var(--panel);
      padding:16px 20px 20px;overflow:hidden}
    .sp{display:flex;flex-direction:column;flex:1;min-height:0;max-width:1040px;width:100%;
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
      box-shadow:var(--shadow-card);overflow:hidden}
    .sp-fixed{flex:none;padding:16px 28px 0}
    .sp-scroll{flex:1;min-height:0;overflow-y:auto;padding:0}
    .sp-block.sp-foot{flex:none;margin:0;border-top:1px solid var(--line);
      box-shadow:0 -8px 20px -16px #1c1e2e26}
    .sp-block.sp-foot .sp-block-h{border-radius:0}
    .sp-block.sp-foot .sp-block-b{max-height:32vh;overflow-y:auto}

    /* ── the step's own header: identity, then the facts as a strip ── */
    .sp-head{padding:0 0 12px;margin:0}
    .sp-head-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:6px}
    /* the facts, inline, in the space the title wasn't using */
    .sp-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);
      min-width:0;padding-left:4px}
    .sp-meta i{font-style:normal;opacity:.5}
    .sp-n{width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:12px;font-weight:700;background:var(--accent-soft);
      color:var(--accent);font-variant-numeric:tabular-nums}
    .sp-title{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em;color:var(--ink)}
    .sp-state{font-size:11px;font-weight:700;letter-spacing:.02em;padding:4px 11px;
      border-radius:var(--r-pill);background:var(--panel-3);color:var(--ink-3);white-space:nowrap}
    .sp-state.done{background:var(--green-soft);color:var(--green)}
    .sp-state.gate{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sp-state.live{background:var(--accent-soft);color:var(--accent)}
    .sp .rn-sp{flex:1 1 auto}
    /* facts as one strip with hairline dividers, so they read as a
       row of related things rather than three stray labels */
    .rn-page-facts{display:flex;align-items:stretch;flex-wrap:wrap;gap:0;
      border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
      overflow:hidden}
    .rn-page-facts>span{display:flex;flex-direction:column;gap:4px;min-width:0;
      padding:11px 20px;border-left:1px solid var(--line);flex:0 1 auto}
    .rn-page-facts>span:first-child{border-left:0}
    .rn-page-facts>span.wide{flex:1 1 240px}
    .rn-page-facts b{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink-3)}
    .rn-page-facts em{font-style:normal;font-size:13px;font-weight:550;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rn-page-facts em i{font-style:normal;color:var(--ink-3);margin:0 6px}
    .rn-page-facts .wide em{white-space:normal;font-weight:500;color:var(--ink-2)}

    /* ── 1. the task. The loudest thing on the page, and the widest. ── */
    .sp-task{position:relative;padding:16px 28px 18px;margin:0 -28px;
      border-top:1px solid var(--line);border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#7a4fd60d 0%,#7a4fd603 100%)}
    .sp-task:before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:3px;
      background:linear-gradient(180deg,var(--orange),var(--magenta))}
    /* the task leads with the task; the tag sits out of the way */
    .sp-task-h{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
    .sp-kicker{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;
      font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:var(--accent)}
    .sp-kicker:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .sp-task .rn-task{margin:0;font-size:19px;font-weight:650;letter-spacing:-.018em;
      line-height:1.32;color:var(--ink);min-width:0}
    .sp-task .rn-do{max-width:none;font-size:14px;line-height:1.64;color:var(--ink-2)}
    /* provenance trails the description rather than opening a new zone */
    .sp-task .rn-prov{display:inline;margin:0;padding:0;border:0;white-space:normal;
      color:var(--ink-3)}
    .sp-task .rn-prov svg{display:inline-block;vertical-align:-2px;margin:0 5px 0 3px}

    /* 2 — what the run produced. A panel you read. */
    .sp-block{border:0;border-radius:0;margin:0;background:var(--panel)}
    .sp-block-h{display:flex;align-items:baseline;gap:10px;padding:10px 28px;position:sticky;
      top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}
    .sp-block-l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-2)}
    .sp-block-by{font-size:11px;color:var(--ink-3)}
    .sp-block-h .rn-sp{flex:1 1 auto}
    .sp-block-go{display:inline-flex;align-items:center;gap:6px;border:0;background:none;
      padding:0;cursor:pointer;font:600 11.5px var(--font-sans);color:var(--accent);
      align-self:center}
    .sp-block-go svg{width:12px;height:12px}
    .sp-block-go:hover{text-decoration:underline;text-underline-offset:2px}
    .sp-block-b{padding:18px 28px 24px}

    /* 3 — the decision. Set apart, because it is the only thing here
       that changes the world. */
    .sp-block.decide .sp-block-h{background:var(--pb-orange-soft);border-bottom:0}
    .sp-block.decide .sp-block-l{color:var(--pb-orange)}
    .sp-act{display:flex;align-items:center;gap:10px;padding:13px 28px 16px}
    .sp-block.decide .sp-block-b+.sp-act{border-top-color:var(--line)}
    .sp-block.decide .sp-block-b{padding-bottom:4px}
    /* two choices don't need a metre of card each */
    .sp-block.decide .sd-opts{grid-template-columns:max-content max-content;gap:10px;
      margin-bottom:0}
    .sp-block.decide .sd-opt{min-width:148px}

    /* authenticity: the assessment reads, the choice acts */
    .au-out{display:flex;flex-direction:column;gap:16px}
    .au-conf{display:flex;align-items:center;gap:11px;padding:10px 15px;border-radius:var(--r-md);
      background:var(--green-soft);color:var(--green);align-self:flex-start}
    .au-conf.warn{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .au-conf-ic{display:flex;flex:none}
    .au-conf-ic svg{width:16px;height:16px}
    .au-conf-b{display:flex;align-items:baseline;gap:6px}
    .au-conf-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
    .au-conf-l{font-size:11px;font-weight:600;opacity:.8}
    .au-conf-bar{width:90px;height:3px;border-radius:2px;background:#0000001a;overflow:hidden}
    .au-conf-bar i{display:block;height:100%;background:currentColor}
    .au-note{font-size:13px;line-height:1.68;color:var(--ink-2)}
    .au-note p{margin:0 0 12px}
    .au-note p:last-child{margin-bottom:0}

    /* ═══ VAULT — what the request produced ═══ */
    .rn-vault{max-width:1180px;margin:0 auto}
    .rn-vault-h{font-size:12px;color:var(--ink-3);margin-bottom:12px}
    .rn-tbl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
      background:var(--panel)}
    .rn-tr{display:grid;grid-template-columns:minmax(0,2fr) 130px minmax(0,1.4fr) 120px 80px 24px;
      align-items:center;gap:16px;width:100%;padding:12px 16px;background:none;border:0;
      border-top:1px solid var(--line);text-align:left;font-size:12.5px;color:var(--ink);
      cursor:pointer}
    .rn-tr:first-child{border-top:0}
    .rn-tr.head{background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--ink-3);cursor:default}
    .rn-tr:not(.head):hover{background:var(--hover)}
    .rn-tr>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rn-tr-n{display:flex;align-items:center;gap:9px;font-weight:600}
    .rn-tr-n svg{width:14px;height:14px;flex:none;color:var(--accent)}
    .rn-tr .dim{color:var(--ink-3)}

    /* THE TASK — a gate opens with the verb, not with what the agent
       concluded. Provenance sits at the foot, quietly. */
    .rn-ask{margin-bottom:26px}
    .rn-task{font-size:18px;font-weight:650;letter-spacing:-.016em;color:var(--ink);
      line-height:1.35;margin-bottom:9px}
    .rn-do{font-size:13.5px;line-height:1.62;color:var(--ink-2);margin:0}
    .rn-do b{color:var(--ink);font-weight:650}
    .rn-prov{display:flex;align-items:flex-start;gap:8px;margin-top:16px;font-size:12px;
      line-height:1.5;color:var(--ink-3)}
    .rn-prov svg{width:13px;height:13px;flex:none;margin-top:2px;color:var(--t-agent)}
    .rn-prov button{font:inherit;font-weight:600;color:var(--accent);background:none;border:0;
      padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
    .rn-prov button:hover{color:var(--orange-deep)}

    .rn-act{display:flex;align-items:center;gap:10px}
    .rn-btn{font-size:13px;font-weight:600;padding:9px 17px;border-radius:var(--r-pill);
      border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer;
      display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
    .rn-btn:hover{border-color:var(--ink-3)}
    .rn-btn svg{width:13px;height:13px;flex:0 0 13px}
    .rn-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
    .rn-btn.primary:hover{background:var(--orange-deep)}
    .rn-btn.ghost{background:none}
    .rn-btn.quiet{border:0;background:none;color:var(--ink-3);padding:8px 11px}
    .rn-btn.quiet:hover{color:var(--accent);background:var(--accent-soft)}

    /* a running step says it is running and points at chat — the
       agent's own narration belongs in the agent's own room */
    .rn-working{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-2)}
    .rn-working .pbx-spin.big{width:20px;height:20px;flex:none}
    .rn-working-b{display:flex;flex-direction:column;gap:3px;min-width:0}
    .rn-working-t{font-size:13.5px;font-weight:650;color:var(--ink)}
    .rn-working-s{font-size:12.5px;color:var(--ink-3)}
    .rn-bar{flex:1;max-width:240px;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
    .rn-bar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
    .rn-note{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
    .rn-note.dim{color:var(--ink-3)}
    .rn-mode{margin-bottom:14px}

    /* ═══ AUTHENTICITY — a two-field form. The decision, with the
       agent's confidence beside it as evidence, and the reason it
       gave, which is read, not edited. ═══ */
    .au{display:flex;flex-direction:column;gap:22px}
    .au-f{display:flex;flex-direction:column;gap:10px}
    .au-l{display:flex;align-items:baseline;gap:9px;font-size:10.5px;font-weight:700;
      letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
    .au-l-note{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:none;
      color:var(--ink-3);opacity:.75}
    .au-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .au-conf{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-md);
      background:var(--green-soft);color:var(--green)}
    .au-conf.warn{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .au-conf-ic{display:flex;flex:none}
    .au-conf-ic svg{width:16px;height:16px}
    .au-conf-b{display:flex;align-items:baseline;gap:6px}
    .au-conf-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
    .au-conf-l{font-size:11px;font-weight:600;opacity:.8}
    .au-conf-bar{width:80px;height:3px;border-radius:2px;background:#0000001a;overflow:hidden}
    .au-conf-bar i{display:block;height:100%;background:currentColor}
    .au-note{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
      padding:14px 16px;font-size:13px;line-height:1.65;color:var(--ink-2);max-height:260px;
      overflow-y:auto}
    .au-note p{margin:0 0 11px}
    .au-note p:last-child{margin-bottom:0}
    .rn-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;
      border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;
      color:var(--ink)}
    .rn-link:hover{border-color:var(--accent);background:var(--accent-soft)}
    .rn-link-ic{width:18px;height:18px;flex:none;color:var(--accent)}
    .rn-link-ic svg{width:18px;height:18px}
    .rn-link>svg{width:13px;height:13px;margin-left:auto;flex:none;color:var(--ink-3)}
    .rn-link-t{display:block;font-size:13px;font-weight:600}
    .rn-link-s{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}

    /* ═══ THE AGENT'S SIDE
       Chat holds one kind of thing: an agent that was invoked. Each
       one is a card, numbered to match its row on the right, so a
       reader scrolling past knows which step they are looking at and
       can get to it in one click. ═══ */
    .ag{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      overflow:hidden;box-shadow:var(--shadow-card);
      transition:border-color var(--standard) var(--std),box-shadow var(--standard) var(--std)}
    /* the one that is running is the one you should be looking at */
    .ag.working{border-color:#7a4fd659;box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-card)}
    .ag.folded .ag-b{display:none}
    .ag.folded .ag-h{border-bottom-color:transparent}
    .ag-chev{flex:none;display:flex;color:var(--ink-3);transition:transform var(--fast) var(--std)}
    .ag-chev svg{width:12px;height:12px}
    .ag.folded .ag-chev{transform:rotate(-90deg)}
    .ag+.ag{margin-top:2px}
    .ag-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;
      background:var(--surface);border:0;border-bottom:1px solid var(--line);
      cursor:pointer;text-align:left;color:var(--ink)}
    .ag-h:hover{background:var(--hover)}
    .ag-num{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;
      background:var(--t-agent-soft);color:var(--t-agent)}
    .ag.settled .ag-num{background:var(--green-soft);color:var(--green)}
    .ag.handed .ag-num{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .ag-t{font-size:12.5px;font-weight:650;letter-spacing:-.005em}
    .ag .ag-sp{flex:1 1 auto}
    .ag-st{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);flex:none;
      max-width:180px}
    .ag-st-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ag-st .pbx-spin{width:11px;height:11px}
    .ag.working .ag-st{color:var(--accent)}
    .ag-fin{font-size:11.5px;font-weight:600}
    .ag.settled .ag-fin{color:var(--green)}
    .ag.handed .ag-fin{color:var(--pb-orange)}
    .ag-go{flex:none;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600;
      color:var(--ink-3);opacity:0;transition:opacity var(--fast) var(--std)}
    .ag-go svg{width:11px;height:11px}
    .ag-h:hover .ag-go{opacity:1;color:var(--accent)}
    .ag-b{display:flex;flex-direction:column;gap:0;padding:0}
    .ag-req{order:0}
    .ag-sec[data-part="reasoning"]{order:1}
    .ag-sec[data-part="output"]{order:2}
    .ag-out-b{display:flex;flex-direction:column;gap:11px}
    .ag-b:empty{display:none}
    .ag-sum{font-size:13px;line-height:1.62;color:var(--ink-2)}
    .ag-sum b{color:var(--ink);font-weight:650}
    /* the two labelled parts: what it checked, what it made */
    .ag-sec{border-top:1px solid var(--line);padding:13px 15px;display:flex;
      flex-direction:column;gap:9px}
    .ag-sec-l{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3)}
    .ag-sec[data-part="reasoning"]{padding:0;border-top:0}
    .ag-sec[data-part="output"]{border-top:1px solid var(--line)}
    .ag-why-t{display:flex;align-items:center;gap:7px;width:100%;padding:11px 15px;border:0;
      background:none;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink-3);
      text-align:left}
    .ag-why-t:hover{color:var(--accent);background:var(--hover)}
    .ag-why-t svg{width:11px;height:11px;transform:rotate(-90deg);
      transition:transform var(--fast) var(--std)}
    .ag-sec.open .ag-why-t svg{transform:rotate(0)}
    .ag-why-t b{font-weight:600;color:var(--ink-3);opacity:.7;margin-left:2px}
    .ag-sec[data-part="reasoning"] .ag-why{display:none;padding:2px 15px 14px}
    .ag-sec[data-part="reasoning"].open .ag-why{display:flex}
    .ag-why{display:flex;flex-direction:column;gap:8px}
    .ag-line{display:flex;gap:9px;font-size:12px;line-height:1.55;color:var(--ink-2)}
    .ag-line i{flex:none;width:4px;height:4px;border-radius:50%;background:var(--line-strong);margin-top:7px}
    .ag-line.warn i{background:var(--pb-orange)}
    .ag-line code{font-family:var(--font-mono);font-size:11px;background:var(--panel-3);
      padding:1px 5px;border-radius:4px}
    .ag-made{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;
      border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer}
    .ag-made:hover{border-color:var(--accent);background:var(--accent-soft)}
    .ag-made-b{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px}
    .ag-made-t{font-size:12.5px;font-weight:600;color:var(--ink)}
    .ag-made-s{font-size:11.5px;color:var(--ink-3)}
    .ag-made-go{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 14px;
      border-radius:var(--r-pill);background:var(--accent);color:#fff;white-space:nowrap;
      font:650 12px var(--font-sans);box-shadow:0 1px 2px #6c4ef52e}
    .ag-made-go svg{width:12px;height:12px}
    .ag-made:hover .ag-made-go{background:var(--orange-deep)}
    .ag-flash{animation:agflash 1.6s var(--std)}
    @keyframes agflash{
      0%{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
      100%{box-shadow:var(--shadow-card);border-color:var(--line)}
    }
    .rn-noagent{font-size:11.5px;color:var(--ink-3);margin-left:auto}

    /* ═══════════════════════════════════════════════════════
       CHAT — the agent's room, retyped.

       The thread had one weight and one size doing every job, so a
       three-line thought and a two-word answer looked identical. This
       sets a rhythm: the agent speaks in lighter, longer-measure
       prose; the person's turns are small and tucked right; the
       agent's run cards are the only heavy objects in the column.
    ═══════════════════════════════════════════════════════ */
    .pbx-in{max-width:720px;gap:20px;padding:8px 0 4px}
    .pbx-in>*{scroll-margin-top:16px}

    /* the person's turn: quiet, compact, right */
    .pbx-user{
      align-self:flex-end;max-width:78%;
      padding:11px 15px;border-radius:16px 16px 5px 16px;
      background:var(--panel-3);color:var(--ink);
      font:450 13.5px/1.55 var(--font-sans);letter-spacing:-.005em;
      border:1px solid var(--line);box-shadow:none}
    .pbx-user .pbx-user-file{
      display:inline-flex;align-items:center;gap:7px;margin-bottom:7px;
      padding:6px 11px;border-radius:var(--r-pill);background:var(--panel);
      border:1px solid var(--line);font:600 12px var(--font-sans);color:var(--ink-2)}
    .pbx-user .pbx-user-file svg{width:13px;height:13px;color:var(--accent)}

    /* the agent's turn: prose, not UI */
    .pbx-agent{gap:12px;align-items:flex-start}
    .pbx-av{width:22px;height:22px;flex:none;margin-top:1px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:var(--t-agent-soft);color:var(--t-agent)}
    .pbx-av svg{width:12px;height:12px}
    .pbx-agent-body{gap:14px}
    .pbx-say{font:400 14px/1.72 var(--font-sans);color:var(--ink-2);
      letter-spacing:-.003em;max-width:64ch}
    .pbx-say b{font-weight:650;color:var(--ink)}
    .pbx-say code{font-family:var(--font-mono);font-size:12px;background:var(--panel-3);
      padding:1px 5px;border-radius:4px}

    /* offers: one real button, one way out */
    .pbx-btn-row{display:flex;align-items:center;gap:9px}
    .pbx-btn{padding:9px 18px;border-radius:var(--r-pill);background:var(--accent);color:#fff;
      font:600 13px var(--font-sans);border:1px solid transparent;cursor:pointer;
      box-shadow:0 1px 2px #6c4ef52e}
    .pbx-btn:hover{background:var(--orange-deep)}
    .pbx-btn.ghost{background:none;color:var(--ink-2);border-color:var(--line-strong);
      box-shadow:none}
    .pbx-btn.ghost:hover{background:var(--hover);color:var(--ink);border-color:var(--ink-3)}
    .pbx-btn:disabled{opacity:.45;cursor:default}

    .pbx-think{display:flex;align-items:center;gap:9px;font:450 13px var(--font-sans);
      color:var(--ink-3)}

    /* ── the run cards ─────────────────────────────────────── */
    .ag{border-radius:var(--r-lg);border-color:var(--line)}
    .ag-h{padding:13px 16px;gap:11px}
    .ag-num{width:22px;height:22px;font-size:11px}
    .ag-t{flex:none;font-size:13.5px;font-weight:650;letter-spacing:-.008em}
    /* folded, the header carries the job in light type beside the name */
    .ag-ask{flex:1 1 auto;min-width:0;font-size:12px;font-weight:400;color:var(--ink-3);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ag:not(.folded) .ag-ask{display:none}
    .ag-st,.ag-fin{font-size:11.5px;font-weight:600;letter-spacing:.002em}
    /* the job, before any answer to it. Not a grey slab floating in a
       card — it is the card's first line. */
    .ag-req{display:flex;align-items:baseline;gap:14px;padding:12px 18px;margin:0;
      background:none;border-bottom:1px solid var(--line)}
    .ag[data-agent="__create"] .ag-num{background:var(--panel-3);color:var(--ink-3);font-size:13px}
    .ag-req-l{flex:none;font-size:9.5px;font-weight:700;letter-spacing:.09em;
