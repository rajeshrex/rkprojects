    .rv-res-top>div:nth-child(3n+1){border-left:0}
    .rv-res-top b{font-family:var(--font-display,inherit);font-size:26px;font-weight:400;
      letter-spacing:-.02em;color:var(--ink)}
    .rv-res-top b.dim{color:var(--line-strong)}
    .rv-res-top span{font:600 10.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3)}
    .rv-res-l{padding:16px 18px 4px;font:700 10.5px var(--font-sans);letter-spacing:.07em;
      text-transform:uppercase;color:var(--ink-3)}
    .rv-res-l em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;
      margin-left:8px;opacity:.8}
    .rv-res-h,.rv-res-r{display:grid;
      grid-template-columns:10px minmax(0,1.3fr) minmax(90px,1.4fr) 56px 56px 60px 52px;
      gap:12px;align-items:center;padding:9px 18px}
    .rv-res-h{font:600 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);padding-bottom:4px}
    .rv-res-h>span{text-align:right}
    .rv-res-r{border-top:1px solid var(--line);font-size:13px}
    .rv-dot{width:8px;height:8px;border-radius:50%}
    .rv-res-n{font-weight:600;color:var(--ink)}
    .rv-bar2{height:8px;border-radius:5px;background:var(--track);overflow:hidden}
    .rv-bar2 i{display:block;height:100%;border-radius:5px}
    .rv-res-d{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
    .rv-res-m{text-align:right;color:var(--line-strong)}
    .rv-res-c{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
    .rv-res-f{padding:14px 18px 0;font-size:12.5px;color:var(--ink-3)}
    .rv-res-a{display:flex;align-items:center;gap:9px;padding:14px 18px 16px;flex-wrap:wrap}
    .rv-res-a .rn-btn svg{width:13px;height:13px}

    .rv-bar-run{border:0;background:none;padding:0;cursor:pointer;
      font-family:var(--font-mono,monospace);font-size:11px;font-weight:700;
      color:var(--accent);margin-left:5px;text-decoration:underline;text-underline-offset:2px}
    .rv-bar-run:hover{color:var(--orange-deep)}

    /* ═══ EVERY PANEL IS A SHEET ═══
       The floating treatment was scoped to the subpoena record, so
       the apps — Legal Holds, Matters, Collections — still butted
       against the thread as a second column. Same rule everywhere:
       the panel lies on the conversation. */
    .armour-library-panel.open{
      margin:12px;border-radius:18px;border:1px solid #1c1e2e14;
      background:var(--panel);overflow:hidden;
      box-shadow:
        0 0 0 1px #1c1e2e08,
        0 1px 2px #1c1e2e14,
        0 8px 16px -8px #1c1e2e1f,
        0 32px 64px -24px #1c1e2e33;}
    .armour-library-panel.open .armour-library-panel-body{border-radius:inherit}
    .wsrow{background:var(--panel)}
    .wscol{border-right:0}
    /* the seam only appears when you reach for it */
    .pane-resize-handle{width:0}
    .pane-resize-handle::after{background:transparent}
    .pane-resize-handle:hover{width:5px}
    .pane-resize-handle:hover::after,
    .pane-resize-handle.dragging::after{background:var(--accent);width:2px;left:1.5px}

    /* The record was inheriting the library's table width — 74vw,
       regardless of the thread beside it — so it overhung the chat
       instead of sitting next to it like every other panel. It takes
       the space the thread leaves, same as the apps do. */
    .wsrow.rec-open .armour-library-panel.open,
    .wsrow.rec-open .armour-library-panel.open.table-level,
    .wsrow.rec-open .armour-library-panel.open.matter-level{
      width:auto;flex:1 1 auto;min-width:0;max-width:none}
    .wsrow.rec-open .wscol.pbx-running{flex:none}
    /* and the hero's gradient rule follows the sheet's corner */
    .wsrow.rec-open .rn-fixed>.cs{border-radius:18px 18px 0 0}
    .wsrow.rec-open .rn-fixed>.cs:before{border-radius:18px 0 0 0}

    /* ═══════════════════════════════════════════════════════════════
       ARMOUR ADD-IN — Word · Google Docs · Google Sheets
       Additions only. Every ARMOUR surface is built from the tokens and
       components already defined above (pbx-*, list-*, rt, wscol-scope).
       Host chrome (Word blue, Docs blue, Sheets green) carries its own
       colours, as the real hosts do.
    ═══════════════════════════════════════════════════════════════ */
    html, body { height:100%; }
    body { overflow:hidden; }
    .sp2 { flex:1; display:block; min-width:4px; }

    /* ── frame ── */
    .fr { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--chrome); }
    .fr-bar { flex:none; height:44px; display:flex; align-items:center; gap:14px; padding:0 0 0 14px;
      background:var(--chrome); border-bottom:1px solid var(--chrome-line); user-select:none; }
    .fr-brand { display:flex; align-items:center; gap:9px; font:800 13px var(--font-sans); color:var(--chrome-title); white-space:nowrap; }
    .fr-brand .unirail-brand-mark { width:26px; height:26px; border-radius:8px; }
    .fr-brand small { font:600 11.5px var(--font-sans); color:var(--ink-3); }
    .fr-seg { display:flex; gap:3px; padding:3px; border-radius:99px; background:var(--panel-3); border:1px solid var(--line); }
    .fr-seg button { display:flex; align-items:center; gap:7px; padding:5px 13px; border-radius:99px;
      font:650 12.5px var(--font-sans); color:var(--ink-2); white-space:nowrap; }

    .fr-seg .tile { width:17px; height:17px; border-radius:4px; display:grid; place-items:center; color:#fff; font:800 9px var(--font-sans); flex:none; }

    .fr-note { font:600 10.5px var(--font-sans); color:var(--ink-3); }

    .host { flex:1; min-width:0; display:none; flex-direction:column; }

    /* ── Word host ── */
    .w-title { flex:none; height:34px; display:flex; align-items:center; gap:10px; padding:0 12px; background:#2b579a; color:#fff; font-size:12.5px; }
    .w-title .tile { width:21px; height:21px; border-radius:4px; background:#fff; color:#2b579a; display:grid; place-items:center; font:800 12px var(--font-sans); }
    .w-title .nm { font-weight:600; }

    .w-srch { flex:1; max-width:320px; margin:0 auto; height:23px; border-radius:5px; background:#ffffff2e; display:flex; align-items:center; gap:6px; padding:0 9px; font-size:12px; color:#ffffffcc; }
    .w-srch svg { width:12px; height:12px; }

    .w-tabs button.arm svg { width:12px; height:12px; }
    .w-rib { flex:none; display:flex; align-items:stretch; padding:6px 8px 0; background:#fff; border-bottom:1px solid #e1dfdd; min-height:84px; overflow-x:auto; scrollbar-width:thin; }
    .w-grp { display:flex; flex-direction:column; padding:0 9px; border-right:1px solid #e1dfdd; flex:none; }

    .w-col { display:flex; flex-direction:column; gap:2px; }

    .w-styles { display:flex; gap:4px; }

    .w-style small { font-size:10px; color:#605e5c; }

    .w-ruler i { display:block; width:816px; height:12px; background:#fff; border:1px solid #d2d0ce;
      background-image:repeating-linear-gradient(90deg,#8a8886 0 1px,transparent 1px 48px); background-repeat:no-repeat; background-position:96px bottom; background-size:100% 5px; }
    .w-status { flex:none; height:23px; background:#f3f2f1; border-top:1px solid #e1dfdd; display:flex; align-items:center; gap:16px; padding:0 12px; font-size:11.5px; color:#605e5c; }

    .w-status .ok i { width:6px; height:6px; border-radius:50%; background:var(--green); }

    /* ── Google Docs / Sheets host ── */

    .g-tool { flex:none; height:40px; display:flex; align-items:center; gap:3px; padding:0 12px; background:#fff; }
    .g-tool .pill { display:flex; align-items:center; gap:3px; background:#edf2fa; border-radius:99px; padding:3px 6px; }
    .g-tool button, .g-tool .gi { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:#444746; font-size:13px; }
    .g-tool button:hover, .g-tool .gi:hover { background:#e9eef6; }
    .g-tool svg { width:15px; height:15px; }
    .g-tool .gsel { height:26px; padding:0 8px; border-radius:6px; font-size:13px; color:#202124; display:flex; align-items:center; gap:6px; }
    .g-tool .gsel:hover { background:#f1f3f4; }
    .g-tool .div { width:1px; height:20px; background:#dadce0; margin:0 5px; }
    .g-fx { flex:none; height:30px; display:flex; align-items:center; gap:10px; padding:0 12px; border-top:1px solid #e1e3e1; border-bottom:1px solid #e1e3e1; background:#fff; font:500 12.5px var(--font-mono); color:#202124; }
    .g-fx .cell { min-width:62px; border-right:1px solid #e1e3e1; padding-right:10px; }
    .g-fx .fx { color:#80868b; }

    /* document canvas (Word + Docs) */
    .pg-wrap { flex:1; min-height:0; overflow:auto; padding:22px 20px 70px; }
    .pg-wrap.w { background:#f3f2f1; }
    .pg-wrap.d { background:#f9fbfd; }
    .pg { width:816px; min-height:1056px; margin:0 auto; background:#fff; position:relative;
      box-shadow:0 1px 3px #0000001f, 0 4px 14px #0000000f; }
    .pg-in { position:absolute; inset:96px; outline:none; font-family:Aptos, Calibri, Carlito, "Segoe UI", sans-serif; font-size:14.6px; line-height:1.5; color:#1f1f1f; }
    .pg-hd, .pg-ft { position:absolute; left:96px; right:96px; font:500 10.5px Aptos, Calibri, sans-serif; color:#8a8886; display:flex; justify-content:space-between; }
    .pg-hd { top:46px; } .pg-ft { bottom:46px; }
    .pg-in h1 { font-size:27px; font-weight:400; color:#0f2744; margin:0 0 6px; letter-spacing:-.01em; }
    .pg-in .sub { font-size:13px; color:#5a5a5a; margin:0 0 16px; padding-bottom:11px; border-bottom:1.5px solid #2b579a; }
    .pg-in h2 { font-size:17.5px; font-weight:600; color:#1f3864; margin:16px 0 6px; }

    .pg-in th, .pg-in td { border:1px solid #a6a6a6; padding:5px 7px; text-align:left; vertical-align:top; }
    .pg-in th { background:#dbe5f1; font-weight:600; color:#1f3864; }

    .pg-in .q small { color:#6a6a6a; font-size:11.5px; }
    .pg-in .ins { outline:2px dashed var(--accent); outline-offset:3px; background:#7a4fd60d; transition:outline-color 1.2s, background 1.2s; }
    .pg-in .ins.settled { outline-color:transparent; background:transparent; }
    .pg-in .selx { background:#7a4fd626; box-shadow:0 0 0 2px #7a4fd626; }
    .docs .pg-in { font-family:Arial, Helvetica, sans-serif; }
    .docs .pg-in .sub { border-bottom-color:#1a73e8; }
    .docs .pg-in h2 { color:#1a73e8; }
    .docs .pg-in h3 { color:#174ea6; }
    .docs .pg-in th { background:#e8f0fe; color:#174ea6; }

    /* sheet grid */
    .sh { flex:1; min-height:0; overflow:auto; background:#fff; }
    .sh table { border-collapse:collapse; font:400 12.5px Arial, var(--font-sans); color:#202124; }
    .sh th, .sh td { border:1px solid #e1e3e1; padding:3px 7px; height:22px; white-space:nowrap; }
    .sh th { background:#f8f9fa; color:#5f6368; font-weight:500; text-align:center; position:sticky; top:0; z-index:2; }
    .sh th.rh { position:sticky; left:0; z-index:3; width:42px; }
    .sh td.rh { background:#f8f9fa; color:#5f6368; text-align:center; position:sticky; left:0; width:42px; }
    .sh td.hdr { background:#e6f4ea; font-weight:700; color:#0b8043; }

    .sh-tabs { flex:none; height:34px; display:flex; align-items:center; gap:4px; padding:0 10px; border-top:1px solid #e1e3e1; background:#f8f9fa; }
    .sh-tabs .t { font:600 12.5px var(--font-sans); color:#5f6368; padding:5px 12px; border-radius:6px 6px 0 0; }
    .sh-tabs .t.on { background:#fff; color:#0b8043; box-shadow:0 -1px 0 #e1e3e1 inset; }

    /* ═══ ARMOUR pane ═══ */
    .ap { width:430px; flex:none; display:flex; flex-direction:column; min-height:0;
      background:var(--panel); border-left:1px solid var(--line); font-family:var(--font-sans); position:relative; }
    .ap.hid { display:none; }
    .ap-grip { position:absolute; left:-3px; top:0; bottom:0; width:6px; cursor:col-resize; z-index:5; }
    .ap-grip:hover { background:var(--accent-soft); }
    .ap-head { flex:none; display:flex; align-items:center; gap:9px; padding:11px 13px; border-bottom:1px solid var(--line); }
    .ap-head .unirail-brand-mark { width:26px; height:26px; border-radius:8px; }
    .ap-head b { font:800 12.5px var(--font-sans); color:var(--ink); }

    .ap-head .hb:hover { background:var(--hover); color:var(--ink); }
    .ap-head .hb svg { width:13px; height:13px; }
    .lv { display:inline-flex; align-items:center; gap:6px; padding:4px 9px 4px 8px; border-radius:99px;
      font:700 10.5px var(--font-sans); background:var(--green-soft); color:var(--green); border:1px solid #2fb07940; white-space:nowrap; }
    .lv i { width:7px; height:7px; border-radius:50%; background:var(--green); position:relative; }
    .lv i:after { content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--green); opacity:0; animation:lvp 2s ease-out infinite; }
    @keyframes lvp { 0%{transform:scale(.6);opacity:.8} 100%{transform:scale(1.7);opacity:0} }

    /* scope bar */
    .ap-scope { flex:none; padding:10px 13px; border-bottom:1px solid var(--line);
      background:linear-gradient(135deg,#7a4fd610,#e23d7d08 46%,transparent), var(--panel-3); position:relative; }

    .sc-btn { display:flex; align-items:center; gap:9px; width:100%; padding:7px 10px; border-radius:11px; border:1px solid var(--line); background:var(--panel); text-align:left; }

    .sc-btn .pbx-card-ic svg { width:13px; height:13px; }
    .sc-btn .tx { min-width:0; flex:1; }
    .sc-btn b { display:block; font:650 12.5px var(--font-sans); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sc-btn small { display:block; font:500 11px var(--font-sans); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sc-btn .cv { width:14px; height:14px; color:var(--ink-3); flex:none; }
    .sc-list { position:absolute; left:13px; right:13px; top:calc(100% - 4px); z-index:40; background:var(--panel);
      border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-hover); padding:7px; display:none; max-height:330px; overflow:auto; }
    .sc-list.on { display:block; }

    .sc-list button { display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border-radius:10px; text-align:left; }
    .sc-list button:hover { background:var(--hover); }
    .sc-list button.on { background:var(--accent-soft); }
    .sc-list b { display:block; font:650 12.5px var(--font-sans); color:var(--ink); }
    .sc-list small { display:block; font:500 11px var(--font-sans); color:var(--ink-3); }
    .sc-list .pbx-card-ic { width:24px; height:24px; border-radius:7px; flex:none; }
    .sc-list .pbx-card-ic svg { width:12px; height:12px; }
    .sc-ctx { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .ck { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:99px; background:var(--panel);
      border:1px solid var(--line); font:600 10.5px var(--font-sans); color:var(--ink-2); }
    .ck i { width:6px; height:6px; border-radius:50%; background:var(--accent); }
    .ck.g i { background:var(--green); }
    .ck.a i { background:var(--amber); }

    .ap-tabs { flex:none; display:flex; gap:2px; padding:0 9px; border-bottom:1px solid var(--line); }
    .ap-tabs button { padding:9px 11px; font:650 12.5px var(--font-sans); color:var(--ink-3); border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; align-items:center; gap:6px; }
    .ap-tabs button b { font:700 10px var(--font-sans); padding:1px 6px; border-radius:99px; background:var(--panel-3); color:var(--ink-3); }
    .ap-tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
    .ap-body { flex:1; min-height:0; display:flex; flex-direction:column; }
    .ap-pane { flex:1; min-height:0; display:none; flex-direction:column; }
    .ap-pane.on { display:flex; }
    .ap-scroll { flex:1; min-height:0; overflow-y:auto; padding:14px 13px 20px; display:flex; flex-direction:column; gap:14px; }

    /* chat */
    .log { flex:1; min-height:0; overflow-y:auto; padding:16px 13px 10px; display:flex; flex-direction:column; gap:15px; }
    .log .pbx-say { font-size:13px; }
    .log .pbx-user { font-size:13px; align-self:flex-end; max-width:86%; }
    .log .pbx-agent-body { min-width:0; }
    .zero { text-align:center; padding:22px 10px 8px; }
    .zero .unirail-brand-mark { width:44px; height:44px; border-radius:14px; margin:0 auto 12px; }
    .zero .unirail-brand-mark svg { width:21px; height:21px; }
    .zero h4 { font-family:'Fraunces',serif; font-weight:400; font-size:23px; color:var(--ink); letter-spacing:-.01em; }

    .step.live { color:var(--ink); } .step.live i { border-color:var(--accent); border-top-color:transparent; animation:spn .8s linear infinite; }
    .step.done { color:var(--ink-2); } .step.done i { border-color:var(--green); background:var(--green); }

    .prev { border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:11px 12px; max-height:210px; overflow:auto;
      font:500 12px var(--font-sans); color:var(--ink-2); line-height:1.6; }
    .prev h5 { font:700 12.5px var(--font-sans); color:var(--ink); margin:0 0 5px; }

    .prev ul { margin:0 0 7px 16px; }

    .kvs b { margin-left:auto; color:var(--ink); font-weight:600; text-align:right; }
    .log .pbx-btn-row { gap:6px; flex-wrap:wrap; }

    .tagx { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px; font:700 9.5px var(--font-sans); letter-spacing:.04em; text-transform:uppercase; }

    .tagx.pl { background:var(--accent-soft); color:var(--accent); }
    .tagx.nu { background:var(--panel-3); color:var(--ink-3); }

    /* composer + prompt picker */
    .comp { flex:none; position:relative; padding:0 13px 13px; }
    .comp .pbx-dock-box { padding:9px 12px 7px; }
    .comp textarea { font-size:13px; }
    .picker { position:absolute; left:13px; right:13px; bottom:calc(100% - 6px); z-index:30; background:var(--panel);
      border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-hover); display:none; flex-direction:column; max-height:60vh; overflow:hidden; }
    .picker.on { display:flex; }
    .picker-h { flex:none; display:flex; align-items:center; gap:8px; padding:10px 13px 8px; border-bottom:1px solid var(--line); }
    .picker-h b { font:700 10px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
    .picker-h .x { margin-left:auto; width:22px; height:22px; border-radius:7px; display:grid; place-items:center; color:var(--ink-3); }
    .picker-h .x:hover { background:var(--hover); }
    .picker-h .x svg { width:10px; height:10px; }
    .picker-b { flex:1; min-height:0; overflow-y:auto; padding:6px; }
    .picker .gh { font:700 10px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:8px 9px 4px; display:flex; gap:7px; align-items:center; }
    .picker .gh em { font-style:normal; font-weight:600; letter-spacing:0; text-transform:none; color:var(--ink-3); opacity:.8; }
    .picker button.pr { display:flex; align-items:flex-start; gap:9px; width:100%; padding:8px 9px; border-radius:10px; text-align:left; }
    .picker button.pr:hover, .picker button.pr.cur { background:var(--accent-soft); }
    .picker button.pr .ic { width:22px; height:22px; border-radius:7px; background:var(--panel-3); display:grid; place-items:center; color:var(--accent); flex:none; margin-top:1px; }
    .picker button.pr .ic svg { width:12px; height:12px; }
    .picker button.pr b { display:block; font:600 12.5px var(--font-sans); color:var(--ink); line-height:1.35; }
    .picker button.pr small { display:block; font:500 11px var(--font-sans); color:var(--ink-3); margin-top:1px; }
    .picker-f { flex:none; padding:7px 13px; border-top:1px solid var(--line); font:500 10.5px var(--font-sans); color:var(--ink-3); background:var(--surface); }

    /* records + activity panes */
    .sech { font:700 10px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:8px; }
    .sech button { font:700 11px var(--font-sans); letter-spacing:0; text-transform:none; color:var(--accent); }
    .rc { border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:12px 13px; box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:7px; }
    .rc-h { display:flex; align-items:center; gap:8px; font:700 10px var(--font-sans); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
    .rc-h .pbx-card-ic { width:24px; height:24px; border-radius:7px; }
    .rc-h .pbx-card-ic svg { width:12px; height:12px; }
    .rc-h em { margin-left:auto; font-style:normal; font:600 10px var(--font-mono); letter-spacing:0; text-transform:none; }
    .rc-t { font:650 13.5px var(--font-sans); color:var(--ink); line-height:1.35; }
    .rc-v { font:500 12px var(--font-sans); color:var(--ink-2); line-height:1.5; }
    .rc-f { display:flex; align-items:center; gap:8px; }
    .rc-f small { margin-left:auto; font:500 10.5px var(--font-sans); color:var(--ink-3); }
    .act-r { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
    .act-r:last-child { border-bottom:0; }
    .act-r.new { animation:actIn 1s ease; }
    @keyframes actIn { from { background:var(--accent-soft); } to { background:transparent; } }
    .act-d { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); grid-row:span 2; }
    .act-d svg { width:13px; height:13px; }
    .act-d.p { background:var(--green-soft); color:var(--green); }
    .act-t { font:600 12.5px var(--font-sans); color:var(--ink); line-height:1.4; }
    .act-s { font:500 11.5px var(--font-sans); color:var(--ink-3); line-height:1.5; grid-column:2; }
    .act-s time { font-family:var(--font-mono); }

    /* pane sign-in */
    .gate { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center; padding:26px 22px; text-align:center; }
    .gate .unirail-brand-mark { width:46px; height:46px; border-radius:14px; margin:0 auto 14px; }
    .gate .unirail-brand-mark svg { width:22px; height:22px; }
    .gate h4 { font-family:'Fraunces',serif; font-weight:400; font-size:23px; color:var(--ink); letter-spacing:-.01em; }
    .gate p { font:500 12.5px var(--font-sans); color:var(--ink-2); line-height:1.6; margin:8px 0 18px; }
    .gate .pbx-btn { width:100%; padding:11px 14px; }
    .gate .pbx-btn + .pbx-btn { margin-top:8px; }
    .lab { display:block; text-align:left; font:700 10px var(--font-sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin:0 0 6px; }
    .inp { width:100%; border:1px solid var(--line-strong); border-radius:11px; padding:10px 12px; font:500 13px var(--font-sans); color:var(--ink); background:var(--field); outline:none; margin-bottom:13px; }
    .inp:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .who { display:flex; align-items:center; gap:10px; padding:10px 11px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:14px; text-align:left; }
    .who b { display:block; font:600 12.5px var(--font-sans); color:var(--ink); }
    .who small { display:block; font:500 11px var(--font-sans); color:var(--ink-3); }
    .code { display:flex; gap:7px; margin-bottom:15px; }
    .code input { width:100%; text-align:center; font:600 17px var(--font-mono); padding:9px 0; border:1px solid var(--line-strong); border-radius:10px; background:var(--field); color:var(--ink); outline:none; }
    .scopes { display:flex; flex-direction:column; gap:9px; margin-bottom:16px; text-align:left; }
    .scopes div { display:flex; gap:9px; font:500 12.5px var(--font-sans); color:var(--ink-2); line-height:1.5; }
    .scopes svg { width:15px; height:15px; color:var(--green); flex:none; margin-top:2px; }
    .alt { display:flex; align-items:center; gap:10px; margin:13px 0; font:600 10.5px var(--font-sans); color:var(--ink-3); }
    .alt:before, .alt:after { content:""; flex:1; height:1px; background:var(--line); }
    .gfoot { margin-top:14px; font:500 10.5px var(--font-sans); color:var(--ink-3); }
    .chk { display:flex; align-items:center; gap:8px; font:600 12px var(--font-sans); color:var(--ink); text-align:left; margin:-4px 0 14px; }
    .chk input { accent-color:var(--accent); }

    .toastx { position:fixed; left:50%; bottom:26px; transform:translate(-50%,18px); opacity:0; pointer-events:none; z-index:700;
      background:var(--ink); color:var(--panel); font:600 13px var(--font-sans); padding:10px 16px; border-radius:12px;
      box-shadow:0 12px 30px -10px #0007; transition:opacity .2s, transform .2s; max-width:76vw; }
    .toastx.on { opacity:1; transform:translate(-50%,0); }
    .picker-h > svg { width:14px; height:14px; color:var(--accent); flex:none; }
    .zero > svg, .gate > svg { width:40px; height:40px; }
    .ap svg { max-width:100%; max-height:100%; }

    /* ── inline platform panels: every ARMOUR choice happens in the pane ── */
    .ip { border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--shadow-card); overflow:hidden; }
    .ip-h { display:flex; align-items:flex-start; gap:9px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface); }
    .ip-h .pbx-card-ic { width:26px; height:26px; border-radius:8px; flex:none; }
    .ip-h .pbx-card-ic svg { width:13px; height:13px; }
    .ip-t { min-width:0; }
    .ip-t b { display:block; font:650 12.5px var(--font-sans); color:var(--ink); line-height:1.35; }
    .ip-t small { display:block; font:500 11px var(--font-sans); color:var(--ink-3); margin-top:2px; line-height:1.45; }
    .ip-b { padding:10px 11px; max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:7px; }
    .ip-f { display:flex; gap:7px; padding:9px 11px; border-top:1px solid var(--line); background:var(--surface); }
    .ip-f .pbx-btn { flex:1; justify-content:center; padding:8px 10px; font-size:12px; }
    .ip-g { display:flex; align-items:center; gap:6px; font:700 9.5px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:4px 0 0; }
    .ip-g em { font-style:normal; font-weight:600; letter-spacing:0; text-transform:none; }
    .ipo { display:flex; align-items:flex-start; gap:9px; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--panel); text-align:left; }
    .ipo:hover { border-color:var(--accent); }
    .ipo.on { border-color:var(--accent); background:var(--accent-soft); }
    .ipo.tight { padding:7px 10px; }
    .ipx { min-width:0; flex:1; }
    .ipx b { display:block; font:600 12.5px var(--font-sans); color:var(--ink); line-height:1.35; }
    .ipx small { display:block; font:500 11px var(--font-sans); color:var(--ink-3); margin-top:1px; line-height:1.45; }
    .ipr { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--line-strong); flex:none; margin-top:2px; }
    .ipo.on .ipr { border-color:var(--accent); border-width:4px; }
    .ipc { width:15px; height:15px; border-radius:4px; border:1.5px solid var(--line-strong); flex:none; margin-top:2px; display:grid; place-items:center; color:#fff; }
    .ipo.on .ipc { background:var(--accent); border-color:var(--accent); }
    .ipc svg { width:10px; height:10px; }
    .ipo .tagx { margin-left:auto; flex:none; }
    .ipq { border:1px solid var(--line); border-radius:11px; padding:8px 10px; display:flex; flex-direction:column; gap:7px; }
    .ipq-t { display:flex; gap:8px; font:500 12.5px var(--font-sans); color:var(--ink); line-height:1.4; }
    .ipq-t .qn { width:19px; height:19px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font:700 10px var(--font-sans); flex:none; }
    .ipq-r { display:flex; align-items:center; gap:9px; padding-left:27px; }
    .ipq-r select { flex:1; min-width:0; font-size:11.5px; padding:5px 7px; border-radius:8px; border:1px solid var(--line-strong); background:var(--field); color:var(--ink); }
    .ipq-r .req { display:flex; align-items:center; gap:5px; font:600 11px var(--font-sans); color:var(--ink-2); white-space:nowrap; }
    .ipq-r .req input { accent-color:var(--accent); }

    /* ── file rail: open a prebuilt file on the left ── */
    .fr-stage { display:flex; }
    .fr-hosts { flex:1; min-width:0; display:flex; }
    .fl { width:218px; flex:none; display:flex; flex-direction:column; gap:2px; padding:10px 9px 16px;
      background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; }
    .fl-h { display:flex; align-items:center; gap:7px; font:800 11.5px var(--font-sans); color:var(--ink); padding:3px 5px 8px; }
    .fl-n { font:700 10px var(--font-sans); color:var(--ink-3); background:var(--panel-3); border-radius:99px; padding:1px 7px; }
    .fl-s { font:700 9.5px var(--font-sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:9px 5px 5px; }
    .fl-i { display:flex; align-items:flex-start; gap:8px; width:100%; padding:7px 8px; border-radius:10px; text-align:left; border:1px solid transparent; }
    .fl-i:hover { background:var(--hover); }
    .fl-i.on { background:var(--accent-soft); border-color:#7a4fd633; }
    .fl-ic { width:22px; height:22px; border-radius:5px; display:grid; place-items:center; color:#fff; font:800 10px var(--font-sans); flex:none; background:#2b579a; }
    .fl-i .fl-ic.g { background:#0f9d58; }
    .host.excel ~ * .fl-ic.g, .fl-ic.x { background:#217346; }
    .fl-x { min-width:0; }
    .fl-x b { display:block; font:600 11.5px var(--font-sans); color:var(--ink); line-height:1.35; word-break:break-word; }
    .fl-x small { display:block; font:500 10.5px var(--font-sans); color:var(--ink-3); margin-top:1px; line-height:1.4; }
    .fl-note { font:500 10.5px var(--font-sans); color:var(--ink-3); line-height:1.5; padding:0 5px; }

    /* ── Excel chrome: Word's shapes, Excel's colours ── */
    .t-x { background:#217346; } .t-o { background:var(--ink-3); }
    .fr-seg .tile svg { width:10px; height:10px; }
    .excel .w-title { background:#217346; }
    .excel .w-title .tile { color:#217346; }
    .excel .w-tabs button.on { color:#217346; border-bottom-color:#217346; }
    .excel .w-big svg, .excel .w-sm svg { color:#217346; }
    .excel .w-big.arm svg { color:var(--accent); }
    .excel .sh { flex:1; min-height:0; overflow:auto; background:#fff; }
    .excel .sh th { background:#f3f3f3; }
    .excel .sh td.hdr { background:#e2efda; color:#1e6b41; }
    .excel .sh-tabs { background:#f3f3f3; }
    .excel .sh-tabs .t.on { color:#217346; }

    /* ── offline ── */
    .off-bar { flex:none; display:flex; align-items:center; gap:9px; padding:8px 14px; background:#e0902f1f;
      border-bottom:1px solid #e0902f44; font:500 12px var(--font-sans); color:var(--amber); }
    .off-bar b { color:var(--amber); font-weight:700; }
    .off-bar svg { width:14px; height:14px; flex:none; }
    .w-status .ok.off { color:var(--amber); }
    .w-status .ok.off i { background:var(--amber); }
    .lv.off { background:#e0902f1f; color:var(--amber); border-color:#e0902f55; }
    .lv.off i { background:var(--amber); }
    .lv.off i:after { display:none; }
    .act-d.q { background:#e0902f1f; color:var(--amber); }
    .tagx.q { background:#e0902f1f; color:var(--amber); }

    /* ── letterhead in the document ── */
    .pg-in .lh { display:flex; align-items:center; gap:14px; margin:0 0 6px; }
    .pg-in .lh-m { width:42px; height:42px; flex:none; }
    .pg-in .lh-t b { display:block; font-size:16.5px; font-weight:700; color:#1f3864; letter-spacing:-.01em; }
    .pg-in .lh-t span { display:block; font-size:10.5px; color:#6a6a6a; margin-top:2px; }
    .pg-in .lh-r { height:2px; background:#2b579a; margin:0 0 16px; }
    .pg-in .lh-f { font-size:10px; color:#8a8886; letter-spacing:.06em; text-transform:uppercase; margin:-10px 0 16px; }
    .docs .pg-in .lh-r { background:#1a73e8; }
    .lh-prev { border:1px solid var(--line); border-radius:11px; padding:12px; background:#fff; }
    .lh-prev .lh { display:flex; align-items:center; gap:11px; }
    .lh-prev .lh-m { width:34px; height:34px; }
    .lh-prev .lh-t b { display:block; font:700 13px var(--font-sans); color:#1f3864; }
    .lh-prev .lh-t span { display:block; font:500 9.5px var(--font-sans); color:#6a6a6a; margin-top:2px; }
    .lh-prev .lh-r { height:2px; background:#2b579a; margin:9px 0 0; }
    .lh-prev .lh-f { font:600 8.5px var(--font-sans); letter-spacing:.06em; text-transform:uppercase; color:#8a8886; margin-top:7px; }
    .lh-prev .lh-dummy { font:500 11px var(--font-sans); color:var(--ink-3); margin-top:9px; }

    /* ── the file rail collapses ── */
    .fl { transition:width .18s var(--std); }
    .fl.mini { width:52px; padding:10px 7px; align-items:center; }
    .fl-t { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; color:var(--ink-3); flex:none; }
    .fl-t:hover { background:var(--hover); color:var(--accent); }
    .fl-t svg { width:13px; height:13px; }
    .fl.mini .fl-t { margin:0 auto 8px; }
    .fl-i.mini { width:38px; height:38px; padding:0; justify-content:center; border-radius:10px; }
    .fl-i.mini .fl-ic { width:26px; height:26px; font-size:11px; }
    .fl-ic.d { background:#1a73e8; } .fl-ic.g { background:#0f9d58; } .fl-ic.x { background:#217346; }
    #railBtn svg { width:15px; height:15px; }

    /* ── bring the pane back ── */
    .ap-reopen { position:fixed; right:0; top:50%; transform:translate(100%,-50%); z-index:200; display:none;
      flex-direction:column; align-items:center; gap:8px; padding:12px 7px; border-radius:12px 0 0 12px;
      background:var(--panel); border:1px solid var(--line); border-right:0; box-shadow:var(--shadow-hover); }
    .ap-reopen.on { display:flex; transform:translate(0,-50%); }
    .ap-reopen .unirail-brand-mark { width:24px; height:24px; border-radius:7px; }
    .ap-reopen span { writing-mode:vertical-rl; font:700 10.5px var(--font-sans); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); }
    .ap-reopen:hover span { color:var(--accent); }

    /* ── pages stack as the document grows ── */
    .pg-doc { display:flex; flex-direction:column; align-items:center; gap:20px; }
    .pg { width:816px; height:1056px; flex:none; position:relative; background:#fff; box-shadow:0 1px 3px #0000001f, 0 4px 14px #0000000f; }
    .pg-in { position:absolute; inset:96px; overflow:hidden; }
    .pg-ft .pn { font-variant-numeric:tabular-nums; }

    /* ── action-required legal hold notice, inside the document ── */
    .pg-in .nb { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-radius:6px;
      background:#fdf1e7; border-left:4px solid #c2410c; margin:0 0 16px; }
    .pg-in .nb-tag { font:800 9.5px var(--font-sans); letter-spacing:.1em; text-transform:uppercase; color:#fff;
      background:#c2410c; padding:3px 9px; border-radius:99px; }
    .pg-in .nb-t { font:700 13px var(--font-sans); color:#7c2d12; }
    .pg-in .nb-d { margin-left:auto; font:600 11.5px var(--font-sans); color:#9a3412; white-space:nowrap; }
    .pg-in .act-box { border:1.5px solid #2b579a; border-radius:7px; padding:14px 16px 12px; margin:18px 0; background:#f6f9fd; }
    .docs .pg-in .act-box { border-color:#1a73e8; background:#f1f6fe; }
    .pg-in .act-h { font:700 10.5px var(--font-sans); letter-spacing:.09em; text-transform:uppercase; color:#1f3864; margin-bottom:10px; }
    .pg-in a.cta { display:flex; flex-direction:column; gap:1px; padding:10px 14px; margin:0 0 8px; border-radius:6px;
      background:#2b579a; color:#fff !important; text-decoration:none; cursor:pointer; }
    .pg-in a.cta:hover { background:#1e4380; }
    .docs .pg-in a.cta { background:#1a73e8; } .docs .pg-in a.cta:hover { background:#1557b0; }
    .pg-in a.cta-ask, .pg-in a.cta-interview { background:#fff; color:#1f3864 !important; border:1.5px solid #2b579a; }
    .pg-in a.cta-ask:hover, .pg-in a.cta-interview:hover { background:#eaf1fa; }
    .docs .pg-in a.cta-ask, .docs .pg-in a.cta-interview { border-color:#1a73e8; color:#174ea6 !important; }
    .pg-in .cta-l { font-size:14px; font-weight:700; }
    .pg-in .cta-s { font-size:11px; opacity:.85; }
    .pg-in .act-f { font-size:10.5px; color:#5a5a5a; margin-top:8px; }
    .pg-in .nf { font-size:11.5px; color:#6a6a6a; border-top:1px solid #d8d8e0; padding-top:9px; margin-top:16px; }

    /* ── the compliance portal the links open ── */
    .pt { position:fixed; inset:0; z-index:800; background:#0f0c1a7a; backdrop-filter:blur(3px);
      display:none; align-items:center; justify-content:center; padding:26px; }
    .pt.on { display:flex; }
    .pt-win { width:min(760px,100%); max-height:100%; background:var(--panel); border-radius:16px; overflow:hidden;
      display:flex; flex-direction:column; box-shadow:0 30px 80px -20px #0009; border:1px solid var(--line); }
    .pt-bar { flex:none; height:44px; display:flex; align-items:center; gap:9px; padding:0 12px; background:#dee1e6; }
    :root[data-theme="dark"] .pt-bar { background:#2a2b2e; }
    .pt-nav { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#5f6368; transform:scaleX(-1); }
    .pt-nav svg { width:12px; height:12px; }
    .pt-url { flex:1; height:28px; border-radius:99px; background:#fff; display:flex; align-items:center; gap:8px;
      padding:0 13px; font:500 12px var(--font-sans); color:#202124; }
    :root[data-theme="dark"] .pt-url { background:#202124; color:#e8eaed; }
    .pt-url svg { width:11px; height:11px; color:#1e8e3e; }
    .pt-x { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#5f6368; }
    .pt-x:hover { background:#00000014; }
    .pt-x svg { width:11px; height:11px; }
    .pt-body { flex:1; min-height:0; overflow-y:auto; padding:22px 26px 26px; background:var(--bg); }
    .pt-head { display:flex; align-items:center; gap:11px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:18px; }
    .pt-head .lh-m { width:34px; height:34px; flex:none; }
    .pt-head b { display:block; font:700 13px var(--font-sans); color:var(--ink); }
    .pt-head span { display:block; font:500 11.5px var(--font-sans); color:var(--ink-3); }
    .pt-who { margin-left:auto; font:600 11.5px var(--font-sans); color:var(--ink-2); background:var(--panel-3);
      border-radius:99px; padding:4px 11px; }

  function activeHost() { return $('#host-' + S.host); }

  function pageEls() { var h = activeHost(); return h ? Array.prototype.slice.call(h.querySelectorAll('.pg-in')) : []; }
  function pgIn() { var p = pageEls(); return p.length ? p[0] : null; }

  function docFind(sel) {
    var out = [];
    pageEls().forEach(function (p) { Array.prototype.push.apply(out, Array.prototype.slice.call(p.querySelectorAll(sel))); });
    return out;
  }
  function addPage(doc) {
    var pg = node('<div class="pg"><div class="pg-hd"><span class="ph"></span><span class="pc"></span></div>' +
      '<div class="pg-in" contenteditable="true" spellcheck="false"></div>' +
      '<div class="pg-ft"><span class="pf"></span><span class="pn"></span></div></div>');
    doc.appendChild(pg);

  function numberPages() {
    var h = activeHost(); if (!h) return;
    var ps = h.querySelectorAll('.pg'), docs = S.host === 'docs';
    Array.prototype.forEach.call(ps, function (p, i) {
      $('.pn', p).textContent = (docs ? '' : 'Page ') + (i + 1) + (docs ? '' : ' of ' + ps.length);
      $('.ph', p).textContent = M.name + ' · ' + M.number;

  /* a page that overflows pushes what will not fit onto the next one;
     a table that does not fit carries its header row across the break */
  function overflowing(p) { return p.scrollHeight > p.clientHeight + 2; }
  function splitTable(doc, pg, tbl, depth) {
    var tb = tbl.tBodies && tbl.tBodies[0];
    if (!tb || (depth || 0) > 14) return pg;
    var carry = [];
    while (overflowing(pg) && tb.rows.length > 1) { carry.unshift(tb.rows[tb.rows.length - 1]); tb.deleteRow(tb.rows.length - 1); }
    if (!carry.length) return pg;
    var np = addPage(doc), clone = tbl.cloneNode(false);
    if (tbl.tHead) clone.appendChild(tbl.tHead.cloneNode(true));
    var nb = document.createElement('tbody');
    carry.forEach(function (r) { nb.appendChild(r); });
    clone.appendChild(nb);
    np.appendChild(clone);
    return overflowing(np) ? splitTable(doc, np, clone, (depth || 0) + 1) : np;
  }
  function flowDoc(html) {
    var doc = docEl(); if (!doc) return;
    var hold = document.createElement('div');
    hold.innerHTML = html;
    doc.innerHTML = '';
    var pg = addPage(doc);
    Array.prototype.slice.call(hold.childNodes).forEach(function (n) {
      if (n.nodeType === 3 && !n.nodeValue.trim()) return;
      pg.appendChild(n);
      if (!overflowing(pg)) return;
      if (pg.childNodes.length > 1) { pg = addPage(doc); pg.appendChild(n); }
      if (overflowing(pg) && n.nodeType === 1 && n.tagName === 'TABLE') pg = splitTable(doc, pg, n);
    });
    numberPages();
    words();
  }

          paintPane();

  /* delegated listeners — bound once, because the pane element survives repaints */
  function wireOnce() {
    pane.addEventListener('click', function (e) {
      var b = e.target.closest('[data-g]');
      if (b) { gateStep++; paintPane(); return; }
      b = e.target.closest('[data-t]');
      if (b && b.closest('.ap-tabs')) { S.tab = b.dataset.t; paintPane(); return; }
      b = e.target.closest('[data-sc]');
      if (b) {
        S.scope = b.dataset.sc; S.picker = false; paintPane();
        if (!S.threads[S.scope].length) greet();
        toast('Chat scoped to ' + scopeOf(S.scope).name);
        return;
      }
      var a = e.target.closest('[data-act]'); if (!a) return;
      var k = a.dataset.act;
      if (k === 'hide') { pane.classList.add('hid'); showReopen(true); }
      if (k === 'signout') { S.signed = false; gateStep = 0; SCOPES.forEach(function (s) { S.threads[s.k] = []; }); paintPane(); toast('Signed out of Exterro in this panel.'); }
      if (k === 'scope') { var l = $('#scList'); if (l) l.classList.toggle('on'); }
      if (k === 'closepick') { S.picker = false; paintPicker(); }
      if (k === 'send') send();
    });
    document.addEventListener('click', function (e) {
      var l = $('#scList');
      if (l && !e.target.closest('.ap-scope')) l.classList.remove('on');
      if (S.picker && !e.target.closest('#comp')) { S.picker = false; paintPicker(); }
    });
  }

  function wirePane() {
    if (taEl) {
      taEl.addEventListener('focus', function () { S.picker = true; paintPicker(); });
      taEl.addEventListener('click', function () { S.picker = true; paintPicker(); });
      taEl.addEventListener('input', function () { S.pfilter = taEl.value.trim(); S.picker = true; paintPicker(); });
      taEl.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { S.picker = false; paintPicker(); }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
    }
  }
  function focusComposer() { if (taEl) { taEl.focus(); } }
  var reopenEl;
  function showReopen(on) {
    if (!reopenEl) {
      reopenEl = node('<button class="ap-reopen" title="Show the ARMOUR panel">' + MARK + '<span>ARMOUR</span></button>');
      reopenEl.addEventListener('click', function () { pane.classList.remove('hid'); showReopen(false); focusComposer(); });
      document.body.appendChild(reopenEl);
    }
    reopenEl.classList.toggle('on', !!on);
  }

  function classify(t) {
    t = t.toLowerCase();
    var hit = null;
    avail().forEach(function (p) {
      if (hit) return;
      var words = p.t.toLowerCase().replace(/[^a-z ]/g, '').split(/\s+/).filter(function (w) { return w.length > 4; });
      var n = words.filter(function (w) { return t.indexOf(w) > -1; }).length;
      if (n >= 2) hit = p.k;
    });
    if (hit) return hit;
    if (/questionnaire|interview/.test(t) && /publish|push|platform|armour/.test(t)) return 'qnr-publish';
    if (/questionnaire|interview/.test(t)) return 'qnr-draft';
    if (/notice|hold draft|draft.*hold/.test(t)) return 'notice';
    if (/template/.test(t)) return 'push-template';
    if (/new legal hold|create.*hold/.test(t)) return 'push-hold';
    if (/custodian/.test(t) && /table|insert/.test(t)) return 'ins-cust';
    if (/delete|deprovision|offboard/.test(t)) return 'term-release';
    if (/which matter|what matter/.test(t)) return 'gen-find';
    if (/what can you|help/.test(t)) return 'gen-help';
    return 'fallback';
  }

  /* ══════════════════════════════════════════════════════════════
     MODALS
  ══════════════════════════════════════════════════════════════ */
  /* Every platform choice — a template, a new hold, an interview questionnaire,
     a vault pick — is made here in the pane, inline in the thread. No pop-up
     ever covers the document. A panel re-draws itself from its own state, so
     it survives a tab switch. */
  function panelMsg(render, st) {
    st = st || {};
    function draw(b) {
      st.el = b; b.innerHTML = '';
      if (st.done) { b.innerHTML = st.doneHtml || ''; if (st.doneWire) st.doneWire(b); return; }
      render(b, st, redraw);
    }
    function redraw() { if (st.el) draw(st.el); }
    var m = { role: 'agent', html: '', wire: draw };
    S.threads[S.scope].push(m);
    if (logEl) {
      if (S.threads[S.scope].length === 1) logEl.innerHTML = '';
      logEl.appendChild(renderMsg(m));
      bottom();
    }
    return { st: st, redraw: redraw };
  }
  function ip(o) {
    return '<div class="ip"><div class="ip-h"><span class="pbx-card-ic">' + o.ic + '</span>' +
      '<div class="ip-t"><b>' + esc(o.title) + '</b><small>' + o.sub + '</small></div></div>' +
      '<div class="ip-b">' + o.body + '</div><div class="ip-f">' + o.foot + '</div></div>';
  }
  function ipDone(b, st, html, wire) {
    st.done = 1; st.doneHtml = html; st.doneWire = wire;
    b.innerHTML = html;
    if (wire) wire(b);
    bottom();
  }

  ];

      b.innerHTML = ip({
        ic: IC.push, title: 'Push to the template library',

          TEMPLATES.map(function (t) {

              '<span class="tagx nu">new version</span></button>';

          '<span class="ipx"><b>New template from this draft</b><small>Available to the whole legal team</small></span></button>' +
          (st.pick === 'new' ? '<input class="inp" style="margin:0" data-nm value="' + esc(st.name) + '">' : ''),
        foot: '<button class="pbx-btn ghost" data-x>Cancel</button><button class="pbx-btn" data-ok>Push</button>'
      });
      b.querySelectorAll('[data-t]').forEach(function (el) {
        el.addEventListener('click', function () {

      $('[data-ok]', b).addEventListener('click', function () {

        var id = t ? t.id : 'TPL-0' + (12 + S.tmpl.length), nmv = t ? t.n : st.name;

          st.useSel = el.dataset.u === '1'; redraw();
        });
      });
      b.querySelectorAll('[data-g]').forEach(function (el) { el.addEventListener('click', function () { st.tg = el.dataset.g; redraw(); }); });
      $('[data-x]', b).addEventListener('click', function () { ipDone(b, st, '<div class="pbx-say">Nothing copied.</div>'); });
      $('[data-ok]', b).addEventListener('click', function () {
        var t = NOTE_TARGETS.filter(function (x) { return x[0] === st.tg; })[0];
        var recs = { holddoc: 'Legal hold', hold: 'Legal hold', matter: 'Matter', request: 'Request playbook', departure: 'Departure' };
        ipDone(b, st, '<div class="pbx-summary">Copied into <b>' + esc(t[1]) + '</b> (' + esc(t[2]) + ') — ' + esc(ME.n) + ', ' + esc(now()) +
          ', source <b>' + esc(HOSTS[S.host].file) + '</b>.</div>');
        log(recs[st.tg], st.tg === 'holddoc' ? 'Addendum added to the hold document' : 'Note added',
          (st.useSel ? 'Selection' : 'Whole ' + (thing())) + ' from ' + HOSTS[S.host].file);
        toast('Copied into ARMOUR');
      });
    });
  }


  /* exhibit index — pick the vault items, number them, then place them */
  function vaultPanelExhibit() {
    panelMsg(function (b, st, redraw) {
      if (st.done) return;
      st.sel = st.sel || {};
      var n = Object.keys(st.sel).length;
      b.innerHTML = ip({
        ic: IC.table, title: 'Exhibit index',
        sub: 'Pick the items to index. They are numbered in the order shown.',
        body: VAULT.map(function (v) {
          return '<button class="ipo tight' + (st.sel[v.id] ? ' on' : '') + '" data-v="' + v.id + '"><span class="ipc">' + (st.sel[v.id] ? IC.check : '') + '</span>' +
            '<span class="ipx"><b><span class="fic ' + ficOf(v.n) + '">' + ficOf(v.n).toUpperCase().slice(0, 1) + '</span> ' + esc(v.n) + '</b>' +
            '<small>' + esc(v.kind) + ' · ' + esc(v.sub) + '</small></span></button>';
        }).join(''),
        foot: '<button class="pbx-btn ghost" data-x>Cancel</button><button class="pbx-btn" data-ok>Build index (' + n + ')</button>'
      });
      b.querySelectorAll('[data-v]').forEach(function (el) {
        el.addEventListener('click', function () { var i = el.dataset.v; if (st.sel[i]) delete st.sel[i]; else st.sel[i] = 1; redraw(); });
      });
      $('[data-x]', b).addEventListener('click', function () { ipDone(b, st, '<div class="pbx-say">No index built.</div>'); });
      $('[data-ok]', b).addEventListener('click', function () {
        var list = VAULT.filter(function (v) { return st.sel[v.id]; });
        if (!list.length) { toast('Select at least one item.'); return; }
        var rows = list.map(function (v, i) { return ['Ex. ' + (i + 1), v.n, v.kind, v.resp || 'Responsive']; });
        if (isGrid()) {
          sheetAppend('Exhibit index — ' + M.number, ['Exhibit', 'Document', 'Kind', 'Call'], rows);
          ipDone(b, st, '<div class="pbx-summary">Exhibit index built in the sheet — ' + list.length + ' numbered exhibits, each a reference back to its vault item.</div>');
        } else {
          insertDoc('<h2>Exhibit index</h2><p>' + esc(fld('Case caption')) + ' · Case No. ' + esc(fld('Case number')) + '</p>' +
            '<table><thead><tr><th>Exhibit</th><th>Document</th><th>Kind</th><th>Call</th></tr></thead><tbody>' +
            rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('') +
            '</tbody></table>', 'Exhibit index');
          ipDone(b, st, '<div class="pbx-summary">Exhibit index inserted — ' + list.length + ' numbered exhibits with the review call shown against each.</div>');
        }
        log('ESI Vault', 'Exhibit index built', list.length + ' exhibits · ' + M.number);
      });
    });
  }

  /* ── copy out of ARMOUR: vault and matter documents, inline ── */
  function vaultPanel(mode) {
    panelMsg(function (b, st, redraw) {
      if (st.done) return;
      st.sel = st.sel || {};
      st.tg = st.tg || 'hold';
      var n = Object.keys(st.sel).length;
      b.innerHTML = ip({
        ic: IC.vault, title: 'ESI Vault and matter documents',
        sub: 'Attachments are references — permissions still apply and nothing is copied onto this machine.',
        body: VAULT.map(function (v) {
          return '<button class="ipo tight' + (st.sel[v.id] ? ' on' : '') + '" data-v="' + v.id + '"><span class="ipc">' + (st.sel[v.id] ? IC.check : '') + '</span>' +
            '<span class="ipx"><b><span class="fic ' + ficOf(v.n) + '">' + ficOf(v.n).toUpperCase().slice(0, 1) + '</span> ' + esc(v.n) + '</b>' +
            '<small>' + esc(v.kind) + ' · ' + esc(v.sub) + (v.resp ? ' · ' + esc(v.resp) : '') + '</small></span></button>';
        }).join('') +
          '<div class="ip-g">Attach to</div>' +
          [['hold', 'Legal hold notes', H.id], ['matter', 'Matter notes', M.number]].map(function (t) {
            return '<button class="ipo tight' + (st.tg === t[0] ? ' on' : '') + '" data-g="' + t[0] + '"><span class="ipr"></span>' +
              '<span class="ipx"><b>' + esc(t[1]) + '</b><small>' + esc(t[2]) + '</small></span></button>';
          }).join(''),
        foot: '<button class="pbx-btn ghost" data-x>Cancel</button>' +
          (isGrid() ? '' : '<button class="pbx-btn ghost" data-ins>Insert list</button>') +
          '<button class="pbx-btn" data-ok>Attach ' + (n || '') + '</button>'
      });
      b.querySelectorAll('[data-v]').forEach(function (el) {
        el.addEventListener('click', function () { var i = el.dataset.v; if (st.sel[i]) delete st.sel[i]; else st.sel[i] = 1; redraw(); });
      });
      b.querySelectorAll('[data-g]').forEach(function (el) { el.addEventListener('click', function () { st.tg = el.dataset.g; redraw(); }); });
      $('[data-x]', b).addEventListener('click', function () { ipDone(b, st, '<div class="pbx-say">Nothing attached.</div>'); });
      function picked() { return VAULT.filter(function (v) { return st.sel[v.id]; }); }
      var insb = $('[data-ins]', b);
      if (insb) insb.addEventListener('click', function () {
        var list = picked(); if (!list.length) { toast('Select at least one item.'); return; }
        insertDoc('<h3>References</h3><table><thead><tr><th>Item</th><th>Kind</th><th>Detail</th></tr></thead><tbody>' +
          list.map(function (v) { return '<tr><td>' + esc(v.n) + '</td><td>' + esc(v.kind) + '</td><td>' + esc(v.sub) + '</td></tr>'; }).join('') + '</tbody></table>', 'Reference list');
        ipDone(b, st, '<div class="pbx-summary">Inserted ' + list.length + ' reference' + (list.length > 1 ? 's' : '') + ' into the document and attached them to the record.</div>');
        log('ESI Vault', 'Vault references inserted and attached', list.length + ' items');
      });
      $('[data-ok]', b).addEventListener('click', function () {
        var list = picked(); if (!list.length) { toast('Select at least one item.'); return; }
        ipDone(b, st, '<div class="pbx-summary">Attached ' + list.length + ' item' + (list.length > 1 ? 's' : '') + ' to ' +
          (st.tg === 'hold' ? 'the legal hold notes' : 'the matter notes') + ': ' + esc(list.map(function (v) { return v.n; }).join(', ')) + '.</div>');
        log(st.tg === 'hold' ? 'Legal hold' : 'Matter', 'Vault items attached', list.length + ' references');
        toast(list.length + ' attached');
      });
    });
  }

  /* ══════════════════════════════════════════════════════════════
     RECORDS + ACTIVITY
  ══════════════════════════════════════════════════════════════ */
  function paintRecords() {
    var el = $('#recScroll'); if (!el) return;
    if (S.scope === 'general') {
      el.innerHTML = '<div class="sech">Matters you can access</div>' +
        SCOPES.slice(1).map(function (s) {
          return '<button class="rc" data-go="' + s.k + '" style="text-align:left"><div class="rc-h"><span class="pbx-card-ic">' + s.ic + '</span>' + esc(s.kind) + '</div>' +
            '<div class="rc-t">' + esc(s.name) + '</div><div class="rc-v">' + esc(s.sub) + '</div></button>';
        }).join('');
      el.querySelectorAll('[data-go]').forEach(function (b) {
        b.addEventListener('click', function () { S.scope = b.dataset.go; S.tab = 'chat'; paintPane(); if (!S.threads[S.scope].length) greet(); });
      });
      return;
    }
    if (S.scope === 'trm' || S.scope === 'raman') {
      var ok = S.scope === 'trm';
      el.innerHTML = '<div class="sech">Departure record</div>' +
        '<div class="rc"><div class="rc-h"><span class="pbx-card-ic">' + IC.person + '</span>Custodian<em>' + (ok ? OKAFOR.id : 'TRM-0908') + '</em></div>' +
        '<div class="rc-t">' + (ok ? esc(OKAFOR.who) : 'P. Raman') + '</div><div class="rc-v">' + (ok ? esc(OKAFOR.role) + ' · last day ' + esc(OKAFOR.last) : 'Closed · nothing outstanding') + '</div>' +
        '<div class="rc-f"><span class="list-status ' + (ok ? 'warning' : 'success') + '">' + (ok ? 'Offboarding' : 'Released') + '</span></div></div>' +
        (ok ? OKAFOR.holds.map(function (h) {
          return '<div class="rc"><div class="rc-h"><span class="pbx-card-ic">' + IC.hold + '</span>Legal hold<em>' + esc(h.id) + '</em></div>' +
            '<div class="rc-t">' + esc(h.n) + '</div><div class="rc-v">Issued ' + esc(h.issued) + ' · ' + esc(h.ack) + '</div>' +
            '<div class="rc-f"><span class="list-status success">Active</span><small>blocks deletion</small></div></div>';
        }).join('') : '<div class="rc"><div class="rc-h"><span class="pbx-card-ic">' + IC.hold + '</span>Legal holds</div>' +
          '<div class="rc-t">No active holds</div><div class="rc-v">Preservation released and verified; normal retention applies.</div></div>');
      return;
    }
    if (S.scope === 'mtr') {
      var ack = SUB.custodians.filter(function (c) { return c.c >= 95; }).length;
      el.innerHTML = '<div class="sech">Live from the Armour Platform <span class="sp2"></span><span class="lv"><i></i>Live</span></div>' +
        rc(IC.matter, 'Matter', M.number, M.name, M.type + ' · ' + M.court + ' · lead ' + M.lead, ['success', 'Open']) +
        rc(IC.doc, 'Request', SUB.id, SUB.title, 'Objections ' + fld('Objection deadline') + ' · response ' + fld('Response due'), ['info', 'Running']) +
        rc(IC.hold, 'Legal hold', H.id, H.name, ack + ' of ' + SUB.custodians.length + ' acknowledged · ' + H.sources.length + ' systems', ['success', 'Issued']) +
        rc(IC.shield, 'IPP', H.id, 'Preserved in place', SUB.custodians.length + ' custodians and ' + SUB.ncds.length + ' non-custodial stores', ['success', 'Preserved']) +
        rc(IC.vault, 'Collection and review', C.id, C.name, R.id + ' · ' + fmt(R.docs) + ' documents in ' + R.calls.length + ' batches', ['success', 'Complete']);
      return;
    }
    el.innerHTML = '<div class="sech">Record</div>' +
      rc(IC.doc, scopeOf(S.scope).kind, scopeOf(S.scope).sub.split(' · ')[0], scopeOf(S.scope).name, scopeOf(S.scope).sub, ['info', 'Open']);
  }
  function rc(ic, k, id, t, v, st) {
    return '<div class="rc"><div class="rc-h"><span class="pbx-card-ic">' + ic + '</span>' + esc(k) + '<em>' + esc(id) + '</em></div>' +
      '<div class="rc-t">' + esc(t) + '</div><div class="rc-v">' + esc(v) + '</div>' +
      '<div class="rc-f"><span class="list-status ' + st[0] + '">' + esc(st[1]) + '</span></div></div>';
  }
  function paintActivity() {
    var el = $('#actScroll'); if (!el) return;
    if (!S.acts.length) { el.innerHTML = '<div class="rc-v">Nothing yet. Everything you do from this panel is recorded against the record it touched.</div>'; return; }
    el.innerHTML = '<div class="sech">Activity · everything done from the add-in</div>' +
      S.acts.map(function (a) {
        var f = a.fresh; a.fresh = false;
        return '<div class="act-r' + (f ? ' new' : '') + '"><span class="act-d' + (a.queued ? ' q' : '') + '">' + (a.queued ? IC.off : IC.live) + '</span>' +
          '<div class="act-t">' + esc(a.t) + '</div>' +
          '<div class="act-s">' + esc(a.s) + '<br><span class="tagx pl">' + esc(a.rec) + '</span> <span class="tagx nu">' + esc(a.who) + ' · ' + esc(a.surf) + '</span> ' +
          (a.queued ? '<span class="tagx q">queued offline</span> ' : a.synced ? '<span class="tagx ok">synced on reconnect</span> ' : '') + '<time>' + esc(a.at.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })) + '</time></div></div>';
      }).join('');
  }

  /* ══════════════════════════════════════════════════════════════
     BOOT
  ══════════════════════════════════════════════════════════════ */
  var frame = node('<div class="fr">' +
    '<div class="fr-bar"><div class="fr-brand">' + MARK + 'Exterro ARMOUR <small>· Add-in mode</small></div>' +
    '<div class="fr-seg" id="hostSeg">' +
    '<button data-h="offline"><span class="tile t-o">' + IC.off + '</span>Offline</button>' +
    '<button data-h="word"><span class="tile t-w">W</span>Word</button>' +
    '<button data-h="docs"><span class="tile t-d">D</span>Google Docs</button>' +
    '<button data-h="sheets"><span class="tile t-s">S</span>Google Sheets</button>' +
    '<button data-h="excel"><span class="tile t-x">X</span>Excel</button></div>' +
    '<span class="fr-note">Word and Excel run as desktop add-ins · Google Docs and Sheets through the browser extension · offline keeps working and queues</span>' +
    '<span class="sp2"></span>' +
    '<button class="hb" id="railBtn" title="Show or hide the file list" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)">' + IC.panel + '</button>' +
    '<button class="hb" id="themeBtn" title="Toggle theme" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)">' +
    '<svg viewBox="0 0 18 18" fill="none" style="width:15px;height:15px"><path d="M15.5 11.5A7 7 0 0 1 6.5 2.5a7 7 0 1 0 9 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>' +
    '<div class="fr-win"><span>' + IC.min + '</span><span>' + IC.max + '</span><span class="x">' + IC.x + '</span></div></div>' +
    '<div class="fr-stage"><nav class="fl" id="rail"></nav><div class="fr-hosts" id="stage"></div></div></div>');
  document.body.appendChild(frame);
  $('#railBtn').addEventListener('click', function () { S.rail = !S.rail; paintRail(); });
  $('#themeBtn').addEventListener('click', function () {
    var h = document.documentElement;
    h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  buildHosts();
  buildPane();
  paintRail();
  document.querySelectorAll('#hostSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      setHost(b.dataset.h);
      if (S.signed) toast('ARMOUR is now running in ' + HOSTS[b.dataset.h].surface + '.');
    });
  });
})();
</script>
</body>
</html>
