<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exterro ARMOUR — Add-in for Word, Google Docs &amp; Google Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<style>
    /* ═══════════════════════════════════════
       TOKENS — exact values from standalone
    ═══════════════════════════════════════ */
    :root {
      /* lifted verbatim from the product's own :root so the prototype
         and the app resolve to the same face on the same machine */
      --font-sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
                   "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "Courier New", monospace;
      --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-pill:9999px;
      --fast:.16s; --standard:.26s;
      --enter:cubic-bezier(.2,.6,.25,1);
      --std:cubic-bezier(.25,.1,.25,1);
      /* brand */
      --orange:#7a4fd6; --orange-deep:#5e34bf; --orange-soft:#7a4fd61f;
      --magenta:#e23d7d; --magenta-soft:#e23d7d21;
      --accent:#7a4fd6; --accent-soft:#7a4fd621;
      --ex-orange:#ef6f3c; --green:#2fb079; --amber:#e0902f;
      /* playbook tokens — matched exactly to the reference build so the
         step rail and run cards render identically. Note --orange is
         remapped to purple in this app, so the reference's review-state
         orange is exposed under its own name here. */
      --green-soft:#2fb07921; --pb-orange:#e0902f; --pb-orange-soft:#fef3c733;
      --t-agent:#7a4fd6; --t-agent-soft:#7a4fd626;
      --t-play:#e23d7d;  --t-play-soft:#e23d7d26;
    }

    /* light theme (matches screenshot) */
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg:#f6f6f8; --panel:#fff; --panel-2:#fff; --panel-3:#f3f3f6;
      --field:#fff; --line:#ececef; --line-strong:#dcdce2;
      --ink:#2b2b34; --ink-2:#616170; --ink-3:#8d8d98;
      --surface:#fbfbfd; --hover:#f4f4f7;
      --shadow-card:0 0 0 1px #1c1e2e0d,0 4px 16px -6px #1c1e2e14;
      --shadow-hover:0 0 0 1px #1c1e2e0f,0 10px 30px -8px #1c1e2e24;
      --mark-glow:0 2px 9px -3px #7a4fd652;
      /* chrome — white in light mode per reference */
      --chrome:#fff; --chrome-tx:#62636f; --chrome-tx-2:#9a9aa7;
      --chrome-title:#242329; --chrome-line:#ececef; --chrome-hover:#f3f3f6;
      --track:#ececed;
    }

    /* dark theme */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg:#0c0c0e; --panel:#161619; --panel-2:#161619; --panel-3:#202025;
      --field:#121214; --line:#2a2a30; --line-strong:#3b3b43;
      --ink:#f2f2f5; --ink-2:#b3b4bc; --ink-3:#82828c;
      --surface:#0c0c0e; --hover:#202025;
      --shadow-card:0 0 0 1px #ffffff0f,0 8px 24px -10px #0009;
      --shadow-hover:0 0 0 1px #ffffff17,0 16px 38px -14px #0000009e;
      --chrome:#0c0c0e; --chrome-tx:#c2c2ca; --chrome-tx-2:#7e7e88;
      --chrome-title:#fff; --chrome-line:#ffffff14; --chrome-hover:#ffffff0f;
      --track:#202025;
    }

    /* ═══════════════════════════════════════
       TOPBAR + RAIL — theme-aware chrome (white in
       light, dark in dark) exactly like reference
    ═══════════════════════════════════════ */
    .unirail {
      --tb-bg:     var(--chrome);
      --tb-line:   var(--chrome-line);
      --tb-tx:     var(--chrome-tx);
      --tb-tx2:    var(--chrome-tx-2);
      --tb-title:  var(--chrome-title);
      --tb-hover:  var(--chrome-hover);
    }

    /* ═══════════════════════════════════════
       RESET
    ═══════════════════════════════════════ */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    button{font-family:inherit;cursor:pointer;border:none;background:none}
    input,textarea{font-family:inherit}
    svg{display:block;flex-shrink:0}

    html,body{
      height:100%;overflow:hidden;
      font-family:var(--font-sans);
      font-size:14px;line-height:1.5;letter-spacing:-.003em;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }

    /* ═══════════════════════════════════════
       SHELL
    ═══════════════════════════════════════ */
    .shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--chrome)}

    /* theme icon visibility */
    .icon-sun{display:none} .icon-moon{display:none}
    [data-theme="light"] .icon-moon{display:block}
    [data-theme="dark"]  .icon-sun{display:block}

    /* ═══════════════════════════════════════
       BODY
    ═══════════════════════════════════════ */
    .body{display:flex;flex:1;min-height:0;overflow:hidden}

    /* ═══════════════════════════════════════
       UNIRAIL — the one left sidebar: brand, primary nav, chat history,
       and account/utility controls, consolidated from what used to be a
       separate topbar + icon rail + chat-history panel. Expands/collapses;
       auto-collapses when Studio/Usage take over (they don't need the
       chat list), auto-expands back when returning to Chat.
    ═══════════════════════════════════════ */
    .unirail{
      background:var(--tb-bg);border-right:1px solid var(--tb-line);
      display:flex;flex-direction:column;flex:none;width:264px;min-height:0;
      transition:width .26s var(--enter);overflow:hidden;
    }
    .unirail.collapsed{width:84px}

    .unirail-scroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
    .unirail-scroll::-webkit-scrollbar{width:0;height:0}

    .unirail-top{flex:none;padding:14px 14px 6px}
    .unirail-brand-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .unirail-brand-mark{
      width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--ex-orange),var(--magenta));color:#fff;
    }
    .unirail-brand-mark svg{width:16px;height:16px}
    .unirail-brand-title{
      flex:1;min-width:0;color:var(--tb-title);font-size:12.5px;font-weight:800;letter-spacing:-.005em;
      line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .unirail-collapse-btn{
      flex:none;width:24px;height:24px;border-radius:7px;color:var(--tb-tx2);display:grid;place-items:center;
      transition:background .15s,color .15s;
    }
    .unirail-collapse-btn:hover{background:var(--tb-hover);color:var(--tb-tx)}
    .unirail-collapse-btn svg{width:11px;height:11px;transition:transform .2s}
    .unirail.collapsed .unirail-collapse-btn svg{transform:rotate(180deg)}
    .unirail.collapsed .unirail-brand-row{flex-direction:column;gap:6px;margin-bottom:10px}
    .unirail.collapsed .unirail-brand-title{display:none}

    .unirail-new{
      display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:10px;
      background:var(--accent-soft);color:var(--accent);font:700 13px var(--font-sans);
      margin-bottom:6px;transition:background .15s,color .15s;
    }
    .unirail-new:hover{background:var(--accent);color:#fff}
    .unirail-new svg{width:13px;height:13px;flex:none}
    .unirail.collapsed .unirail-new{justify-content:center;padding:9px}
    .unirail.collapsed .unirail-new span{display:none}

    .unirail-navitem{
      display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:9px;
      color:var(--tb-tx);font:600 13px var(--font-sans);transition:background .15s,color .15s;
    }
    .unirail-navitem:hover{background:var(--tb-hover);color:var(--tb-title)}
    .unirail-navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
    .unirail-navitem svg{width:15px;height:15px;flex:none}
    .unirail.collapsed .unirail-navitem{justify-content:center;padding:8px}
    .unirail.collapsed .unirail-navitem span{display:none}

    .unirail-div{height:1px;background:var(--tb-line);margin:12px 4px 4px}
    /* only shown collapsed — expanded already has the dedicated "+" next
       to Search chats, so this would just be a redundant second control */
    .unirail-new-collapsed{display:none}
    .unirail.collapsed .unirail-new-collapsed{display:flex;color:var(--accent)}
    .unirail.collapsed .unirail-new-collapsed:hover{background:var(--accent-soft)}

    .unirail-chats{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:4px}
    .unirail.collapsed .unirail-chats,
    .unirail.collapsed .unirail-div{display:none}
    .unirail-chats-title{
      flex:none;font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--tb-tx2);padding:4px 14px 8px;
    }

    .unirail-foot{
      flex:none;display:flex;align-items:center;gap:6px;padding:12px 14px;border-top:1px solid var(--tb-line);
    }
    .unirail-logo-mark{
      width:28px;height:28px;flex:none;border-radius:50%;object-fit:cover;
      background:#12121a;
    }
    .unirail-foot-div{display:none}
    .unirail-foot-push{margin-left:auto}
    .unirail-foot-item{
      width:30px;height:30px;flex:none;border-radius:8px;color:var(--tb-tx2);display:grid;place-items:center;
      position:relative;transition:background .15s,color .15s;
    }
    .unirail-foot-item:hover{background:var(--tb-hover);color:var(--tb-tx)}
    .unirail-foot-item svg{width:16px;height:16px}
    .unirail-foot-item .notif-badge{
      position:absolute;top:2px;right:2px;background:var(--magenta);color:#fff;
      font-size:8.5px;font-weight:800;min-width:13px;height:13px;border-radius:var(--r-pill);
      display:grid;place-items:center;padding:0 3px;box-shadow:0 0 0 2px var(--tb-bg);
    }
    .unirail-account{
      min-width:0;flex:none;display:flex;align-items:center;padding:2px;
      border-radius:50%;transition:background .15s;
    }
    .unirail-account:hover{background:var(--tb-hover)}
    .unirail-avatar{
      background:linear-gradient(135deg,var(--ex-orange),var(--magenta));color:#fff;
      border-radius:50%;display:grid;place-items:center;width:28px;height:28px;
      font-size:11px;font-weight:700;flex:none;
    }
    /* collapsed footer: identity (logo, avatar) sits above a hairline,
       utilities below — same two-group reading as the expanded row, just
       stacked. Without the rule the divider collapses and all five icons
       read as one undifferentiated column. */
    .unirail.collapsed .unirail-foot{flex-direction:column;height:auto;padding:12px 0 14px;gap:7px}
    .unirail.collapsed .unirail-foot-div{
      display:block;width:22px;height:1px;align-self:center;background:var(--tb-line);margin:3px 0;
    }
    .unirail.collapsed .unirail-foot-push{margin-left:0}
    .unirail.collapsed .unirail-account{width:auto}

    /* ═══════════════════════════════════════
       HISTPANEL / SIDEBAR  (width:248px, chrome bg)
    ═══════════════════════════════════════ */
    .histpanel{
      background:var(--chrome);
      border-right:1px solid var(--chrome-line);
      display:flex;flex-direction:column;
      width:248px;flex:none;min-height:0;overflow:hidden;
      transition:width .3s var(--enter),border-color .3s var(--enter);
    }
    .histpanel.collapsed{width:0;border-right-color:transparent}

    /* floating expand/new-chat controls, shown only while history is
       collapsed — hidden by default so they don't double up with the
       real hp-min/hp-new buttons inside the (visible) histpanel */
    .hp-collapsed-rail{
      display:none;flex-direction:column;gap:8px;flex:none;
      padding:16px 0 0 16px;
    }
    .wsrow.history-collapsed .hp-collapsed-rail{display:flex}
    .hp-collapsed-btn{
      width:30px;height:30px;border-radius:9px;border:1px solid var(--chrome-line);
      background:var(--chrome);color:var(--ink-2);display:grid;place-items:center;
      transition:border-color .15s,color .15s,background .15s;
    }
    .hp-collapsed-btn:hover{border-color:var(--orange);color:var(--orange);background:var(--accent-soft)}
    .hp-collapsed-btn svg{width:14px;height:14px}

    /* lc-top: new button + tabs pill */
    .lc-top{
      display:flex;align-items:center;gap:6px;
      margin:12px 12px 4px;flex:none;
    }
    .lc-new{
      border:1px solid var(--chrome-line);background:var(--field);
      width:36px;height:36px;color:var(--chrome-title);
      border-radius:11px;flex:none;display:grid;place-items:center;
      transition:border-color .2s,color .2s,background .2s;
    }
    .lc-new:hover{border-color:var(--orange);color:var(--orange);background:var(--accent-soft)}
    .lc-new svg{width:16px;height:16px}

    .lc-tabs{
      background:var(--chrome-hover);border-radius:12px;
      flex:1;gap:3px;min-width:0;padding:4px;display:flex;
    }
    .lc-tab{
      color:var(--chrome-tx-2);
      border-radius:9px;flex:1;
      display:inline-flex;justify-content:center;align-items:center;gap:7px;
      padding:7px 10px;font-size:12.5px;font-weight:600;
      transition:background .15s,color .15s,box-shadow .15s;
    }
    .lc-tab:hover{color:var(--chrome-title)}
    .lc-tab.active{
      background:var(--field);color:var(--chrome-title);
      box-shadow:var(--shadow-card);
    }
    .lc-tab.active svg{color:var(--orange)}
    .lc-tab svg{width:15px;height:15px}

    /* collab gradient icon */
    .collab-icon{
      width:15px;height:15px;
      background:linear-gradient(135deg,#5c8fff,#9f5cff);
      border-radius:4px;display:grid;place-items:center;flex-shrink:0;
    }
    .collab-icon svg{width:9px;height:9px;color:#fff}

    /* hp-head: CHATS label + actions */
    .hp-head{
      display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:16px 12px 10px;flex:none;
    }
    .hp-title{
      letter-spacing:.1em;text-transform:uppercase;
      color:var(--chrome-tx-2);font-size:11px;font-weight:700;
    }
    .hp-head-actions{display:flex;align-items:center;gap:6px}
    .hp-new{
      border:1px solid var(--chrome-line);color:var(--chrome-tx);
      border-radius:9px;display:inline-flex;align-items:center;gap:6px;
      padding:6px 11px;font-size:12px;font-weight:700;
      transition:border-color .2s,color .2s,background .2s;
    }
    .hp-new:hover{border-color:var(--orange);color:var(--orange);background:var(--accent-soft)}
    .hp-new svg{width:14px;height:14px}

    /* search */
    .unirail-search-row{display:flex;align-items:center;gap:6px;margin:0 10px 8px}
    .unirail-search-row .hp-search{flex:1;margin:0}
    .unirail-new-icon{
      width:32px;height:32px;flex:none;border-radius:9px;border:1px solid var(--chrome-line);
      color:var(--chrome-tx);display:grid;place-items:center;
      transition:border-color .15s,color .15s,background .15s;
    }
    .unirail-new-icon:hover{border-color:var(--orange);color:var(--orange);background:var(--accent-soft)}
    .unirail-new-icon svg{width:14px;height:14px}
    .hp-search{
      border:1px solid var(--chrome-line);background:var(--field);
      border-radius:9px;display:flex;align-items:center;gap:7px;
      margin:0 10px 8px;padding:7px 9px;
      transition:border-color .15s;
    }
    .hp-search:focus-within{border-color:var(--line-strong)}
    .hp-search svg{width:14px;height:14px;color:var(--chrome-tx-2);flex:none}
    .hp-search input{
      min-width:0;color:var(--chrome-title);
      background:none;border:none;outline:none;flex:1;font-size:12.5px;
    }
    .hp-search input::placeholder{color:var(--chrome-tx-2)}

    /* chat list */
    .hp-list{
      display:flex;flex-direction:column;flex:1;gap:2px;
      padding:4px 8px 14px;overflow-y:auto;scrollbar-width:thin;
      scrollbar-color:var(--chrome-line) transparent;
    }
    .hp-list::-webkit-scrollbar{width:3px}
    .hp-list::-webkit-scrollbar-thumb{background:var(--chrome-line);border-radius:2px}

    .hp-item{
      position:relative;
      text-align:left;border-radius:10px;display:flex;align-items:center;gap:8px;
      width:100%;padding:9px 10px;transition:background .15s;
    }
    .hp-item:hover{background:var(--chrome-hover)}
    .hp-item.active{background:var(--accent-soft);position:relative}
    .hp-item.active::before{
      content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;
      border-radius:0 3px 3px 0;background:var(--accent);
    }
    .hp-item.active .hp-it-title{color:var(--accent)}

    /* needs-input items: curved orange left-bracket accent */
    .hp-item.needs{align-items:flex-start}
    .hp-item.needs::before{
      content:"";position:absolute;
      left:-4px;top:5px;bottom:5px;width:11px;
      border:2.5px solid var(--ex-orange);border-right:0;
      border-radius:11px 0 0 11px;
    }

    .hp-it-dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--ex-orange);flex-shrink:0;
      align-self:flex-start;margin-top:4px;
    }
    .hp-it-main{flex:1;min-width:0}
    .hp-it-title{
      color:var(--chrome-title);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;font-size:13px;font-weight:600;
    }
    .hp-it-time{color:var(--chrome-tx-2);margin-top:2px;font-size:11px}
    .hp-it-need{color:var(--ex-orange);margin-top:2px;font-size:11px;font-weight:600}

    /* ═══════════════════════════════════════
       MAIN COLUMN (after rail) — holds scopebar + wsrow
    ═══════════════════════════════════════ */
    .main-col{
      display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;
    }

    /* wsrow: histpanel + content side by side, below scopebar */
    .wsrow{
      display:flex;flex:1;min-height:0;position:relative;
    }

    /* Library panel — a real flex sibling of .wscol, not an overlay with a
       backdrop. Chat stays fully visible and interactive the whole time;
       this panel just shares the row with it. Width toggles by level:
       narrow for the Directory/Views list, wide once a table is open,
       since a real data table needs the room. */
    .armour-library-panel{
      flex:none;width:0;overflow:hidden;
      background:var(--panel);
      display:flex;flex-direction:column;
      transition:width .24s var(--enter);
    }
    .armour-library-panel.open{width:320px}
    /* a table/detail record is the content — it should claim the width and
       let chat sit compact beside it, rather than the reverse. Chat still
       gets a comfortable reading column, and dragging the divider still
       overrides both. */
    .armour-library-panel.open.table-level{width:min(1280px,74vw)}
    .wsrow-lib-table .wscol{flex:none;width:clamp(300px,26vw,400px)}

    /* ═══ Case record rail — always fixed width when open, unlike the
       library panel which widens for a table. This is a running document,
       not something being browsed; it should feel like a steady, present
       column, not a thing that takes over. ═══ */
    .subcase-rail{
      flex:none;width:0;overflow:hidden;background:var(--panel);
      display:flex;flex-direction:column;border-left:1px solid var(--line);
      transition:width .24s var(--enter);
    }
    .subcase-rail.open{width:380px}
    .subcase-rail-head{flex:none;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
    .subcase-rail-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);display:block}
    .subcase-rail-sub{font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .subcase-rail-body{flex:1;min-height:0;overflow-y:auto;padding:8px 14px 30px}

    /* one row per section — collapsed by default, three states */
    .scr-row{border-bottom:1px solid var(--line)}
    .scr-row:last-child{border-bottom:none}
    .scr-row-head{
      display:flex;align-items:center;gap:9px;padding:12px 2px;cursor:default;
    }
    .scr-mark{
      display:inline-flex;align-items:center;gap:5px;flex:none;
      font:700 10.5px var(--font-sans);padding:2px 8px;border-radius:99px;
    }
    .scr-mark svg{width:11px;height:11px}
    .scr-mark.agent{background:var(--accent-soft);color:var(--accent)}
    .scr-mark.person{background:#2fb0791a;color:var(--green)}
    .scr-mark.app{background:var(--panel-3);color:var(--ink-3);border:1px solid var(--line)}
    .scr-name{flex:1;min-width:0;font:600 13px var(--font-sans);color:var(--ink)}
    .scr-row.pending .scr-name{color:var(--ink-3)}
    .scr-row.pending .scr-mark{opacity:.45}
    .scr-status{font:600 11.5px var(--font-sans);color:var(--ink-3);flex:none}
    .scr-body{padding:0 2px 16px}
    .scr-body .ci-formcard{border:none;padding:0;background:transparent}
    .scr-body .ci-formcard-head{margin:0 0 14px}

    /* commit line — replaces the old outcome+card pairing in chat. One
       small pill saying where the result just got written, colored by
       the same three provenance marks the rail uses. This repetition
       (same colors, same words, both places) is what teaches the model
       without ever having to explain it. */
    .ci-commit{
      display:inline-flex;align-items:center;gap:6px;margin-top:14px;
      font:700 12px var(--font-sans);padding:4px 11px;border-radius:99px;
    }
    .ci-commit svg{width:12px;height:12px}
    .ci-commit.agent{background:var(--accent-soft);color:var(--accent)}
    .ci-commit.person{background:#2fb0791a;color:var(--green)}
    .ci-commit.app{background:var(--panel-3);color:var(--ink-3);border:1px solid var(--line)}
    /* ═══════════════════════════════════════════════════════════════════
       PLAYBOOK STEP — the four beats.

       Beat 1 .pbr  routing    why this step is running now
       Beat 2 .pba  assignment who owns it (manual steps only)
       Beat 3 .pbo  output     compact receipt, opens the real thing right
       Beat 4       action     the existing ci-approve bar

       The rule these enforce: chat carries PROCESS (why, how, who), the
       right panel carries OUTPUT (the actual artifact). Neither repeats
       the other, so there is exactly one place to read any given fact.
    ═══════════════════════════════════════════════════════════════════ */
    .pbr{
      border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0;
    }
    .pbr-line{font:500 12.5px var(--font-sans);line-height:1.6;color:var(--ink-2)}
    .pbr-line b{color:var(--ink);font-weight:700}
    .pbr-toggle{
      display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:3px 9px;
      border-radius:99px;border:1px solid var(--line);background:var(--panel);
      font:700 10.5px var(--font-sans);color:var(--ink-3);
    }
    .pbr-toggle:hover{border-color:var(--line-strong);color:var(--ink-2)}
    .pbr-toggle svg{width:10px;height:10px;transition:transform .18s}
    .pbr-toggle.open svg{transform:rotate(180deg)}
    .pbr-body{display:none;margin-top:9px}
    .pbr-body.open{display:block}
    .pbr-rule{
      display:flex;gap:9px;align-items:flex-start;padding:5px 0;
      font:500 11.5px var(--font-sans);color:var(--ink-2);line-height:1.55;
    }
    .pbr-rule-mark{
      flex:none;margin-top:2px;width:13px;height:13px;border-radius:50%;
      display:grid;place-items:center;
    }
    .pbr-rule-mark svg{width:8px;height:8px}
    .pbr-rule.hit .pbr-rule-mark{background:var(--accent-soft);color:var(--accent)}
    .pbr-rule.miss .pbr-rule-mark{background:var(--panel-3);color:var(--ink-3)}
    .pbr-rule.miss{color:var(--ink-3)}
    .pbr-rule code{
      font-family:var(--font-mono);font-size:10.5px;color:var(--ink);
      background:var(--panel-3);padding:1px 5px;border-radius:4px;
    }

    /* The agent's working — one block, two lives.

       Running: a spinner, a label, sub-steps ticking in. This is the
       step indicator, and it is the only thing on screen while the step
       is live, so there is no question about what is happening.

       Finished: the whole thing folds to a single quiet link and the
       output card is the only thing left with visual weight. Why it ran
       and how it ran collapse together because they are the same kind
       of content — the agent's working, not its result. */
    .pbw{margin:0}
    .pbw-live{display:none;align-items:center;gap:9px}
    .pbw.running .pbw-live{display:flex}
    .pbw-live-lab{font:600 13px var(--font-sans);color:var(--ink)}
    .pbw-toggle{
      display:inline-flex;align-items:center;gap:6px;padding:0;background:none;
      font:700 11.5px var(--font-sans);color:var(--ink-3);
    }
    .pbw.running .pbw-toggle{display:none}
    .pbw-toggle:hover{color:var(--accent)}
    .pbw-toggle svg{width:11px;height:11px;transition:transform .18s}
    .pbw.open .pbw-toggle{color:var(--ink-2)}
    .pbw.open .pbw-toggle svg{transform:rotate(180deg)}
    .pbw-body{display:none;margin-top:12px}
    .pbw.running .pbw-body,.pbw.open .pbw-body{display:block}
    /* mid-run only the doing matters; the why is available after */
    .pbw.running .pbw-why{display:none}
    .pbw.running .pbw-sec{display:none}
    .pbw-body > * + *{margin-top:16px}
    .pbw-sec{
      font:700 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:8px;
    }
    .pbw-why{border-left:2px solid var(--accent);padding-left:12px}
    .pbw-why .pbr-line{margin-bottom:8px}

    /* Beat 2 — manual assignment. Deliberately NOT the accent colour:
       this is the one kind of step the agent cannot finish itself. */
    .pba{
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      padding:14px 16px;box-shadow:var(--shadow-card);
    }
    .pba-head{display:flex;align-items:center;gap:11px}
    .pba-av{
      flex:none;width:30px;height:30px;border-radius:50%;background:var(--pb-orange-soft);
      color:var(--pb-orange);display:grid;place-items:center;
      font:800 11.5px var(--font-sans);border:1px solid #e0902f3d;
    }
    .pba-who{flex:1;min-width:0}
    .pba-name{font:700 13px var(--font-sans);color:var(--ink);display:block}
    .pba-role{font:600 11px var(--font-sans);color:var(--ink-3)}
    .pba-state{
      flex:none;font:700 10.5px var(--font-sans);color:var(--pb-orange);
      background:var(--pb-orange-soft);padding:3px 9px;border-radius:99px;
    }
    .pba-state.done{color:var(--green);background:var(--green-soft)}
    .pba-grid{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px}
    .pba-lab{
      font:700 9.5px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);padding-top:2px;
    }
    .pba-val{font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.55}
    .pba-foot{
      margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
      display:flex;align-items:center;gap:10px;
    }
    .pba-btn{
      font:700 11.5px var(--font-sans);color:var(--ink-2);
      border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 13px;background:var(--panel);
    }
    .pba-btn:hover{border-color:var(--line-strong);color:var(--ink)}

    /* Beat 3 — the output card. The ONE thing chat shows for a result.
       Never the form itself: the form lives wherever the record lives. */
    .pbo{
      display:flex;align-items:stretch;gap:0;width:100%;text-align:left;
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      box-shadow:var(--shadow-card);overflow:hidden;
      transition:box-shadow var(--fast) var(--std),border-color var(--fast) var(--std);
    }
    .pbo:hover{box-shadow:var(--shadow-hover);border-color:var(--line-strong)}
    .pbo.needs{border-color:#e0902f55;box-shadow:0 0 0 3px #e0902f14}
    .pbo-main{flex:1;min-width:0;padding:13px 15px}
    .pbo-top{display:flex;align-items:center;gap:9px}
    .pbo-ic{
      flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .pbo-ic svg{width:13px;height:13px}
    .pbo.needs .pbo-ic{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .pbo.done .pbo-ic{background:var(--green-soft);color:var(--green)}
    .pbo-t{flex:1;min-width:0;font:700 13px var(--font-sans);color:var(--ink)}
    .pbo-tag{
      flex:none;font:700 9.5px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;
      padding:2px 7px;border-radius:99px;background:var(--panel-3);color:var(--ink-3);
    }
    .pbo.needs .pbo-tag{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .pbo.done .pbo-tag{background:var(--green-soft);color:var(--green)}
    .pbo-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .pbo-fact{
      display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:6px;
      background:var(--panel-3);font:600 11px var(--font-sans);color:var(--ink);
    }
    .pbo-fact i{font-style:normal;color:var(--ink-3);font-weight:700;font-size:9.5px;
      letter-spacing:.04em;text-transform:uppercase}
    .pbo-go{
      flex:none;width:112px;border-left:1px solid var(--line);background:var(--surface);
      display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 13px;
    }
    .pbo:hover .pbo-go{background:var(--hover)}
    .pbo-go-lab{
      font:700 9.5px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);
    }
    .pbo-go-dest{
      display:flex;align-items:center;gap:5px;
      font:700 12px var(--font-sans);color:var(--accent);
    }
    .pbo-go-dest svg{width:11px;height:11px}

    /* the crumb the right panel grows when it was opened FROM something */
    .pbcrumb{
      flex:none;display:flex;align-items:center;gap:8px;padding:8px 30px;
      background:var(--panel-3);border-bottom:1px solid var(--line);
    }
    .pbcrumb-back{
      display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;
      border:1px solid var(--line);background:var(--panel);
      font:700 11px var(--font-sans);color:var(--ink-2);
    }
    .pbcrumb-back:hover{border-color:var(--line-strong);color:var(--ink)}
    .pbcrumb-back svg{width:10px;height:10px}
    .pbcrumb-trail{font:600 11px var(--font-sans);color:var(--ink-3);min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .sl-note{font:500 12.5px var(--font-sans);color:var(--ink-3);line-height:1.6}

    /* a compact status line in the idbar itself — replaces the old hero
       card, which mostly repeated what the idbar's own status pill and
       the tab rail already said (due date twice, custodians/uploads/
       production counts that read "—" more often than not) */
    .hd-blocked-chip{
      display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;
      background:var(--pb-orange-soft);border:1px solid #e0902f3d;
      font:700 11.5px var(--font-sans);color:var(--pb-orange);white-space:nowrap;
    }
    .hd-blocked-chip:hover{background:#e0902f26}
    .hd-days-chip{
      font:600 12px var(--font-sans);color:var(--ink-3);white-space:nowrap;
    }
    .hd-days-chip b{color:var(--ink);font-weight:700}

    /* ═══ ARMOUR session chat — document-style, matching the reference:
       user messages are quiet bordered cards (not gradient bubbles),
       agent messages have no bubble at all so cards and prose sit
       directly on the page. Applies only when chat has the column to
       itself; beside a table it reverts to the compact bubble style. ═══ */
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel{flex:1;width:auto}
    /* with the middle pane collapsed there's nothing beside chat, so it
       takes the whole column regardless of the beside-a-table width */
    .pane-split.mid-empty > #armourSessionChatPanel{flex:1;width:auto}
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-log,
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-composer,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-log,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-composer{
      max-width:820px;width:100%;margin-left:auto;margin-right:auto;
    }
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-log,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-log{
      display:flex;flex-direction:column;gap:18px;padding:22px;
    }
    /* agent: no bubble, no avatar tint — content sits on the page */
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-msg-agent,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-msg-agent{gap:12px}
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-msg-agent .pane-chat-bubble,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-msg-agent .pane-chat-bubble{
      max-width:100%;width:100%;background:none;border:none;padding:3px 0 0;
      font-size:14.5px;line-height:1.55;color:var(--ink);
    }
    /* user: a quiet card, left-aligned with the agent column, not a
       right-floated gradient — keeps long messages readable */
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-msg-user,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-msg-user{justify-content:flex-start}
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-msg-user .pane-chat-bubble,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-msg-user .pane-chat-bubble{
      max-width:100%;width:100%;margin-left:40px;
      background:var(--panel-3);color:var(--ink);border:1px solid var(--line);
      border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.55;font-weight:500;
    }
    .armour-library-panel-head{
      flex:none;display:flex;align-items:center;gap:10px;
      padding:14px 18px;font-size:13px;font-weight:700;color:var(--ink);
      white-space:nowrap;min-height:56px;
    }
    /* a single-purpose panel (one step's form, nothing else) has nothing
       to navigate to and nothing to summarize — the breadcrumb, title,
       list summary, and filter/download/expand controls all belonged to
       whatever list was open before this content replaced it. Only the
       close button still means anything here. */
    .armour-library-panel.bare-head .armour-library-panel-back,
    .armour-library-panel.bare-head .armour-library-panel-title,
    .armour-library-panel.bare-head .albh-summary-slot,
    .armour-library-panel.bare-head .albh-actions-slot,
    .armour-library-panel.bare-head .armour-library-expand-btn{ display:none !important; }
    /* the whole outer bar goes away, not just its contents — a blank
       strip sitting above our own header still reads as a second layer
       even with nothing in it. Our content's own header becomes the
       only header, and gets the close button back since it's now the
       only one. */
    .armour-library-panel.bare-head .armour-library-panel-head{ display:none; }
    /* the record/list title used to sit in its own bar below this one —
       now it's inline, larger, part of the same breadcrumb chain instead
       of a second header repeating the same "where am I" information */
    .armour-library-panel-title{
      flex:none;overflow:hidden;text-overflow:ellipsis;max-width:260px;
      font:inherit;color:inherit;cursor:default;
      background:none;border:none;padding:0;margin:0;text-align:left;
    }
    /* only clickable — and only looks it — while a record is open on top
       of this list; at the list level it's just "you are here" */
    .armour-library-panel-title.is-clickable{cursor:pointer}
    .armour-library-panel-title.is-clickable:hover{color:var(--accent);text-decoration:underline}
    .armour-library-panel-title:empty{display:none}
    .albh-summary-slot{
      display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden;
    }
    .albh-summary-slot:empty{display:none}
    .albh-summary-slot .list-card-count{
      font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .albh-sep{color:var(--ink-3);font-weight:400;font-size:15px}
    .albh-spacer{flex:1;min-width:8px}
    .albh-actions-slot{display:flex;align-items:center;gap:9px}
    .albh-actions-slot:empty{display:none}
    .armour-library-panel-back{
      display:flex;align-items:center;gap:5px;flex:none;
      font-size:12.5px;font-weight:700;color:var(--ink-2);
      padding-right:10px;margin-right:2px;border-right:1px solid var(--line);
    }
    .armour-library-panel-back:hover{color:var(--ink)}
    .armour-library-panel-back svg{width:13px;height:13px}
    .armour-library-overlay-close{
      width:22px;height:22px;flex:none;border-radius:7px;color:var(--ink-3);display:grid;place-items:center;
      transition:background .15s,color .15s;
    }
    .armour-library-overlay-close svg{width:11px;height:11px}
    .armour-library-overlay-close:hover{background:var(--panel);color:var(--ink)}

    /* Expand — grows the panel to fill the whole row, hiding chat rather
       than just sharing width with it, similar to expanding an artifact
       to full screen. Only makes sense once viewing an actual table
       (Holds, a saved dashboard, etc.) — the nav-level Apps/Playbooks/
       Dashboards list is a narrow, fixed-width list by design, and
       stretching it to full width just leaves a wall of empty space
       beside it, so the button is hidden until you're past that level. */
    .armour-library-expand-btn{
      display:none;width:22px;height:22px;flex:none;border-radius:7px;color:var(--ink-3);
      place-items:center;transition:background .15s,color .15s;
    }
    .armour-library-panel.table-level .armour-library-expand-btn{display:grid}
    .armour-library-expand-btn:hover{background:var(--panel);color:var(--ink)}
    .armour-library-expand-btn svg{width:13px;height:13px}
    .wsrow.chat-hidden .wscol{display:none}
    .wsrow.chat-hidden .armour-library-panel{flex:1;width:auto;max-width:none}
    /* the way back from maximized — chat is fully hidden, so this strip
       stands in for it: same width/position chat's own collapsed state
       used elsewhere, so maximizing doesn't feel like losing a different
       part of the UI, just chat folding down to its smallest form */
    .wscol-collapsed-strip{
      display:none;flex:none;width:40px;flex-direction:column;align-items:center;
      justify-content:flex-start;gap:12px;padding:16px 0;
      background:linear-gradient(180deg,#7a4fd614,#e23d7d0a 55%,var(--panel) 100%);
      border-right:1px solid var(--line);cursor:pointer;
      transition:background .2s;
    }
    .wsrow.chat-hidden .wscol-collapsed-strip{display:flex}
    .wscol-collapsed-strip:hover{background:linear-gradient(180deg,#7a4fd622,#e23d7d14 55%,var(--hover) 100%)}
    .wscol-collapsed-strip-icon{color:var(--accent);display:flex;flex:none}
    .wscol-collapsed-strip-icon svg{width:13px;height:13px}
    .wscol-collapsed-strip-text{
      writing-mode:vertical-rl;transform:rotate(180deg);
      font:700 11.5px var(--font-sans);letter-spacing:.03em;color:var(--ink-2);
      white-space:nowrap;
    }
    .wscol-collapsed-strip:hover .wscol-collapsed-strip-text{color:var(--ink)}

    /* the "an ongoing chat just got attached" notice — subtle, dismissible,
       never blocks anything. Hidden by default; shown only for the one
       case that actually warrants a heads-up. Lives inside the chat
       column itself, so it wraps to two lines rather than the wide
       single-row layout a full-panel header could afford. */
    .chat-attach-banner{
      display:none;flex-wrap:wrap;align-items:center;gap:6px 8px;
      padding:9px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);
      font:600 11.5px var(--font-sans);color:var(--ink-2);line-height:1.4;
    }
    .chat-attach-banner.show{display:flex}
    .chat-attach-banner-icon{color:var(--accent);display:flex;flex:none}
    .chat-attach-banner-icon svg{width:12px;height:12px}
    .chat-attach-banner-text{flex:1;min-width:0}
    .chat-attach-banner-text strong{color:var(--ink);font-weight:700}
    .chat-attach-banner-x{
      flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
      color:var(--ink-3);transition:background .15s,color .15s;
    }
    .chat-attach-banner-x:hover{background:#7a4fd61f;color:var(--ink)}
    .chat-attach-banner-x svg{width:8px;height:8px}
    .chat-attach-banner-new{
      flex:none;width:100%;text-align:left;
      font:700 11px var(--font-sans);color:var(--accent);
      padding:3px 0 0 20px;
    }
    .chat-attach-banner-new:hover{text-decoration:underline}
    .armour-library-overlay-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    /* the relocated .bm-nav should fill this body naturally, unstyled by
       its usual fixed width/border since it's no longer beside bm-content */
    .armour-library-overlay-body .bm-nav{width:100%;border-right:none;flex:1;min-height:0}
    /* the collapse-to-hover-peek control only makes sense on the standalone
       Library page — here the panel's own close (X) already does that job */
    .armour-library-overlay-body .bm-nav-collapse{display:none}
    .armour-library-table-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    /* the pane's own insight banner duplicates both the panel header title
       and the table card's own summary line — one of the three is enough */
    .armour-library-table-body .pane-brief{display:none}
    /* the per-table chat ("type to filter…") is retired in this context —
       the one ARMOUR composer on the left is now the only way to ask
       anything, so the table gets the full panel width to itself */
    .armour-library-table-body .pane-chat{display:none}
    .armour-library-table-body .pane-split{width:100%}

    /* ═══════════════════════════════════════
       CONTENT COLUMN  (wscol)
    ═══════════════════════════════════════ */
    .wscol{
      position:relative;display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;overflow:hidden;
    }
    /* Browsing a list without having connected chat to it. Rather than
       just dimming (ambiguous — looks broken, or like a loading state),
       chat is visibly held back AND labelled, so the reason is explicit.
       The note sits as a compact bar pinned to the bottom of the pane, so
       it never overlaps the greeting or composer behind it. */
    .wscol.chat-inactive > .chat-landing,
    .wscol.chat-inactive > .armour-session{opacity:.3;filter:saturate(.3);pointer-events:none;transition:opacity .2s,filter .2s}
    .chat-idle-note{
      display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;
      align-items:center;gap:12px;
      padding:14px 16px;background:var(--panel);border-top:2px solid var(--accent-soft);
      box-shadow:0 -8px 24px -18px #1c1e2e40;
      text-align:left;
    }
    /* only while a list is actually open — an empty chat with nothing
       selected has no list to be "not connected" to */
    .wscol.chat-inactive.list-open .chat-idle-note{display:flex}
    .chat-idle-note-icon{
      width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .chat-idle-note-icon svg{width:16px;height:16px}
    .chat-idle-note-text{display:flex;flex-direction:column;gap:2px;min-width:0}
    .chat-idle-note-title{font:800 13.5px var(--font-sans);color:var(--ink)}
    .chat-idle-note-sub{font:600 12.5px var(--font-sans);color:var(--ink-2);line-height:1.5}
    /* the button name inside the sentence — styled to visually match the
       real button, so the instruction points at something recognisable */
    .chat-idle-note-sub strong{
      font-weight:800;color:var(--accent);
    }

    /* scopebar — FULL WIDTH after rail, chrome bg, workspace selector */
    .scopebar{
      background:var(--chrome);border-bottom:1px solid var(--chrome-line);
      display:flex;flex:none;align-items:center;gap:12px;padding:10px 20px;
    }
    .sb-wrap{display:inline-flex;position:relative}
    .sb-sel{
      border:1px solid var(--chrome-line);background:var(--field);
      border-radius:11px;display:inline-flex;align-items:center;gap:9px;
      padding:7px 12px 7px 9px;font-family:inherit;
      transition:border-color .2s,background .2s;cursor:pointer;
    }
    .sb-sel:hover{border-color:var(--line-strong)}
    .studio-scopebar-title{display:inline-flex;align-items:center;gap:9px}
    .studio-scopebar-subtitle{color:var(--chrome-tx-2);font-size:13px;font-weight:500}
    .sb-ic{
      background:var(--chrome-hover);width:28px;height:28px;
      color:var(--chrome-tx);border-radius:8px;flex:none;
      display:grid;place-items:center;
    }
    .sb-ic svg{width:16px;height:16px}
    .sb-k{
      letter-spacing:.08em;text-transform:uppercase;
      color:var(--chrome-tx-2);flex:none;font-size:10px;font-weight:700;
    }
    .sb-nm{color:var(--chrome-title);white-space:nowrap;font-size:14px;font-weight:650}
    .sb-caret{width:14px;height:14px;color:var(--chrome-tx-2);flex:none;margin-left:2px}
    .sb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .sb-ic-btn{
      width:36px;height:36px;color:var(--chrome-tx-2);
      border-radius:10px;display:grid;place-items:center;
      transition:background var(--fast),color var(--fast);
    }
    .sb-ic-btn:hover{background:var(--chrome-hover);color:var(--chrome-tx)}
    .sb-ic-btn svg{width:18px;height:18px}

    /* hp-min = collapse button, lives in hp-head inside histpanel */
    .hp-min{
      border:1px solid var(--chrome-line);background:var(--field);
      width:34px;height:34px;color:var(--chrome-tx);
      border-radius:9px;display:grid;place-items:center;flex:none;
      transition:border-color .2s,color .2s,background .2s;
    }
    .hp-min:hover{border-color:var(--orange);color:var(--orange);background:var(--accent-soft)}
    .hp-min svg{width:16px;height:16px}

    /* ═══════════════════════════════════════
       MAIN THREAD / SCROLL AREA
    ═══════════════════════════════════════ */
    .thread{
      background:var(--bg);
      background-image:radial-gradient(60% 50% at 100% -4%,#e23d7d09,#0000 62%);
      display:flex;flex-direction:column;flex:1;overflow-y:auto;
      min-height:0;justify-content:center;
    }

    .home{
      width:100%;max-width:680px;margin:0 auto;
      padding:48px 28px 32px;
    }

    /* dock: pinned to the bottom of wscol — suggestions sit just above the message bar */
    .dock{
      flex:none;background:var(--bg);
      border-top:1px solid var(--line);
    }
    .dock-in{
      width:100%;max-width:680px;margin:0 auto;
      padding:18px 28px 24px;
    }

    /* agent mode pill */
    .agent-pill{
      display:inline-flex;align-items:center;gap:7px;
      background:var(--panel);border:1px solid var(--line);
      border-radius:var(--r-pill);padding:4px 12px 4px 6px;
      margin-bottom:22px;box-shadow:var(--shadow-card);
    }
    .agent-pill-icon{
      width:22px;height:22px;
      background:linear-gradient(135deg,var(--accent),var(--magenta));
      border-radius:6px;display:grid;place-items:center;
    }
    .agent-pill-icon svg{width:12px;height:12px;color:#fff}
    .agent-pill-name{font-size:12.5px;font-weight:600;color:var(--ink-2)}
    .agent-pill-dot{
      width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 0 3px #2fb07920;
    }
    .agent-pill-status{font-size:12.5px;font-weight:600;color:var(--green)}

    /* "Chatting about Holds" — a persistent, visible reminder inside the
       chat pane itself once a list/hold has been scoped in, since the
       greeting-text change alone was too easy to miss at a glance. */
    .chat-scope-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:#2fb0791a;border-radius:var(--r-pill);
      padding:4px 12px;margin:-12px 0 22px;
      font-size:12.5px;font-weight:700;color:var(--green);
    }
    .chat-scope-chip-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #2fb07926}
    #chatScopeChipSession{margin:0 0 0 8px;flex:none}

    /* greeting — Fraunces serif exact from reference */
    .greet{
      letter-spacing:-.015em;color:var(--ink);
      font-family:Fraunces,serif;
      font-size:clamp(36px,5vw,56px);
      font-weight:330;line-height:1.02;
    }
    .greet em{color:var(--ink-2);font-style:italic}
    .greet-sub{color:var(--ink-2);margin-top:12px;font-size:16.5px}

    /* composer — exact from reference, now docked above the fold */
    .composer{
      border:1px solid var(--line);background:var(--panel);
      box-shadow:var(--shadow-card);
      border-radius:22px;
      display:flex;flex-direction:column;align-items:stretch;
      margin:14px auto 0;padding:16px 18px 14px;
      transition:box-shadow var(--standard),border-color var(--standard);
    }
    .composer:focus-within{
      box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-hover);
      border-color:transparent;
    }
    .composer textarea{
      resize:none;width:100%;color:var(--ink);background:none;
      border:none;outline:none;flex:none;
      min-height:24px;max-height:170px;
      padding:2px 2px 0;font-size:15.5px;line-height:1.5;
    }
    .composer textarea::placeholder{color:var(--ink-3)}

    .crow{display:flex;align-items:center;gap:8px;margin-top:10px}
    .crow .spacer{flex:1}

    /* ARMOUR landing — simple centered page, no thread/dock split */
    .chat-landing{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:100%;max-width:640px;margin:0 auto;padding:40px 28px;text-align:center;
    }
    .chat-landing-in{position:relative;width:100%}
    .chat-landing-in::before{
      content:'';position:absolute;left:50%;top:50%;
      width:640px;height:420px;transform:translate(-50%,-50%);
      background-image:
        radial-gradient(45% 55% at 32% 38%, #7a4fd633, transparent 68%),
        radial-gradient(40% 50% at 48% 58%, #e23d7d2b, transparent 65%);
      filter:blur(8px);pointer-events:none;z-index:0;
    }
    .chat-landing-in > *{position:relative;z-index:1}

    /* Needs attention — lives in the workspace bar now, with a soft pulsing
       amber glow so it reads as something worth noticing, not just another button */
    .attn-topbar-btn{
      position:relative;display:inline-flex;align-items:center;gap:7px;
      background:var(--chrome-hover);border:1px solid #e0902f4a;
      border-radius:var(--r-pill);padding:7px 13px 7px 11px;
      font-size:12.5px;font-weight:600;color:var(--chrome-tx);
      transition:border-color .15s,background .15s;
    }
    .attn-topbar-btn:hover{background:var(--chrome-hover);border-color:#e0902f80}
    .attn-topbar-btn svg{width:13px;height:13px;color:var(--amber);flex:none;position:relative;z-index:1}
    .attn-topbar-btn > span:not(.attn-topbar-glow){position:relative;z-index:1}
    .attn-topbar-glow{
      position:absolute;inset:-5px;border-radius:var(--r-pill);
      box-shadow:0 0 0 0 #e0902f55;
      animation:attnGlowPulse 2.2s ease-out infinite;pointer-events:none;
    }
    @keyframes attnGlowPulse{
      0%{box-shadow:0 0 0 0 #e0902f55}
      70%{box-shadow:0 0 0 9px #e0902f00}
      100%{box-shadow:0 0 0 0 #e0902f00}
    }
    .attn-pill-count{
      font-size:10.5px;font-weight:700;color:#fff;background:var(--amber);
      padding:1px 7px;border-radius:var(--r-pill);
    }
    /* compact variant: icon + count only, no label — a quiet notification-style indicator */
    .attn-topbar-btn-compact{padding:7px;gap:0}
    .attn-topbar-btn-compact .attn-pill-count{margin-left:5px}

    /* Bookmarks — now the more prominent of the two: a labeled pill, not a bare icon */
    .bookmarks-topbar-btn{
      height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px 0 10px;
      background:var(--chrome-hover);border:1px solid var(--chrome-line);
      border-radius:10px;color:var(--accent);
      font:700 12.5px var(--font-sans);white-space:nowrap;
      transition:border-color .15s,background .15s,color .15s;
    }
    .bookmarks-topbar-btn:hover{border-color:var(--accent)}
    .bookmarks-topbar-btn svg{width:15px;height:15px;color:var(--accent);flex:none}

    /* agent selector — replaces the plain "Auto" pill in the composer */
    .agent-select-wrap{position:relative}
    .agent-select-menu{
      display:none;position:absolute;bottom:calc(100% + 8px);right:0;width:220px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow-hover);padding:6px;z-index:80;
    }
    .agent-select-menu.open{display:block}
    .agent-select-option{
      width:100%;display:flex;align-items:center;gap:9px;text-align:left;
      padding:9px 9px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);
      transition:background .15s;
    }
    .agent-select-option:hover{background:var(--panel-3)}
    .agent-select-option.active{color:var(--accent)}
    .agent-select-option-icon{
      width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .agent-select-option-icon svg{width:13px;height:13px}
    .agent-select-option-body{flex:1;min-width:0}
    .agent-select-option-name{display:block}
    .agent-select-option-desc{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:1px}
    .agent-select-check{width:13px;height:13px;flex:none;color:var(--accent);visibility:hidden}
    .agent-select-option.active .agent-select-check{visibility:visible}

    /* ARMOUR session composer — one unified box (textarea + controls together),
       matching the landing composer's pattern instead of stacking separate pieces */
    .armour-session-composer-box{
      width:100%;border:1px solid var(--line);background:var(--field);
      border-radius:16px;padding:10px 10px 8px;
      transition:box-shadow var(--standard),border-color var(--standard);
    }
    .armour-session-composer-box:focus-within{
      box-shadow:0 0 0 2px var(--accent-soft);border-color:transparent;
    }
    .armour-session-composer-box textarea{
      width:100%;resize:none;border:none;outline:none;background:none;color:var(--ink);
      min-height:56px;max-height:150px;font-size:12.5px;line-height:1.5;padding:0 0 8px;
    }
    .armour-session-composer-box textarea::placeholder{color:var(--ink-3)}
    .armour-session-composer-row{display:flex;align-items:center;gap:8px}
    .armour-session-composer-row .agent-select-wrap{flex:1;min-width:0}
    .agent-select-btn-sm{
      width:100%;display:inline-flex;align-items:center;gap:6px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
      border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:600;
    }
    .agent-select-btn-sm svg:first-child{width:13px;height:13px;flex:none;color:var(--accent)}
    .agent-select-btn-sm span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .agent-select-btn-sm svg:last-child{width:10px;height:10px;flex:none}

    /* the working session — histpanel collapses, landing hides, this two-pane
       layout (reusing the same chat + skeleton/table components used elsewhere) takes over */
    .chat-landing.session-hide{display:none}
    .armour-session{display:none;flex:1;flex-direction:column;min-height:0;padding:24px 28px 0}
    .armour-session.show{display:flex}
    .armour-session .pane-split{min-height:0;flex:1;width:calc(100% + 28px);margin-left:-28px}
    .armour-session-back{
      display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;flex:none;
      font-size:12.5px;font-weight:700;color:var(--ink-2);align-self:flex-start;
    }
    .armour-session-back:hover{color:var(--ink)}
    .armour-session-back svg{width:14px;height:14px}
    /* when relocated into a pane-brief row (Library items opened inside
       ARMOUR), sit inline with the insight text instead of on its own line */
    .pane-brief .armour-session-back{
      margin-bottom:0;align-self:center;padding-right:12px;margin-right:2px;
      border-right:1px solid var(--line);
    }

    /* recent bookmarks — a small dropdown off the workspace bar, not a landing block */
    .topbar-bookmarks-wrap{position:relative}
    .topbar-bookmarks-menu{
      display:none;position:absolute;top:calc(100% + 8px);right:0;width:290px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow-hover);padding:8px;z-index:80;
    }
    .topbar-bookmarks-menu.open{display:block}
    .topbar-bookmarks-label{
      font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);padding:6px 8px 8px;
    }
    .topbar-bookmark-row{
      width:100%;display:flex;align-items:center;gap:9px;text-align:left;
      padding:8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);
      transition:background .15s;
    }
    .topbar-bookmark-row:hover{background:var(--panel-3)}
    .topbar-bookmark-row svg{width:14px;height:14px;flex:none;color:var(--accent)}
    .topbar-bookmarks-viewall{
      width:100%;display:flex;align-items:center;justify-content:center;gap:5px;
      margin-top:6px;padding:9px 8px 7px;border-top:1px solid var(--line);
      font-size:12px;font-weight:700;color:var(--accent);
    }
    .topbar-bookmarks-viewall:hover{color:var(--orange-deep)}
    .topbar-bookmarks-viewall svg{width:10px;height:10px;flex:none}
    .chat-landing .greet-sub{margin-bottom:26px}
    .landing-composer{
      width:100%;border:1px solid var(--line);background:var(--panel);
      box-shadow:var(--shadow-card);border-radius:22px;
      padding:18px 20px 14px;text-align:left;
      transition:box-shadow var(--standard),border-color var(--standard);
    }
    .landing-composer:focus-within{
      box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-hover);
      border-color:transparent;
    }
    .landing-composer textarea{
      resize:none;width:100%;color:var(--ink);background:none;
      border:none;outline:none;
      min-height:26px;max-height:170px;
      padding:2px 2px 0;font-size:15.5px;line-height:1.5;
    }
    .landing-composer textarea::placeholder{color:var(--ink-3)}

    .cbtn{
      width:32px;height:32px;color:var(--ink-3);
      border-radius:9px;display:grid;place-items:center;
      transition:background .2s,color .2s;
    }
    .cbtn:hover{background:var(--panel-3);color:var(--ink-2)}
    .cbtn svg{width:18px;height:18px}

    .cpill{
      color:var(--ink-2);border:1px solid var(--line);
      background:var(--field);border-radius:var(--r-pill);
      display:inline-flex;align-items:center;gap:5px;
      padding:6px 11px;font-size:12.5px;font-weight:600;
      transition:border-color .2s;
    }
    .cpill:hover{border-color:var(--line-strong)}
    .cpill svg{width:12px;height:12px;color:var(--ink-3)}

    /* send — gradient circle, exact from reference */
    .send{
      cursor:pointer;color:#fff;
      background:linear-gradient(135deg,#7a4fd6,#e23d7d);
      border:none;border-radius:50%;flex:none;
      display:grid;place-items:center;
      width:38px;height:38px;transition:transform .2s;
      box-shadow:0 8px 20px -8px #e23d7d99;
    }
    .send:hover{transform:translateY(-1px)}
    .send svg{width:17px;height:17px}

    /* quick chips */
    .quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
    .qchip{
      border:1px solid var(--line);background:var(--panel);color:var(--ink);
      box-shadow:var(--shadow-card);border-radius:var(--r-pill);
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 12px;font-size:12.5px;font-weight:600;
      transition:border-color var(--fast),transform var(--fast) var(--std),box-shadow var(--fast);
    }
    .qchip:hover{
      box-shadow:var(--shadow-hover);color:var(--orange);
      border-color:transparent;transform:translateY(-2px);
    }
    .qchip .qi{width:15px;height:15px;color:var(--orange)}

    /* section eyebrow label */
    .eyebrow{
      letter-spacing:.12em;text-transform:uppercase;
      color:var(--ink-3);font-size:11px;font-weight:700;
      margin-bottom:12px;
    }

    /* get-started cards (matching screenshot) */
    .gs-section{margin-top:0}
    .gs-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
    .gs-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

    .gs-card{
      background:var(--panel);border:1px solid var(--line);
      border-radius:var(--r-md);box-shadow:var(--shadow-card);
      padding:16px;display:flex;align-items:flex-start;gap:12px;
      text-align:left;
      transition:box-shadow var(--standard),transform var(--standard),border-color var(--standard);
    }
    .gs-card:hover{
      box-shadow:var(--shadow-hover);transform:translateY(-1px);
      border-color:var(--line-strong);
    }
    .gs-icon{
      width:36px;height:36px;flex:none;border-radius:10px;
      display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .gs-icon svg{width:18px;height:18px}
    .gs-icon.magenta{background:var(--magenta-soft);color:var(--magenta)}
    .gs-icon.blue{background:#5c8fff1a;color:#5c8fff}
    .gs-icon.green{background:#2fb0791a;color:var(--green)}
    .gs-icon.pink{background:var(--t-play-soft);color:var(--t-play)}

    .gs-body .gs-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px}
    .gs-body .gs-desc{font-size:12px;color:var(--ink-3);line-height:1.4}

    /* recent projects */
    .rp-section{margin-top:36px}
    .rp-row{display:flex;gap:10px;align-items:stretch}

    .rp-card{
      background:var(--panel);border:1px solid var(--line);
      border-radius:var(--r-md);box-shadow:var(--shadow-card);
      padding:12px 14px;display:flex;align-items:center;gap:10px;
      flex:1;min-width:0;text-align:left;
      transition:box-shadow var(--standard),transform var(--standard),border-color var(--standard);
    }
    .rp-card:hover{
      box-shadow:var(--shadow-hover);transform:translateY(-1px);
      border-color:var(--line-strong);
    }
    .rp-icon{
      width:30px;height:30px;flex:none;border-radius:8px;
      background:var(--accent-soft);color:var(--accent);
      display:grid;place-items:center;
    }
    .rp-icon svg{width:15px;height:15px}
    .rp-body{flex:1;min-width:0}
    .rp-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
    .rp-meta{font-size:11px;color:var(--ink-3)}

    .rp-new{
      border-style:dashed!important;flex:0 0 auto;min-width:130px;
      justify-content:center;gap:8px;color:var(--ink-3);
    }
    .rp-new:hover{color:var(--accent);border-color:var(--accent)!important}
    .rp-new svg{width:15px;height:15px;flex-shrink:0}
    .rp-new-label{font-size:12.5px;font-weight:600}

    /* ═══════════════════════════════════════
       EXPLORER ROW — content pane + docked AI panel
    ═══════════════════════════════════════ */
    .explorer-row{display:flex;flex:1;min-height:0;overflow:hidden}

    .dash-btn{
      border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
      border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:7px;
      padding:9px 15px;font-size:12.5px;font-weight:700;
      box-shadow:var(--shadow-card);
      transition:border-color .2s,color .2s,transform .2s,box-shadow .2s;
    }
    .dash-btn:hover{border-color:var(--line-strong);color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-hover)}
    .dash-btn svg{width:14px;height:14px}
    .dash-btn-ai{
      color:#fff;border:none;
      background:linear-gradient(135deg,#7a4fd6,#e23d7d);
      box-shadow:0 10px 24px -10px #e23d7d8c;
    }
    .dash-btn-ai:hover{color:#fff;transform:translateY(-1px);box-shadow:0 14px 28px -10px #e23d7dad}


    .dash-eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .dash-eyebrow-row .eyebrow{margin-bottom:0}

    /* ── bounded panel: shared container + header bar for both sections ── */
    .panel-section{
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow-card);overflow:hidden;
    }
    .panel-header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 18px;border-bottom:1px solid var(--line);
    }
    .panel-header .eyebrow{margin-bottom:0}
    .panel-body{padding:8px}

    /* section spacing */
    .dash-section{margin-top:34px}
    .dash-section:first-of-type{margin-top:26px}

    /* narrated-summary treatment, reused above every entity pane's table */
    .pane-brief{
      display:flex;align-items:flex-start;gap:10px;
      background:var(--panel);
      padding:16px 24px 16px;
      border-bottom:1px solid var(--line);
    }
    .pane-brief-icon{
      width:22px;height:22px;flex:none;border-radius:7px;margin-top:1px;
      background:var(--accent-soft);
      display:grid;place-items:center;
    }
    .pane-brief-icon svg{width:11px;height:11px;color:var(--accent)}
    .pane-brief-text{font-size:13px;color:var(--ink);line-height:1.5}
    .pane-brief-text b{font-weight:700}

    /* inline ask sits right above each pane's table */

    /* shared with the table Personalize overlay's describe box */
    .ai-send{
      cursor:pointer;color:#fff;flex:none;
      background:linear-gradient(135deg,#7a4fd6,#e23d7d);
      border-radius:50%;width:34px;height:34px;display:grid;place-items:center;
      box-shadow:0 8px 20px -8px #e23d7d99;transition:transform .2s;
    }
    .ai-send:hover{transform:translateY(-1px)}
    .ai-send svg{width:15px;height:15px}
    .ai-dots{display:inline-flex;gap:3px}
    .ai-dots span{
      width:4px;height:4px;border-radius:50%;background:var(--accent);
      animation:aidot 1s infinite ease-in-out;
    }
    .ai-dots span:nth-child(2){animation-delay:.15s}
    .ai-dots span:nth-child(3){animation-delay:.3s}
    @keyframes aidot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

    /* ═══════════════════════════════════════
       EXPLORER — stacked cards, no pills, no fixed pages.
       Click "Explore" morphs the card into the full table view;
       "Back to bookmarks" morphs it back. Nothing is navigated to —
       it's the same object, expanding and collapsing.
    ═══════════════════════════════════════ */
    .explorer-in{width:100%;margin:0 auto;padding:28px 40px 0;display:flex;flex-direction:column;flex:1;min-height:0}
    .explorer-stage{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}

    /* ═══ Bookmarks — persistent left nav (Browse + Saved) beside a content
       pane that just swaps in place. No more page-to-page navigation: click
       a different item, the content changes, nothing "opens" or "closes." ═══ */
    .bm-shell{
      flex-direction:row;margin:-28px -40px 0;width:calc(100% + 80px);
    }
    .bm-nav{
      width:280px;flex:none;display:flex;flex-direction:column;position:relative;
      background:var(--panel);border-right:1px solid var(--line);
      transition:width .22s var(--enter);overflow:hidden;
    }
    .bm-nav.collapsed{width:44px;overflow:visible}
    .bm-nav-collapse{
      flex:none;align-self:flex-end;width:28px;height:28px;margin:8px 8px 0 0;
      border-radius:8px;color:var(--ink-3);display:grid;place-items:center;
      transition:background .15s,color .15s,transform .2s;
    }
    .bm-nav-collapse:hover{background:var(--panel);color:var(--ink)}
    .bm-nav-collapse svg{width:10px;height:10px}
    .bm-nav.collapsed .bm-nav-collapse{transform:rotate(180deg)}
    .bm-nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 16px;transition:opacity .15s var(--enter)}
    /* collapsed: the nav itself stays a thin 44px strip in normal layout
       (so nothing reflows), but hovering it peeks the full content as a
       floating overlay — same pattern as Claude's own sidebar. Clicking
       (anywhere, bubbling up from the existing click-to-expand handler)
       "fixes" it open for real. */
    .bm-nav.collapsed .bm-nav-scroll{
      opacity:0;pointer-events:none;
      position:absolute;top:44px;left:0;bottom:16px;width:280px;
      background:var(--panel-3);border:1px solid var(--line);border-top:none;
      border-radius:0 0 12px 0;box-shadow:var(--shadow-hover);z-index:15;
    }
    .bm-nav.collapsed:hover .bm-nav-scroll{opacity:1;pointer-events:auto}

    /* resize handles — thin drag strips between panes, injected by JS so
       one implementation covers every .pane-split instance in the app */
    .pane-resize-handle{
      flex:none;width:5px;cursor:col-resize;position:relative;z-index:5;
      background:transparent;
    }
    .pane-resize-handle::after{
      content:"";position:absolute;top:0;bottom:0;left:2px;width:1px;
      background:var(--line);transition:background .15s,width .15s;
    }
    .pane-resize-handle:hover::after,
    .pane-resize-handle.dragging::after{
      background:var(--accent);width:2px;left:1.5px;
    }
    /* a collapsed chat panel already has its own border-right — the handle's
       line right next to it just doubles up as visual clutter, especially on
       narrow viewports, so hide the handle (and its drag affordance) while
       the panel it resizes is collapsed */
    .pane-chat.collapsed + .pane-resize-handle{display:none}
    .bm-nav-section{margin-bottom:20px}
    .bm-nav-label{
      font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-2);padding:0 2px;margin-bottom:8px;
    }
    .bm-nav-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .bm-nav-label-row .bm-nav-label{margin-bottom:0}
    .bm-nav-label .segment-count{margin-left:4px}
    .bm-nav-label-row-actions{display:flex;align-items:center;gap:4px}

    /* accordion — click a section label to collapse it. Directory rarely
       needs collapsing at 6 items, but the same control on both sections
       keeps the behavior predictable rather than picking favorites. */
    .bm-nav-accordion-toggle{display:flex;align-items:center;gap:5px;transition:color .15s}
    .bm-nav-accordion-toggle:hover{color:var(--ink)}
    .bm-nav-accordion-chevron{width:8px;height:8px;flex:none;transition:transform .18s}
    .bm-nav-section.collapsed .bm-nav-accordion-chevron{transform:rotate(-90deg)}
    .bm-nav-section.collapsed .bm-nav-items,
    .bm-nav-section.collapsed .bm-nav-search,
    .bm-nav-section.collapsed .bm-nav-group-label{display:none}

    /* recency groups within Views — waypoints for scanning a long list,
       instead of one undifferentiated scroll. Only shown when sorted by
       recency; sorting by name shows a flat list instead. */
    .bm-nav-group-label{
      font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);padding:10px 8px 4px;
    }
    .bm-nav-group-label:first-child{padding-top:2px}

    /* sort popover reuses the same shape as the filter popover */
    .bm-nav-sort-wrap{position:relative}
    .bm-sort-option{
      display:block;width:100%;text-align:left;padding:7px 8px;border-radius:7px;
      font-size:12.5px;font-weight:600;color:var(--ink);
    }
    .bm-sort-option:hover{background:var(--panel-3)}
    .bm-sort-option.active{color:var(--accent);background:var(--accent-soft)}

    .bm-nav-items{display:flex;flex-direction:column;gap:2px}
    .bm-nav-item{
      display:flex;align-items:center;gap:9px;text-align:left;
      padding:8px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);
      transition:background .15s;
    }
    .bm-nav-item:hover{background:var(--hover)}
    .bm-nav-item.active{background:var(--accent-soft);color:var(--accent)}
    .bm-nav-item-icon{
      width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;
      background:#5c8fff1a;color:#5c8fff;
    }
    .bm-nav-item-icon svg{width:12px;height:12px}

    /* Dashboards — an app-item like any other, but expandable: its saved
       items render as indented sub-items directly beneath it instead of
       living in a separate top-level section */
    .bm-nav-item-expandable .segment-count{color:var(--ink-3);font-weight:600;margin-left:auto;margin-right:2px}
    .bm-nav-item-chevron{width:9px;height:9px;color:var(--ink-3);flex:none;transition:transform .15s}
    .bm-nav-item-expandable.expanded .bm-nav-item-chevron{transform:rotate(90deg)}

    /* ═══ Studio — build/configure area. Same left-tree + right-content
       shape as the Library panel, but the right side is a prompt bar +
       "start from scratch" + a card grid of what's already configured,
       instead of a data table. ═══ */
    /* Studio's three areas are independent tools, not facets of one record —
       you don't cross-reference an app config against a playbook mid-task.
       Exclusive destinations like that read honestly as tabs. A 220px rail
       for three items also competed with the global sidebar for "where am
       I?" and pushed this page's centered content off-axis. */
    .studio-shell{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
    .studio-nav{
      flex:none;display:flex;align-items:center;gap:2px;padding:0 28px;
      background:var(--panel);border-bottom:1px solid var(--line);
      overflow-x:auto;scrollbar-width:none;
    }
    .studio-nav::-webkit-scrollbar{display:none}
    .studio-nav-item{
      display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none;
      padding:14px 14px 12px;border-bottom:2.5px solid transparent;
      font-size:13.5px;font-weight:600;color:var(--ink-2);
      transition:color .15s,border-color .15s;
    }
    .studio-nav-item:hover{color:var(--ink)}
    .studio-nav-item.active{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
    .studio-nav-item-icon{
      width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--ink-3);
    }
    .studio-nav-item.active .studio-nav-item-icon{color:var(--accent)}
    .studio-nav-item-icon svg{width:15px;height:15px}

    .studio-content{
      flex:1;min-width:0;overflow-y:auto;padding:56px 40px 80px;
      background:
        radial-gradient(ellipse 700px 380px at 32% -5%, rgba(139,92,246,.10), transparent 60%),
        radial-gradient(ellipse 700px 380px at 68% 5%, rgba(236,72,153,.07), transparent 60%),
        var(--bg);
    }
    .studio-hero-wrap{max-width:820px;margin:0 auto}
    .studio-pane{display:none;max-width:820px;margin:0 auto}
    /* Agents Center has a richer, card-heavy layout with category filters
       and 8+ cards — the narrow 820px column built for Playbooks' simpler
       "Build a playbook" composer-plus-templates shape leaves huge empty
       margins here instead. Let this one pane use the full available width. */
    .studio-pane[data-studio-content="agents"]{max-width:none}
    .studio-pane[data-studio-content="agents"] .studio-template-grid{
      grid-template-columns:repeat(3,1fr);max-width:1160px;margin:0 auto;
    }
    /* ...but the composer itself should stay a narrower, centered box even
       on the wide pane — going edge-to-edge felt too stretched, unlike the
       card grid which genuinely benefits from the extra width. */
    .studio-pane[data-studio-content="agents"] .studio-hero-composer{max-width:820px;margin-left:auto;margin-right:auto}
    .studio-pane[data-studio-content="agents"] .studio-toolbar-row{max-width:1160px;margin-left:auto;margin-right:auto}
    .studio-pane.active{display:block}

    .studio-prompt-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .studio-prompt-bar{
      flex:1;min-width:0;display:flex;align-items:center;gap:10px;
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-pill);
      padding:11px 10px 11px 16px;box-shadow:var(--shadow-card);
      transition:box-shadow var(--standard),border-color var(--standard);
    }
    .studio-prompt-bar:focus-within{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-hover);border-color:transparent}
    .studio-prompt-icon{width:15px;height:15px;color:var(--accent);flex:none}
    .studio-prompt-bar input{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--ink);font-size:14px}
    .studio-prompt-bar input::placeholder{color:var(--ink-3)}
    .studio-prompt-send{
      width:32px;height:32px;flex:none;border-radius:50%;color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--magenta));
      display:grid;place-items:center;transition:transform .15s;
    }
    .studio-prompt-send:hover{transform:translateY(-1px)}
    .studio-prompt-send svg{width:14px;height:14px}
    .studio-scratch-btn{
      flex:none;display:inline-flex;align-items:center;gap:7px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
      border-radius:var(--r-pill);padding:10px 16px;font-size:13px;font-weight:600;white-space:nowrap;
      transition:border-color .15s,color .15s;
    }
    .studio-scratch-btn:hover{border-color:var(--accent);color:var(--accent)}
    .studio-scratch-btn svg{width:12px;height:12px}

    .studio-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    .studio-card{
      display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:18px;box-shadow:var(--shadow-card);
      transition:box-shadow var(--standard),transform var(--standard),border-color var(--standard);
    }
    .studio-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);border-color:var(--line-strong)}
    .studio-card-icon{
      width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .studio-card-icon svg{width:16px;height:16px}
    .studio-card-stage{
      display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--accent);margin-bottom:3px;
    }
    .studio-card-title{font-family:'Fraunces',serif;font-size:15.5px;font-weight:500;color:var(--ink)}
    .studio-card-desc{font-size:12.5px;color:var(--ink-3);line-height:1.5}
    .studio-card-meta{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px}

    /* ═══ Studio hero layout — the spacious, editorial version of each
       Studio pane: a serif headline matching ARMOUR's own greeting style,
       a large composer, then a labeled template grid. Replaces the more
       compact prompt-bar version. ═══ */
    .studio-hero-eyebrow{
      font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:10px;text-align:center;
    }
    .studio-hero-title{
      font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;
      color:var(--ink);font-size:42px;line-height:1.15;margin-bottom:16px;text-align:center;
    }
    .studio-hero-desc{color:var(--ink-2);font-size:15px;line-height:1.55;max-width:640px;margin:0 auto 30px;text-align:center}
    .studio-hero-composer{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;
      box-shadow:var(--shadow-card);padding:16px 20px 14px;margin-bottom:0;
      transition:box-shadow var(--standard),border-color var(--standard);
    }
    .studio-hero-composer:focus-within{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-hover);border-color:transparent}
    .studio-hero-composer textarea{
      width:100%;border:none;outline:none;background:none;resize:none;
      color:var(--ink);font-size:15px;font-family:inherit;min-height:24px;
    }
    .studio-hero-composer textarea::placeholder{color:var(--ink-3)}
    .studio-hero-composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
