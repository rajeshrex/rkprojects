      text-transform:uppercase;color:var(--ink-3);padding-top:2px}
    .ag-req p{margin:0;min-width:0;font-size:13px;line-height:1.55;color:var(--ink-2)}
    @media (max-width:620px){ .ag-req{flex-direction:column;gap:5px} }
    .ag-sum{padding:16px 18px;font:400 13.5px/1.68 var(--font-sans);color:var(--ink-2)}
    .ag-sum b{font-weight:650;color:var(--ink)}
    .ag-sec{padding:15px 18px;gap:11px}
    .ag-sec-l{font-size:9.5px;letter-spacing:.1em}
    .ag-why-t{padding:12px 18px;font-size:12px;letter-spacing:-.002em}
    .ag-sec[data-part="reasoning"] .ag-why{padding:2px 18px 16px;gap:10px}
    .ag-line{font-size:12.5px;line-height:1.62}
    .ag-line i{margin-top:8px}
    .ag-made{padding:13px 15px;border-radius:var(--r-md);gap:14px}
    .ag-made-t{font-size:13px;letter-spacing:-.006em}
    .ag-made-s{font-size:12px;margin-top:3px}
    .ag-made-go{font-size:12px}
    .ag-out-b{gap:14px}

    /* ═══════════════════════════════════════════════════════
       THE BUILDER — creating a hold or a collection is a page, not a
       step inside a list. Route on top, the thing being made below
       it, and the one commitment on the far right where it can't be
       hit by accident.
    ═══════════════════════════════════════════════════════ */
    .wkbar{display:flex;align-items:center;gap:12px;flex:none;padding:11px 22px;
      background:var(--panel);border-bottom:1px solid var(--line)}
    .wkbar-back{width:30px;height:30px;flex:none;display:flex;align-items:center;
      justify-content:center;border-radius:50%;border:0;background:none;color:var(--ink-3);
      cursor:pointer}
    .wkbar-back svg{width:16px;height:16px}
    .wkbar-back:hover{background:var(--hover);color:var(--ink)}
    .wkbar-id{display:flex;flex-direction:column;gap:3px;min-width:0}
    .wkbar-crumb{display:flex;align-items:center;gap:7px;font:600 11.5px var(--font-sans);
      color:var(--ink-3)}
    .wkbar-crumb button{border:0;background:none;padding:0;font:inherit;color:inherit;
      cursor:pointer}
    .wkbar-crumb button:hover{color:var(--accent)}
    .wkbar-crumb i{font-style:normal;opacity:.45}
    .wkbar-t{display:flex;align-items:center;gap:10px}
    .wkbar-name{font-size:19px;font-weight:650;letter-spacing:-.02em;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wkbar-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;
      border-radius:var(--r-pill);font-size:11px;font-weight:700;
      color:var(--accent);background:var(--accent-soft);white-space:nowrap}
    .wkbar-pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
    .wkbar-pill.live{color:var(--green);background:var(--green-soft)}
    .wkbar-sp{flex:1 1 auto}
    .wkbar-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;
      border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);
      font:650 13px var(--font-sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
    .wkbar-btn svg{width:13px;height:13px}
    .wkbar-btn:hover{border-color:var(--line-strong);color:var(--ink)}
    .wkbar-go{display:inline-flex;align-items:center;gap:8px;padding:10px 19px;
      border-radius:var(--r-md);border:0;font:700 13px var(--font-sans);color:#fff;
      background:linear-gradient(135deg,var(--orange),var(--magenta));
      box-shadow:0 8px 20px -9px #e23d7d99;cursor:pointer;white-space:nowrap}
    .wkbar-go svg{width:13px;height:13px}
    .wkbar-go:hover{transform:translateY(-1px)}
    #pane-matter-detail [data-mv-panel="overview"] > .sd-work.open{flex:1;min-height:0}

    /* the uploaded hold builder brings its own styling; it just needs
       the room and its own scroll */
    .sd-work.wk-draft{padding:0;background:var(--panel)}
    .sd-work.wk-draft>div{height:100%}

    /* the run, hosted inside a matter, takes the whole surface */
    #pane-matter-detail [data-mv-panel="overview"] > #subpoenaDetailSlot.sd-embedded{
      flex:1;min-height:0;margin:0;padding:0;display:flex}

    /* ═══ REVIEW / PRODUCTION / PUBLISH ═══ */
    .pv{display:flex;flex-direction:column;gap:18px}
    .pv-nums{display:flex;gap:10px;flex-wrap:wrap}
    .pv-num{flex:1 1 130px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-md);
      background:var(--surface);display:flex;flex-direction:column;gap:3px}
    .pv-num-v{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
      font-variant-numeric:tabular-nums}
    .pv-num-l{font-size:11.5px;color:var(--ink-3)}
    .pv-num.ok .pv-num-v{color:var(--green)}
    .pv-num.warn .pv-num-v{color:var(--pb-orange)}
    /* the door into the review conversation */
    .pv-conv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;
      border:1px solid #7a4fd633;border-radius:var(--r-md);cursor:pointer;
      background:linear-gradient(120deg,#7a4fd614,#e23d7d0d)}
    .pv-conv:hover{border-color:var(--accent)}
    .pv-conv-ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
      color:#fff;background:linear-gradient(135deg,var(--orange),var(--magenta))}
    .pv-conv-ic svg{width:15px;height:15px}
    .pv-conv-b{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
    .pv-conv-t{font-size:14px;font-weight:650;color:var(--ink)}
    .pv-conv-s{font-size:12.5px;line-height:1.5;color:var(--ink-3)}
    .pv-conv-go{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
      font-weight:650;color:var(--accent);white-space:nowrap}
    .pv-conv-go svg{width:12px;height:12px}
    .pv-tbl{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .pv-tr{display:grid;grid-template-columns:minmax(0,2fr) 120px 120px;gap:14px;align-items:center;
      padding:11px 15px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink)}
    .pv-tr:first-child{border-top:0}
    .pv-tr.head{background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--ink-3)}
    .pv-tr .dim{color:var(--ink-3);font-variant-numeric:tabular-nums}
    .pv-n{font-weight:600}
    .pv-state{font-weight:650;color:var(--ink-3)}
    .pv-state.ok{color:var(--green)}

    .pv-sets{display:flex;flex-direction:column;gap:12px}
    .pv-set{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;
      border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);cursor:pointer}
    .pv-set:hover:not(:disabled){border-color:var(--line-strong)}
    .pv-set.on{border-color:var(--accent);background:var(--accent-soft)}
    .pv-set-radio{width:17px;height:17px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);
      background:var(--panel)}
    .pv-set.on .pv-set-radio{border-color:var(--accent);border-width:5px}
    .pv-set-b{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
    .pv-set-t{font-size:13.5px;font-weight:650;color:var(--ink)}
    .pv-set-s{font-size:12px;color:var(--ink-3)}
    .pv-set-done{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:11.5px;
      font-weight:700;color:var(--green)}
    .pv-set-done svg{width:13px;height:13px}
    .pv-dest{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink-3);
      line-height:1.5;padding:2px 2px 0}
    .pv-dest svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
    .pv-dest b{color:var(--ink-2);font-weight:650}

    .prd-row{display:flex;align-items:baseline;gap:16px;padding:10px 0;
      border-top:1px solid var(--line)}
    .prd-row:first-child{border-top:0}
    .prd-row>span{flex:none;width:210px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
    .prd-row>b{font-size:13.5px;font-weight:600;color:var(--ink)}
    .prd-row code{font-family:var(--font-mono);font-size:12px;background:var(--panel-3);
      padding:1px 6px;border-radius:4px}
    .wk-warn{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:var(--r-md);
      background:var(--pb-orange-soft);border:1px solid #e0902f42;font-size:12.5px;line-height:1.55;
      color:var(--ink-2)}
    .wk-warn svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--pb-orange)}
    .wk-warn b{color:var(--ink);font-weight:650}

    .nt{display:flex;flex-direction:column;gap:14px;max-width:760px}
    .nt-i{display:flex;gap:13px}
    .nt-av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
      font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
    .nt-b{display:flex;flex-direction:column;gap:5px;min-width:0}
    .nt-h{display:flex;align-items:baseline;gap:10px;font-size:12.5px}
    .nt-h b{font-weight:650;color:var(--ink)}
    .nt-h span{color:var(--ink-3);font-size:11.5px}
    .nt-t{font-size:13.5px;line-height:1.62;color:var(--ink-2)}

    /* ═══ DETAILS — the system of record. Flat, read-only, no
       chronology: sections of fields and values. ═══ */
    .rn-seg2{display:inline-flex;flex:none;padding:2px;gap:2px;border-radius:var(--r-pill);
      background:var(--panel-3)}
    .rn-seg2 button{font-size:12px;font-weight:650;color:var(--ink-3);background:none;border:0;
      padding:5px 14px;border-radius:var(--r-pill);cursor:pointer}
    .rn-seg2 button:hover{color:var(--ink)}
    .rn-seg2 button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #1c1e2e14}
    .dt{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
    .dt-lead{font-size:12.5px;color:var(--ink-3);padding:0 2px}
    .dt-s{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      overflow:hidden}
    .dt-s-h{display:flex;align-items:baseline;gap:10px;padding:11px 18px;
      background:var(--surface);border-bottom:1px solid var(--line)}
    .dt-s-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-2)}
    .dt-s-m{font-size:11px;color:var(--ink-3)}
    .dt-s-b{padding:4px 18px 8px}
    .dt-r{display:flex;align-items:baseline;gap:20px;padding:9px 0;
      border-top:1px solid var(--line)}
    .dt-r:first-child{border-top:0}
    .dt-k{flex:none;width:210px;font-size:12.5px;color:var(--ink-3)}
    .dt-v{flex:1;min-width:0;font-size:13px;color:var(--ink);line-height:1.5}
    .dt-r.wide .dt-v{font-weight:600}
    @media (max-width:900px){
      .dt-r{flex-direction:column;gap:3px}
      .dt-k{width:auto}
    }

    /* ═══ ARGUING WITH AN AGENT — the per-step input, the proposal,
       and the mark it leaves on the record. ═══ */
    .ag-ask-box{order:4;border-top:1px solid var(--line);padding:11px 18px;
      display:flex;flex-direction:column;gap:12px;align-items:flex-start}
    .ag-ask-thread{display:flex;flex-direction:column;gap:12px}
    .ag-ask-thread:empty{display:none}
    .ag-you{align-self:flex-end;max-width:88%;padding:9px 13px;border-radius:14px 14px 4px 14px;
      background:var(--panel-3);border:1px solid var(--line);font-size:12.5px;line-height:1.5;
      color:var(--ink)}
    .ag-work{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-3)}
    .ag-work .pbx-spin{width:12px;height:12px}
    .ag-reply{font-size:13px;line-height:1.62;color:var(--ink-2)}
    .ag-reply b{color:var(--ink);font-weight:650}
    .ag-reply em{font-style:italic;color:var(--ink-3)}
    .ag-ask-in{display:flex;align-items:center;gap:8px}
    .ag-ask-in input{flex:1;min-width:0;padding:9px 13px;border:1px solid var(--line-strong);
      border-radius:var(--r-pill);background:var(--panel);font:400 12.5px var(--font-sans);
      color:var(--ink)}
    .ag-ask-in input:focus{outline:none;border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft)}
    .ag-ask-go{width:30px;height:30px;flex:none;border:0;border-radius:50%;cursor:pointer;
      display:grid;place-items:center;color:#fff;
      background:linear-gradient(135deg,var(--orange),var(--magenta))}
    .ag-ask-go svg{width:14px;height:14px}

    /* a change is a thing you accept, never a thing already done */
    .ag-diff{border:1px solid #e0902f5c;border-radius:var(--r-md);overflow:hidden;
      background:var(--panel)}
    .ag-diff-h{display:flex;align-items:center;gap:8px;padding:9px 13px;
      background:var(--pb-orange-soft);font-size:11px;font-weight:700;letter-spacing:.04em;
      text-transform:uppercase;color:var(--pb-orange)}
    .ag-diff-h svg{width:13px;height:13px;flex:none}
    .ag-diff-b{padding:12px 13px;display:flex;flex-direction:column;gap:9px}
    .ag-diff-r{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:12.5px}
    .ag-diff-k{flex:none;width:100%;font-size:10px;font-weight:700;letter-spacing:.07em;
      text-transform:uppercase;color:var(--ink-3)}
    .ag-diff-was{color:var(--ink-3);text-decoration:line-through}
    .ag-diff-arw{color:var(--ink-3)}
    .ag-diff-now{font-weight:650;color:var(--ink)}
    .ag-diff-a{display:flex;gap:8px;padding:0 13px 13px}
    .ag-diff-a .rn-btn{font-size:12px;padding:7px 14px}
    .ag-diff.applied{border-color:#2fb07959}
    .ag-diff.applied .ag-diff-h{background:var(--green-soft);color:var(--green)}
    .ag-diff.dropped{border-color:var(--line);opacity:.72}
    .ag-diff.dropped .ag-diff-h{background:var(--panel-3);color:var(--ink-3)}

    .rc-amend{flex:none;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--r-pill);
      background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sp-state.amend{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sp-amend{display:flex;align-items:flex-start;gap:10px;margin:0;padding:12px 28px;
      background:var(--pb-orange-soft);border-bottom:1px solid #e0902f2e;
      font-size:12.5px;line-height:1.55;color:var(--ink-2)}
    .sp-amend svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--pb-orange)}
    .sp-amend b{color:var(--ink);font-weight:650}
    .sp-amend button{font:inherit;font-weight:650;color:var(--accent);background:none;border:0;
      padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

    /* one composer, aimed. The chip says what it is pointed at. */
    .pbx-dock-aim{display:none}
    .pbx-dock-aim.on{display:block;padding:0 0 8px}
    .pbx-aim{display:inline-flex;align-items:center;gap:7px;padding:4px 6px 4px 11px;
      border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);
      font:600 11.5px var(--font-sans)}
    .pbx-aim>svg{width:12px;height:12px;flex:none}
    .pbx-aim b{font-weight:700}
    .pbx-aim button{width:18px;height:18px;flex:none;display:grid;place-items:center;border:0;
      border-radius:50%;background:none;color:inherit;cursor:pointer;opacity:.7}
    .pbx-aim button svg{width:10px;height:10px}
    .pbx-aim button:hover{opacity:1;background:#7a4fd61f}

    /* the card's invitation, in place of an input of its own */
    .ag-ask-open{display:inline-flex;align-items:baseline;gap:6px;padding:0;border:0;
      background:none;cursor:pointer;text-align:left;
      font:400 11.5px var(--font-sans);color:var(--ink-3)}
    .ag-ask-open>span{color:var(--ink-3)}
    .ag-ask-open b{font-weight:600;color:var(--ink-3);text-decoration:underline;
      text-underline-offset:2px}
    .ag-ask-open:hover>span,.ag-ask-open:hover b{color:var(--accent)}

    /* accounting for the steps chat had nothing to say about */
    .ag-gap{display:flex;align-items:center;gap:11px;padding:2px 4px;
      font:400 11.5px/1.5 var(--font-sans);color:var(--ink-3)}
    .ag-gap>i{flex:1;height:1px;background:var(--line)}
    .ag-gap>span{flex:0 1 auto;min-width:0;text-align:center}
    .ag-gap b{font-weight:650;color:var(--ink-2)}
    .ag-gap button{flex:none;border:0;background:none;padding:0;cursor:pointer;
      font:650 11.5px var(--font-sans);color:var(--ink-3)}
    .ag-gap button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}

    /* a stage that is deliberately left open */
    .pv-roll{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:var(--r-md);
      background:var(--accent-soft);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
    .pv-roll svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
    .pv-roll b{color:var(--ink);font-weight:650}
    .pv-set.static{cursor:default}
    .pv-set.sent{opacity:.72}
    .pv-set-ic{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent)}
    .pv-set-ic.ok{background:var(--green-soft);color:var(--green)}
    .pv-set-ic svg{width:13px;height:13px}
    .pv-set-tag{flex:none;font-size:10.5px;font-weight:700;padding:2px 9px;
      border-radius:var(--r-pill);background:var(--panel-3);color:var(--ink-3)}

    /* ═══ THE DRAWERS — notes, documents, mail and the log. They
       belong to the request but they are not the run, so they open
       over it from the right and close again. ═══ */
    .rn-body{flex:1;min-height:0;display:flex}
    .rn-body>.rn-scroll,.rn-body>.rn-stage{flex:1;min-width:0}
    .rn-tabs button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
    .rn-tabs button.on b{color:var(--accent)}
    .rn-tabs button b{margin-left:6px}
    .dw{flex:none;width:376px;display:flex;flex-direction:column;min-height:0;
      background:var(--panel);border-left:1px solid var(--line);
      box-shadow:-12px 0 28px -22px #1c1e2e40;animation:dwIn .22s var(--enter)}
    @keyframes dwIn{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
    .dw-head{flex:none;display:flex;align-items:center;gap:9px;padding:12px 16px;
      border-bottom:1px solid var(--line)}
    .dw-t-l{font-size:13px;font-weight:650;color:var(--ink)}
    .dw-c{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);
      background:var(--panel-3);color:var(--ink-3)}
    .dw-x{width:26px;height:26px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;
      background:none;color:var(--ink-3);cursor:pointer}
    .dw-x svg{width:13px;height:13px}
    .dw-x:hover{background:var(--hover);color:var(--ink)}
    .dw-body{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 28px}
    .dw-i{display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--line)}
    .dw-i:first-child{border-top:0}
    .dw-b{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
    .dw-h{display:flex;align-items:baseline;gap:9px}
    .dw-h b{font-size:12.5px;font-weight:650;color:var(--ink)}
    .dw-h span{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
    .dw-n{font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-word}
    .dw-s{font-size:11.5px;color:var(--ink-3)}
    .dw-s.dim{opacity:.75}
    .dw-t{font-size:12.5px;line-height:1.55;color:var(--ink-2);margin-top:3px}
    .dw-av{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
      font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
    .dw-ic{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
      background:var(--panel-3);color:var(--accent)}
    .dw-ic svg{width:13px;height:13px}
    .dw-dir{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
      font-size:12px;font-weight:700;background:var(--panel-3);color:var(--ink-3)}
    .dw-dir.in{background:var(--accent-soft);color:var(--accent)}
    .dw-dir.out{background:var(--green-soft);color:var(--green)}
    .dw-dot{width:8px;height:8px;flex:none;margin-top:6px;border-radius:50%;background:var(--line-strong)}
    .dw-dot.done{background:var(--green)}
    .dw-dot.gate{background:var(--pb-orange)}
    .dw-dot.skipped{background:var(--line-strong)}
    .dw-dot.amend{background:var(--pb-orange)}
    @media (max-width:1180px){ .dw{width:320px} }

    /* the record's own utility row — route on the left, its tools on
       the right, sitting inside the content rather than above it */
    .ru{display:flex;align-items:center;gap:11px;max-width:1000px;margin:0 auto;
      padding:14px 4px 0}
    .rn-stage .ru{padding:0 0 8px;max-width:1040px;width:100%}
    .ru.bare{gap:0}
    .ru-back{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
      border-radius:50%;border:0;background:none;color:var(--ink-3);cursor:pointer}
    .ru-back svg{width:15px;height:15px}
    .ru-back:hover{background:var(--hover);color:var(--ink)}
    .ru-here{font-weight:700;color:var(--ink-2)}
    .rn-stage{flex-direction:column;align-items:center;padding:16px 20px 20px}
    .rn-lead{max-width:1000px;margin:26px auto 12px;padding:0 26px;
      display:flex;align-items:center;gap:11px}
    .rn-lead .rn-prog-track{width:150px}

    /* the case is fixed; the steps scroll under it */
    .rn-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
    .rn-fixed{flex:none;padding-bottom:2px;border-bottom:1px solid var(--line);
      background:var(--panel)}
    .rn-main>.rn-scroll{padding:16px 22px 120px}
    .rn-fixed>.ru,.rn-fixed>.cs,.rn-fixed>.rn-lead{padding-left:22px;padding-right:22px}
    .rn-fixed>.cs{margin-left:22px;margin-right:22px;padding-left:24px;padding-right:24px}
    .rn-lead{margin:20px auto 14px}
    .ru-win{display:inline-flex;gap:2px;flex:none;margin-left:4px}
    .ru-win button{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:50%;
      background:none;color:var(--ink-3);cursor:pointer}
    .ru-win button svg{width:14px;height:14px}
    .ru-win button:hover{background:var(--hover);color:var(--ink)}

    /* the hero, the lead and the list share one gutter */
    .rn-fixed>.ru{padding:14px 22px 0}
    .rn-fixed>.cs{margin-left:22px;margin-right:22px;max-width:none}
    .rn-fixed>.rn-lead{margin:16px auto 12px;padding:0 26px}
    .rn-main>.rn-scroll{padding:14px 22px 120px}
    .rn-main .rn-list{padding:0 4px}
    .rn-main .rn-foot{padding:0 4px 0 34px}

    /* ═══ THE CASE HERO OWNS ITS ROUTE ═══ */
    .cs{margin:14px 22px 0;max-width:none;padding:16px 22px 20px}
    .cs-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .cs-trail{display:flex;align-items:center;gap:6px;font:600 11.5px var(--font-sans);
      color:var(--ink-3);min-width:0}
    .cs-trail button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
    .cs-trail button:hover{color:var(--accent)}
    .cs-trail i{font-style:normal;opacity:.45}
    .cs-trail span{color:var(--ink-2);font-weight:700}
    .cs-top .ru-win button:hover{background:#7a4fd614}

    /* ═══ TABS — the run is one of the things this request holds ═══ */
    .rt{display:flex;align-items:center;gap:2px;padding:12px 26px 0;margin:0 22px;
      border-bottom:1px solid var(--line);overflow-x:auto}
    .rt-b{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 11px;border:0;
      background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
      font:600 13px var(--font-sans);color:var(--ink-3);margin-bottom:-1px}
    .rt-b svg{width:14px;height:14px;opacity:.85}
    .rt-b b{font-weight:750;font-size:10.5px;padding:1px 7px;border-radius:var(--r-pill);
      background:var(--panel-3);color:var(--ink-3)}
    .rt-b:hover{color:var(--ink)}
    .rt-b.on{color:var(--ink);border-bottom-color:var(--accent)}
    .rt-b.on b{background:var(--accent-soft);color:var(--accent)}

    /* a tab's content, as a page rather than a drawer */
    .rp{max-width:1000px;margin:0 auto;padding:4px 4px 40px}
    .rp-h{display:flex;align-items:baseline;gap:9px;padding:10px 0 4px;
      font:700 10.5px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-3)}
    .rp-h span{font-size:11px;letter-spacing:0;text-transform:none;font-weight:600}
    .rp .dw-i{padding:15px 0}
    .rn-fixed{padding-bottom:0;border-bottom:0}

    /* ═══ ONE OBJECT ═══
       The hero, the tabs and the steps were three cards stacked on a
       page. They are one record, so they share one boundary: the hero
       is its top band, the tabs are its rail, and the steps live
       inside it. */
    .rn-body{padding:14px 20px 18px}
    .rn-main{border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;
      background:var(--panel);box-shadow:0 1px 2px #1c1e2e0f}
    .rn-fixed{padding:0;border-bottom:1px solid var(--line);background:transparent}

    /* the hero is the top band of that object, not a card on it */
    .rn-fixed>.cs{margin:0;max-width:none;border:0;border-radius:0;
      padding:15px 24px 18px;border-bottom:1px solid var(--line)}
    .rn-fixed>.cs:before{width:3px}

    /* the tabs are its rail, flush to the same edges */
    .rn-fixed>.rt{margin:0;padding:0 16px;border-bottom:0;background:var(--panel)}

    /* and the steps are its contents */
    .rn-main>.rn-scroll{padding:18px 24px 90px}
    .rn-main .rn-list{padding:0;max-width:none}
    .rn-main .rn-foot{max-width:none;margin:18px 0 0;padding:0 0 0 30px}
    .rn-main .rp{max-width:none;padding:0 0 30px}
    .rc-mark{box-shadow:0 0 0 4px var(--panel)}

    /* ═══ CASE HERO — the hold hero's shape, the request's data ═══ */
    .rn-fixed>.cs{position:relative;display:flex;align-items:center;gap:34px;flex-wrap:wrap;
      padding:22px 28px 20px;border-bottom:1px solid var(--line);
      background:linear-gradient(135deg,#7a4fd612 0%,#e23d7d0a 46%,#7a4fd603 100%),var(--panel-3)}
    .cs-main{flex:1;min-width:300px}
    .cs-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
    .cs-back{width:32px;height:32px;flex:none;margin-top:14px;display:flex;align-items:center;
      justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--panel);
      color:var(--ink-3);cursor:pointer}
    .cs-back svg{width:15px;height:15px}
    .cs-back:hover{color:var(--ink);border-color:var(--line-strong)}
    .cs-id{min-width:0}
    .cs-trail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;
      font:500 12px var(--font-sans);color:var(--ink-3)}
    .cs-trail button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
    .cs-trail button:hover{color:var(--accent)}
    .cs-trail i{font-style:normal;font-size:9px;opacity:.5}
    .cs-trail>span{color:var(--ink-2);font-weight:600}
    .cs-t{margin:0;font-family:var(--font-display,inherit);font-size:27px;font-weight:400;
      letter-spacing:-.02em;color:var(--ink);line-height:1.14}
    .cs-label{font:700 10.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:6px}
    .cs-figure{display:flex;align-items:baseline;gap:12px;margin-bottom:11px}
    .cs-pct{font-family:var(--font-display,inherit);font-size:38px;font-weight:400;
      letter-spacing:-.03em;line-height:1;color:var(--ink)}
    .cs-of{font-size:13.5px;color:var(--ink-2)}
    .cs-track{height:7px;border-radius:9999px;background:var(--track);overflow:hidden;
      margin-bottom:11px;max-width:640px}
    .cs-fill{height:100%;border-radius:9999px;
      background:linear-gradient(90deg,var(--orange),var(--magenta))}
    .cs-note{font-size:12.5px;color:var(--ink-2)}
    .cs-note strong{color:var(--magenta);font-weight:650}

    .cs-stats{display:flex;gap:12px;flex:none;margin-right:44px}
    .cs-stat{min-width:112px;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-lg);
      background:var(--panel);cursor:pointer;text-align:left;
      transition:border-color var(--fast) var(--std),transform var(--fast) var(--std)}
    .cs-stat:hover{border-color:var(--line-strong);transform:translateY(-1px)}
    .cs-stat-n{font-family:var(--font-display,inherit);font-size:26px;font-weight:400;
      line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
    .cs-stat.warn .cs-stat-n{color:var(--accent)}
    .cs-stat.risk .cs-stat-n{color:var(--magenta)}
    .cs-stat-l{margin-top:3px;font-size:12px;color:var(--ink-3)}
    .cs-win{position:absolute;top:12px;right:16px}

    /* the hero was carrying the weight of a full page header; it is a
       band inside a record, so bring it in */
    .rn-fixed>.cs{gap:24px;padding:14px 24px 14px}
    .cs-head{gap:10px;margin-bottom:10px}
    .cs-back{width:26px;height:26px;margin-top:8px}
    .cs-back svg{width:13px;height:13px}
    .cs-trail{margin-bottom:3px;font-size:11.5px}
    .cs-t{font-size:20px;letter-spacing:-.018em}
    .cs-label{font-size:9.5px;margin-bottom:3px}
    .cs-figure{gap:9px;margin-bottom:7px}
    .cs-pct{font-size:26px}
    .cs-of{font-size:12.5px}
    .cs-track{height:5px;margin-bottom:8px;max-width:520px}
    .cs-note{font-size:12px}
    .cs-stats{gap:8px;margin-right:38px}
    .cs-stat{min-width:88px;padding:9px 13px;border-radius:var(--r-md)}
    .cs-stat-n{font-size:19px}
    .cs-stat-l{margin-top:1px;font-size:11px}
    .cs-win{top:8px;right:12px}
    .cs-win button{width:24px;height:24px}
    .cs-win button svg{width:12px;height:12px}

    /* ═══ CASE HERO, rethought — three things, not nine ═══ */
    .rn-fixed>.cs{position:relative;display:flex;align-items:center;gap:28px;flex-wrap:wrap;
      padding:16px 24px 16px;border-bottom:1px solid var(--line);
      background:linear-gradient(120deg,#7a4fd60f 0%,#e23d7d08 55%,transparent 100%),var(--panel)}
    .cs-id{flex:1;min-width:280px}
    .cs-trail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;
      font:500 11.5px var(--font-sans);color:var(--ink-3)}
    .cs-trail button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
    .cs-trail button:hover{color:var(--accent)}
    .cs-trail i{font-style:normal;font-size:9px;opacity:.5}
    .cs-trail>span{color:var(--ink-2);font-weight:600}
    .cs-t{margin:0 0 5px;font-family:var(--font-display,inherit);font-size:21px;font-weight:400;
      letter-spacing:-.018em;color:var(--ink);line-height:1.16}
    .cs-note{margin:0;font-size:12.5px;color:var(--ink-3)}
    /* the one number the header exists to carry */
    .cs-clock{display:flex;align-items:center;gap:10px;flex:none;margin-right:52px;
      padding:8px 16px 8px 14px;border-radius:var(--r-lg);background:var(--pb-orange-soft)}
    .cs-days{font-family:var(--font-display,inherit);font-size:30px;font-weight:400;
      line-height:1;letter-spacing:-.03em;color:var(--pb-orange)}
    .cs-days-l{font-size:11.5px;font-weight:650;line-height:1.35;color:var(--pb-orange)}
    .cs-days-l i{font-style:normal;font-weight:500;opacity:.75}
    .cs-win{position:absolute;top:10px;right:14px}
    .cs-win button{width:24px;height:24px}
    .cs-win button svg{width:12px;height:12px}

    /* the tab rail fits — it doesn't need a scroller of its own */
    .rt{overflow-x:visible;flex-wrap:wrap}
    .rt::-webkit-scrollbar{display:none}

    /* the kind of work, as a tag rather than as the first words of a
       sentence */
    .rc-type{flex:none;font:650 9.5px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
      padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--ink-3);
      background:var(--panel)}
    .rc-type.t-agent{color:var(--t-agent);border-color:transparent;background:var(--t-agent-soft)}
    .rc-type.t-human{color:var(--pb-orange);border-color:transparent;background:var(--pb-orange-soft)}
    .rc.ahead .rc-type{opacity:.6}
    .rc-t{gap:8px}

    /* the redline: clause, verdict, what changed, why */
    .rl{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);
      border-radius:var(--r-md);overflow:hidden}
    .rl-i{padding:13px 15px;border-top:1px solid var(--line)}
    .rl-i:first-child{border-top:0}
    .rl-h{display:flex;align-items:center;gap:11px;margin-bottom:6px}
    .rl-c{font-size:13px;font-weight:650;color:var(--ink)}
    .rl-v{margin-left:auto;flex:none;font:700 9.5px var(--font-sans);letter-spacing:.08em;
      text-transform:uppercase;padding:3px 9px;border-radius:5px}
    .rl-v.ok{background:var(--green-soft);color:var(--green)}
    .rl-v.warn{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .rl-v.bad{background:#e23d7d1a;color:var(--magenta)}
    .rl-d{display:flex;align-items:baseline;gap:9px;font-size:12.5px;margin-bottom:5px}
    .rl-was{color:var(--ink-3);text-decoration:line-through}
    .rl-arw{color:var(--ink-3)}
    .rl-now{font-weight:600;color:var(--ink)}
    .rl-w{font-size:12.5px;line-height:1.55;color:var(--ink-3)}

    /* ═══ REDLINE READER — findings on the left, the document on the
       right, and a citation joining them. ═══ */
    .rd{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.15fr);gap:16px;
      align-items:start}
    .rd-list{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow-y:auto;
      padding-right:4px}
    .rd-list-h{font:700 10px var(--font-sans);letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink-3);padding:2px 2px 4px}
    .rd-i{display:block;width:100%;text-align:left;padding:12px 14px;cursor:pointer;
      border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);
      transition:border-color var(--fast) var(--std),background var(--fast) var(--std)}
    .rd-i:hover{border-color:var(--line-strong)}
    .rd-i.on{border-color:var(--accent);background:var(--accent-soft)}
    .rd-i-h{display:flex;align-items:center;gap:10px;margin-bottom:5px}
    .rd-cite{font:650 10.5px var(--font-mono,monospace);letter-spacing:.02em;color:var(--accent)}
    .rd-i-c{font-size:13px;font-weight:650;color:var(--ink);margin-bottom:5px}
    .rd-i .rl-v{margin-left:auto}
    .rd-i .rl-d{margin-bottom:5px}
    .rd-i .rl-w{font-size:12px}

    .rd-doc{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
      background:var(--panel);position:sticky;top:0}
    .rd-doc-h{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface);
      border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
    .rd-doc-t{font-weight:650;color:var(--ink-2)}
    .rd-key{display:inline-flex;align-items:center;gap:6px;font-size:10.5px}
    .rd-key i{width:9px;height:9px;border-radius:2px;display:inline-block}
    .rd-key i.del{background:#e23d7d33}
    .rd-key i.ins{background:#2fb07933}
    .rd-doc-b{max-height:62vh;overflow-y:auto;padding:6px 0}
    .rd-p{position:relative;padding:14px 20px 16px 46px;border-left:3px solid transparent}
    .rd-p.on{border-left-color:var(--accent);background:var(--accent-soft)}
    .rd-pg{position:absolute;left:12px;top:16px;font:600 9.5px var(--font-mono,monospace);
      color:var(--ink-3)}
    .rd-p h4{margin:0 0 6px;font-size:12.5px;font-weight:700;color:var(--ink)}
    .rd-p p{margin:0;font-size:13px;line-height:1.72;color:var(--ink-2)}
    .rd-p del{text-decoration:line-through;background:#e23d7d1a;color:var(--magenta);
      padding:1px 2px;border-radius:2px;text-decoration-thickness:1px}
    .rd-p ins{text-decoration:none;background:#2fb0791f;color:#1c7d55;padding:1px 2px;
      border-radius:2px}
    @media (max-width:1040px){
      .rd{grid-template-columns:1fr}
      .rd-list{max-height:none}
      .rd-doc{position:static}
    }

    /* a standalone accounting line reads left to right, not centred
       between two rules */
    .ag-gap.note{display:block;padding:2px 2px 0;text-align:left;line-height:1.6}
    .ag-gap.note>span{display:inline}
    .ag-gap.note button{display:inline;margin-left:6px}

    /* ═══ STEP FORMS — a record, a match, a task, a log, a notice ═══ */
    .fm{display:flex;flex-direction:column}
    .fm-l{font:700 10px var(--font-sans);letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:9px}
    .fm-change{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;margin-bottom:18px;
      border-radius:var(--r-md);background:var(--accent-soft);font-size:12.5px;line-height:1.55;
      color:var(--ink-2)}
    .fm-change svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
    .fm-change b{color:var(--ink);font-weight:650}
    .fm-change s{color:var(--ink-3)}
    .fm-change em{font-style:normal;font-weight:650;color:var(--accent)}
    .fm-rows{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .fm-r{display:flex;align-items:baseline;gap:18px;padding:10px 16px;
      border-top:1px solid var(--line)}
    .fm-r:first-child{border-top:0}
    .fm-k{flex:none;width:180px;font-size:12.5px;color:var(--ink-3)}
    .fm-v{flex:1;min-width:0;font-size:13px;color:var(--ink)}
    .fm-task{padding:15px 17px;margin-bottom:18px;border-radius:var(--r-md);
      border:1px solid #e0902f42;background:var(--pb-orange-soft)}
    .fm-task-h{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
    .fm-task-h>span:first-child{font:700 10px var(--font-sans);letter-spacing:.09em;
      text-transform:uppercase;color:var(--pb-orange)}
    .fm-task-w{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
    .fm-task-t{font-size:15px;font-weight:650;color:var(--ink);margin-bottom:6px}
    .fm-task-d{margin:0;font-size:13px;line-height:1.62;color:var(--ink-2)}
    .fm-ta{width:100%;min-height:74px;padding:10px 13px;border:1px solid var(--line-strong);
      border-radius:var(--r-md);background:var(--panel);font:400 13px/1.55 var(--font-sans);
      color:var(--ink);resize:vertical}
    .fm-ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .fm-was{color:var(--ink-3);text-decoration:line-through;font-size:12.5px}
    .fm-now{font-weight:650;color:var(--ink);font-size:12.5px}
    .pv-tr.lg,.pv-tr.head.lg{grid-template-columns:minmax(0,2fr) 130px 150px 120px}
    .fm-notice{border:1px solid var(--line);border-radius:var(--r-md);padding:15px 17px;
      background:var(--surface);font-size:13px;line-height:1.68;color:var(--ink-2)}
    .fm-notice p{margin:0 0 11px}
    .fm-notice p:last-child{margin-bottom:0}

    /* give the playbook something to read */
    .up{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
    .up-zone{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;
      padding:34px 24px;border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);
      background:var(--surface);cursor:pointer;text-align:center;
      transition:border-color var(--fast) var(--std),background var(--fast) var(--std)}
    .up-zone:hover{border-color:var(--accent);background:var(--accent-soft)}
    .up-zone input{display:none}
    .up-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);margin-bottom:3px}
    .up-ic svg{width:17px;height:17px}
    .up-t{font-size:13.5px;font-weight:650;color:var(--ink)}
    .up-s{font-size:12px;color:var(--ink-3)}
    .up-sample{border:0;background:none;padding:0;cursor:pointer;
      font:600 12.5px var(--font-sans);color:var(--accent);text-decoration:underline;
      text-underline-offset:2px}
    .up-sample:hover{color:var(--orange-deep)}

    /* ═══ REDLINE READER — the widest thing in the product ═══ */
    .wsrow.rd-wide .wscol{flex:none;width:clamp(280px,30%,420px)}
    .wsrow.rd-wide .armour-library-panel.open{width:auto;flex:1;min-width:0}

    /* one scrollbar per pane, and none around them. The step page
       stops scrolling for this step — the two documents do it. */
    .sp.sp-reader .sp-scroll{overflow:hidden;display:flex;flex-direction:column}
    .sp.sp-reader .sp-block{flex:1;min-height:0;display:flex;flex-direction:column}
    .sp.sp-reader .sp-block-b{flex:1;min-height:0;padding-bottom:14px}
    .sp.sp-reader .rd{height:100%;grid-template-columns:35% minmax(0,65%);gap:14px}
    .sp.sp-reader .rd-list{max-height:none;height:100%;overflow-y:auto}
    .sp.sp-reader .rd-doc{height:100%;display:flex;flex-direction:column;position:static}
    .sp.sp-reader .rd-doc-b{max-height:none;flex:1;min-height:0}

    /* the reader fills the pane: the stage stops centring its child
       vertically, and every wrapper between it and the two documents
       passes its height down */
    .rn-stage{justify-content:flex-start;align-items:stretch}
    .rn-stage>.sp{flex:1 1 auto;min-height:0;margin:0 auto;height:auto}
    .sp.sp-reader{height:100%}
    .sp.sp-reader>.sp-scroll{flex:1 1 auto;min-height:0}
    .sp.sp-reader .sp-block{flex:1 1 auto;min-height:0}
    .sp.sp-reader .sp-block-b{flex:1 1 auto;min-height:0;display:flex}
    .sp.sp-reader .rd{flex:1;min-height:0}

    /* a document staged on the composer, before you send */
    .pbx-file{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 11px;
      border-radius:var(--r-pill);background:var(--panel-3);border:1px solid var(--line);
      font:600 12px var(--font-sans);color:var(--ink-2)}
    .pbx-file>svg{width:13px;height:13px;flex:none;color:var(--accent)}
    .pbx-file button{width:18px;height:18px;flex:none;display:grid;place-items:center;border:0;
      border-radius:50%;background:none;color:var(--ink-3);cursor:pointer}
    .pbx-file button svg{width:10px;height:10px}
    .pbx-file button:hover{background:var(--hover);color:var(--ink)}

    /* ═══ LEDGER — what changed, where, and whether anything is left ═══ */
    .lg-top{display:flex;align-items:center;gap:11px;padding:14px 24px 0}
    .lg{max-width:980px;margin:0 auto;padding:18px 24px 60px}
    .lg-head h2{margin:0 0 6px;font-family:var(--font-display,inherit);font-size:23px;
      font-weight:400;letter-spacing:-.02em;color:var(--ink)}
    .lg-head p{margin:0 0 20px;font-size:13px;color:var(--ink-3)}
    .lg-ex{display:flex;gap:12px;padding:16px 18px;border-radius:var(--r-lg);
      border:1px solid #e0902f52;background:var(--pb-orange-soft);margin-bottom:24px}
    .lg-ex>svg{width:17px;height:17px;flex:none;margin-top:2px;color:var(--pb-orange)}
    .lg-ex-t{font-size:14.5px;font-weight:650;color:var(--ink);margin-bottom:4px}
    .lg-ex p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2);max-width:70ch}
    .lg-ex .rn-act{margin-top:12px}
    .lg-ok{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:var(--r-lg);
      background:var(--green-soft);font-size:13px;color:var(--ink-2);margin-bottom:24px}
    .lg-ok svg{width:15px;height:15px;flex:none;color:var(--green)}
    .lg-ok b{color:var(--ink);font-weight:650}
    .lg-l{font:700 10px var(--font-sans);letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:9px}
    .lg-tbl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
    .lg-tr{display:grid;grid-template-columns:minmax(0,1.8fr) 140px 130px 150px 120px;gap:14px;
      align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-size:12.5px}
    .lg-tr:first-child{border-top:0}
    .lg-tr.head{background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--ink-3)}
    .lg-tr>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lg-o{font-weight:600;color:var(--ink)}
    .lg-tr .dim{color:var(--ink-3)}
    .lg-foot{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:12.5px;
      line-height:1.55;color:var(--ink-3)}
    .lg-foot svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--green)}

    /* ═══ TOOL — upload, wait, judge ═══ */
    .rn-main.tl{display:flex;flex-direction:column;min-height:0}
    .tl-head{display:flex;align-items:flex-start;gap:16px;padding:10px 24px 16px;
      border-bottom:1px solid var(--line)}
    .tl-head h2{margin:0 0 5px;font-family:var(--font-display,inherit);font-size:22px;
      font-weight:400;letter-spacing:-.02em;color:var(--ink)}
    .tl-head p{margin:0;font-size:12.5px;color:var(--ink-3)}
    .tl-head p b{color:var(--pb-orange);font-weight:650}
    .tl-head .rn-btn.quiet{margin-left:auto;flex:none}
    .tl-done{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;
      padding:6px 13px;border-radius:var(--r-pill);background:var(--green-soft);
      font:650 12px var(--font-sans);color:var(--green)}
    .tl-done svg{width:13px;height:13px}
    .tl-body{flex:1;min-height:0;display:flex;padding:16px 24px}
    .tl-body>.rd{flex:1;min-height:0;height:100%;grid-template-columns:35% minmax(0,65%);gap:14px}
    .tl-body .rd-list{max-height:none;height:100%}
    .tl-body .rd-doc{height:100%;display:flex;flex-direction:column;position:static}
    .tl-body .rd-doc-b{max-height:none;flex:1;min-height:0}
    .tl-empty{flex:1;display:flex;align-items:center;justify-content:center}
    .tl-empty .up{width:min(560px,100%)}
    .tl-work{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
    .tl-work-t{font-size:15px;font-weight:650;color:var(--ink)}
    .tl-work-s{font-size:13px;color:var(--ink-3);margin-top:3px}
    .tl-act{display:flex;align-items:center;gap:10px;padding:14px 24px;flex:none;
      border-top:1px solid var(--line);background:var(--pb-orange-soft)}
    .tl-act-l{font-size:12.5px;color:var(--ink-2)}
    .tl-act.done{background:var(--green-soft)}
    .tl-act.done>svg{width:15px;height:15px;color:var(--green)}
    .tl-act.done span{font-size:12.5px;color:var(--ink-2)}
    .tl-act.done b{color:var(--ink);font-weight:650}

    /* ═══ THE LIVING DOCUMENT ═══
       Sections that fill in as the run works. Empty ones stay, dim,
       so the shape of the whole thing is legible from the start. */
    .dv{max-width:1000px;margin:0 auto;padding:4px 4px 60px;
      display:flex;flex-direction:column;gap:2px}
    .dv-s{border-top:1px solid var(--line);padding:16px 2px 18px}
    .dv-s:first-child{border-top:0}
    .dv-s-h{display:flex;align-items:center;gap:11px;margin-bottom:2px}
    .dv-s-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
    .dv-s-m{font-size:12.5px;color:var(--ink-3)}
    .dv-ok{color:var(--green);font-weight:650}
    .dv-wm{color:var(--pb-orange);font-weight:650}
    .dv-warn{color:var(--pb-orange);font-weight:650}
    .dv-s.empty .dv-s-t{color:var(--ink-3);font-weight:600}
    .dv-s.empty .dv-s-h:after{content:"not reached yet";font-size:12px;color:var(--ink-3);opacity:.7}
    .dv-s.live .dv-s-h:after{content:"working\2026";font-size:12px;color:var(--accent);font-weight:600}
    .dv-s.wait{background:linear-gradient(90deg,#e0902f0f,#fff0 70%);
      border-radius:var(--r-md);padding-left:14px;padding-right:14px;
      box-shadow:inset 3px 0 0 var(--pb-orange)}
    .dv-s-b{margin-top:12px}
    .dv-go{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 14px;
      border:0;border-radius:var(--r-pill);background:var(--pb-orange);color:#fff;cursor:pointer;
      font:650 12.5px var(--font-sans)}
    .dv-go svg{width:12px;height:12px}
    .dv-link{flex:none;border:0;background:none;padding:0;cursor:pointer;
      font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .dv-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
    .dv-kv{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);
      border-radius:var(--r-md);overflow:hidden}
    .dv-kv-r{display:flex;align-items:baseline;gap:18px;padding:9px 15px;
      border-top:1px solid var(--line)}
    .dv-kv-r:first-child{border-top:0}
    .dv-kv-r>span{flex:none;width:190px;font-size:12.5px;color:var(--ink-3)}
    .dv-kv-r>b{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink)}
    .dv-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 15px;
      border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);cursor:pointer;
      margin-bottom:8px}
    .dv-card:last-child{margin-bottom:0}
    .dv-card:hover{border-color:var(--accent);background:var(--accent-soft)}
    .dv-card-ic{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent)}
    .dv-card-ic svg{width:13px;height:13px}
    .dv-card>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .dv-card b{font-size:13px;font-weight:650;color:var(--ink)}
    .dv-card em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
    .dv-card>svg{width:13px;height:13px;flex:none;color:var(--ink-3)}
    .dv-chips{display:flex;flex-wrap:wrap;gap:7px}
    .dv-chip{font:600 12px var(--font-sans);padding:5px 11px;border-radius:var(--r-pill);
      background:var(--panel-3);color:var(--ink-2)}
    .dv-chip.src{background:var(--accent-soft);color:var(--accent)}
    .rn-runlead{max-width:1000px;margin:0 auto 14px;padding:0 4px;font-size:12.5px;
      line-height:1.55;color:var(--ink-3)}

    /* ═══ COMMAND CENTER — two lists, and the line between them ═══ */
    .cc-filter{display:flex;gap:2px;padding:2px 10px 8px}
    .cc-filter button{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:0;
      border-radius:9999px;background:none;cursor:pointer;
      font:600 11.5px var(--font-sans);color:var(--chrome-ink-3,#8a8a97)}
    .cc-filter button:hover{background:#ffffff0f;color:var(--chrome-ink,#e8e8ee)}
    .cc-filter button.on{background:#ffffff1a;color:var(--chrome-ink,#e8e8ee)}
    .cc-filter button b{font-size:10px;font-weight:700;padding:1px 6px;border-radius:9999px;
      background:var(--pb-orange);color:#fff}
    .cc-list{padding:0 10px}

    .cc-sec{padding:6px 10px 10px}
    .cc-sec-h{display:flex;align-items:center;gap:8px;padding:6px 6px 8px;
      font:700 10px var(--font-sans);letter-spacing:.1em;text-transform:uppercase;
      color:var(--chrome-ink-3,#8a8a97)}
    .cc-sec-h b{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9999px;
      background:#ffffff14;color:inherit}
    .cc-sec-h b.wait{background:var(--pb-orange);color:#fff}
    .cc-list{display:flex;flex-direction:column;gap:2px}
    /* a run row is a chat row with a state rule down its edge */
    .cc-i{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
      padding:8px 9px 8px 12px;border:0;border-radius:var(--r-sm);background:none;cursor:pointer}
    .cc-i:before{content:"";position:absolute;left:3px;top:9px;bottom:9px;width:2px;
      border-radius:2px;background:#ffffff29}
    .cc-i:hover{background:#ffffff0f}
    .cc-i.on{background:#ffffff1a}
    .cc-i.wait:before{background:var(--pb-orange)}
    .cc-i.work:before{background:var(--accent)}
    .cc-i.done:before{background:var(--green)}
    .cc-i.idle:before{background:#ffffff29}
    .cc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .cc-t{font:600 12.5px var(--font-sans);color:var(--chrome-ink,#e8e8ee);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cc-s{font-size:11px;color:var(--chrome-ink-3,#8a8a97);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cc-i.wait .cc-s b{color:var(--pb-orange);font-weight:700}
    .cc-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
    .cc-when{font-size:10.5px;color:var(--chrome-ink-3,#8a8a97)}
    .cc-id{font:600 9.5px var(--font-mono,monospace);letter-spacing:.02em;
      color:var(--chrome-ink-3,#8a8a97);opacity:.6}
    .unirail-chats-title{margin-top:4px}

    /* what you type here is on the record */
    .cc-scope{display:flex;align-items:flex-start;gap:8px;padding:0 2px 9px;
      font-size:11.5px;line-height:1.5;color:var(--ink-3)}
    .cc-scope svg{width:13px;height:13px;flex:none;margin-top:1px;color:var(--accent)}
    .cc-scope b{color:var(--ink-2);font-weight:650}

    /* a run is a chat that happens to sit on a record — same type, same
       colour, no rule down the side. The state shows in the words. */
    .cc-i:before{display:none}
    .cc-i{padding:8px 9px}
    .cc-t{font:600 13px var(--font-sans);color:var(--chrome-ink,#e8e8ee)}
    .cc-s{font-size:11.5px}
    .cc-i.wait .cc-s b{color:var(--pb-orange);font-weight:650}
    .cc-filter button b{display:none}

    /* exactly the chat row's type — the run titles were on a fallback
       colour that doesn't exist in this theme, so they came out washed */
    .cc-t{color:var(--chrome-title);font-size:13px;font-weight:600}
    .cc-s{color:var(--chrome-tx-2);font-size:11px}
    .cc-when{color:var(--chrome-tx-2);font-size:11px}
    .cc-id{color:var(--chrome-tx-2);opacity:.55}
    .cc-i.wait .cc-s b{color:var(--ex-orange);font-weight:650}
    .cc-filter button{color:var(--chrome-tx-2)}
    .cc-filter button.on,.cc-filter button:hover{color:var(--chrome-title)}

    /* ═══ THE THREAD IS THE RUN ═══ */
    /* the thread only claims 40% once it is carrying a run — on the
       landing screen it is the whole surface, and pinning it to 560px
       shoved the greeting into a column */
    /* The thread has the window to itself until something is open on
       the right. Then it steps aside, and takes the space back when
       that thing closes. */
    .wscol.pbx-running{flex:1;width:auto;min-width:0;
      transition:width var(--standard) var(--enter),flex-basis var(--standard) var(--enter)}
    .wsrow.rec-open .wscol.pbx-running{flex:none;width:clamp(360px,40%,560px)}
    .wsrow.rec-open.rd-wide .wscol.pbx-running{width:clamp(280px,30%,420px)}
    /* the thread centres itself when it owns the width — a full-bleed
       run list is unreadable */
    .wscol.pbx-running .pbx-in{max-width:720px;margin:0 auto}
    .wsrow.rec-open .wscol.pbx-running .pbx-in{max-width:none}

    /* a step card at rest: one line, the plan readable straight down */
    .ag.ahead{opacity:.72;box-shadow:none;border-style:dashed}
    .ag.ahead .ag-num{background:var(--panel-3);color:var(--ink-3)}
    .ag.ahead .ag-t{font-weight:600;color:var(--ink-3)}
    .ag.gate{border-color:#e0902f7a;box-shadow:0 0 0 3px var(--pb-orange-soft)}
    .ag.gate .ag-num{background:var(--pb-orange);color:#fff}
    .ag.gate .ag-fin{color:var(--pb-orange);font-weight:700}
    .ag.live{border-color:#7a4fd659;box-shadow:0 0 0 3px var(--accent-soft)}
    .ag.done .ag-num{background:var(--green-soft);color:var(--green)}
    .ag.done .ag-fin{color:var(--green)}
    .ag.skipped{opacity:.62}
    .ag.skipped .ag-t{text-decoration:line-through;color:var(--ink-3)}
    .ag.folded .ag-go{display:none}
    .ag.gate .ag-go,.ag.done .ag-go,.ag.live .ag-go{display:inline-flex;opacity:1;
      color:var(--accent)}

    /* filter the conversation away and leave the plan */
    .pbx-in.only-steps>*:not(.ag){display:none}
    .pbx-only{display:inline-flex;align-items:center;gap:7px;padding:0 2px 8px;cursor:pointer;
      font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .pbx-only input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer}
    .pbx-only:hover{color:var(--ink-2)}

    /* ═══ THE RUN CARD, IN THE THREAD ═══
       Same anatomy as the run row it replaces: a state mark, the name
       with its type tag, one line of result, and the way in. Agent
       steps unfold underneath; the rest stay a single line. */
    .ag.rcc{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      box-shadow:none;overflow:hidden}
    .ag.rcc+.ag.rcc{margin-top:-6px}
    .rcc-h{display:flex;align-items:center;gap:13px;width:100%;padding:13px 15px;border:0;
      background:none;cursor:pointer;text-align:left;border-bottom:0}
    .rcc-h:hover{background:var(--hover)}
    .ag.rcc .rc-mark{position:static;transform:none;width:24px;height:24px;box-shadow:none;
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:var(--panel-3);color:var(--ink-3);flex:none}
    .ag.rcc .rc-mark svg{width:13px;height:13px}
    .ag.rcc .rc-mark .pbx-spin{width:12px;height:12px}
    .ag.rcc.done .rc-mark{background:var(--green);color:#fff}
    .ag.rcc.gate .rc-mark{background:var(--pb-orange);color:#fff}
    .ag.rcc.live .rc-mark{background:var(--accent-soft);color:var(--accent)}
    .ag.rcc.skipped .rc-mark{background:var(--panel-3);color:var(--ink-3)}
    .ag.rcc .rc-b{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
    .ag.rcc .rc-t{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;
      letter-spacing:-.01em;color:var(--ink)}
    .ag.rcc .rc-s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
    .ag.rcc.ahead{opacity:.7;border-style:dashed}
    .ag.rcc.ahead .rc-t{font-weight:600;color:var(--ink-3)}
    .ag.rcc.gate{border-color:#e0902f7a;box-shadow:0 0 0 3px var(--pb-orange-soft)}
    .ag.rcc.live{border-color:#7a4fd659;box-shadow:0 0 0 3px var(--accent-soft)}
    .ag.rcc.skipped{opacity:.6}
    .ag.rcc.skipped .rc-t{text-decoration:line-through;color:var(--ink-3)}
    .ag.rcc .rc-act{flex:none;font-size:12.5px;font-weight:650;color:var(--accent)}
    .ag.rcc .rc-act.go{color:var(--pb-orange)}
    .ag.rcc .rc-act.live{color:var(--accent);font-weight:600}
    .ag.rcc .ag-chev{flex:none}
    .ag.rcc .ag-b{border-top:1px solid var(--line)}
    .ag.rcc.folded .ag-b{display:none}
    .ag.rcc .ag-req{border-bottom:1px solid var(--line)}
    .ag.rcc .rc-type{font-size:9px;padding:2px 7px}

    /* ═══ EXACT RUN LIST, IN THE THREAD ═══
       Same spine, same marks half outside the card, same spacing as
       the record's run list had — so the plan reads as one connected
       sequence rather than a stack of messages. */
    .ag.rcc{position:relative;padding-left:30px;border:0;border-radius:0;background:none;
      box-shadow:none;overflow:visible}
    .ag.rcc+.ag.rcc{margin-top:8px}
    .ag.rcc:before{content:"";position:absolute;left:13px;top:-8px;bottom:-8px;width:1.5px;
      background:var(--line)}
    .ag.rcc:first-of-type:before{top:24px}
    .ag.rcc:last-of-type:before{bottom:auto;height:26px}

    .rcc-h{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border:0;
      text-align:left;cursor:pointer;border-radius:var(--r-lg);
      border:1px solid var(--line);background:var(--panel);
      transition:background var(--fast) var(--std),border-color var(--standard) var(--std)}
    .rcc-h:hover{background:var(--surface);border-color:var(--line-strong)}

    /* the mark sits on the spine, punched out of the page */
    .ag.rcc .rc-mark{position:absolute;left:0;top:24px;transform:translateY(-50%);
      width:27px;height:27px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;background:var(--panel-3);color:var(--ink-3);
      box-shadow:0 0 0 4px var(--panel);z-index:1}
    .ag.rcc .rc-mark svg{width:14px;height:14px}
    .ag.rcc .rc-mark .pbx-spin{width:13px;height:13px}
    .ag.rcc.done .rc-mark{background:var(--green);color:#fff}
    .ag.rcc.gate .rc-mark{background:var(--pb-orange);color:#fff}
    .ag.rcc.live .rc-mark{background:var(--accent-soft);color:var(--accent)}

    .ag.rcc .rc-t{font-size:14.5px}
    .ag.rcc .rc-s{font-size:12.5px}
    .ag.rcc.ahead{opacity:1}
    .ag.rcc.ahead .rcc-h{border-style:dashed;background:none}
    .ag.rcc.ahead .rc-t{color:var(--ink-3);font-weight:500}
    .ag.rcc.ahead .rc-s{opacity:.75}
    .ag.rcc.gate .rcc-h{border-color:#e0902f7a;box-shadow:0 0 0 3px var(--pb-orange-soft);
      background:linear-gradient(180deg,#e0902f0a,#fff0)}
    .ag.rcc.live .rcc-h{border-color:#7a4fd659;box-shadow:0 0 0 3px var(--accent-soft)}
    .ag.rcc.gate,.ag.rcc.live{box-shadow:none}
    .ag.rcc.skipped .rcc-h{border-style:dashed;background:none}

    /* what an agent produced hangs under its own card */
    .ag.rcc .ag-b{margin-top:6px;border:1px solid var(--line);border-radius:var(--r-lg);
      background:var(--panel);overflow:hidden}
    .ag.rcc .ag-req{border-bottom:1px solid var(--line)}

    /* ═══ THE RECORD LIES ON THE PAGE ═══
       Not a second column butted against the thread — a sheet resting
       on it, with the page showing around its edges and a shadow that
       says it can be put down again. */
    .wsrow.rec-open{position:relative}
    /* Floated on all four sides, so the thread's surface runs behind
       and around it. The separation is the shadow, not an edge: a
       tight contact shadow to lift it off the page, a wide soft one
       for the drop, and the faintest hairline so it still has a
       boundary on white. */
    .wsrow.rec-open .armour-library-panel.open{
      margin:12px;border-radius:18px;border:1px solid #1c1e2e14;
      background:var(--panel);overflow:hidden;
      box-shadow:
        0 0 0 1px #1c1e2e08,
        0 1px 2px #1c1e2e14,
        0 8px 16px -8px #1c1e2e1f,
        0 32px 64px -24px #1c1e2e33;}
    .wsrow.rec-open .armour-library-panel.open .armour-library-panel-body{border-radius:inherit}
    /* the thread keeps its own surface underneath */
    .wsrow.rec-open .wscol{background:var(--bg)}
    .wsrow.rec-open .wscol.pbx-running .pbx-in{padding-left:2px}
    /* the sheet's own chrome follows its corners */
    .wsrow.rec-open .rn,
    .wsrow.rec-open .rn-main{border-radius:inherit}
    .wsrow.rec-open .rn-main{border:0;box-shadow:none;margin:0}
    .wsrow.rec-open .rn-body{padding:0}
    .wsrow.rec-open .rn-fixed>.cs{margin:0;border-radius:18px 18px 0 0}
    .wsrow.rec-open .rn-fixed>.rt{margin:0;padding-left:22px;padding-right:22px}

    /* the thread keeps its own white surface, whatever is open beside it */
    .wsrow.rec-open .wscol{background:var(--panel)}
    .wscol.pbx-running{background:var(--panel)}

    /* the composer is fixed at the foot; the thread scrolls to meet it */
    .wscol.pbx-running .pbx-thread{display:flex;flex-direction:column;min-height:0;flex:1}
    .wscol.pbx-running .pbx-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
    .wscol.pbx-running .pbx-dock{flex:none}

    /* the filter rides above the thread, not in the composer */
    .pbx-only{position:absolute;top:10px;right:16px;z-index:3;display:inline-flex;
      align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);
      border:1px solid var(--line);background:var(--panel);cursor:pointer;
      font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .pbx-only:hover{border-color:var(--line-strong);color:var(--ink-2)}
    .pbx-only input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer}

    /* The sheet lies on the thread, so there is nothing to divide. The
       drag strip keeps working — it just stops drawing a seam until
       you reach for it. */
    .wsrow.rec-open .pane-resize-handle::after{background:transparent}
    .wsrow.rec-open .pane-resize-handle:hover::after,
    .wsrow.rec-open .pane-resize-handle.dragging::after{
      background:var(--accent);width:2px;left:1.5px}
    .wsrow.rec-open .wscol{border-right:0}
    /* the gap the sheet floats in is the thread's own surface */
    .wsrow.rec-open{background:var(--panel)}
    .wsrow.rec-open .pane-resize-handle{width:0}
    .wsrow.rec-open .pane-resize-handle:hover{width:5px}

    /* the section the running step is filling in */
    .dv-s.dv-focus{animation:dvFocus 1.5s var(--std)}
    @keyframes dvFocus{
      0%{background:var(--accent-soft)}
      100%{background:transparent}
    }
    .dv-s{border-radius:var(--r-md);transition:background .3s}

    /* ═══ A SECTION BEING FILLED IN ═══
       Field labels are real from the start; the values arrive. The
       mark beside each one says an agent is doing it. */
    .dv-kv.pending .dv-kv-r{align-items:center}
    .dv-kv-r.pend>b{display:flex;align-items:center;gap:10px}
    .dv-sk{display:block;height:9px;border-radius:5px;flex:1;max-width:280px;
      background:linear-gradient(90deg,var(--panel-3) 0%,#7a4fd61f 40%,var(--panel-3) 80%);
      background-size:220% 100%;animation:dvSk 1.5s linear infinite}
    @keyframes dvSk{0%{background-position:120% 0}100%{background-position:-120% 0}}
    .dv-ai{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;
      background:var(--accent-soft);color:var(--accent);animation:dvAi 1.4s ease-in-out infinite}
    .dv-ai svg{width:11px;height:11px}
    @keyframes dvAi{
      0%,100%{opacity:.45;transform:scale(.9)}
      50%{opacity:1;transform:scale(1.06)}
    }
    .dv-kv-r.pend{animation:dvIn .4s var(--enter) both}
    @keyframes dvIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    /* the section header says who is doing it */
    .dv-s.live .dv-s-h:after{content:"";}
    .dv-s.live .dv-s-t:after{content:" \00b7 an agent is filling this in";
      font-size:12px;font-weight:500;color:var(--accent)}

    /* folded sections: header and result only */
    .dv-s-h{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;
      background:none;cursor:pointer;padding:14px 10px;border-radius:var(--r-md)}
    .dv-s-h:hover{background:var(--hover)}
    .dv-chev{display:flex;flex:none;color:var(--ink-3);transition:transform var(--fast) var(--std)}
    .dv-chev svg{width:12px;height:12px;transform:rotate(-90deg);transition:transform .18s}
    .dv-s.open .dv-chev svg{transform:rotate(0)}
    .dv-s-b{display:none;padding:2px 10px 18px}
    .dv-s.open>.dv-s-b{display:block}
    .dv-s{padding:0;border-top:1px solid var(--line)}
    .dv-s.empty .dv-chev{opacity:.35}
    .dv-s.wait{box-shadow:inset 3px 0 0 var(--pb-orange);padding-left:6px}
    .dv-s.live{box-shadow:inset 3px 0 0 var(--accent);padding-left:6px}
    .dv-inline{border:0;background:none;padding:0;font:inherit;color:var(--accent);
      cursor:pointer;text-decoration:underline;text-underline-offset:2px}
    .dv-go{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r-pill);
      background:var(--pb-orange);color:#fff;font:650 12.5px var(--font-sans)}
    .dv-link{font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .dv-s-h:hover .dv-link{color:var(--accent)}

    /* a section heading reads like a document's, with the system's
       count beside it rather than inside it */
    .dv-s-t{font-size:14.5px;font-weight:650;letter-spacing:-.008em}
    .dv-low{font:700 10px var(--font-mono,monospace);padding:1px 6px;border-radius:4px;
      background:var(--pb-orange-soft);color:var(--pb-orange);margin-left:8px;
      vertical-align:1px}
    .dv-kv-r>b{font-weight:600}

    /* ═══ A SECTION YOU CAN ACT ON ═══ */
    .dv-task{padding:14px 16px;margin-bottom:16px;border-radius:var(--r-md);
      border:1px solid #e0902f42;background:var(--pb-orange-soft)}
    .dv-task-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
    .dv-task-h>span:first-child{font:700 10px var(--font-sans);letter-spacing:.09em;
      text-transform:uppercase;color:var(--pb-orange)}
    .dv-task-w{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
    .dv-task-t{font-size:15px;font-weight:650;color:var(--ink);margin-bottom:5px}
    .dv-task-d{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2);max-width:78ch}
    .dv-act{display:flex;align-items:center;gap:9px;margin-top:16px;flex-wrap:wrap}
    .dv-act .rn-btn.quiet{margin-left:auto}
    .dv-in{width:100%;padding:7px 11px;border:1px solid var(--line-strong);
      border-radius:var(--r-sm);background:var(--panel);font:400 13px var(--font-sans);
      color:var(--ink)}
    .dv-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .dv-kv.editing{border-color:var(--accent)}
    .dv-kv.editing .dv-kv-r{padding:7px 15px}

    /* the commitment sits inside the task it answers */
    .dv-task-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
      padding-top:13px;border-top:1px solid #e0902f33}
    .dv-task-note{font-size:11.5px;color:var(--ink-3)}
    .dv-act:empty{display:none}

    /* the section's own control, beside its name */
    .dv-save{display:inline-flex;align-items:center;gap:6px;flex:none;padding:4px 10px;
      border-radius:var(--r-pill);font:650 11px var(--font-sans);
      color:var(--ink-3);background:var(--panel-3);opacity:.75}
    .dv-save svg{width:11px;height:11px}
    .dv-s-h:hover .dv-save{opacity:1}
    .dv-save.on{background:var(--accent);color:#fff;opacity:1}
    .dv-discard{flex:none;font:600 11px var(--font-sans);color:var(--ink-3);
      text-decoration:underline;text-underline-offset:2px}
    .dv-discard:hover{color:var(--magenta)}
    /* values read as fields, not as boxes, until you touch them */
    .dv-in{background:none;border:1px solid transparent;border-radius:var(--r-sm);
      padding:6px 9px;margin:-6px -9px;width:calc(100% + 18px);
      font:600 13px var(--font-sans);color:var(--ink)}
    .dv-in:hover{border-color:var(--line);background:var(--panel)}
    .dv-in:focus{outline:none;border-color:var(--accent);background:var(--panel);
      box-shadow:0 0 0 3px var(--accent-soft)}
    .dv-kv.editing{border-color:var(--line)}
    .dv-kv.editing .dv-kv-r{padding:10px 16px}

    /* a decision that is a field */
    .dv-decide{margin-top:15px;padding-top:14px;border-top:1px solid #e0902f33}
    .dv-decide-q{font-size:13.5px;font-weight:650;color:var(--ink);margin-bottom:10px}
    .dv-decide .sd-opts{grid-template-columns:max-content max-content;gap:10px;margin-bottom:14px}
    .dv-decide .sd-opt{min-width:130px}
    .dv-decide-n{font:700 10px var(--font-sans);letter-spacing:.09em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:7px}
    .dv-decide-n span{font-weight:500;letter-spacing:0;text-transform:none;opacity:.8}
    .dv-decide .fm-ta{min-height:62px}

    /* a form living inside a record section */
    .dv-s-b .sd-details,.dv-s-b .au,.dv-s-b .sd-matter,.dv-s-b .sdg{margin-top:4px}
    .dv-s-b .sd-flag{margin-top:12px}
    .dv-s-b .au-out{gap:14px}

    /* the task and its answer on one line */
    .dv-task-row{display:flex;align-items:flex-start;gap:22px}
    .dv-task-b{flex:1;min-width:0}
    .dv-task-go{flex:none;display:flex;align-items:center;gap:9px;padding-top:2px}
    .dv-task .dv-task-d{margin:0}
    @media (max-width:860px){
      .dv-task-row{flex-direction:column;gap:14px}
      .dv-task-go{padding-top:0}
    }

    /* one body per section: the decision reads as fields, like the rest */
    .dv-s-b .fm .sd-opts{grid-template-columns:max-content max-content;gap:10px;margin-bottom:0}
    .dv-s-b .fm .sd-opt{min-width:190px}
    .fm-opt{font-weight:500;letter-spacing:0;text-transform:none;opacity:.75;margin-left:5px}
    .dv-s-b .fm-ta{min-height:66px}

    /* ═══ AN OBJECT BEING DRAFTED ═══ */
    .df{border:1px solid #7a4fd633;border-radius:var(--r-lg);padding:16px 18px;
      background:linear-gradient(135deg,#7a4fd60d,#e23d7d08 60%,transparent)}
    .df-h{display:flex;align-items:center;gap:13px;margin-bottom:14px}
    .df-ic{position:relative;width:36px;height:36px;flex:none;border-radius:11px;display:grid;
      place-items:center;background:var(--panel);color:var(--accent);
      box-shadow:0 1px 2px #1c1e2e14}
    .df-ic svg{width:16px;height:16px}
    .df-ic i{position:absolute;inset:-3px;border-radius:14px;border:1.5px solid var(--accent);
      opacity:.45;animation:dfPulse 1.8s ease-out infinite}
    @keyframes dfPulse{
      0%{transform:scale(.94);opacity:.5}
      70%{transform:scale(1.12);opacity:0}
      100%{opacity:0}
    }
    .df-b{display:flex;flex-direction:column;gap:3px;min-width:0}
    .df-t{font-size:14px;font-weight:650;color:var(--ink)}
    .df-s{font-size:12.5px;color:var(--ink-3)}
    .df-bar{height:3px;border-radius:2px;background:var(--track);overflow:hidden;margin-bottom:14px}
    .df-bar i{display:block;height:100%;width:40%;border-radius:2px;
      background:linear-gradient(90deg,var(--orange),var(--magenta));
      animation:dfBar 1.9s var(--std) infinite}
    @keyframes dfBar{
      0%{transform:translateX(-100%)}
      100%{transform:translateX(280%)}
    }
    .df-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
    .df-list li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);
      opacity:.35;animation:dfOn .5s var(--enter) forwards}
    @keyframes dfOn{to{opacity:1;color:var(--ink-2)}}
    .df-dot{position:relative;width:16px;height:16px;flex:none;display:grid;place-items:center}
    .df-dot i{position:absolute;width:8px;height:8px;border-radius:50%;
      border:1.5px solid var(--line-strong);animation:dfDot .5s var(--enter) forwards;
      animation-delay:inherit}
    .df-dot svg{width:13px;height:13px;color:var(--green);opacity:0;
      animation:dfTick .4s var(--enter) forwards;animation-delay:inherit}
    .df-list li:last-child .df-dot svg{animation:none}
    .df-list li:last-child .df-dot i{border-color:var(--accent);animation:dfSpin 1s linear infinite}
    @keyframes dfDot{to{opacity:0;transform:scale(.6)}}
    @keyframes dfTick{to{opacity:1}}
    @keyframes dfSpin{
      0%{transform:rotate(0);border-top-color:transparent}
      100%{transform:rotate(360deg);border-top-color:transparent}
    }

    /* a long value sits in its own box, read-only */
    .dv-kv-r.long{align-items:flex-start}
    .dv-long{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-md);
      background:var(--surface);padding:13px 15px;font-size:13px;line-height:1.68;
      color:var(--ink-2);max-height:250px;overflow-y:auto}
    .dv-long p{margin:0 0 11px}
    .dv-long p:last-child{margin-bottom:0}

    /* ═══ THE CLASSIFICATION CONVERSATION ═══ */
    .rv-conv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:14px;
      padding:15px 17px;border-radius:var(--r-md);cursor:pointer;
      border:1px solid #7a4fd633;background:linear-gradient(120deg,#7a4fd612,#e23d7d0a)}
    .rv-conv:hover{border-color:var(--accent)}
    .rv-conv-ic{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;
      color:#fff;background:linear-gradient(135deg,var(--orange),var(--magenta))}
    .rv-conv-ic svg{width:15px;height:15px}
    .rv-conv-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .rv-conv-t{font-size:13.5px;font-weight:650;color:var(--ink)}
    .rv-conv-s{font-size:12.5px;color:var(--ink-3);line-height:1.5}
    .rv-conv-go{flex:none;display:inline-flex;align-items:center;gap:5px;font:650 12.5px var(--font-sans);
      color:var(--accent)}
    .rv-conv-go svg{width:12px;height:12px}

    /* a call the agent brings for confirmation */
    .rvc{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      overflow:hidden}
    .rvc-h{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--surface);
      border-bottom:1px solid var(--line);font:650 13px var(--font-sans);color:var(--ink)}
    .rvc-n{font:700 9.5px var(--font-mono,monospace);letter-spacing:.04em;padding:3px 8px;
      border-radius:5px;background:var(--accent-soft);color:var(--accent)}
    .rvc-d{margin-left:auto;font:500 11.5px var(--font-sans);color:var(--ink-3)}
    .rvc-b{padding:13px 15px;display:flex;flex-direction:column;gap:10px}
    .rvc-r{display:flex;gap:14px;font-size:12.5px;line-height:1.55}
    .rvc-r>span{flex:none;width:88px;color:var(--ink-3)}
    .rvc-r>b{flex:1;min-width:0;font-weight:500;color:var(--ink-2)}
    .rvc-tag{font-weight:700!important;color:var(--accent)!important}
    .rvc-a{display:flex;align-items:center;gap:9px;padding:0 15px 14px}
    .rvc-a .rn-btn{font-size:12.5px;padding:7px 15px}
    .rvc-done{display:inline-flex;align-items:center;gap:7px;font:650 12px var(--font-sans);
      color:var(--green)}
    .rvc-done svg{width:13px;height:13px}
    .rvc-note{font-size:12px;color:var(--ink-3)}

    /* ═══ THE REVIEW CONVERSATION ═══ */
    .rv-bar{display:flex;align-items:center;gap:12px;flex:none;padding:9px 18px;
      border-bottom:1px solid var(--line);background:var(--surface)}
    .rv-bar-id{font:650 12.5px var(--font-sans);color:var(--ink)}
    .rv-bar-link{font:500 11.5px var(--font-sans);color:var(--ink-3)}
    .rv-bar-link b{font-family:var(--font-mono,monospace);font-size:11px;font-weight:700;
      color:var(--accent);margin-left:5px}
    .rv-back{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r-pill);
      padding:5px 13px;font:600 11.5px var(--font-sans);color:var(--ink-2);cursor:pointer}
    .rv-back:hover{border-color:var(--ink-3);color:var(--ink)}
    .rv-thread{gap:16px}

    .rv-stage{display:flex;align-items:center;gap:10px;font:700 11px var(--font-sans);
      letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
    .rv-stage-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;
      background:linear-gradient(135deg,var(--orange),var(--magenta))}
    .rv-stage-ic svg{width:13px;height:13px}

    .rv-card{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--panel);
      padding:18px 20px}
    .rv-card-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650;
      color:var(--ink);margin-bottom:4px}
    .rv-count{margin-left:auto;font:700 11px var(--font-sans);padding:3px 10px;
      border-radius:var(--r-pill);background:var(--panel-3);color:var(--ink-3)}
    .rv-card-s{margin:0 0 14px;font-size:12.5px;color:var(--ink-3)}
    .rv-card-b{display:flex;flex-direction:column;gap:20px;margin-top:14px}
    .rv-cls-h{display:flex;align-items:center;gap:11px;margin-bottom:9px}
    .rv-cls-n{font:700 9.5px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;
      padding:4px 9px;border-radius:6px;background:var(--panel-3);color:var(--ink-3)}
    .rv-cls-h b{font-size:14px;font-weight:650;color:var(--ink)}
    .rv-cls-c{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
    .rv-tags{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .rv-tag{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
      border-top:1px solid var(--line)}
    .rv-tag:first-child{border-top:0}
    .rv-tag-n{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
      font:700 10.5px var(--font-sans);background:var(--panel-3);color:var(--ink-3)}
    .rv-tag-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
    .rv-tag-b b{font-size:13.5px;font-weight:650;color:var(--ink)}
    .rv-tag-b em{font-style:normal;font-size:12.5px;line-height:1.55;color:var(--ink-3)}
    .rv-x{width:22px;height:22px;flex:none;border:0;background:none;color:var(--ink-3);
      cursor:pointer;border-radius:50%;display:grid;place-items:center}
    .rv-x svg{width:11px;height:11px}
    .rv-x:hover{background:var(--hover);color:var(--magenta)}
    .rv-add{margin-top:10px;border:1px solid var(--line-strong);background:var(--panel);
      border-radius:var(--r-pill);padding:7px 15px;font:600 12.5px var(--font-sans);
      color:var(--ink-2);cursor:pointer}
    .rv-add:hover{border-color:var(--accent);color:var(--accent)}

    .rv-tbl{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .rv-tr{display:grid;grid-template-columns:150px 70px 120px minmax(0,1fr) 26px;gap:12px;
      align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px}
    .rv-tr:first-child{border-top:0}
    .rv-tr.head{background:var(--surface);font:700 10px var(--font-sans);letter-spacing:.07em;
      text-transform:uppercase;color:var(--ink-3)}
    .rv-tr-n{font-weight:650;color:var(--ink)}
    .rv-tr .dim{color:var(--ink-3)}
    .rv-pii{font-style:normal;font:700 10px var(--font-sans);padding:3px 8px;border-radius:5px;
      background:var(--pb-orange-soft);color:var(--pb-orange)}

    .rv-run{display:flex;align-items:center;gap:11px;padding:14px 18px;border-radius:var(--r-xl);
      border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink-2)}
    .rv-num{width:74px;padding:7px 11px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
      font:600 13px var(--font-sans);color:var(--ink);background:var(--panel)}

    /* the sample result */
    .rv-res{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--panel);
      overflow:hidden}
    .rv-res-top{display:grid;grid-template-columns:repeat(3,1fr)}
    .rv-res-top>div{padding:16px 18px;border-left:1px solid var(--line);
      border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
