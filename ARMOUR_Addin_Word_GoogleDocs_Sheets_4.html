    /* the record's own name is the anchor of its row */
    .list-table tbody .list-row-name{color:var(--ink);font-weight:700;font-size:13.5px}
    .list-table tbody tr:hover{background:var(--hover)}

    /* the card's summary line is a heading for the whole list, so it
       shouldn't compete with the column labels directly under it */

    /* Matter tab lists now use the same .list-card / .list-table-wrap /
       .list-pagination components as the global app lists, so header,
       rows and pager are identical everywhere. The wrapper only
       supplies the tab's padding. */
    .mv-list{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 24px 14px;overflow:hidden}
    .mv-list > .list-card{flex:1;min-height:0;display:flex;flex-direction:column}

    /* ═══════════════════════════════════════════════════════════
       PLAYBOOK ORCHESTRATION — the command-center run thread and the
       subpoena working page. The thread narrates; every decision and
       every editable field lives in the record, never in chat.
    ═══════════════════════════════════════════════════════════ */

    .pbx-thread{display:none;flex:1;min-height:0;flex-direction:column;width:100%}
    .wscol.pbx-running > .chat-landing{display:none}
    .wscol.pbx-running > .pbx-thread{display:flex}

    /* no header bar — the rail is the run's chrome, and the thread gets
       the rest. One less row of furniture across the top. */
    .pbx-body{display:flex;flex:1;min-height:0;padding-top:36px}
    @keyframes pbxPulse{0%,100%{opacity:1}50%{opacity:.42}}


    /* ── PLAN RAIL — vertical, because a branching plan grows downward
       and a horizontal bar can only ever lie about it. Collapses to a
       spine of dots, which still carries state and still gets you back. */
    .pbx-vrail{
      flex:none;width:216px;border-right:1px solid var(--line);background:var(--surface);
      display:flex;flex-direction:column;min-height:0;overflow:hidden;
      transition:width .22s var(--enter);
    }
    .pbx-vrail.collapsed{width:52px}
    /* nothing to plan against until the playbook is actually running */
    .pbx-thread:not(.run-started) .pbx-vrail{width:0;border-right-color:transparent}

    .pbx-vrail-head{
      flex:none;display:flex;align-items:flex-start;gap:8px;padding:12px 12px 10px;
      border-bottom:1px solid var(--line);margin-bottom:6px;
    }
    .pbx-vrail-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .pbx-vrail.collapsed .pbx-vrail-titles{display:none}
    .pbx-vrail-name{
      font:700 12.5px var(--font-sans);color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .pbx-vrail-state{font:600 11px var(--font-sans);color:var(--ink-2);line-height:1.35}

    .pbx-vrail-foot{flex:none;padding:8px 12px 12px}
    .pbx-vrail-end{
      display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;border-radius:8px;
      color:var(--ink-3);font:700 11.5px var(--font-sans);transition:background .14s,color .14s;
    }
    .pbx-vrail-end:hover{background:var(--hover);color:var(--ink)}
    .pbx-vrail-end svg{width:11px;height:11px;flex:none}
    .pbx-vrail.collapsed .pbx-vrail-end{justify-content:center;padding:7px 0}
    .pbx-vrail.collapsed .pbx-vrail-end span{display:none}
    .pbx-vrail.collapsed .pbx-vrail-head{justify-content:center;padding:12px 0 10px}
    .pbx-vrail-collapse{
      width:22px;height:22px;flex:none;border-radius:6px;color:var(--ink-3);
      display:grid;place-items:center;transition:background .14s,color .14s;
    }
    .pbx-vrail-collapse:hover{background:var(--hover);color:var(--ink)}
    .pbx-vrail-collapse svg{width:10px;height:10px;transition:transform .2s}
    .pbx-vrail.collapsed .pbx-vrail-collapse{margin:0 auto}
    .pbx-vrail.collapsed .pbx-vrail-collapse svg{transform:rotate(180deg)}

    .pbx-plan-panel{flex:1;min-height:0;overflow-y:auto;padding:2px 12px 14px;scrollbar-width:none}
    .pbx-plan-panel::-webkit-scrollbar{width:0}
    .pbx-vrail.collapsed .pbx-plan-panel{padding:2px 0 14px}
    .pbx-plan-list{display:flex;flex-direction:column}
    .pbx-plan-step{display:flex;gap:10px;padding:7px 0}
    .pbx-vrail.collapsed .pbx-plan-step{justify-content:center;padding:6px 0}
    .pbx-vrail.collapsed .pbx-plan-main{display:none}
    .pbx-vrail.collapsed .pbx-plan-info{display:none}
    .pbx-vrail.collapsed .pbx-plan-rail{width:100%}
    .pbx-plan-rail{position:relative;flex:none;width:22px;display:flex;justify-content:center}
    .pbx-plan-step:not(:last-child) .pbx-plan-rail::after{
      content:'';position:absolute;top:22px;bottom:-14px;left:50%;width:1.5px;
      background:var(--line-strong);transform:translateX(-50%);
    }
    .pbx-plan-dot{
      width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-3);z-index:1;
      font:700 10px var(--font-sans);border:1.5px solid var(--panel-3);
    }
    .pbx-plan-dot svg{width:11px;height:11px}
    .pbx-plan-dot .pbx-spin{width:10px;height:10px}
    .pbx-plan-step.done .pbx-plan-dot{background:var(--green-soft);border-color:var(--green-soft);color:var(--green)}
    .pbx-plan-step.live .pbx-plan-dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .pbx-plan-step.gate .pbx-plan-dot{background:var(--pb-orange-soft);border-color:var(--pb-orange);color:var(--pb-orange)}
    .pbx-plan-step.skipped .pbx-plan-dot{background:none;border-style:dashed;border-color:var(--line-strong);color:var(--ink-3)}
    /* one line per step: what it is, where it stands, and a way in */
    .pbx-plan-main{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-top:2px}
    .pbx-plan-title{
      min-width:0;font:600 12px var(--font-sans);color:var(--ink);line-height:1.35;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }

    /* the pip a queued step gets instead of a number */
    .pbx-plan-pip{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.5;flex:none}

    /* the why, behind an icon that only appears on hover */
    .pbx-plan-info{
      position:relative;flex:none;width:16px;height:16px;display:grid;place-items:center;
      color:var(--ink-3);opacity:0;transition:opacity .14s,color .14s;cursor:help;outline:none;
    }
    .pbx-plan-step:hover .pbx-plan-info,
    .pbx-plan-info:focus-visible{opacity:1}
    .pbx-plan-info:hover{color:var(--accent);opacity:1}
    .pbx-plan-info > svg{width:12px;height:12px;flex:none}
    /* The rail scrolls and clips, so the card can't live inside it.
       It's a single element parked on the thread and positioned to the
       icon on hover — no clipping, no stacking-context surprises. */
    .pbx-pop{
      display:none;position:fixed;width:246px;padding:11px 12px;border-radius:11px;z-index:200;
      background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-hover);
      text-align:left;white-space:normal;cursor:default;pointer-events:none;
    }
    .pbx-pop.open{display:block}
    .pbx-pop-t{
      display:block;font:700 10px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:6px;
    }
    .pbx-pop-cond{display:flex;align-items:flex-start;gap:6px;font:600 11.5px var(--font-sans);color:var(--t-play);line-height:1.45}
    .pbx-pop-cond svg{width:11px;height:11px;flex:none;margin-top:1px}
    .pbx-pop-why{display:block;margin-top:7px;font:500 11.5px var(--font-sans);color:var(--ink-2);line-height:1.55}

    /* nothing inside the rail may size its own icons — an unconstrained
       inline SVG will happily fill the whole panel */
    .pbx-vrail svg{max-width:100%;max-height:100%}
    .pbx-plan-step.queued .pbx-plan-title,
    .pbx-plan-step.skipped .pbx-plan-title{color:var(--ink-3)}
    .pbx-plan-step.skipped .pbx-plan-title{text-decoration:line-through;text-decoration-color:var(--line-strong)}
    .pbx-plan-state{
      flex:none;margin-left:auto;font:700 9px var(--font-sans);letter-spacing:.04em;
      text-transform:uppercase;color:var(--ink-3);background:var(--panel-3);padding:2px 7px;border-radius:99px;
    }
    .pbx-plan-step.done .pbx-plan-state{color:var(--green);background:var(--green-soft)}
    .pbx-plan-step.live .pbx-plan-state{color:var(--accent);background:var(--accent-soft)}
    .pbx-plan-step.gate .pbx-plan-state{color:var(--pb-orange);background:var(--pb-orange-soft)}
    .pbx-plan-step.gate .pbx-plan-dot{color:var(--pb-orange)}

    .pbx-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 20px 8px}

    /* ── FLOW MAP — sits over the thread, not beside it, because it
       wants the width and you only look at it deliberately ── */
    .pbx-map{
      display:none;position:absolute;inset:0;z-index:30;
      background:var(--panel);flex-direction:column;
    }
    .pbx-map.open{display:flex}
    .pbx-body{position:relative}
    .pbx-map-head{
      flex:none;display:flex;align-items:center;gap:14px;padding:12px 16px;
      border-bottom:1px solid var(--line);
    }
    .pbx-map-title{font:700 13px var(--font-sans);color:var(--ink)}
    .pbx-map-legend{display:flex;gap:12px;flex-wrap:wrap}
    .pbx-map-key{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font-sans);color:var(--ink-3)}
    .pbx-map-key i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line-strong);flex:none}
    .pbx-map-key i.k-done{background:var(--green-soft);border-color:var(--green)}
    .pbx-map-key i.k-gate{background:var(--pb-orange-soft);border-color:var(--pb-orange)}
    .pbx-map-key i.k-queued{background:var(--panel);border-color:var(--line-strong)}
    .pbx-map-key i.k-skip{background:none;border-style:dashed}
    .pbx-map-sp{flex:1}
    .pbx-map-x{width:26px;height:26px;border-radius:8px;color:var(--ink-3);display:grid;place-items:center;flex:none}
    .pbx-map-x:hover{background:var(--hover);color:var(--ink)}
    .pbx-map-x svg{width:12px;height:12px}
    .pbx-map-body{
      flex:1;min-height:0;overflow:hidden;padding:16px;
      display:flex;align-items:center;justify-content:center;
    }
    /* height-first, so the whole diagram is always on screen */
    .pbx-map-svg{height:100%;width:auto;max-width:100%;max-height:100%}
    .pbx-map-svg text{font-family:var(--font-sans)}

    .pbx-vrail-map{
      width:22px;height:22px;flex:none;border-radius:6px;color:var(--ink-3);
      display:grid;place-items:center;transition:background .14s,color .14s;
    }
    .pbx-vrail-map:hover{background:var(--hover);color:var(--accent)}
    .pbx-vrail-map svg{width:13px;height:13px}
    .pbx-vrail.collapsed .pbx-vrail-map{display:none}
    .pbx-in{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:15px}

    .pbx-user{
      align-self:flex-end;max-width:86%;background:var(--accent);color:#fff;
      border-radius:16px 16px 5px 16px;padding:10px 14px;
      font:500 12px var(--font-sans);line-height:1.5;
    }
    .pbx-user .pbx-user-file{
      display:flex;align-items:center;gap:7px;margin-bottom:7px;padding:6px 9px;
      background:#ffffff2e;border-radius:9px;font-size:12.5px;font-weight:600;
    }
    .pbx-user .pbx-user-file svg{width:13px;height:13px}

    .pbx-agent{display:flex;gap:10px;align-items:flex-start}
    .pbx-av{
      width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);margin-top:1px;
    }
    .pbx-av svg{width:14px;height:14px}
    .pbx-agent-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
    .pbx-say{font:500 12px var(--font-sans);color:var(--ink);line-height:1.65}
    .pbx-say b{font-weight:600}

    .pbx-think{display:flex;align-items:center;gap:8px;font:500 13.5px var(--font-sans);color:var(--ink-2)}
    .pbx-spin{
      width:12px;height:12px;flex:none;border-radius:50%;
      border:1.8px solid var(--accent-soft);border-top-color:var(--accent);
      animation:pbxSpin .7s linear infinite;
    }
    @keyframes pbxSpin{to{transform:rotate(360deg)}}

    .pbx-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden;box-shadow:var(--shadow-card)}
    .pbx-card-top{
      display:flex;align-items:center;gap:11px;padding:13px 14px;
      border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s;
    }
    .pbx-card-top:hover{background:var(--hover)}
    .pbx-card.collapsed .pbx-card-top{border-bottom-color:transparent}
    .pbx-card.collapsed .pbx-card-body{display:none}
    .pbx-card.collapsed .pbx-step-chev{transform:rotate(-90deg)}
    .pbx-card-ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--t-play-soft);color:var(--t-play)}
    .pbx-card-ic svg{width:15px;height:15px}
    .pbx-card-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .pbx-card-name{display:block;font:600 12px var(--font-sans);color:var(--ink)}
    .pbx-card-sub{display:block;font:500 12.5px var(--font-sans);color:var(--ink-3)}
    .pbx-card-conf{margin-left:auto;flex:none;font:700 11px var(--font-sans);color:var(--green);background:var(--green-soft);padding:4px 9px;border-radius:99px;white-space:nowrap}
    .pbx-card-body{padding:13px 14px}
    .pbx-card-desc{font:500 13.5px var(--font-sans);color:var(--ink-2);line-height:1.6;margin-bottom:13px}

    .pbx-plan{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
    .pbx-plan-row{display:flex;align-items:flex-start;gap:9px}
    .pbx-plan-n{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--t-play);margin-top:2px}
    .pbx-plan-n svg{width:12px;height:12px}
    .pbx-plan-n .pbx-plan-pip{background:var(--ink-3)}
    .pbx-plan-t{font:600 13px var(--font-sans);color:var(--ink-2);line-height:1.45}
    .pbx-plan-t em{font-style:normal;color:var(--pb-orange);font-weight:600}
    .pbx-plan-t i{font-style:normal;color:var(--t-play);font-weight:600}

    .pbx-btn-row{display:flex;gap:8px;flex-wrap:wrap}
    .pbx-btn{padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font:600 12.5px var(--font-sans);transition:filter .15s}
    .pbx-btn:hover{filter:brightness(1.08)}
    .pbx-btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink-2)}
    .pbx-btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
    .pbx-btn.ok{background:var(--green)}
    .pbx-btn:disabled{opacity:.45;cursor:default;filter:none}

    .pbx-step{
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      overflow:hidden;transition:opacity .18s,box-shadow .18s,border-color .18s;
    }
    /* waiting on you: ringed, tinted and full strength */
    .pbx-step.gate{
      border-color:#e0902f5c;
      box-shadow:0 0 0 3px var(--pb-orange-soft),var(--shadow-card);
    }
    .pbx-step.gate .pbx-step-head{background:var(--pb-orange-soft)}
    /* done steps keep full strength — they're the record of the run */
    .pbx-step-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;transition:background .14s}
    .pbx-step-head:hover{background:var(--hover)}
    .pbx-step-chev{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--ink-3);transition:transform .2s}
    .pbx-step-chev svg{width:11px;height:11px}
    .pbx-step.collapsed .pbx-step-chev{transform:rotate(-90deg)}
    .pbx-step.collapsed .pbx-step-body{display:none}
    .pbx-step.collapsed .pbx-step-head{border-radius:var(--r-lg)}
    /* the record just sent you here — say so for a moment */
    .pbx-step.pbx-flash{box-shadow:0 0 0 2px var(--accent),var(--shadow-hover)}
    .pbx-step-mark{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 10.5px var(--font-sans)}
    .pbx-step-mark svg{width:12px;height:12px}
    .pbx-step.done .pbx-step-mark{background:var(--green-soft);color:var(--green)}
    .pbx-step.gate .pbx-step-mark{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .pbx-step-title{font:600 13.5px var(--font-sans);color:var(--ink)}
    .pbx-step-state{margin-left:auto;font:700 11px var(--font-sans);color:var(--ink-3);background:var(--panel-3);padding:3px 9px;border-radius:99px;white-space:nowrap}
    .pbx-step.done .pbx-step-state{color:var(--green);background:var(--green-soft)}
    .pbx-step.gate .pbx-step-state{color:var(--pb-orange);background:var(--pb-orange-soft)}
    .pbx-step-body{padding:0 13px 13px;display:flex;flex-direction:column;gap:11px}

    .pbx-reason-toggle{display:flex;align-items:center;gap:6px;font:700 11.5px var(--font-sans);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
    .pbx-reason-toggle:hover{color:var(--ink-2)}
    .pbx-reason-toggle svg{width:11px;height:11px;transition:transform .18s}
    .pbx-reason-toggle.open svg{transform:rotate(180deg)}
    .pbx-reason{display:none;border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-left:2px}
    .pbx-reason.open{display:flex;flex-direction:column;gap:7px}
    .pbx-rline{display:flex;gap:8px;align-items:flex-start;font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.55}
    .pbx-rline i{width:5px;height:5px;flex:none;border-radius:50%;background:var(--accent);margin-top:7px}
    .pbx-rline.warn i{background:var(--pb-orange)}
    .pbx-rline code{font-family:var(--font-mono);font-size:11.5px;background:var(--panel-3);padding:1px 5px;border-radius:5px;color:var(--ink)}

    .pbx-out{
      display:flex;align-items:center;gap:11px;width:100%;text-align:left;
      border:1px solid var(--line);border-radius:12px;background:var(--surface);
      padding:11px 12px;transition:border-color .15s,background .15s,box-shadow .15s;
    }
    .pbx-out:hover{border-color:var(--accent);background:var(--panel);box-shadow:var(--shadow-card)}
    .pbx-out-ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
    .pbx-out-ic svg{width:15px;height:15px}
    .pbx-out-body{flex:1;min-width:0}
    .pbx-out-title{display:block;font:600 13px var(--font-sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pbx-out-sub{display:block;font:500 12px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .pbx-out-go{flex:none;color:var(--ink-3)}
    .pbx-out-go svg{width:13px;height:13px}

    /* what the step actually did, in a sentence or two, before the
       reasoning and the link into the thing it produced */
    .pbx-summary{
      font:500 13.5px var(--font-sans);color:var(--ink-2);line-height:1.65;
    }
    .pbx-summary b{color:var(--ink);font-weight:600}
    .pbx-step-body > .pbx-summary{padding-top:2px}
    .pbx-agent-body > .pbx-summary + .pbx-out{margin-top:2px}
    .pbx-done-banner{
      display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:12px;
      background:var(--green-soft);border:1px solid #2fb07938;
      font:600 13px var(--font-sans);color:var(--green);
    }
    .pbx-done-banner > svg{width:15px;height:15px;flex:none}

    /* a step that didn't run — dimmer than a real step, but never absent */
    .pbx-skip{
      display:flex;align-items:flex-start;gap:11px;padding:10px 13px;
      border:1px dashed var(--line);border-radius:var(--r-lg);background:none;
      opacity:.5;transition:opacity .18s;
    }
    /* it stays on the record, it just doesn't ask for anything */
    .pbx-skip:hover{opacity:1}
    .pbx-skip-ic{
      width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
      border:1.5px dashed var(--line-strong);color:var(--ink-3);
    }
    .pbx-skip-ic svg{width:11px;height:11px}
    .pbx-skip-body{flex:1;min-width:0}
    .pbx-skip-title{
      display:block;font:600 13px var(--font-sans);color:var(--ink-3);
    }
    .pbx-skip-why{display:block;margin-top:3px;font:500 12px var(--font-sans);color:var(--ink-3);line-height:1.5}
    .pbx-skip-cond{display:flex;align-items:center;gap:5px;margin-top:5px;font:600 11px var(--font-sans);color:var(--ink-3)}
    .pbx-skip-cond svg{width:11px;height:11px;flex:none}
    .pbx-skip-tag{
      flex:none;font:700 10px var(--font-sans);letter-spacing:.03em;
      color:var(--ink-3);background:var(--panel-3);padding:3px 8px;border-radius:99px;white-space:nowrap;
    }

    .pbx-dock{flex:none;padding:8px 20px 16px}
    .pbx-dock-in{max-width:700px;margin:0 auto}
    .pbx-dock-box{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:11px 14px 9px;box-shadow:var(--shadow-card)}
    .pbx-dock-box textarea{resize:none;width:100%;border:none;outline:none;background:none;color:var(--ink);font-size:12px;line-height:1.5;min-height:22px;max-height:110px}
    .pbx-dock-box textarea::placeholder{color:var(--ink-3)}
    .pbx-dock-row{display:flex;align-items:center;gap:8px;margin-top:7px}
    .pbx-dock-row .spacer{flex:1}
    .pbx-disclaim{text-align:center;font:500 11px var(--font-sans);color:var(--ink-3);margin-top:7px}

    .pbx-attach-chip{
      display:none;align-items:center;gap:8px;margin:0 0 10px;padding:8px 11px;
      border:1px solid var(--line);border-radius:11px;background:var(--surface);
      font:600 12.5px var(--font-sans);color:var(--ink);
    }
    .pbx-attach-chip.on{display:flex}
    .pbx-attach-chip > svg{width:14px;height:14px;flex:none;color:var(--accent)}
    .pbx-attach-x{margin-left:auto;color:var(--ink-3);width:18px;height:18px;border-radius:6px;display:grid;place-items:center}
    .pbx-attach-x:hover{background:var(--hover);color:var(--ink)}
    .pbx-attach-x svg{width:9px;height:9px;color:currentColor}

    .pbx-prompt-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;justify-content:center}
    .pbx-prompt{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font:600 12.5px var(--font-sans);color:var(--ink-2);transition:border-color .15s,color .15s}
    .pbx-prompt:hover{border-color:var(--accent);color:var(--accent)}

    /* ═══════════════════════════════════════════════════════════
       SUBPOENA WORKING PAGE
       One page, two steps. Triage is a form plus an authenticity
       verdict; Scoping is the custodian/source grid, NCDS, and where
       this request is going to live. Confirm sits at the top of each
       step, because that's where the person's eye starts.
    ═══════════════════════════════════════════════════════════ */
    .sd{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--panel)}
    .sd-idbar{flex:none;display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
    .sd-back{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);background:var(--panel-3)}
    .sd-back:hover{background:var(--hover);color:var(--ink)}
    .sd-back svg{width:14px;height:14px}
    .sd-title{font:700 12px var(--font-sans);color:var(--ink)}
    .sd-id{font:700 11.5px var(--font-sans);color:var(--ink-3);background:var(--panel-3);padding:3px 8px;border-radius:6px}
    .sd-standing{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--font-sans);padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
    .sd-standing i{width:6px;height:6px;border-radius:50%;background:currentColor}
    .sd-standing.ok{background:var(--green-soft);color:var(--green)}
    .sd-standing.warn{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sd-idbar-sp{flex:1}

    /* the hero, built on the hold detail's own shape: the record names
       itself, one number carries the state, a track sits under it, and
       the actionable split stands to the right */
    /* matches the hold hero's own metrics — the record needs air above
       it, or the title collides with the matter's tab row */
    .sd-hero{
      flex:none;display:flex;align-items:center;gap:34px;flex-wrap:wrap;
      padding:22px 26px 20px;border-bottom:1px solid var(--line);background:var(--surface);
    }
    .sd-hero-main{flex:1;min-width:280px}
    .sd-hero-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;min-width:0}
    /* an icon that grows into a labelled pill on hover, like the hold's */
    .sd-hero-back{
      flex:none;display:inline-flex;align-items:center;
      width:26px;height:26px;padding:0;overflow:hidden;white-space:nowrap;
      border-radius:8px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);
      transition:width .2s var(--enter),border-color .15s,background .15s,color .15s;
    }
    .sd-hero-back svg{width:14px;height:14px;flex:none;margin:0 5px}
    .sd-hero-back-label{
      flex:none;font:600 12px var(--font-sans);opacity:0;padding-right:11px;
      transition:opacity .16s var(--std);
    }
    .sd-hero-back:hover,
    .sd-hero-back:focus-visible{
      width:auto;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);
    }
    .sd-hero-back:hover .sd-hero-back-label,
    .sd-hero-back:focus-visible .sd-hero-back-label{opacity:1}
    .sd-hero-title{
      margin:0;min-width:0;flex:1;
      font:600 20px 'Fraunces',serif;letter-spacing:-.015em;color:var(--ink);line-height:1.2;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sd-hero .sd-id{flex:none;white-space:nowrap}
    .sd-hero-label{font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
    .sd-hero-figure{display:flex;align-items:baseline;gap:10px;margin-top:3px}
    .sd-hero-pct{font:600 34px 'Fraunces',serif;color:var(--ink);letter-spacing:-.02em;line-height:1}
    .sd-hero-of{font:500 12px var(--font-sans);color:var(--ink-2)}
    .sd-hero-track{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:10px;max-width:520px}
    .sd-hero-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--magenta))}
    .sd-hero-note{font:500 12px var(--font-sans);color:var(--ink-2);margin-top:8px}
    .sd-hero-note strong{color:var(--magenta);font-weight:600}
    .sd-triage{display:flex;gap:8px}
    .sd-triage{flex:none}
    .sd-triage-item{min-width:96px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:left;transition:border-color .15s}
    .sd-triage-item:hover{border-color:var(--accent)}
    .sd-triage-num{font:700 18px var(--font-sans);color:var(--ink)}
    .sd-triage-item.warn .sd-triage-num{color:var(--pb-orange)}
    .sd-triage-item.ok .sd-triage-num{color:var(--green)}
    .sd-triage-lab{font:600 11px var(--font-sans);color:var(--ink-3);margin-top:2px}

    .sd-body{flex:1;min-height:0;display:flex;overflow:hidden}
    .sd-jump{flex:none;width:186px;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
    .sd-jump-label{
      font:700 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);padding:0 8px 10px;
    }

    /* A step is a heading; its sections are children of it. The step
       gets the weight, the colour and a rule above; the sections sit
       indented off a hairline that reads as the step's own spine. */
    .sd-jump-group{
      display:flex;align-items:center;gap:7px;padding:14px 8px 6px;margin-top:4px;
      border-top:1px solid var(--line);
      font:700 12px var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink);
    }
    .sd-jump-group:first-of-type{border-top:none;margin-top:0;padding-top:2px}
    .sd-jump-group i{width:6px;height:6px;border-radius:50%;background:var(--pb-orange);flex:none}
    .sd-jump-group.done i{background:var(--green)}
    .sd-jump-group.idle i{background:var(--line-strong)}
    .sd-jump-group.idle{color:var(--ink-3)}

    .sd-jump-item{
      position:relative;display:flex;align-items:center;gap:7px;
      margin-left:11px;padding:6px 9px 6px 12px;border-radius:0 8px 8px 0;
      font:500 12px var(--font-sans);color:var(--ink-2);text-align:left;width:calc(100% - 11px);
    }
    /* the spine the children hang off */
    .sd-jump-item::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--line);
    }
    .sd-jump-item:hover{background:var(--hover);color:var(--ink)}
    .sd-jump-item:hover::before{background:var(--line-strong)}
    .sd-jump-item.current{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .sd-jump-item.current::before{background:var(--accent)}
    .sd-jump-item.idle{color:var(--ink-3)}
    .sd-jump-count{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-3)}
    .sd-jump-item.current .sd-jump-count{color:var(--accent)}

    /* The page itself doesn't scroll. Each step owns its own scroll, so a
       wheel inside Details can reach Authenticity but can never spill over
       into Scope — crossing a step is a click, always. */
    .sd-scroll{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:0 20px}

    /* ── a step block ─────────────────────────────────────── */
    .sd-step{
      border:1px solid var(--line);border-radius:var(--r-lg);margin:14px 0 0;
      background:var(--panel);display:flex;flex-direction:column;min-height:0;
    }
    .sd-step:last-child{margin-bottom:14px}
    .sd-step.open{flex:1;min-height:0}
    /* the bar is a header now, not a toggle — the left rail moves
       between steps, so nothing here opens or closes */
    .sd-step-bar{
      flex:none;display:flex;align-items:center;gap:11px;
      padding:12px 15px;background:var(--panel);border-bottom:1px solid var(--line);
      border-radius:var(--r-lg) var(--r-lg) 0 0;
    }
    .sd-step-bar button{cursor:pointer}
    /* the section heading carries the name and nothing else — the step
       numbering lived in the chat thread and didn't need repeating here */
    .sd-step-name{font:700 15px var(--font-sans);color:var(--ink);letter-spacing:-.012em}
    .sd-step.idle .sd-step-name{color:var(--ink-3)}
    .sd-step-pill{
      font:700 10.5px var(--font-sans);padding:4px 9px;border-radius:99px;
      background:var(--pb-orange-soft);color:var(--pb-orange);white-space:nowrap;
    }
    .sd-step.done .sd-step-pill{background:var(--green-soft);color:var(--green)}
    .sd-step.idle .sd-step-pill{background:var(--panel-3);color:var(--ink-3)}
    .sd-step-sp{flex:1}
    /* the way back to the thread that produced this step */
    .sd-step-chat{
      display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;
      border:1px solid var(--line);color:var(--ink-2);background:var(--panel);
      font:700 11.5px var(--font-sans);white-space:nowrap;
    }
    .sd-step-chat:hover{border-color:var(--accent);color:var(--accent)}
    .sd-step-chat svg{width:12px;height:12px;flex:none}
    @media (max-width:1080px){ .sd-step-chat span{display:none} }
    .sd-step-body{flex:1;min-height:0;overflow-y:auto;padding:16px 15px 18px}
    .sd-step-locked{padding:26px 18px;text-align:center;font:500 13px var(--font-sans);color:var(--ink-3)}

    .sd-sub{margin-bottom:24px}
    .sd-sub:last-child{margin-bottom:0}
    .sd-sub-head{display:flex;align-items:center;gap:9px;margin-bottom:3px}
    .sd-sub-title{font:700 13.5px var(--font-sans);color:var(--ink)}
    .sd-sub-count{font:700 10.5px var(--font-sans);color:var(--ink-3);background:var(--panel-3);padding:3px 8px;border-radius:99px}
    .sd-sub-sp{flex:1}

    /* ── the details form ─────────────────────────────────── */
    .sdf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px 20px}
    .sdf{display:flex;flex-direction:column;gap:5px;min-width:0}
    .sdf.wide{grid-column:1 / -1}
    .sdf-lab{display:flex;align-items:center;gap:6px;font:600 11px var(--font-sans);color:var(--ink-3)}
    /* only ever rendered when the score is low enough to matter */
    .sdf-conf.low{font:700 10px var(--font-sans);padding:1px 6px;border-radius:99px;background:var(--pb-orange-soft);color:var(--pb-orange)}
    /* values read as text and only become a box under the cursor —
       still editable, just not shouting about it */
    .sdf input,.sdf textarea{
      width:100%;border:1px solid transparent;border-radius:8px;background:none;
      padding:5px 8px;margin-left:-8px;font:600 13px var(--font-sans);color:var(--ink);outline:none;
      transition:border-color .13s,background .13s,box-shadow .13s;
    }
    .sdf textarea{resize:vertical;min-height:44px;font-weight:500;line-height:1.55}
    .sdf input:hover,.sdf textarea:hover{border-color:var(--line);background:var(--field)}
    .sdf input:focus,.sdf textarea:focus{border-color:var(--accent);background:var(--field);box-shadow:0 0 0 3px var(--accent-soft)}
    .sdf.low input{background:#e0902f0a;border-color:#e0902f33}

    /* the source file, as a quiet strip rather than a card */
    .sdf-doc{
      flex-direction:row;align-items:center;gap:10px;padding:9px 11px;margin-bottom:4px;
      border:1px solid var(--line);border-radius:10px;background:var(--surface);
    }
    .sdf-doc > svg{width:15px;height:15px;flex:none;color:var(--accent)}
    .sdf-doc-body{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
    .sdf-doc-t{font:600 12.5px var(--font-sans);color:var(--ink)}
    .sdf-doc-s{font:500 11.5px var(--font-sans);color:var(--ink-3)}
    .sdf-doc-open{
      flex:none;padding:5px 11px;border-radius:7px;border:1px solid var(--line-strong);
      color:var(--ink-2);font:700 11.5px var(--font-sans);
    }
    .sdf-doc-open:hover{border-color:var(--accent);color:var(--accent)}

    /* the fold for supporting fields, and for the long reasoning */
    .sdf-more{
      display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 11px;
      border-radius:8px;color:var(--ink-2);font:600 12px var(--font-sans);
      border:1px solid var(--line);background:var(--panel);
    }
    .sdf-more:hover{border-color:var(--accent);color:var(--accent)}
    .sdf-more svg{width:11px;height:11px;transition:transform .18s}
    .sdf-more.open svg{transform:rotate(180deg)}

    /* ── authenticity: one line, a score, and the call ────── */
    .sd-authline{
      display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
      background:var(--green-soft);border:1px solid #2fb07938;
    }
    .sd-authline.warn{background:var(--pb-orange-soft);border-color:#e0902f3d}
    .sd-authline-ic{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--panel);color:var(--green)}
    .sd-authline.warn .sd-authline-ic{color:var(--pb-orange)}
    .sd-authline-ic svg{width:14px;height:14px}
    .sd-authline-t{flex:1;min-width:0;font:600 13px var(--font-sans);color:var(--ink)}
    .sd-authline-c{flex:none;font:700 12px var(--font-sans);color:var(--green)}
    .sd-authline.warn .sd-authline-c{color:var(--pb-orange)}
    .sd-authline-bar{flex:none;width:60px;height:5px;border-radius:99px;background:var(--panel);overflow:hidden}
    .sd-authline-bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
    .sd-authline.warn .sd-authline-bar i{background:var(--pb-orange)}
    .sd-authnote{display:none;margin-top:10px}
    .sd-authnote.open{display:block}
    .sd-authnote textarea{
      width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--field);
      padding:11px 12px;font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.65;
      outline:none;resize:vertical;
    }
    .sd-authnote textarea:focus{border-color:var(--accent);color:var(--ink)}

    /* ── the old inline confidence row ─────────────────────── */
    .sd-confrow{
      display:flex;align-items:center;gap:12px;margin-top:13px;padding:11px 13px;
      border:1px solid var(--line);border-radius:11px;background:var(--surface);
    }
    .sd-confrow-lab{
      font:700 9.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);flex:none;
    }
    .sd-confrow-bar{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
    .sd-confrow-bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
    .sd-confrow-n{font:700 15px var(--font-sans);color:var(--green);flex:none}

    /* the textarea carries a real paragraph, so it wants room */
    .sdf textarea[data-authnote]{min-height:150px;font-size:12.5px;line-height:1.65}

    /* ── list rows: recipients, targets, schedule, progress ──
       These were deleted with the old authenticity verdict block and
       then reused by the hold and collection sections, which is why an
       unsized icon blew the layout apart. */
    .sd-val{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .sd-val-row{display:flex;align-items:flex-start;gap:11px;background:var(--panel);padding:11px 13px}
    .sd-val-ic{
      width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--green-soft);color:var(--green);
    }
    .sd-val-ic svg{width:11px;height:11px}
    .sd-val-row.warn .sd-val-ic{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sd-val-body{flex:1;min-width:0}
    .sd-val-name{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .sd-val-note{display:block;font:500 12px var(--font-sans);color:var(--ink-2);margin-top:3px;line-height:1.5}
    .sd-val-tag{
      flex:none;font:600 10.5px var(--font-sans);padding:3px 8px;border-radius:99px;
      background:var(--green-soft);color:var(--green);white-space:nowrap;
    }
    .sd-val-row.warn .sd-val-tag{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sd-val-row.off .sd-val-tag{background:var(--panel-3);color:var(--ink-3)}

    /* ── the custodian / NCDS grids ───────────────────────── */
    .sdg-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto}
    .sdg{min-width:940px;display:flex;flex-direction:column}
    .sdg.ncds{min-width:880px}
    .sdg-row{
      display:grid;align-items:center;
      grid-template-columns:1.5fr 1.25fr 78px 78px 78px 2.1fr 34px;
      border-bottom:1px solid var(--line);
    }
    .sdg.ncds .sdg-row{grid-template-columns:1.5fr 1.25fr 1.5fr 2.1fr 34px}
    .sdg-row:last-child{border-bottom:none}
    .sdg-row.head{background:var(--panel-3);position:sticky;top:0;z-index:2}
    .sdg-row.head > span{
      font:700 9.5px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);padding:9px 10px;
    }
    .sdg-row.head .sdg-srch{text-align:center}
    .sdg-cell{padding:7px 8px;min-width:0}
    .sdg-cell input{
      width:100%;border:1px solid transparent;border-radius:7px;background:none;
      padding:6px 8px;font:600 12.5px var(--font-sans);color:var(--ink);outline:none;
    }
    .sdg-cell input:hover{border-color:var(--line)}
    .sdg-cell input:focus{border-color:var(--accent);background:var(--field);box-shadow:0 0 0 3px var(--accent-soft)}
    .sdg-cell input.mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
    .sdg-src{display:flex;align-items:center;justify-content:center;padding:7px 4px}
    .sdg-check{
      width:18px;height:18px;border-radius:6px;border:1.6px solid var(--line-strong);
      display:grid;place-items:center;color:transparent;background:var(--field);transition:all .14s;
    }
    .sdg-check svg{width:11px;height:11px}
    .sdg-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
    .sdg-reason{padding:8px 10px;min-width:0}
    .sdg-reason-t{font:500 11.5px var(--font-sans);color:var(--ink-2);line-height:1.45}
    .sdg-conf{
      display:inline-flex;align-items:center;gap:5px;margin-top:5px;
      font:700 9.5px var(--font-sans);padding:2px 7px;border-radius:99px;
      background:var(--green-soft);color:var(--green);
    }
    .sdg-conf.mid{background:var(--accent-soft);color:var(--accent)}
    .sdg-conf.low{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sdg-x{width:24px;height:24px;border-radius:7px;color:var(--ink-3);display:grid;place-items:center;margin:0 5px}
    .sdg-x:hover{background:var(--magenta-soft);color:var(--magenta)}
    .sdg-x svg{width:10px;height:10px}
    .sdg-foot{display:flex;align-items:center;gap:9px;margin-top:10px}
    .sdg-add{
      display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
      border:1px dashed var(--line-strong);color:var(--ink-2);
      font:600 12px var(--font-sans);
    }
    .sdg-add:hover{border-color:var(--accent);color:var(--accent)}
    .sdg-add svg{width:11px;height:11px}
    .sdg-tally{font:500 12px var(--font-sans);color:var(--ink-3);margin-left:auto}

    /* ── matter chooser ───────────────────────────────────── */
    .sd-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
    /* the authenticity pair is a two-word choice, so it stays compact */
    .sd-decision .sd-opts{grid-template-columns:max-content max-content;gap:8px;margin-bottom:0}
    .sd-decision .sd-opt{align-items:center;padding:8px 14px 8px 11px}
    .sd-opt{
      display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px 13px;
      border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:all .15s;
    }
    .sd-opt:hover{border-color:var(--line-strong)}
    .sd-opt.on{border-color:var(--accent);background:var(--accent-soft)}
    .sd-opt-radio{width:16px;height:16px;flex:none;border-radius:50%;border:1.8px solid var(--line-strong);margin-top:1px;display:grid;place-items:center}
    .sd-opt.on .sd-opt-radio{border-color:var(--accent)}
    .sd-opt.on .sd-opt-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent)}
    .sd-opt-t{font:600 13px var(--font-sans);color:var(--ink)}
    .sd-opt-s{font:500 11.5px var(--font-sans);color:var(--ink-2);margin-top:3px;line-height:1.45}
    .sd-pick{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .sd-pick-row{display:flex;align-items:center;gap:11px;background:var(--panel);padding:11px 13px;text-align:left;width:100%}
    .sd-pick-row:hover{background:var(--hover)}
    .sd-pick-row.on{background:var(--accent-soft)}
    .sd-pick-radio{width:15px;height:15px;flex:none;border-radius:50%;border:1.8px solid var(--line-strong);display:grid;place-items:center}
    .sd-pick-row.on .sd-pick-radio{border-color:var(--accent)}
    .sd-pick-row.on .sd-pick-radio::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .sd-pick-n{font:600 12.5px var(--font-sans);color:var(--ink)}
    .sd-pick-s{font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .sd-pick-side{margin-left:auto;font:600 11.5px var(--font-sans);color:var(--ink-3);white-space:nowrap}

    /* the authenticity call, set apart from the checks that informed it */
    .sd-decision{margin-top:14px}
    .sd-decision-lab{
      font:700 9.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:9px;
    }
    .sd-decision .sd-opts{margin-bottom:0}
    .sd-opt[disabled]{opacity:.62;cursor:default}
    .sd-opt[disabled]:hover{border-color:var(--line)}
    .sd-opt.on[disabled]{opacity:1}

    .sd-flag{
      display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border-radius:11px;
      background:var(--pb-orange-soft);border:1px solid #e0902f3d;margin-top:13px;
      font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.55;
    }
    .sd-flag > svg{width:14px;height:14px;flex:none;color:var(--pb-orange);margin-top:1px}
    .sd-flag b{color:var(--pb-orange);font-weight:600}

    /* the filing, sitting in the details form as a field of its own */
    .sd-docfield{
      display:flex;align-items:center;gap:11px;border:1px solid var(--line-strong);
      border-radius:9px;background:var(--surface);padding:10px 12px;
    }
    .sd-docfield > svg{width:16px;height:16px;flex:none;color:var(--accent)}
    .sd-docfield-body{flex:1;min-width:0}
    .sd-docfield-t{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .sd-docfield-s{display:block;font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}

    .sd-doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--panel)}
    .sd-doc > svg{width:15px;height:15px;color:var(--accent);flex:none}
    .sd-doc-t{font:600 13px var(--font-sans);color:var(--ink)}
    .sd-doc-s{font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}

    .sd-link-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 14px}
    .sd-link-card:hover{border-color:var(--accent)}
    .sd-link-ic{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
    .sd-link-ic svg{width:16px;height:16px}
    .sd-link-t{font:600 13.5px var(--font-sans);color:var(--ink)}
    .sd-link-s{font:500 12px var(--font-sans);color:var(--ink-3);margin-top:2px}

    .sd-tl{display:flex;flex-direction:column}
    .sd-tl-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
    .sd-tl-row:last-child{border-bottom:none}
    .sd-tl-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent);margin-top:6px}
    .sd-tl-who{font:600 12.5px var(--font-sans);color:var(--ink)}
    .sd-tl-when{font:500 11.5px var(--font-sans);color:var(--ink-3);margin-left:auto;white-space:nowrap}
    .sd-tl-text{font:500 12.5px var(--font-sans);color:var(--ink-2);margin-top:2px}
    .sd-tl-head{display:flex;align-items:center;gap:8px}
    .sd-tl-body{flex:1;min-width:0}

    .sd-plain-sec{margin:22px 0}
    .sd-plain-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
    .sd-plain-title{font:700 12px var(--font-sans);color:var(--ink)}
    .sd-plain-count{font:700 10.5px var(--font-sans);color:var(--ink-3);background:var(--panel-3);padding:3px 8px;border-radius:99px}
    .sd-plain-sub{font:500 12.5px var(--font-sans);color:var(--ink-2);margin-bottom:11px}

    .sd svg,.pbx-thread svg{max-width:100%}

    .mvreq-row{cursor:pointer}
    .mvreq-new{display:inline-flex;align-items:center;gap:5px;font:700 10px var(--font-sans);background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:99px;margin-left:8px}

    tr.pbx-fresh > td{background:var(--accent-soft) !important}

    @media (max-width:1180px){
      .sd-opts{grid-template-columns:1fr}
      .sd-hero{grid-template-columns:1fr}
    }

    /* ═══════════════════════════════════════════════════════════
       RUN SPLIT — while a playbook is running, the record and the
       thread are read together, so the row splits 40/60 instead of
       giving chat a fixed narrow column. Dragging the divider still
       overrides this, since the inline width wins.
    ═══════════════════════════════════════════════════════════ */
    .wsrow.wsrow-lib-table .wscol{flex:none;width:40%;max-width:none;min-width:320px}
    .armour-library-panel.open.table-level{width:60%;max-width:none}

    /* below laptop width 40% stops being a usable reading column, so
       the record takes a little more and chat holds a floor */
    @media (max-width:1180px){
      .wsrow.wsrow-lib-table .wscol{width:36%;min-width:300px}
      .armour-library-panel.open.table-level{width:64%}
    }

    /* the subpoena record while it is hosted inside a matter's Requests
       tab — it fills the panel rather than sitting in the list's padding */
    #subpoenaDetailSlot.sd-embedded{
      margin:0;padding:0;display:flex;flex:1;min-height:0;flex-direction:column;
    }
    #pane-matter-detail [data-mv-panel="requests"]{padding:0}
    #subpoenaDetailSlot.sd-embedded .sd-idbar{background:var(--surface)}

    /* ═══════════════════════════════════════════════════════════
       MATTER TAB ROW — breadcrumb, matter name and six tabs in one
       row inside a 60% pane. The row used to scroll as a whole, so
       overflow pushed the tabs out of reach behind the panel buttons
       and the last one sat under the close control. Now each part
       has a job: the route drops out first, the name truncates, and
       the tabs keep their own scroll so they're always reachable.
    ═══════════════════════════════════════════════════════════ */
    .mv-tabsbar{overflow:visible;flex-wrap:nowrap;padding-right:88px}

    /* the route is the first thing to go — it's an address, not content */
    .mv-tabsbar .mv-route{flex:0 1 auto;min-width:0;overflow:hidden}

    /* the name shrinks rather than shoving the tabs off the row */
    .mv-tabsbar-title{flex:0 1 auto;min-width:7ch;max-width:30ch}

    /* the tabs own the remaining width and scroll inside it */
    .mv-tabsbar .mv-tabs{
      flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;
      scrollbar-width:none;-ms-overflow-style:none;
      display:flex;align-items:center;flex-wrap:nowrap;
      scroll-padding-inline:24px;
    }
    .mv-tabsbar .mv-tabs::-webkit-scrollbar{width:0;height:0;display:none}
    .mv-tabsbar .mv-tab{flex:none;white-space:nowrap}
    /* a soft edge so a scrolled-off tab reads as "there's more" */
    .mv-tabsbar .mv-tabs{
      -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent 100%);
      mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent 100%);
    }

    /* on a narrower screen the route and the seam go entirely — the
       matter name and its tabs are what the row is actually for */
    @media (max-width:1500px){
      .mv-tabsbar .mv-route,
      .mv-tabsbar .mv-tabsbar-rule{display:none}
      .mv-tabsbar-title{max-width:22ch}
    }
    @media (max-width:1200px){
      .mv-tabsbar-title{max-width:16ch}
    }

    /* ═══════════════════════════════════════════════════════════
       AUXILIARY NODES — receipts, not work. No state to wait on, no
       form behind them; they record that something happened and give
       you the way back to it. Deliberately lighter than a step card.
    ═══════════════════════════════════════════════════════════ */
    .pbx-aux{
      display:flex;align-items:center;gap:11px;width:100%;text-align:left;
      padding:10px 13px;border-radius:var(--r-lg);
      border:1px solid #2fb07933;background:var(--green-soft);
      transition:border-color .15s,box-shadow .15s;
    }
    .pbx-aux:hover{border-color:var(--green);box-shadow:var(--shadow-card)}
    .pbx-aux-ic{
      width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--panel);color:var(--green);
    }
    .pbx-aux-ic svg{width:13px;height:13px}
    .pbx-aux-body{flex:1;min-width:0}
    .pbx-aux-t{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .pbx-aux-s{display:block;font:500 11.5px var(--font-sans);color:var(--ink-2);margin-top:2px}

    /* ── chips for keywords, source types, file types ── */
    .sd-sub-lab{
      font:600 11px var(--font-sans);color:var(--ink-3);margin:14px 0 7px;
    }
    .sd-chips{display:flex;flex-wrap:wrap;gap:6px}
    .sd-chip{
      display:inline-flex;align-items:center;gap:5px;padding:5px 6px 5px 10px;
      border:1px solid var(--line);border-radius:99px;background:var(--panel);
      font:500 12px var(--font-sans);color:var(--ink);
    }
    .sd-chip-x{
      width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
      color:var(--ink-3);
    }
    .sd-chip-x:hover{background:var(--magenta-soft);color:var(--magenta)}
    .sd-chip-x svg{width:8px;height:8px}

    /* ── the notice body wants room to be read ── */
    .sd-notice{
      width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--field);
      padding:12px 13px;font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.7;
      outline:none;resize:vertical;
    }
    .sd-notice:focus{border-color:var(--accent);color:var(--ink)}

    /* ── on/off switches for the email schedule ── */
    .sd-toggle{
      width:32px;height:18px;flex:none;border-radius:99px;background:var(--line-strong);
      position:relative;transition:background .16s;margin-top:1px;
    }
    .sd-toggle i{
      position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
      background:var(--panel);transition:transform .16s var(--enter);
    }
    .sd-toggle.on{background:var(--accent)}
    .sd-toggle.on i{transform:translateX(14px)}
    .sd-val-row.off .sd-val-name,
    .sd-val-row.off .sd-val-note{color:var(--ink-3)}

    /* ── collection progress ── */
    .sd-prog-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
    .sd-prog-pct{font:600 26px 'Fraunces',serif;color:var(--ink);letter-spacing:-.02em;line-height:1}
    .sd-prog-of{font:500 12px var(--font-sans);color:var(--ink-2)}
    .sd-tprog{
      display:block;height:4px;border-radius:99px;background:var(--track);
      overflow:hidden;margin-top:6px;max-width:320px;
    }
    .sd-tprog i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s var(--std)}
    .sd-val-ic.pend{background:var(--panel-3);color:transparent}

    /* an "open" affordance on a list row */
    .sd-val-go{
      flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;
      border:1px solid var(--line);color:var(--ink-2);font:600 11.5px var(--font-sans);background:var(--panel);
    }
    .sd-val-go:hover{border-color:var(--accent);color:var(--accent)}
    .sd-val-go svg{width:11px;height:11px}

    /* the hold / collection workspace hosted inside a matter tab */
    #pbxWorkSlot{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--panel)}
    #pbxWorkSlot .sd-step{margin:0;border:none;border-radius:0}
    #pbxWorkSlot .sd-step-bar{border-radius:0}
    #pane-matter-detail [data-mv-panel="holds"],
    #pane-matter-detail [data-mv-panel="collections"]{padding:0}

    /* ═══════════════════════════════════════════════════════════
       WORKSPACE TABS — the hold and collection are long enough that
       one scroll buried half of them. One tab at a time instead.
    ═══════════════════════════════════════════════════════════ */
    .wk-body{flex:1;min-height:0;display:flex;overflow:hidden}
    .wk-tabs{
      flex:none;width:186px;border-right:1px solid var(--line);background:var(--surface);
      display:flex;flex-direction:column;gap:2px;padding:12px 10px;overflow-y:auto;
      scrollbar-width:none;-ms-overflow-style:none;
    }
    .wk-tabs::-webkit-scrollbar{width:0;height:0}
    .wk-tab{
      display:flex;align-items:center;gap:8px;width:100%;text-align:left;
      padding:8px 10px;border-radius:8px;
      font:500 12px var(--font-sans);color:var(--ink-2);
    }
    .wk-tab:hover{background:var(--hover);color:var(--ink)}
    .wk-tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .wk-tab-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .wk-tab-count{
      flex:none;font:600 10px var(--font-sans);padding:1px 6px;border-radius:99px;
      background:var(--panel-3);color:var(--ink-3);
    }
    .wk-tab.active .wk-tab-count{background:var(--panel);color:var(--accent)}

    /* ── an editable field should look editable ──
       The borderless treatment reads fine on a record you mostly read,
       but a creation form has to say which values you're expected to
       type into. Boxed grids get a permanent border. */
    .sdf-grid.boxed input,
    .sdf-grid.boxed textarea,
    #pbxWorkSlot .sd-notice{
      border:1px solid var(--line-strong);border-radius:9px;background:var(--field);
      padding:9px 11px;margin-left:0;
    }
    .sdf-grid.boxed input:hover,
    .sdf-grid.boxed textarea:hover{border-color:var(--ink-3)}
    .sdf-grid.boxed input:focus,
    .sdf-grid.boxed textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    #pbxWorkSlot .sd-notice{width:100%;margin-top:2px}

    /* the grids inside a hold or collection */
    .sdg.hold-cu{min-width:820px}
    .sdg.hold-cu .sdg-row{grid-template-columns:1.5fr 1.4fr 84px 84px 84px 36px}
    .sdg.hold-nc{min-width:840px}
    .sdg.hold-nc .sdg-row{grid-template-columns:1.5fr 1.4fr 1.4fr 1fr 36px}
    .sdg.coll-tg{min-width:620px}
    .sdg.coll-tg .sdg-row{grid-template-columns:2fr 1.1fr 1fr 36px}
    /* grid inputs get a visible field too, so the whole form is honest */
    #pbxWorkSlot .sdg-cell input{border-color:var(--line);background:var(--field)}
    #pbxWorkSlot .sdg-cell input:focus{border-color:var(--accent);background:var(--field)}

    .sd-chip-add{margin-top:8px;padding:5px 11px}
    #pbxWorkSlot .sd-step-body{padding:16px 15px 24px}

    /* ── read-only grid cells: values you can see and drop, not retype ── */
    .sdg-v{display:block;font:500 12px var(--font-sans);color:var(--ink);line-height:1.4}
    .sdg-v.mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
    .sdg-vsub{display:block;font:500 11px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .sdg-srcs{display:flex;flex-wrap:wrap;gap:4px}
    .sdg-srcchip{
      font:600 10.5px var(--font-sans);padding:2px 7px;border-radius:99px;
      background:var(--panel-3);color:var(--ink-2);white-space:nowrap;
    }
    .sdg.hold-cu .sdg-row{grid-template-columns:1.5fr 1.5fr 1.6fr 36px}
    .sdg.hold-cu{min-width:700px}
    .sdg.coll-tg .sdg-row{grid-template-columns:2fr 1fr 1fr 36px}
    .sdg-cell{padding:9px 10px}

    /* ── the add picker ── */
    .sdg-add.open{border-style:solid;border-color:var(--accent);color:var(--accent)}
    .sd-picker{
      margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
      display:flex;flex-direction:column;gap:1px;background:var(--line);
    }
    .sd-picker-row{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      background:var(--panel);padding:10px 12px;
    }
    .sd-picker-row:hover{background:var(--accent-soft)}
    .sd-picker-ic{
      width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .sd-picker-ic svg{width:10px;height:10px}
    .sd-picker-n{display:block;font:600 12px var(--font-sans);color:var(--ink)}
    .sd-picker-s{display:block;font:500 11px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .sd-picker-empty{background:var(--panel);padding:14px;text-align:center;font:500 12px var(--font-sans);color:var(--ink-3)}

    /* a receipt still landing: neutral rather than green, with a bar */
    .pbx-aux.working{
      border-color:var(--line);background:var(--surface);cursor:default;
    }
    .pbx-aux.working:hover{border-color:var(--line);box-shadow:none}
    .pbx-aux.working .pbx-aux-ic{background:var(--accent-soft);color:var(--accent)}
    .pbx-aux-bar{
      display:block;height:4px;border-radius:99px;background:var(--track);
      overflow:hidden;margin-top:8px;max-width:340px;
    }
    .pbx-aux-bar i{
      display:block;height:100%;width:0;border-radius:99px;
      background:linear-gradient(90deg,var(--accent),var(--magenta));transition:width .14s linear;
    }

    /* ═══════════════════════════════════════════════════════════
       EDIT vs VIEW — a field that can be changed carries a border and
       a field background. A settled one is text. The difference has to
       be visible at a glance, or people retype things that are locked
       and skip things that aren't.
    ═══════════════════════════════════════════════════════════ */
    .sdf-view{
      display:block;font:500 13px var(--font-sans);color:var(--ink);line-height:1.5;
      padding:6px 0 5px;border-bottom:1px solid var(--line);
    }
    .sdf-view.block{
      padding:12px 13px;border:1px solid var(--line);border-radius:10px;
      background:var(--surface);color:var(--ink-2);font-size:12.5px;line-height:1.7;border-bottom:1px solid var(--line);
    }
    .sd-mode{
      flex:none;font:600 10px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;
      padding:2px 8px;border-radius:99px;background:var(--panel-3);color:var(--ink-3);
    }
    .sd-mode.edit{background:var(--accent-soft);color:var(--accent)}

    /* the one note that replaces twelve "drafted" chips */
    .sdf-note{
      display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:10px;
      background:var(--accent-soft);margin-bottom:14px;
      font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.55;
    }
    .sdf-note svg{width:13px;height:13px;flex:none;color:var(--accent);margin-top:1px}

    /* collection grids, built on the Scope screen's own shape */
    .sdg.coll-cu{min-width:900px}
    .sdg.coll-cu .sdg-row{grid-template-columns:1.4fr 1.4fr 92px 92px 92px .9fr 36px}
    .sdg.coll-nc{min-width:820px}
    .sdg.coll-nc .sdg-row{grid-template-columns:44px 1.5fr 1.4fr 1.4fr .9fr 36px}
    /* the per-source estimate sits under its checkbox */
    .sdg-src{flex-direction:column;gap:4px}
    .sdg-gb{font:500 10px var(--font-sans);color:var(--ink-3)}
    .sdg-row.head .sdg-srch{padding-bottom:9px}

    /* ═══════════════════════════════════════════════════════════
       THEME PASS — matched to the ARMOUR product shell: a lavender-
       tinted ground, white cards with hairline borders and a wide soft
       shadow, pill-shaped controls, and a bluer purple accent. These
       are token-level so the whole app moves, not just this layer.
    ═══════════════════════════════════════════════════════════ */
    :root, :root[data-theme="light"]{
      --accent:#6c4ef5; --accent-soft:#6c4ef514;
      --orange:#6c4ef5; --orange-deep:#5a3ce0; --orange-soft:#6c4ef514;
      --magenta:#e2497f; --magenta-soft:#e2497f1a;
      --t-agent:#6c4ef5; --t-agent-soft:#6c4ef51f;
      --t-play:#e2497f;  --t-play-soft:#e2497f1a;
      --green:#1fa971; --green-soft:#1fa9711a;
      --pb-orange:#d9822b; --pb-orange-soft:#d9822b17;

      --bg:#f6f6fb; --panel:#fff; --panel-2:#fff; --panel-3:#f4f4f9;
      --field:#fff; --surface:#fbfbfe; --hover:#f4f4fa;
      --line:#ebebf2; --line-strong:#dedee8; --track:#eeeef4;

      --shadow-card:0 0 0 1px #1b1a3208,0 2px 8px -2px #1b1a320f;
      --shadow-hover:0 0 0 1px #1b1a3212,0 12px 32px -10px #1b1a3226;

      --chrome:#fff; --chrome-line:#ebebf2; --chrome-hover:#f4f4fa;

      --r-sm:10px; --r-md:14px; --r-lg:16px; --r-xl:22px;
    }
    :root[data-theme="dark"]{
      --accent:#8b6dff; --accent-soft:#8b6dff1f;
      --orange:#8b6dff; --orange-deep:#6c4ef5; --orange-soft:#8b6dff1f;
      --green:#2fbd84; --green-soft:#2fbd8420;
      --pb-orange:#e2953f; --pb-orange-soft:#e2953f1f;
      --panel-3:#1c1c22; --line:#26262e; --line-strong:#33333d; --track:#26262e;
    }

    /* ── controls are pills ───────────────────────────────── */
    .pbx-btn,
    .sdg-add,
    .sd-step-chat,
    .sdf-doc-open,
    .sdf-more,
    .sd-val-go,
    .pbx-prompt{border-radius:999px}
    .pbx-btn{padding:9px 18px;box-shadow:0 1px 2px #6c4ef52e}
    .pbx-btn.ghost{box-shadow:none}
    .sd-step-chat,.sdf-doc-open,.sdf-more,.sd-val-go,.sdg-add{
      border-color:var(--line-strong);background:var(--panel);
    }
    .sd-hero-back{border-radius:999px}

    /* ── cards get more corner and a softer edge ──────────── */
    .pbx-step,.pbx-card,.pbx-aux,.pbx-skip,.sd-step,
    .sdg-wrap,.sd-val,.sd-picker,.sd-authnote textarea,
    .sd-link-card,.pbx-out,.sd-docfield{border-radius:var(--r-lg)}
    .pbx-step,.pbx-card,.sd-step{box-shadow:var(--shadow-card)}
    .pbx-dock-box{border-radius:var(--r-xl)}

    /* ── the section head reads like the product's panel heads ── */
    .sd-sub-head{
      padding-bottom:2px;
    }
    .sd-sub-title{font-size:14px;font-weight:700}
    .sd-sub-count{background:var(--panel-3);color:var(--ink-2)}

    /* ── chips and tags soften ────────────────────────────── */
    .sd-chip,.sdg-srcchip,.sd-mode,.wk-tab-count,.pbx-plan-state,
    .sd-val-tag,.sdf-conf,.sd-id,.sdg-conf{border-radius:999px}
    .sd-chip{background:var(--panel-3);border-color:transparent}
    .sdg-srcchip{background:var(--accent-soft);color:var(--accent)}

    /* ── fields ───────────────────────────────────────────── */
    .sdf-grid.boxed input,
    .sdf-grid.boxed textarea,
    #pbxWorkSlot .sd-notice,
    .sd-authnote textarea{border-radius:12px;border-color:var(--line-strong)}
    .sdf-view{border-bottom-color:var(--line)}

    /* ── the vertical tab rail matches the product's left rails ── */
    .wk-tabs,.sd-jump{background:var(--surface)}
    .wk-tab,.sd-jump-item{border-radius:999px}
    .sd-jump-item{margin-left:11px;padding-left:12px}
    .sd-jump-item::before{border-radius:99px}

    /* ── run thread surfaces ──────────────────────────────── */
    .pbx-user{border-radius:18px 18px 6px 18px;box-shadow:0 1px 2px #6c4ef52e}
    .pbx-av,.pbx-out-ic,.pbx-aux-ic,.pbx-card-ic{border-radius:10px}
    .pbx-vrail{background:var(--surface)}

    /* ═══════════════════════════════════════════════════════════
       CARD RHYTHM — the step cards were padded like list rows, so the
       summary sat hard against the header rule and the output card
       against the bottom edge. One scale: 16px inset, 14px between
       blocks, and a little more air under the header.
    ═══════════════════════════════════════════════════════════ */
    .pbx-step-head{padding:13px 16px;gap:11px}
    .pbx-step-body{padding:14px 16px 16px;gap:14px}
    .pbx-step.gate .pbx-step-head{padding-bottom:13px}

    .pbx-summary{line-height:1.7;margin:0}
    .pbx-step-body > .pbx-summary{padding-top:0}

    /* the reasoning disclosure needs to read as its own block */
    .pbx-reason-toggle{padding:2px 0}
    .pbx-reason{padding:8px 0 2px 14px;margin-top:8px}
    .pbx-reason.open{gap:9px}

    .pbx-out{padding:12px 14px;gap:12px}
    .pbx-out-sub{margin-top:3px}

    .pbx-aux{padding:13px 15px;gap:12px}
    .pbx-aux-s{margin-top:3px}
    .pbx-skip{padding:13px 15px;gap:12px}
    .pbx-skip-why{margin-top:4px}

    .pbx-card-top{padding:14px 16px}
    .pbx-card-body{padding:14px 16px 16px}
    .pbx-card-desc{line-height:1.7;margin-bottom:15px}
    .pbx-plan{gap:9px;margin-bottom:16px}

    /* the thread itself breathes a little more between turns */
    .pbx-in{gap:16px}
    .pbx-user{padding:11px 15px}
    .pbx-agent{gap:11px}
    .pbx-agent-body{gap:12px}
    .pbx-say{line-height:1.7}

    /* ── the user's own turn shouldn't be the loudest thing on screen.
       A solid saturated block reads as an alert; a tint reads as a
       message. ── */
    .pbx-user{
      background:var(--panel-3);color:var(--ink);
      border:1px solid var(--line);box-shadow:none;
      font-weight:500;
    }
    .pbx-user .pbx-user-file{
      background:var(--panel);border:1px solid var(--line);
      color:var(--ink-2);font-weight:600;
    }
    .pbx-user .pbx-user-file svg{color:var(--accent)}

    /* the branch condition is context, not a warning */
    .pbx-plan-t i{color:var(--ink-3);font-weight:500}
    .pbx-plan-n{color:var(--ink-3)}
    .pbx-plan-t{color:var(--ink-2)}

    /* the ID belongs to the title, so it sits beside it rather than
       being pushed to the far edge by a stretching heading */
    .sd-hero-title{flex:0 1 auto}
    .sd-hero-head{justify-content:flex-start}
    .sd-hero-head::after{content:'';flex:1}

    /* ── nested hero identity: an eyebrow, the ID, and what kind of
       request it is. The matter's name lives one row up. ── */
    .sd-hero-eyebrow{
      flex:none;font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);
    }
    .sd-hero-kind{
      flex:0 1 auto;min-width:0;font:600 15px var(--font-sans);color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sd-hero-head .sd-id{order:0}

    /* ── 5. the breadcrumb either fits or leaves — a link truncated to
       "Matte" is worse than no link at all ── */
    .mv-tabsbar .mv-route{flex:none;min-width:0}
    .mv-tabsbar .mv-route .mv-trail-link{
      max-width:none;overflow:visible;text-overflow:clip;white-space:nowrap;
    }
    @media (max-width:1750px){
      .mv-tabsbar .mv-route,
      .mv-tabsbar .mv-tabsbar-rule{display:none}
    }

    /* ═══════════════════════════════════════════════════════════
       GRID POLISH — matched to the hold detail's own tables, which
       were already right: a serif section head, a real toolbar, filter
       chips, roomy two-line rows and a footer that says what you're
       looking at. My grids had none of that scaffolding.
    ═══════════════════════════════════════════════════════════ */
    .sd-sec-head{display:flex;align-items:baseline;gap:11px;margin-bottom:14px}
    .sd-sec-title{font:600 19px 'Fraunces',serif;color:var(--ink);letter-spacing:-.01em}
    .sd-sec-count{font:600 13px var(--font-sans);color:var(--ink-3)}
    .sd-sub-mode{display:flex;justify-content:flex-end;margin-bottom:-30px}

    /* rows get the hold table's breathing room */
    .sdg-row{border-bottom:1px solid var(--line)}
    .sdg-row:last-child{border-bottom:none}
    .sdg-row:not(.head):hover{background:var(--hover)}
    .sdg-row.head{
      background:var(--panel-3);
      font:700 9.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    }
    .sdg-cell{padding:13px 12px}
    .sdg-row.head > span{padding:9px 12px}
    .sdg-v{font:600 13px var(--font-sans);color:var(--ink)}
    .sdg-vsub{font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:3px}
    .sdg-wrap{border-radius:var(--r-lg);border-color:var(--line)}
    .sdg-reason{padding:12px 12px}
    .sdg-src{padding:12px 4px}

    /* the footer */
    .sd-gridfoot{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 2px 0;font:500 12px var(--font-sans);color:var(--ink-3);
    }
    .sd-gridfoot b{color:var(--ink-2);font-weight:600}
    .sd-loadmore{font:600 12px var(--font-sans);color:var(--accent)}
    .sd-loadmore:hover{text-decoration:underline}

    /* the toolbar primitives sit a touch tighter inside a step */
    .sd-sub .toolbar{margin-bottom:12px}
    .sd-sub .filter-chips{margin-bottom:14px}
    .sd-sub .search-field{flex:1;min-width:200px}

    /* the picker's own add button is redundant beside the toolbar's */
    .sd-sub .sdg-foot{display:none}
    .sd-sub .sdg-foot + .sd-picker{margin-top:0}

    /* ═══════════════════════════════════════════════════════════
       CREATION WORKSPACE — one scrolling composition, not six tabs.
       A reading column of sections down the middle, and a rail that
       stays put telling you what exists and what happens on commit.
    ═══════════════════════════════════════════════════════════ */
    .wk-body{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--bg)}
    .wk-scroll{flex:1;min-width:0;overflow-y:auto;padding:24px 28px 60px}
    .wk-col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

    .wk-sec-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
    .wk-sec-ic{
      width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .wk-sec-ic svg{width:15px;height:15px}
    .wk-sec-t{font:600 17px 'Fraunces',serif;color:var(--ink);letter-spacing:-.01em}
    .wk-sec-m{margin-left:auto;font:500 12px var(--font-sans);color:var(--ink-3)}

    .wk-card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:18px;box-shadow:var(--shadow-card);
    }
    .wk-card > div > .sdf-grid{margin:0}
    .wk-card .sd-gridfoot{padding-top:14px;border-top:1px solid var(--line);margin-top:14px}

    /* ── the summary rail ── */
    .wk-side{
      flex:none;width:264px;border-left:1px solid var(--line);background:var(--panel);
      overflow-y:auto;padding:24px 20px;
    }
    .wk-side-in{position:sticky;top:0}
    .wk-side-t{font:700 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .wk-stat{display:flex;align-items:baseline;gap:8px;margin:8px 0 18px}
    .wk-stat b{font:600 34px 'Fraunces',serif;color:var(--ink);letter-spacing:-.02em;line-height:1}
    .wk-stat span{font:500 12px var(--font-sans);color:var(--ink-2)}
    .wk-mini{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .wk-mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);padding:9px 12px}
    .wk-mini-row span{font:500 12px var(--font-sans);color:var(--ink-2)}
    .wk-mini-row b{font:600 12.5px var(--font-sans);color:var(--ink)}
    .wk-side-lab{font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 10px}
    .wk-side-note{
      margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--panel-3);
      font:500 11.5px var(--font-sans);color:var(--ink-3);line-height:1.5;
    }

    .wk-tl{display:flex;flex-direction:column}
    .wk-tl-row{display:flex;gap:10px;padding-bottom:14px;position:relative}
    .wk-tl-row:last-child{padding-bottom:0}
    .wk-tl-row > i{
      width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent);margin-top:4px;z-index:1;
    }
    .wk-tl-row:not(:last-child)::after{
      content:'';position:absolute;left:3.5px;top:12px;bottom:0;width:1.5px;background:var(--line-strong);
    }
    .wk-tl-row span{font:500 11.5px var(--font-sans);color:var(--ink-3);line-height:1.5}
    .wk-tl-row b{display:block;font:600 12px var(--font-sans);color:var(--ink)}

    .wk-bars{display:flex;flex-direction:column;gap:9px}
    .wk-bar{display:grid;grid-template-columns:1fr 74px 34px;align-items:center;gap:8px}
    .wk-bar-l{font:500 11.5px var(--font-sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wk-bar-t{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
    .wk-bar-t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
    .wk-bar-v{font:600 11px var(--font-sans);color:var(--ink-3);text-align:right}

    /* ── the schedule as a timeline ── */
    .wk-sched{display:flex;flex-direction:column}
    .wk-sched-row{display:grid;grid-template-columns:74px 18px 1fr auto;align-items:center;gap:10px;padding:11px 0;position:relative}
    .wk-sched-when{font:600 11px var(--font-sans);color:var(--ink-3);text-align:right}
    .wk-sched-rail{display:flex;justify-content:center;align-self:stretch;position:relative}
    .wk-sched-rail i{width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center;z-index:1}
    .wk-sched-row:not(:last-child) .wk-sched-rail::after{
      content:'';position:absolute;left:50%;top:50%;bottom:-13px;width:1.5px;
      background:var(--line-strong);transform:translateX(-50%);
    }
    .wk-sched-n{display:block;font:600 13px var(--font-sans);color:var(--ink)}
    .wk-sched-v{display:block;font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .wk-sched-row.off .wk-sched-rail i{background:var(--line-strong)}
    .wk-sched-row.off .wk-sched-n,.wk-sched-row.off .wk-sched-v,.wk-sched-row.off .wk-sched-when{color:var(--ink-3)}

    @media (max-width:1280px){
      .wk-side{display:none}
      .wk-scroll{padding:20px 20px 60px}
    }

    /* ── the outcome, inside the step that produced it ── */
    .pbx-result{
      display:flex;align-items:center;gap:12px;width:100%;text-align:left;
      padding:12px 14px;border-radius:var(--r-lg);
      border:1px solid #1fa97133;background:var(--green-soft);
      transition:border-color .15s,box-shadow .15s;
    }
    .pbx-result:hover{border-color:var(--green);box-shadow:var(--shadow-card)}
    .pbx-result.working{
      border-color:var(--line);background:var(--surface);cursor:default;
    }
    .pbx-result.working:hover{border-color:var(--line);box-shadow:none}
    .pbx-result-ic{
      width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--panel);color:var(--green);
    }
    .pbx-result.working .pbx-result-ic{color:var(--accent)}
    .pbx-result-ic svg{width:13px;height:13px}
    .pbx-result-body{flex:1;min-width:0}
    .pbx-result-t{display:block;font:600 12.5px var(--font-sans);color:var(--ink)}
    .pbx-result-s{display:block;font:500 11.5px var(--font-sans);color:var(--ink-2);margin-top:3px}

    /* ═══════════════════════════════════════════════════════════
       ARTIFACT ROW — it needs to say two things a chevron doesn't:
       that this is the step's output, and that it opens something.
    ═══════════════════════════════════════════════════════════ */
    .pbx-artifact{display:flex;flex-direction:column;gap:7px}
    .pbx-artifact-lab{
      display:inline-flex;align-items:center;gap:6px;
      font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
    }
    .pbx-artifact-lab svg{width:11px;height:11px;color:var(--accent)}

    .pbx-out{
      border-color:var(--line-strong);background:var(--panel);
      box-shadow:var(--shadow-card);
    }
    .pbx-out:hover{
      border-color:var(--accent);background:var(--accent-soft);
      box-shadow:var(--shadow-hover);transform:translateY(-1px);
    }
    .pbx-out-ic{background:var(--accent-soft);color:var(--accent)}

    /* a named action, not a bare arrow */
    .pbx-out-open{
      flex:none;display:inline-flex;align-items:center;gap:5px;
      padding:6px 11px;border-radius:999px;
      background:var(--accent-soft);color:var(--accent);
      font:700 11.5px var(--font-sans);white-space:nowrap;transition:background .15s,color .15s;
    }
    .pbx-out-open svg{width:11px;height:11px}
    .pbx-out:hover .pbx-out-open{background:var(--accent);color:#fff}
    .pbx-result .pbx-out-open{background:#1fa9711f;color:var(--green)}
    .pbx-result:hover .pbx-out-open{background:var(--green);color:#fff}
    .pbx-result:hover{transform:translateY(-1px)}
    .pbx-result.working{transform:none}

    /* ═══════════════════════════════════════════════════════════
       ARTIFACT SHEEN — the output is the one thing in the thread the
       agent actually made, so it gets the only gradient in the build.
       A gradient hairline, a faint wash, and a sweep on hover. Kept to
       one element, or it stops meaning anything.
    ═══════════════════════════════════════════════════════════ */
    .pbx-out,.pbx-result{position:relative;overflow:hidden;border-color:transparent}
    .pbx-out{
      background:
        linear-gradient(var(--panel),var(--panel)) padding-box,
        linear-gradient(115deg,#6c4ef5 0%,#c44ec9 48%,#e2497f 100%) border-box;
      border:1px solid transparent;
    }
    /* the wash sitting under the content */
    .pbx-out::before,.pbx-result::before{
      content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(115deg,#6c4ef50f 0%,#c44ec90a 45%,#e2497f12 100%);
      opacity:.9;transition:opacity .18s;
    }
    .pbx-out > *,.pbx-result > *{position:relative;z-index:1}

    /* the sweep — one pass across the card on hover */
    .pbx-out::after{
      content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;
      background:linear-gradient(100deg,transparent,#ffffff9e,transparent);
      transform:skewX(-18deg);opacity:0;pointer-events:none;
    }
    .pbx-out:hover::after{animation:pbxSweep .85s var(--std)}
    @keyframes pbxSweep{
      0%{left:-60%;opacity:0}
      12%{opacity:1}
      100%{left:115%;opacity:0}
    }
    .pbx-out:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 26px -12px #6c4ef559,0 0 0 1px #6c4ef52e;
    }
    .pbx-out:hover::before{opacity:1}
