    .mv-row-go{flex:none;width:13px;height:13px;color:var(--ink-3)}
    .mv-row-go svg{width:13px;height:13px}

    /* process cards — collapsed to one line so a matter with many work
       items keeps each section about one screen tall */
    .mv-card{
      border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:5px;
      background:var(--panel);overflow:hidden;
    }
    .mv-card:hover{border-color:var(--line-strong)}
    .mv-cardhead{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 13px}
    .mv-cardhead:hover{background:var(--hover)}
    .mv-cx{flex:none;width:12px;height:12px;color:var(--ink-3);transition:transform .18s}
    .mv-cx svg{width:12px;height:12px}
    .mv-card.open .mv-cx{transform:rotate(180deg)}
    .mv-card-name{font:700 12.5px var(--font-sans);color:var(--ink)}
    .mv-card-meta{flex:1;min-width:0;font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .mv-cardbody{display:none;padding:0 13px 13px 36px}
    .mv-card.open .mv-cardbody{display:block}
    .mv-chatlink{
      display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:0;background:none;
      font:700 11px var(--font-sans);color:var(--ink-3);
    }
    .mv-chatlink:hover{color:var(--accent)}
    .mv-chatlink svg{width:11px;height:11px}

    .mv-tag{
      flex:none;font:700 10px var(--font-sans);padding:2px 8px;border-radius:99px;
      background:var(--accent-soft);color:var(--accent);
    }
    .mv-tag.matter{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .mv-empty{font:500 12.5px var(--font-sans);color:var(--ink-3);padding:22px 0}
    .mv-pinnote{
      display:flex;align-items:center;gap:7px;margin-top:4px;padding:9px 13px;
      border-radius:var(--r-md);background:var(--panel-3);border:1px solid var(--line);
      font:500 11.5px var(--font-sans);color:var(--ink-3);
    }

    /* one level in — a child record opens here, inside the matter, with
       a breadcrumb back rather than replacing the matter entirely */
    .mv-child{display:none;flex-direction:column;flex:1;min-height:0}
    .mv-crumb{
      flex:none;display:flex;align-items:center;gap:9px;padding:11px 26px;
      border-bottom:1px solid var(--line);background:var(--panel-3);
    }
    .mv-crumb-back{
      display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;
      border:1px solid var(--line);background:var(--panel);
      font:700 11px var(--font-sans);color:var(--ink-2);
    }
    .mv-crumb-back:hover{border-color:var(--line-strong);color:var(--ink)}
    .mv-crumb-back svg{width:10px;height:10px}
    .mv-crumb-trail{font:600 11px var(--font-sans);color:var(--ink-3)}
    .mv-crumb-scope{
      margin-left:auto;font:700 10.5px var(--font-sans);padding:3px 9px;
      border-radius:99px;background:var(--pb-orange-soft);color:var(--pb-orange);
    }

    /* ═══════════════════════════════════════
       ADDENDA — outline pass: Apps launcher,
       stub views, toast. Everything else above
       this point is the existing design system,
       reused as-is for visual continuity.
    ═══════════════════════════════════════ */

    .apps-launcher{padding:2px 2px 28px}
    .apps-launcher-head{margin-bottom:18px}
    .apps-launcher-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
    .apps-launcher-sub{font-size:13px;color:var(--ink-2);margin-top:4px;max-width:52ch;line-height:1.5}
    .apps-launcher-group{margin-bottom:26px}
    .apps-launcher-group-label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
    .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
    .app-tile{
      text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:15px 16px 16px;display:flex;flex-direction:column;gap:10px;
      box-shadow:var(--shadow-card);transition:box-shadow .16s var(--std),transform .16s var(--std),border-color .16s;
      cursor:pointer;
    }
    .app-tile:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);border-color:var(--line-strong)}
    .app-tile:active{transform:translateY(0)}
    .app-tile.disabled{cursor:default;opacity:.55}
    .app-tile.disabled:hover{box-shadow:var(--shadow-card);transform:none;border-color:var(--line)}
    .app-tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .app-tile-icon{
      width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .app-tile-icon svg{width:16px;height:16px}
    .app-tile.playbook .app-tile-icon{background:var(--t-play-soft);color:var(--t-play)}
    .app-tile-badge{font-size:10px;font-weight:700;color:var(--ink-3);background:var(--panel-3);border-radius:99px;padding:2px 8px;white-space:nowrap}
    .app-tile-name{font-size:14.5px;font-weight:700;color:var(--ink)}
    .app-tile-desc{font-size:12px;color:var(--ink-2);line-height:1.5;flex:1}
    .app-tile-stat{font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:9px}
    .app-tile-stat b{color:var(--ink);font-weight:700}

    .apps-crumb{
      display:flex;align-items:center;gap:8px;margin-bottom:16px;
    }
    .apps-crumb-back{
      display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);
      padding:5px 10px 5px 6px;border-radius:8px;
    }
    .apps-crumb-back:hover{background:var(--hover);color:var(--ink)}
    .apps-crumb-back svg{width:13px;height:13px}
    .apps-crumb-sep{color:var(--ink-3);font-size:12px}
    .apps-crumb-current{font-size:12.5px;font-weight:700;color:var(--ink)}

    #holdOverlay.open{flex:1;min-height:0;height:auto}


    /* narrower directory panel — the plain nav list doesn't need 320px */
    .armour-library-panel.open{width:240px}

    /* table-level: fill the remaining row width instead of a fixed
       vw-based width — the fixed formula could exceed the row's actual
       width alongside the chat column and clip content (e.g. the list's
       own "+ New" button) at the right edge. flex:1 always fits. */
    .armour-library-panel.open.table-level{width:auto;flex:1;min-width:0}
    .wsrow-lib-table .wscol{width:340px}

    /* tighter header — the default panel head + pane padding left too
       much empty space between the breadcrumb and the list below it */
    .armour-library-panel-head{padding:10px 16px;min-height:auto;gap:8px}
    .armour-library-table-body .pane-main{padding:10px 16px 16px}

    /* chat ↔ list resize handle — only meaningful once a list is open
       and taking real width; hidden in the narrow directory state */
    #chatPanelResizeHandle{display:none}
    .wsrow-lib-table #chatPanelResizeHandle{display:block}

    .view-stub{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;flex:1;padding:0 40px}
    .view-stub-icon{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
    .view-stub-icon svg{width:20px;height:20px}
    .view-stub-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink)}
    .view-stub-sub{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:46ch;line-height:1.55}

    .oln-toast{
      position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);
      background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;
      padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-hover);
      z-index:500;opacity:0;pointer-events:none;transition:opacity .18s var(--enter),transform .18s var(--enter);
      white-space:nowrap;
    }
    :root[data-theme="dark"] .oln-toast{background:#fff;color:#0c0c0e}
    .oln-toast.show{opacity:1;transform:translate(-50%,0)}

    .apps-scopebar-search{
      display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);
      border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--ink-3);width:220px;
    }
    .apps-scopebar-search svg{width:13px;height:13px;flex:none}

    /* ═══════════════════════════════════════════════════════════
       MATTER DETAIL — a matter is a pipeline under pressure.
       Data moves Hold → Collect → Review → Produce, and what
       matters at a glance is where it's stuck. So the hero is the
       flow itself, not a grid of equal-weight numbers. All the
       boldness is spent on that rail; everything below it stays
       deliberately quiet.
    ═══════════════════════════════════════════════════════════ */

    .mv{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

    /* ── masthead: identity, then the one sentence that matters ── */
    .mv-mast{flex:none;padding:20px 26px 0}
    .mv-mast-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:3px}
    .mv-mast-title{
      font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--ink);
      letter-spacing:-.015em;line-height:1.15;
    }
    .mv-mast-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:7px}
    .mv-chip{
      font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--panel-3);
      border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap;
    }
    .mv-chip-live{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--green-soft);color:var(--green);font-weight:700;
    }
    .mv-chip-live::before{
      content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
    }
    .mv-mast-spacer{flex:1}
    .mv-mast-actions{display:flex;align-items:center;gap:8px;flex:none}

    /* ── the alert line — plain language, only when something's wrong ── */
    .mv-alert{
      display:flex;align-items:center;gap:10px;margin-top:16px;
      padding:11px 15px;border-radius:var(--r-md);
      background:var(--magenta-soft);color:var(--ink);
      font-size:13px;line-height:1.45;
    }
    .mv-alert svg{width:16px;height:16px;flex:none;color:var(--magenta)}
    .mv-alert b{font-weight:700}
    .mv-alert-link{
      margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--magenta);
      padding:4px 10px;border-radius:8px;white-space:nowrap;
    }
    .mv-alert-link:hover{background:#e23d7d1f}

    /* ══ THE HERO — pipeline rail ══
       Four stages, connected. Each carries its own volume, a fill
       bar for progress, and a state line. The connector between
       stages is what makes it read as flow rather than four cards. */
    .mv-flow{
      display:grid;grid-template-columns:repeat(4,1fr);
      margin:20px 26px 0;border:1px solid var(--line);border-radius:var(--r-xl);
      background:var(--panel);box-shadow:var(--shadow-card);overflow:hidden;
    }
    .mv-stage{
      position:relative;padding:16px 18px 17px;text-align:left;
      border-right:1px solid var(--line);
      transition:background .16s var(--std);
      display:flex;flex-direction:column;gap:9px;cursor:pointer;
    }
    .mv-stage:last-child{border-right:none}
    .mv-stage:hover{background:var(--hover)}
    /* the connective chevron — sits on the seam between two stages,
       which is what turns four panels into one pipeline */
    .mv-stage:not(:last-child)::after{
      content:"";position:absolute;right:-6px;top:50%;z-index:2;
      width:11px;height:11px;margin-top:-6px;
      border-right:1.5px solid var(--line-strong);border-top:1.5px solid var(--line-strong);
      transform:rotate(45deg);background:var(--panel);
    }
    .mv-stage:hover:not(:last-child)::after{background:var(--hover)}
    .mv-stage-label{
      font-size:11px;font-weight:700;color:var(--ink-3);
      letter-spacing:.04em;text-transform:uppercase;
    }
    .mv-stage-figure{display:flex;align-items:baseline;gap:7px}
    .mv-stage-num{
      font-family:'Fraunces',serif;font-size:27px;font-weight:600;color:var(--ink);
      line-height:1;letter-spacing:-.02em;
    }
    .mv-stage-unit{font-size:12px;font-weight:600;color:var(--ink-3)}
    .mv-stage-track{
      height:4px;border-radius:var(--r-pill);background:var(--track);overflow:hidden;display:flex;
    }
    .mv-stage-track i{display:block;height:100%}
    .mv-stage-note{font-size:11.5px;color:var(--ink-2);line-height:1.4}
    .mv-stage-note b{color:var(--ink);font-weight:700}
    .mv-stage-note .risk{color:var(--magenta);font-weight:700}
    /* the stage that's actually blocking — earns the one accent edge */
    .mv-stage.blocked{background:linear-gradient(180deg,#e23d7d0a,transparent 60%)}
    .mv-stage.blocked::before{
      content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--magenta);
    }

    /* ── tabs — quiet, underline only, sits on a hairline ── */
    .mv-tabs{
      display:flex;gap:0;flex:none;margin:22px 26px 0;
      border-bottom:1px solid var(--line);overflow-x:auto;
    }
    .mv-tab{
      padding:0 0 10px;margin-right:24px;flex:none;
      font-size:13px;font-weight:600;color:var(--ink-3);
      border-bottom:2px solid transparent;margin-bottom:-1px;
      display:flex;align-items:center;gap:7px;white-space:nowrap;
      transition:color .15s;
    }
    .mv-tab:hover{color:var(--ink)}
    .mv-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
    .mv-tab-count{
      font-size:10.5px;font-weight:700;color:var(--ink-3);
      background:var(--panel-3);border-radius:var(--r-pill);padding:1px 7px;
    }
    .mv-tab.active .mv-tab-count{color:var(--accent);background:var(--accent-soft)}

    .mv-panels{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .mv-panel{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
    .mv-panel.active{display:flex}

    /* ── OVERVIEW — two columns so nothing needs a long scroll:
         the record on the left, what's happened on the right ── */
    .mv-overview{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 28px}
    .mv-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:26px;align-items:start}
    @media (max-width:1080px){.mv-cols{grid-template-columns:minmax(0,1fr)}}

    .mv-block{margin-bottom:26px}
    .mv-block:last-child{margin-bottom:0}
    .mv-block-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
    .mv-block-title{font-size:13px;font-weight:700;color:var(--ink)}
    .mv-block-count{font-size:11.5px;color:var(--ink-3);font-weight:600}
    .mv-block-spacer{flex:1}

    /* details as a definition list, not a card grid — reference data
       should read like a record, quietly, in two tight columns */
    .mv-facts{
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden;
    }
    @media (max-width:620px){.mv-facts{grid-template-columns:minmax(0,1fr)}}
    .mv-fact{
      display:flex;align-items:baseline;gap:12px;padding:10px 15px;
      border-bottom:1px solid var(--line);min-width:0;
    }
    .mv-fact:nth-child(odd){border-right:1px solid var(--line)}
    .mv-fact:nth-last-child(-n+2){border-bottom:none}
    @media (max-width:620px){
      .mv-fact:nth-child(odd){border-right:none}
      .mv-fact:nth-last-child(-n+2){border-bottom:1px solid var(--line)}
      .mv-fact:last-child{border-bottom:none}
    }
    .mv-fact-k{font-size:11.5px;color:var(--ink-3);flex:none;width:104px}
    .mv-fact-v{font-size:12.5px;font-weight:600;color:var(--ink);min-width:0;word-break:break-word}

    /* notes & docs — flat rows, hairline separated, no card-in-card */
    .mv-rows{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
    .mv-row{
      display:flex;gap:12px;align-items:flex-start;padding:12px 15px;
      border-bottom:1px solid var(--line);transition:background .14s;
    }
    .mv-row:last-child{border-bottom:none}
    .mv-row:hover{background:var(--hover)}
    .mv-row-ic{
      width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-3);margin-top:1px;
    }
    .mv-row-ic svg{width:14px;height:14px}
    .mv-row-body{flex:1;min-width:0}
    .mv-row-title{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35}
    .mv-row-sub{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
    .mv-row-side{font-size:11px;color:var(--ink-3);flex:none;white-space:nowrap;margin-top:2px}
    .mv-empty{padding:20px 15px;font-size:12.5px;color:var(--ink-3);text-align:center}

    .mv-add{
      display:inline-flex;align-items:center;gap:6px;flex:none;
      font-size:12px;font-weight:700;color:var(--accent);
      padding:5px 11px;border-radius:8px;background:var(--accent-soft);
      transition:background .15s;
    }
    .mv-add:hover{background:#7a4fd633}
    .mv-add svg{width:12px;height:12px}

    .mv-composer{
      display:none;flex-direction:column;gap:10px;margin-bottom:11px;
      border:1px solid var(--line-strong);border-radius:var(--r-lg);
      padding:13px 15px;background:var(--field);
    }
    .mv-composer.open{display:flex}
    .mv-composer textarea{
      width:100%;border:none;outline:none;background:none;resize:vertical;min-height:62px;
      font:inherit;font-size:12.5px;color:var(--ink);line-height:1.55;
    }
    .mv-composer textarea::placeholder{color:var(--ink-3)}
    .mv-composer-actions{display:flex;justify-content:flex-end;gap:8px}

    /* activity — a real timeline with a continuous spine */
    .mv-timeline{position:relative;padding-left:20px}
    .mv-timeline::before{
      content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1.5px;background:var(--line);
    }
    .mv-tl{position:relative;padding-bottom:17px}
    .mv-tl:last-child{padding-bottom:0}
    .mv-tl::before{
      content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;
      background:var(--panel);border:2px solid var(--line-strong);
    }
    .mv-tl.sys::before{border-color:var(--accent);background:var(--accent)}
    .mv-tl.risk::before{border-color:var(--magenta);background:var(--magenta)}
    .mv-tl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .mv-tl-who{font-size:12.5px;font-weight:700;color:var(--ink)}
    .mv-tl-when{font-size:11px;color:var(--ink-3)}
    .mv-tl-text{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:2px}

    /* ── LIST TABS — every one gets the same frame + pagination bar,
         so moving between them feels like one component, not four ── */
    .mv-list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 26px 22px;overflow:hidden}

    /* pagination — one consistent bar pinned to the bottom of every
       list, with page numbers rather than a bare prev/next pair */


    /* ═══════════════════════════════════════════════════════════
       CONDENSED MATTER HEADER — the Vault problem.
       A matter's masthead + pipeline is the right hero on Overview,
       but it's ~230px of chrome sitting above a table that may hold
       a million rows. So the header has two states: full on
       Overview, condensed to a single strip on any data tab. The
       matter identity never disappears (you must always know which
       matter you're inside) — it just stops taking the room.
    ═══════════════════════════════════════════════════════════ */

    /* the condensed strip — only exists in condensed mode */
    .mv-bar{
      display:none;align-items:center;gap:12px;flex:none;
      padding:9px 26px;border-bottom:1px solid var(--line);background:var(--panel);
    }
    .mv.condensed .mv-bar{display:flex}
    .mv.condensed .mv-mast{display:none}

    .mv-bar-title{
      font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;color:var(--ink);
      letter-spacing:-.01em;white-space:nowrap;
    }
    .mv-bar-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex:none}
    /* the pipeline survives as four tiny inline readouts — same
       four numbers, ~8px tall instead of ~120px */
    .mv-bar-mini{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
    .mv-bar-step{
      display:flex;align-items:center;gap:6px;flex:none;
      padding:3px 9px;border-radius:var(--r-pill);
      font-size:11.5px;color:var(--ink-2);white-space:nowrap;
      transition:background .14s,color .14s;
    }
    .mv-bar-step:hover{background:var(--hover);color:var(--ink)}
    .mv-bar-step b{color:var(--ink);font-weight:700}
    .mv-bar-step.risk b{color:var(--magenta)}
    .mv-bar-step.on{background:var(--accent-soft);color:var(--accent)}
    .mv-bar-step.on b{color:var(--accent)}
    .mv-bar-sep{color:var(--line-strong);font-size:10px;flex:none}
    .mv-bar-spacer{flex:1;min-width:8px}
    .mv-bar-expand{
      display:inline-flex;align-items:center;gap:5px;flex:none;
      font-size:11.5px;font-weight:600;color:var(--ink-3);
      padding:4px 9px;border-radius:8px;
    }
    .mv-bar-expand:hover{background:var(--hover);color:var(--ink)}
    .mv-bar-expand svg{width:11px;height:11px}

    /* condensed mode gives the tabs and list their margins back */
    .mv.condensed .mv-tabs{margin-top:0;padding-top:8px}
    .mv.condensed .mv-list{padding-top:14px}

    /* ── Vault at scale: filters do the work, not paging ──
       A million rows can't be browsed, only narrowed. So the Vault
       tab gets a real filter bar and a result count that updates,
       and the table takes every remaining pixel. */
    .mv-filterbar{
      flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel);
    }
    .mv-search{
      display:flex;align-items:center;gap:7px;flex:1;min-width:180px;max-width:340px;
      background:var(--field);border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    }
    .mv-search:focus-within{border-color:var(--accent)}
    .mv-search svg{width:13px;height:13px;color:var(--ink-3);flex:none}
    .mv-search input{
      flex:1;min-width:0;border:none;outline:none;background:none;
      font:inherit;font-size:12.5px;color:var(--ink);
    }
    .mv-search input::placeholder{color:var(--ink-3)}
    .mv-facet{
      display:inline-flex;align-items:center;gap:6px;flex:none;
      font-size:12px;font-weight:600;color:var(--ink-2);
      background:var(--field);border:1px solid var(--line);
      border-radius:var(--r-pill);padding:5px 12px;transition:border-color .14s,color .14s;
    }
    .mv-facet:hover{border-color:var(--line-strong);color:var(--ink)}
    .mv-facet.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
    .mv-facet-x{font-size:13px;line-height:1;opacity:.7}
    .mv-facet-caret{width:8px;height:8px;opacity:.6}

    /* narrow the pager's page list on small widths so it never wraps
       into the row count */
    @media (max-width:760px){
      .mv-bar-mini{display:none}
      .list-pagination-text{display:none}
    }

    /* the matter name lives in the panel breadcrumb, so neither the
       masthead nor the condensed strip repeats it. The masthead now
       leads with its chips; the strip leads with status. */
    .mv-mast-title{display:none}
    .mv-mast-meta{margin-top:0}
    .mv-bar-status{font-size:12px;font-weight:700;color:var(--green);flex:none;white-space:nowrap}

    /* A matter is a container, not a record — its name should read at
       a different scale from a list title so you feel you've stepped
       *inside* something. The panel breadcrumb carries it, enlarged
       and set in the display serif only while a matter is open. */
    .armour-library-panel.matter-level .armour-library-panel-title{
      font-family:'Fraunces',serif;font-size:19px;font-weight:600;
      letter-spacing:-.015em;color:var(--ink);
    }
    .armour-library-panel.matter-level .armour-library-panel-head{padding:12px 16px}
    /* the hero sits closer now that the alert line is gone */
    .mv-flow{margin-top:16px}

    /* ═══════════════════════════════════════════════════════════
       SPACING PASS — with the big title and the alert line gone,
       the old gaps were sized for content that no longer exists.
       Re-tightened so the pipeline sits high and the tables get
       the reclaimed room, and so the gap between blocks tracks
       their relationship rather than being a uniform 26px.
    ═══════════════════════════════════════════════════════════ */

    /* masthead is now just chips + Export — one row, so it only
       needs breathing room, not a block of padding */
    .mv-mast{padding:12px 24px 0}
    .mv-mast-top{align-items:center;margin-bottom:0}
    .mv-flow{margin:13px 24px 0}
    .mv-tabs{margin:16px 24px 0}

    /* stage cells: a touch more air inside, less wasted between the
       number and its note */
    .mv-stage{padding:14px 16px 15px;gap:7px}
    .mv-stage-num{font-size:25px}

    /* overview: tighter column gutter, and blocks spaced by relation —
       details→notes→docs are one chain, so 20px, not 26px */
    .mv-overview{padding:18px 24px 24px}
    .mv-cols{gap:22px}
    .mv-block{margin-bottom:20px}
    .mv-block-head{margin-bottom:9px}

    /* the right column is short next to the left — let activity start
       flush with Details instead of floating in dead space */
    .mv-cols > div:last-child{position:sticky;top:0}
    @media (max-width:1080px){.mv-cols > div:last-child{position:static}}

    /* list tabs: the card should reach the edges of the reclaimed space */
    .mv-list{padding:14px 24px 18px}
    .mv.condensed .mv-list{padding-top:12px}
    .mv-filterbar{padding:9px 16px}

    /* rows can afford to be a shade tighter — more visible at once
       without feeling cramped */
    .mv-row{padding:11px 15px}
    .mv-fact{padding:9px 15px}
    .mv-tl{padding-bottom:15px}

    /* ── final trim ──
       1. The chips are a continuation of the matter name in the
          breadcrumb directly above, not a separate band — so they sit
          tight under it rather than across a gap.
       2. Tabs read as available, not greyed out: inactive labels use
          body-text ink, and the active one is marked by the accent
          underline plus weight, not by everything else fading. */
    .armour-library-panel.matter-level .armour-library-panel-head{padding:12px 16px 6px}
    .mv-mast{padding:6px 24px 0}
    .mv-flow{margin-top:11px}

    .mv-tab{color:var(--ink-2);font-weight:600}
    .mv-tab:hover{color:var(--ink)}
    .mv-tab.active{color:var(--ink);font-weight:700}
    .mv-tab .mv-tab-count{color:var(--ink-2);background:var(--panel-3)}
    .mv-tab:hover .mv-tab-count{color:var(--ink)}
    .mv-tab.active .mv-tab-count{color:var(--accent);background:var(--accent-soft)}

    /* ═══════════════════════════════════════════════════════════
       OVERVIEW AT SCALE — Details, Notes, Documents and Activity
       all grow without limit. Left unbounded, one long block shoves
       every other block off the page and the Overview stops being
       an overview. Two containment strategies:

       • Finite-but-long (Details, 16 fields) → CAP and reveal. The
         cap shows the fields you check often; the rest are a click
         away, so the common case stays short.
       • Unbounded (Notes, Documents, Activity) → fixed-height
         SCROLLBOX. The block's footprint stops changing as records
         accumulate, so the page layout is stable at 7 notes or 700.
    ═══════════════════════════════════════════════════════════ */

    /* — capped: collapsed to the first 8 rows (4 grid rows × 2 cols) — */
    .mv-capped{position:relative;overflow:hidden;max-height:164px;transition:max-height .26s var(--enter)}
    .mv-capped.expanded{max-height:1200px}
    .mv-capped::after{
      content:"";position:absolute;left:0;right:0;bottom:0;height:44px;pointer-events:none;
      background:linear-gradient(180deg,transparent,var(--panel));transition:opacity .2s;
    }
    .mv-capped.expanded::after{opacity:0}

    /* — scrollbox: fixed height, scrolls internally — */
    .mv-scrollbox{max-height:236px;overflow-y:auto;overscroll-behavior:contain}
    .mv-scrollbox-tall{max-height:420px}
    /* a quieter scrollbar so it reads as content, not chrome */
    .mv-scrollbox::-webkit-scrollbar{width:9px}
    .mv-scrollbox::-webkit-scrollbar-thumb{
      background:var(--line-strong);border-radius:99px;
      border:3px solid var(--panel);background-clip:padding-box;
    }
    .mv-scrollbox::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box}
    .mv-scrollbox::-webkit-scrollbar-track{background:transparent}
    /* timeline needs its own padding back once it scrolls */
    .mv-timeline.mv-scrollbox{padding-right:8px;padding-bottom:2px}

    /* — the reveal / jump control shared by both — */
    .mv-more{
      display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
      margin-top:8px;padding:7px 12px;border-radius:9px;
      font-size:12px;font-weight:700;color:var(--ink-2);
      border:1px solid var(--line);background:var(--panel);
      transition:background .15s,color .15s,border-color .15s;
    }
    .mv-more:hover{background:var(--hover);color:var(--ink);border-color:var(--line-strong)}
    .mv-more svg{width:11px;height:11px;transition:transform .22s var(--enter)}
    .mv-more.expanded svg{transform:rotate(180deg)}

    /* the left column can scroll as a whole; the sticky right column
       shouldn't outrun it */
    .mv-cols > div:last-child{top:0;align-self:start}

    /* Condensed state: the breadcrumb already carries the matter name
       at display size, so the strip doesn't need to restate the
       pipeline too. It drops to a hairline with just the status and a
       way back to the summary — the numbers are one click away, and
       every pixel saved goes to the table. */
    .mv.condensed .mv-bar-mini,
    .mv.condensed .mv-bar-sep{display:none}
    .mv.condensed .mv-bar{padding:5px 24px}
    .mv-bar-expand{color:var(--accent);font-weight:700}
    .mv-bar-expand:hover{background:var(--accent-soft);color:var(--accent)}

    /* With the chip row gone (Status/Type/Team/Lead/Opened all live in
       Details), the masthead is only a wrapper for the pipeline — so
       the hero sits directly under the breadcrumb. */
    .mv-mast{padding:0}
    .mv-flow{margin:12px 24px 0}

    /* The condensed strip is gone: the Overview tab is itself the way
       back to the summary, and status lives in Details — so a whole
       row restating both was pure cost. In condensed mode the hero
       simply collapses and the tabs sit directly under the breadcrumb. */
    .mv.condensed .mv-mast{display:none}
    .mv.condensed .mv-tabs{margin-top:2px}

    /* The pipeline now lives inside Overview rather than above the
       tabs, so it inherits the overview's padding and scrolls with
       the rest of the content. Tabs become the first thing under the
       breadcrumb — the matter's top level is navigation, and the
       stats are Overview's content like everything else. */
    .mv-tabs{margin:0 24px}
    .mv-flow{margin:0 0 20px}
    .mv-overview{padding-top:16px}

    /* nothing is condensed any more — the hero disappears on other
       tabs simply by not being in them */
    .mv.condensed .mv-tabs{margin-top:0}

    /* ═══════════════════════════════════════════════════════════
       MATTER — VISUAL REWORK

       Grounded in two things specific to this subject:

       1. A legal filing opens with a CAPTION BLOCK — identity set
          formally, on its own, before any content. So the matter gets
          a real header instead of riding in a chrome bar, with its
          docket line beneath, separated by hairline rules the way a
          register is ruled (not middots).

       2. The substance of eDiscovery is CHAIN OF CUSTODY. A chain is
          a line, not four boxes. So the hero is one continuous rail
          with four nodes on it — filled behind progress, hollow
          ahead — and the break in the chain is the only red on screen.
    ═══════════════════════════════════════════════════════════ */

    /* ── caption ── */
    .mv-caption{
      flex:none;display:flex;align-items:flex-end;gap:20px;
      padding:14px 24px 15px;border-bottom:1px solid var(--line);
    }
    .mv-caption-main{min-width:0;flex:1}
    .mv-caption-name{
      font-family:'Fraunces',serif;font-size:27px;font-weight:600;color:var(--ink);
      letter-spacing:-.02em;line-height:1.1;margin:0;
    }
    /* docket line — ruled segments, the way a register separates
       columns; reads as legal metadata rather than a tag soup */
    .mv-docket{display:flex;align-items:center;flex-wrap:wrap;margin-top:9px}
    .mv-docket-i{
      display:flex;align-items:baseline;gap:6px;
      padding:0 13px;border-left:1px solid var(--line);
    }
    .mv-docket-i:first-child{padding-left:0;border-left:none}
    .mv-docket-k{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
    .mv-docket-v{font-size:12.5px;font-weight:600;color:var(--ink-2)}

    .mv-standing{
      flex:none;font-size:12px;color:var(--green);font-weight:600;
      display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
      padding-bottom:3px;
    }
    .mv-standing b{font-weight:700}
    .mv-standing::before{
      content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
      box-shadow:0 0 0 3px var(--green-soft);
    }

    /* ── tabs: navigation that reports ── */
    .mv-tabs{margin:0;padding:0 24px;gap:0}
    .mv-tab{
      padding:11px 0 10px;margin-right:26px;font-size:13.5px;
      position:relative;
    }
    .mv-tab-flag{
      width:5px;height:5px;border-radius:50%;background:var(--magenta);
      flex:none;margin-left:-2px;
    }
    .mv-tab.active .mv-tab-flag{background:var(--magenta)}

    /* ── the custody band ── */
    .mv-band{
      display:grid;grid-template-columns:repeat(4,1fr);
      margin:0 0 22px;
    }
    @media (max-width:820px){.mv-band{grid-template-columns:repeat(2,1fr);row-gap:18px}}
    .mv-node{
      text-align:left;display:flex;flex-direction:column;gap:0;
      padding:0 18px 0 0;min-width:0;cursor:pointer;
      transition:opacity .16s var(--std);
    }
    .mv-node:hover{opacity:.72}
    .mv-node-label{
      font-size:11px;font-weight:700;color:var(--ink-3);
      letter-spacing:.05em;text-transform:uppercase;
    }
    .mv-node-fig{display:flex;align-items:baseline;gap:7px;margin-top:7px;min-width:0}
    .mv-node-num{
      font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--ink);
      line-height:1;letter-spacing:-.025em;
    }
    .mv-node-unit{font-size:12px;font-weight:600;color:var(--ink-3);min-width:0}

    /* the rail: each cell draws its own half-segments, so together
       they form one unbroken line across all four */
    .mv-node-rail{
      position:relative;display:block;height:22px;margin:13px 0 0;
    }
    .mv-node-rail::before,
    .mv-node-rail::after{
      content:"";position:absolute;top:50%;height:2px;margin-top:-1px;
      background:var(--track);
    }
    .mv-node-rail::before{left:0;right:50%}
    .mv-node-rail::after{left:50%;right:-18px}
    .mv-node:last-child .mv-node-rail::after{display:none}
    .mv-node:first-child .mv-node-rail::before{display:none}
    .mv-dot{
      position:absolute;left:50%;top:50%;width:13px;height:13px;
      margin:-6.5px 0 0 -6.5px;border-radius:50%;
      background:var(--panel);border:2.5px solid var(--track);z-index:2;
      transition:transform .18s var(--enter);
    }
    .mv-node:hover .mv-dot{transform:scale(1.18)}

    /* states — everything behind the current position reads solid,
       everything ahead reads hollow */
    .mv-node.done .mv-node-rail::before,
    .mv-node.done .mv-node-rail::after,
    .mv-node.running .mv-node-rail::before,
    .mv-node.blocked .mv-node-rail::before{background:var(--accent)}
    .mv-node.done .mv-dot{background:var(--accent);border-color:var(--accent)}
    .mv-node.running .mv-dot{
      border-color:var(--accent);background:var(--panel);
      box-shadow:0 0 0 4px var(--accent-soft);
    }
    /* the break in the chain — the one red thing on the page */
    .mv-node.blocked .mv-dot{
      border-color:var(--magenta);background:var(--panel);
      box-shadow:0 0 0 4px var(--magenta-soft);
    }
    .mv-node.blocked .mv-node-rail::after{
      background:repeating-linear-gradient(90deg,var(--magenta) 0 4px,transparent 4px 8px);
    }
    .mv-node.todo .mv-dot{border-color:var(--line-strong)}

    .mv-node-note{font-size:11.5px;color:var(--ink-2);line-height:1.45;margin-top:11px}
    .mv-node-note b{color:var(--ink);font-weight:700}
    .mv-node-note .risk{color:var(--magenta);font-weight:700}

    .mv-overview{padding-top:20px}

    /* breadcrumb keeps only the way back while a matter is open */
    .armour-library-panel.matter-level .armour-library-panel-head{padding:8px 16px}

    /* ═══════════════════════════════════════════════════════════
       DENSITY PASS — the page was shouting in four places at once.

       Three fixes:
       1. ONE entry point. The four figures were all 32px serif, so
          the eye had nowhere to land. Only the stage that needs you
          stays large; the rest step down to a supporting size. The
          band becomes a status line, not four headlines.
       2. NO NESTED SCROLL. Notes and Activity scrolled inside a page
          that also scrolls — three scroll contexts on one screen.
          They now show a few rows and link to the rest, so the page
          has exactly one scrollbar.
       3. LESS AT ONCE. Overview is a landing that points to depth,
          not a container for it: 6 fields, 3 notes, 3 docs, 4 events.
       ═══════════════════════════════════════════════════════════ */

    /* ── band: one voice, not four ── */
    .mv-band{margin-bottom:30px}
    .mv-node-num{font-size:21px;letter-spacing:-.015em;color:var(--ink-2)}
    .mv-node-unit{font-size:11.5px}
    .mv-node-label{font-size:10px;color:var(--ink-3);letter-spacing:.06em}
    .mv-node-note{font-size:11px;margin-top:9px;color:var(--ink-3)}
    /* the one stage that needs you keeps the display size */
    .mv-node.blocked .mv-node-num{font-size:30px;color:var(--ink)}
    .mv-node.blocked .mv-node-label{color:var(--magenta)}
    .mv-node.blocked .mv-node-note{color:var(--ink-2)}

    /* ── details: a record, not a spreadsheet. Grid lines removed;
         alignment alone does the work. ── */
    .mv-facts{border:none;border-radius:0;background:none;gap:0 28px}
    .mv-fact{
      border:none !important;padding:7px 0;
      border-bottom:1px solid var(--line) !important;
    }
    .mv-fact-k{width:112px;font-size:11.5px}
    .mv-fact-v{font-size:12.5px;font-weight:600}
    .mv-capped{max-height:132px}
    .mv-capped::after{background:linear-gradient(180deg,transparent,var(--panel) 78%)}

    /* ── notes & docs: hairlines, no card frames ── */
    .mv-rows{border:none;border-radius:0;background:none;border-top:1px solid var(--line)}
    .mv-row{padding:11px 0;border-bottom:1px solid var(--line)}
    .mv-row:hover{background:transparent}
    .mv-row:hover .mv-row-title{color:var(--accent)}
    .mv-row-ic{display:none}
    .mv-row-title{font-size:12.5px}
    .mv-row-sub{font-size:11.5px;color:var(--ink-3)}

    /* ── the quiet "see the rest" link both lists share ── */
    .mv-viewall{
      display:block;width:100%;text-align:left;padding:9px 0 0;
      font-size:12px;font-weight:600;color:var(--accent);
    }
    .mv-viewall:hover{text-decoration:underline}

    /* ── activity: lighter, and it no longer competes with the left ── */
    .mv-tl{padding-bottom:14px}
    .mv-tl-who{font-size:12px}
    .mv-tl-text{font-size:11.5px;color:var(--ink-3)}
    .mv-timeline::before{background:var(--line)}

    /* ── section headings carry more separation than their content ── */
    .mv-block{margin-bottom:32px}
    .mv-block-title{font-size:12px;letter-spacing:.01em}
    .mv-block-count{font-size:11px}
    .mv-cols{gap:44px}
    .mv-overview{padding:20px 24px 32px}

    .mv-more{
      margin-top:10px;border:none;background:none;padding:6px 0;
      justify-content:flex-start;color:var(--accent);font-size:12px;
    }
    .mv-more:hover{background:none;color:var(--accent);text-decoration:underline}

    /* ═══════════════════════════════════════════════════════════
       OVERVIEW, REDONE — A STATUS BRIEF

       Previous versions arranged a dashboard. But nobody opens a
       matter to browse it; they open it with a question. And legal
       people read briefs, not dashboards — so the page is built the
       way an associate would actually answer "where does this stand?"

         Zone 1  the standing, in prose. The hero is a sentence.
         Zone 2  what needs a decision. The only loud interactive
                 elements on the page.
         Zone 3  the chain, small — evidence for the sentence, not
                 a headline competing with it.
         ── rule ──
         Zone 4  reference. Quiet, below the fold of attention.

       The inversion that matters: figures used to be the hero and
       prose didn't exist. Now prose leads and figures support it.
    ═══════════════════════════════════════════════════════════ */

    .mv2{flex:1;min-height:0;overflow-y:auto;padding:26px 26px 34px}

    /* ── Zone 1: the standing ── */
    .mv2-brief{
      margin:0;max-width:62ch;
      font-family:'Fraunces',serif;font-size:17.5px;font-weight:400;
      line-height:1.62;color:var(--ink-2);letter-spacing:-.005em;
    }
    .mv2-brief b{font-weight:600;color:var(--ink)}
    .mv2-brief b.risk{color:var(--magenta)}

    /* ── Zone 2: decisions ── */
    .mv2-todo{display:flex;flex-direction:column;margin-top:22px;max-width:760px}
    .mv2-act{
      display:flex;align-items:center;gap:16px;text-align:left;width:100%;
      padding:12px 14px;border-radius:var(--r-md);
      border:1px solid var(--line);background:var(--panel);
      margin-bottom:8px;transition:border-color .15s,background .15s,transform .15s var(--std);
    }
    .mv2-act:hover{border-color:var(--line-strong);background:var(--hover);transform:translateX(2px)}
    .mv2-act-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .mv2-act-title{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.3}
    .mv2-act-sub{font-size:11.5px;color:var(--ink-3);line-height:1.45}
    .mv2-act-due{
      flex:none;font-size:11px;font-weight:700;color:var(--ink-3);
      background:var(--panel-3);border-radius:var(--r-pill);padding:4px 11px;white-space:nowrap;
    }
    /* the one that's actually late earns the accent edge */
    .mv2-act.urgent{border-left:2.5px solid var(--magenta)}
    .mv2-act.urgent .mv2-act-due{background:var(--magenta-soft);color:var(--magenta)}

    /* ── Zone 3: the chain, small ── */
    .mv2-chain{
      display:grid;grid-template-columns:repeat(4,1fr);gap:0;
      margin-top:26px;border-top:1px solid var(--line);
    }
    @media (max-width:760px){.mv2-chain{grid-template-columns:repeat(2,1fr)}}
    .mv2-link{
      text-align:left;padding:13px 16px 13px 0;position:relative;
      display:flex;flex-direction:column;gap:3px;
    }
    .mv2-link:hover .mv2-link-k{color:var(--accent)}
    .mv2-link-tick{
      position:absolute;top:-1px;left:0;width:100%;height:2px;background:var(--track);
    }
    .mv2-link.break .mv2-link-tick{background:var(--magenta)}
    .mv2-link.live .mv2-link-tick{background:var(--accent)}
    .mv2-link-k{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;transition:color .14s}
    .mv2-link-v{font-size:13px;font-weight:600;color:var(--ink)}
    .mv2-link-v .risk{color:var(--magenta);font-weight:700}

    /* ── Zone 4: reference, below the rule ── */
    .mv2-ref{
      display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 52px;
      margin-top:34px;padding-top:28px;border-top:1px solid var(--line);
    }
    @media (max-width:900px){.mv2-ref{grid-template-columns:minmax(0,1fr)}}
    .mv2-sec{margin-bottom:34px}
    .mv2-sec:last-child{margin-bottom:0}
    .mv2-sec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
    .mv2-sec-t{margin:0;font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.01em}
    .mv2-sec-n{font-size:11px;color:var(--ink-3)}
    .mv2-sec-sp{flex:1}
    .mv2-add{font-size:11.5px;font-weight:700;color:var(--accent)}
    .mv2-add:hover{text-decoration:underline}

    .mv2-facts{margin:0;border-top:1px solid var(--line)}
    .mv2-facts > div{
      display:flex;align-items:baseline;gap:14px;
      padding:7px 0;border-bottom:1px solid var(--line);
    }
    .mv2-facts dt{flex:none;width:116px;font-size:11.5px;color:var(--ink-3)}
    .mv2-facts dd{margin:0;font-size:12.5px;font-weight:600;color:var(--ink);min-width:0;word-break:break-word}

    .mv2-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}

    .mv2-more{
      display:block;padding:9px 0 0;font-size:12px;font-weight:600;color:var(--accent);
    }
    .mv2-more:hover{text-decoration:underline}

    /* the capped details block re-tuned for the new two-column width */
    .mv2 .mv-capped{max-height:150px}
    .mv2 .mv-capped::after{background:linear-gradient(180deg,transparent,var(--panel) 80%)}
    .mv2 .mv-composer{margin:0 0 12px}

    /* ═══════════════════════════════════════════════════════════
       MATTER VIEW — rebuilt on the hold detail's own pattern, so a
       matter and a hold feel like the same kind of object:

         identity bar  →  name + standing, nothing else
         tabs
         hero band     →  headline figure left, stage cards right
         body          →  jump rail left, record sections right

       The brief and the action list are gone; the docket line is
       gone (those fields live in Details, where they belong).
    ═══════════════════════════════════════════════════════════ */

    .mv-idbar{
      flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:14px 26px;background:var(--panel);
    }
    .mv-idbar-title{
      font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.015em;
      color:var(--ink);line-height:1.2;
    }
    .mv-idbar-status{
      display:inline-flex;align-items:center;gap:7px;
      font-size:12px;font-weight:700;color:var(--green);
      background:var(--green-soft);border-radius:var(--r-pill);padding:4px 12px;
    }
    .mv-idbar-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

    /* hero band — mirrors .hd-hero */
    .mv-hero{
      flex:none;display:flex;align-items:center;gap:34px;flex-wrap:wrap;
      padding:22px 26px 20px;background:var(--panel-3);border-bottom:1px solid var(--line);
    }
    .mv-hero-main{flex:1;min-width:280px}
    .mv-hero-label{
      font:700 10.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:7px;
    }
    .mv-hero-figure{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
    .mv-hero-pct{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.02em}
    .mv-hero-of{font-size:13px;color:var(--ink-2);font-weight:600}
    .mv-hero-track{height:6px;border-radius:var(--r-pill);background:var(--track);overflow:hidden;max-width:580px}
    .mv-hero-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--magenta));border-radius:var(--r-pill)}
    .mv-hero-note{font-size:12px;color:var(--ink-2);margin-top:10px}
    .mv-hero-note strong{color:var(--magenta);font-weight:700}

    .mv-triage{display:flex;gap:10px;flex:none;flex-wrap:wrap}
    .mv-triage-item{
      min-width:104px;padding:12px 16px;border-radius:var(--r-lg);
      background:var(--panel);border:1px solid var(--line);text-align:left;
      transition:border-color .15s,box-shadow .15s,transform .15s;
    }
    .mv-triage-item:hover{border-color:var(--accent);box-shadow:var(--shadow-card);transform:translateY(-1px)}
    .mv-triage-num{
      font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--ink);
      line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px;
    }
    .mv-triage-num span{font-family:var(--font-sans);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:0}
    .mv-triage-label{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:600}
    .mv-triage-item.warn .mv-triage-num{color:var(--accent)}
    .mv-triage-item.risk .mv-triage-num{color:var(--magenta)}

    /* body — jump rail + sections, mirrors .hd-body / .hd-jump */
    .mv-body{flex:1;min-height:0;display:flex;overflow:hidden}
    .mv-jump{
      flex:none;width:172px;padding:18px 12px 18px 22px;overflow-y:auto;
      border-right:1px solid var(--line);background:var(--panel);
    }
    .mv-jump-head{padding:0 6px 0 10px;margin-bottom:8px}
    .mv-jump-label{
      font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);
    }
    /* the component lists now sit inside the overview scroll */
    .mv-panel.mv-inline{display:block;padding:0;overflow:visible;background:none;border:0}
    .mv-panel.mv-inline .mv-list{padding:0}
    .mv-panel.mv-inline .list-card{border-radius:var(--r-md)}
    /* two segments, not six tabs */
    .mv-tabs.mv-segs{gap:2px}
    .mvh-seg{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
      color:var(--ink-3);background:none;border:0;border-bottom:2px solid transparent;
      padding:8px 12px 10px;cursor:pointer;white-space:nowrap}
    .mvh-seg:hover{color:var(--ink)}
    .mvh-seg.active{color:var(--ink);border-bottom-color:var(--accent)}
    .mvh-seg .mv-tab-count{font-size:10.5px;font-weight:700;padding:2px 7px;
      border-radius:var(--r-pill);background:var(--panel-3);color:var(--ink-3)}
    .mvh-seg.active .mv-tab-count{background:var(--accent-soft);color:var(--accent)}
    .mv-jump-item{
      display:flex;align-items:center;gap:8px;width:100%;text-align:left;
      padding:7px 10px;border-radius:8px;margin-bottom:2px;
      font-size:12.5px;font-weight:600;color:var(--ink-2);
      transition:background .14s,color .14s;
    }
    .mv-jump-item:hover{background:var(--hover);color:var(--ink)}
    .mv-jump-item.current{background:var(--accent-soft);color:var(--accent);font-weight:700}
    .mv-jump-count{
      margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-3);
      background:var(--panel-3);border-radius:var(--r-pill);padding:1px 7px;
    }
    .mv-jump-item.current .mv-jump-count{background:#7a4fd626;color:var(--accent)}

    .mv-scroll{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 30px}
    .mv-sec{margin-bottom:34px;scroll-margin-top:12px}
    .mv-sec:last-child{margin-bottom:0}
    .mv-sec-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
    .mv-sec-title{font-size:13px;font-weight:700;color:var(--ink)}
    .mv-sec-count{font-size:11px;color:var(--ink-3)}
    .mv-sec-sp{flex:1}

    /* the overview panel now manages its own scrolling regions */
    .mv-panel[data-mv-panel="overview"]{overflow:hidden}

    /* ── record rows: renamed off .mv-row, which already exists in the
         base stylesheet as a bordered card and was leaking its border,
         radius and margin into these lists. Own namespace, no clash.
         Rows now align flush with their section heading. ── */
    .mv2-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
    .mvrec{
      display:flex;align-items:flex-start;gap:16px;width:100%;
      padding:10px 0;margin:0;background:none;border:none;border-radius:0;
      border-bottom:1px solid var(--line);
    }
    .mvrec:last-child{border-bottom:none}
    .mvrec-body{flex:1;min-width:0}
    .mvrec-title{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
    .mvrec-sub{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:2px}
    .mvrec-side{
      flex:none;font-size:11px;color:var(--ink-3);white-space:nowrap;
      line-height:1.4;padding-top:1px;
    }
    .mvrec:hover .mvrec-title{color:var(--accent)}

    /* headings, rows, facts and links all share one left edge */
    .mv-sec-head,
    .mv2-facts,
    .mv2-list,
    .mv2-more,
    .mv-timeline{margin-left:0;padding-left:0}
    .mv-timeline{padding-left:19px}
    .mv2-more{padding:10px 0 0}

    /* ── header on one line: the breadcrumb carries back-link, matter
         name and standing together, instead of stacking a second bar
         underneath it. ── */
    .mv-standing-pill{
      display:inline-flex;align-items:center;gap:6px;
      font-size:11.5px;font-weight:700;color:var(--green);
      background:var(--green-soft);border-radius:var(--r-pill);padding:3px 11px;
      white-space:nowrap;
    }
    .mv-standing-pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
    .armour-library-panel.matter-level .albh-summary-slot{display:flex;align-items:center;margin-left:10px}

    /* ── four stages, equal weight ──
         Same parts in the same order at the same size in each card;
         colour marks STATE, not importance, so nothing outranks
         anything else structurally. ── */
    .mv-hero{
      flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
      padding:16px 26px 18px;background:var(--panel-3);border-bottom:1px solid var(--line);
    }
    @media (max-width:900px){.mv-hero{grid-template-columns:repeat(2,1fr)}}
    .mv-stat{
      text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;
      padding:13px 15px 14px;border-radius:var(--r-lg);
      background:var(--panel);border:1px solid var(--line);
      transition:border-color .15s,box-shadow .15s,transform .15s;
    }
    .mv-stat:hover{border-color:var(--accent);box-shadow:var(--shadow-card);transform:translateY(-1px)}
    .mv-stat-label{
      font:700 10.5px var(--font-sans);letter-spacing:.07em;
      text-transform:uppercase;color:var(--ink-3);
    }
    .mv-stat-fig{display:flex;align-items:baseline;gap:7px;min-width:0}
    .mv-stat-fig b{
      font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--ink);
      line-height:1;letter-spacing:-.02em;
    }
    .mv-stat-fig span{font-size:11.5px;font-weight:600;color:var(--ink-3);min-width:0}
    .mv-stat-track{height:4px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
    .mv-stat-track i{display:block;height:100%;background:var(--ink-3);border-radius:var(--r-pill)}
    .mv-stat-note{font-size:11px;color:var(--ink-3);line-height:1.4}
    .mv-stat-note em{font-style:normal;font-weight:700;color:var(--magenta)}
    /* state, not rank */
    .mv-stat.live .mv-stat-track i{background:linear-gradient(90deg,var(--accent),#9b5cf0)}
    .mv-stat.risk .mv-stat-track i{background:var(--magenta)}

    /* ── the band, made richer without getting noisy ──
       Added, in order of loudness: a state-tinted top edge, a ghosted
       stage glyph, a 14-day trend spark, and a delta in the note.
       Chevrons in the gutters restore the left-to-right custody
       reading the equal-cards layout had flattened out. ── */
    .mv-hero{gap:22px;padding:18px 26px 20px;position:relative}
    .mv-stat{
      position:relative;overflow:hidden;gap:7px;padding:15px 16px 14px;
    }
    /* state-tinted top edge — the quietest way to carry state */
    .mv-stat::before{
      content:"";position:absolute;left:0;right:0;top:0;height:2.5px;
      background:var(--line-strong);
    }
    .mv-stat.live::before{background:linear-gradient(90deg,var(--accent),#9b5cf0)}
    .mv-stat.risk::before{background:var(--magenta)}

    /* chevron in the gutter — flow direction, not decoration */
    .mv-stat:not(:last-child)::after{
      content:"";position:absolute;right:-15px;top:50%;z-index:3;
      width:8px;height:8px;margin-top:-4px;
      border-right:1.6px solid var(--line-strong);
      border-top:1.6px solid var(--line-strong);
      transform:rotate(45deg);
    }
    @media (max-width:900px){.mv-stat:not(:last-child)::after{display:none}}

    /* ghosted stage glyph, top-right — identity at a glance */
    .mv-stat-glyph{
      position:absolute;right:12px;top:11px;width:26px;height:26px;
      color:var(--ink-3);opacity:.16;pointer-events:none;
    }
    .mv-stat-glyph svg{width:100%;height:100%}
    .mv-stat.live .mv-stat-glyph{color:var(--accent);opacity:.26}
    .mv-stat.risk .mv-stat-glyph{color:var(--magenta);opacity:.24}

    .mv-stat-label{padding-right:30px}
    .mv-stat-fig b{font-size:27px}

    /* 14-day trend spark — shows movement, which a bare number can't */
    .mv-stat-spark{display:block;height:26px;margin:1px 0 2px}
    .mv-stat-spark svg{width:100%;height:100%;display:block;overflow:visible}
    .mv-stat-spark polyline{
      fill:none;stroke:var(--ink-3);stroke-width:1.6;
      stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;
      opacity:.55;
    }
    .mv-stat.live .mv-stat-spark polyline{stroke:var(--accent);opacity:1;stroke-width:2}
    .mv-stat.risk .mv-stat-spark polyline{stroke:var(--magenta);opacity:.9}
    /* a flat line means nothing has moved — say so quietly */
    .mv-stat-spark.flat polyline{stroke-dasharray:3 4;opacity:.4}

    .mv-stat-track{height:4px}
    .mv-stat-note b{color:var(--accent);font-weight:700}
    .mv-stat:hover .mv-stat-glyph{opacity:.34}

    /* ── compact band: no in-card graphics. State lives in the top
         edge and the track; movement lives in the delta text. Card
         height drops by roughly a third. ── */
    .mv-hero{padding:13px 26px 15px;gap:20px}
    .mv-stat{gap:6px;padding:11px 14px 12px}
    .mv-stat-label{padding-right:0;font-size:10px;letter-spacing:.06em}
    .mv-stat-fig{gap:6px}
    .mv-stat-fig b{font-size:22px}
    .mv-stat-fig span{font-size:11px}
    .mv-stat-track{height:3px;margin-top:1px}
    .mv-stat-note{font-size:10.5px;line-height:1.35}
    .mv-stat::before{height:2px}
    .mv-stat:not(:last-child)::after{right:-14px;width:7px;height:7px;margin-top:-3.5px}

    /* ═══════════════════════════════════════════════════════════
       BREADCRUMB TRAIL — one line, every ancestor clickable.

       The trail is built from the route actually taken, so the same
       hold reads differently depending on how you got there:
         Apps / Matters / Board Matter 2026-04 / RIF 2026…
         Apps / Legal Holds / RIF 2026…
       Ancestors are small and grey; the current page is large and
       set in the display serif, so "where am I" and "how do I get
       back" are visually distinct jobs on the same line.
    ═══════════════════════════════════════════════════════════ */
    .mv-trail{
      display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap;
    }
    .mv-trail-link{
      flex:none;font-size:12.5px;font-weight:600;color:var(--ink-3);
      padding:2px 4px;border-radius:6px;transition:color .14s,background .14s;
      white-space:nowrap;
    }
    .mv-trail-link:hover{color:var(--accent);background:var(--accent-soft)}
    .mv-trail-sep{flex:none;color:var(--line-strong);font-size:12px;user-select:none}
    .mv-trail-current{
      flex:none;font-family:'Fraunces',serif;font-size:19px;font-weight:600;
      color:var(--ink);letter-spacing:-.015em;cursor:default;padding:0 2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch;
    }
    /* only the leaf grows; a plain app list keeps a calmer size */
    .armour-library-panel:not(.matter-level) .mv-trail-current{font-size:15px}

    /* the hold's own identity bar duplicated the trail — name and
       standing now live on the breadcrumb line, so it goes */
    .hold-overlay-embedded .hd-idbar{display:none}

    /* ═══════════════════════════════════════════════════════════
       PARENT MATTER, PERSISTENT

       A hold's matter defines its scope, its custodian population and
       who is accountable for it — so it's a property of the hold, not
       a fact about how you navigated. It therefore shows on BOTH
       paths, in the record itself, where it survives scrolling. The
       breadcrumb is left to do navigation only.
    ═══════════════════════════════════════════════════════════ */
    /* one chip, one job: state the parent and go there. Reads as an
       action ("‹ Holds on Board Matter 2026-04"), not a static label,
       so it doesn't need a separate back-bar next to it. */
    .hd-parent{
      display:inline-flex;align-items:center;gap:7px;margin-bottom:13px;
      padding:5px 12px 5px 9px;border-radius:var(--r-pill);
      background:var(--panel);border:1px solid var(--line);
      transition:border-color .15s,background .15s;max-width:100%;
    }
    .hd-parent:hover{border-color:var(--accent);background:var(--accent-soft)}
    .hd-parent svg{width:12px;height:12px;flex:none;color:var(--ink-3);transition:color .15s}
    .hd-parent:hover svg{color:var(--accent)}
    .hd-parent-v{
      font-size:12.5px;font-weight:600;color:var(--ink-2);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .hd-parent-v b{color:var(--ink);font-weight:700}
    .hd-parent:hover .hd-parent-v,
    .hd-parent:hover .hd-parent-v b{color:var(--accent)}

    /* the detail fills its host — inside a matter that means the whole
       overview panel, because a record is a page, not a row */
    #pane-holds > .col-overlay.hold-overlay-embedded.open,
    #pane-matter-detail [data-mv-panel="holds"] > .col-overlay.hold-overlay-embedded.open,
    #pane-matter-detail [data-mv-panel="overview"] > .col-overlay.hold-overlay-embedded.open{
      flex:1;min-height:0;
    }
    /* the matter's segmented header steps aside while a record is open —
       two headers saying nearly the same thing is one too many */
    #pane-matter-detail.rec-open .mv-tabsbar{display:none}
    #pane-matter-detail.rec-open [data-mv-panel="overview"]{padding:0}

    /* the route, inside the record's own hero */
    .hd-hero-id{display:flex;flex-direction:column;gap:7px;min-width:0}
    .hd-crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
      font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .hd-crumb button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
    .hd-crumb button:hover{color:var(--accent)}
    .hd-crumb i{font-style:normal;opacity:.5;font-size:10px}
    .hd-crumb .hd-crumb-scope{display:inline-flex;align-items:center;gap:6px;padding-left:9px;
      margin-left:3px;border-left:1px solid var(--line-strong);color:var(--ink-2)}

    /* ── the chat column's top strip ──
       Scope on the left, Apps on the right. Both float over the chat
       rather than sitting in a bar across both panes, so they cost no
       layout height — the reason the old scopebar was removed. ── */
    .wscol-scope{
      position:absolute;top:12px;left:16px;z-index:8;
      display:inline-flex;align-items:center;gap:7px;
      padding:6px 13px;border-radius:var(--r-pill);
      background:var(--panel);border:1px solid var(--line);
      box-shadow:var(--shadow-card);max-width:min(46%,340px);
      transition:border-color .15s,background .15s;
    }
    .wscol-scope:hover{border-color:var(--line-strong)}
    .wscol-scope-k{
      flex:none;font:700 9.5px var(--font-sans);
      letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
    }
    .wscol-scope-v{
      font-size:12px;font-weight:700;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    /* scoped to a matter — accent, so the switch is unmistakable */
    .wscol-scope.scoped{background:var(--accent-soft);border-color:transparent}
    .wscol-scope.scoped .wscol-scope-k{color:var(--accent);opacity:.7}
    .wscol-scope.scoped .wscol-scope-v{color:var(--accent)}
    .wsrow-lib-table .wscol-scope{max-width:calc(100% - 32px)}

    /* Apps entry, floated in the chat column's corner — no bar needed */
    .wscol-apps-btn{
      position:absolute;top:12px;right:16px;z-index:8;
      display:inline-flex;align-items:center;gap:7px;
      padding:6px 12px;border-radius:var(--r-pill);
      background:var(--panel);border:1px solid var(--line);
      font-size:12px;font-weight:700;color:var(--accent);
      box-shadow:var(--shadow-card);
      transition:border-color .15s,background .15s,transform .15s var(--std);
    }
    .wscol-apps-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
    .wscol-apps-btn svg{width:14px;height:14px;flex:none}
    .wscol{position:relative}
    /* once the panel is open — in any state, not just table-level —
       its own header is the way out, so the entry chip retires */
    .panel-open .wscol-apps-btn{display:none}

    /* ═══════════════════════════════════════════════════════════
       ONE CHROME ROW, NOT TWO

       A matter used to cost three stacked bars before any content:
       scopebar, breadcrumb, tabs. The breadcrumb now rides in the
       tabs row, and the panel header collapses to its window
       controls floated over the corner — so the header row costs
       zero height. Roughly 44px back, which is 1–2 more document
       rows visible in Vault on every screen.
    ═══════════════════════════════════════════════════════════ */
    .armour-library-panel.matter-level .armour-library-panel-head{
      position:absolute;top:0;right:0;z-index:6;
      padding:7px 10px;border:none;background:none;min-height:0;
      width:auto;gap:4px;
    }
    /* the head keeps only its window controls */
    .armour-library-panel.matter-level .armour-library-panel-head > .mv-trail,
    .armour-library-panel.matter-level .albh-summary-slot,
    .armour-library-panel.matter-level .albh-spacer{display:none}
    .armour-library-panel.matter-level{position:relative}

    /* merged row: trail, hairline, tabs */
    .mv-tabsbar{
      flex:none;display:flex;align-items:center;gap:14px;
      padding:0 96px 0 24px;border-bottom:1px solid var(--line);
      overflow-x:auto;
    }
    .mv-trail-inline{flex:none;padding:0;gap:7px}
    .mv-trail-inline .mv-trail-current{font-size:15px}
    .mv-trail-inline .mv-standing-pill{margin-left:2px}
    .mv-tabsbar-rule{
      flex:none;width:1px;height:18px;background:var(--line);
    }
    .mv-tabsbar .mv-tabs{
      border-bottom:none;margin:0;padding:0;flex:1;min-width:0;
    }
    .mv-tabsbar .mv-tab{padding:12px 0 11px;margin-right:22px}
    .mv-tabsbar .mv-tab:last-child{margin-right:0}

    /* the hold detail mounts inside a tab, so it inherits the same
       single-row saving automatically */

    /* ── Vault: the list's own chrome merged too ──
       The count header and the filter bar were two separate rows
       saying related things. One row: count on the left, search and
       facets on the right. Another ~40px to the table. ── */
    .mv-list{padding:12px 24px 14px}
    .mv-filterbar{
      padding:0 14px 10px;border-bottom:1px solid var(--line);
      margin-top:-4px;
    }

    /* scopebar: it spans both panes, so trimming it pays twice */
    .scopebar{padding-top:8px;padding-bottom:8px}

    /* The tabs row scrolls horizontally when it overflows, but the
       native scrollbar renders as a full arrow-and-thumb widget that
       reads as broken chrome. Keep the scrolling, hide the bar. */
    .mv-tabsbar{
      overflow-x:auto;overflow-y:hidden;
      scrollbar-width:none;-ms-overflow-style:none;
    }
    .mv-tabsbar::-webkit-scrollbar{width:0;height:0;display:none}

    /* same treatment for the other horizontal strips */
    .mv-jump,
    .mv-hero,
    .mv-filterbar{scrollbar-width:none;-ms-overflow-style:none}
    .mv-jump::-webkit-scrollbar,
    .mv-hero::-webkit-scrollbar,
    .mv-filterbar::-webkit-scrollbar{width:0;height:0;display:none}

    /* ── the hold names itself inside its own hero ──
       Drilling from a matter's hold list into a hold used to add a
       breadcrumb segment and a chip. Now the hero carries the hold's
       identity and a single back control, so going one level deeper
       costs no extra chrome rows at all. ── */
    .hd-hero-head{
      display:flex;align-items:center;gap:11px;margin-bottom:14px;min-width:0;
    }
    .hd-hero-back{
      flex:none;width:26px;height:26px;border-radius:8px;
      display:grid;place-items:center;color:var(--ink-2);
      background:var(--panel);border:1px solid var(--line);
      transition:border-color .15s,background .15s,color .15s;
    }
    .hd-hero-back:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .hd-hero-back svg{width:14px;height:14px}
    .hd-hero-title{
      margin:0;min-width:0;flex:1;
      font-family:'Fraunces',serif;font-size:20px;font-weight:600;
      letter-spacing:-.015em;color:var(--ink);line-height:1.2;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .hd-hero-standing{
      flex:none;display:inline-flex;align-items:center;gap:6px;
      font-size:11.5px;font-weight:700;color:var(--green);
      background:var(--green-soft);border-radius:var(--r-pill);padding:3px 11px;
      white-space:nowrap;
    }
    .hd-hero-standing i{width:5px;height:5px;border-radius:50%;background:currentColor}

    /* The inner .mv-tabs kept its own overflow:auto from the earlier
       standalone layout, so a second scrollbar was drawing inside the
       merged row. It no longer scrolls independently — the row does. */
    .mv-tabsbar .mv-tabs{
      overflow:visible;scrollbar-width:none;-ms-overflow-style:none;
    }
    .mv-tabsbar .mv-tabs::-webkit-scrollbar{width:0;height:0;display:none}

    /* the collapsed panel header sits over the corner; make sure it
       can never scroll or draw a bar of its own */
    .armour-library-panel.matter-level .armour-library-panel-head{overflow:visible}

    /* a little more room in the row now that it carries both the trail
       and the tabs */
    .mv-tabsbar{padding-top:2px;padding-bottom:2px}
    .mv-tabsbar .mv-tab{padding:13px 0 12px}
    .mv-trail-inline .mv-trail-current{font-size:16px}

    /* ── back control: says where it goes on hover ──
       A bare chevron doesn't tell you what it returns to, which is the
       one thing you need before clicking. Hovering expands it into a
       labelled control that names the destination — so the breadcrumb
       can stay short without the back action becoming a guess. ── */
    .hd-hero-back{
      display:inline-flex;align-items:center;gap:0;
      width:26px;height:26px;padding:0;overflow:hidden;
      white-space:nowrap;
      transition:width .2s var(--enter),gap .2s var(--enter),
                 border-color .15s,background .15s,color .15s;
    }
    .hd-hero-back svg{flex:none;margin:0 6px}
    .hd-hero-back-label{
      flex:none;font-size:12px;font-weight:700;
      opacity:0;transition:opacity .16s var(--std);padding-right:11px;
    }
    .hd-hero-back:hover,
    .hd-hero-back:focus-visible{
      width:auto;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);
    }
    .hd-hero-back:hover .hd-hero-back-label,
    .hd-hero-back:focus-visible .hd-hero-back-label{opacity:1}

    /* ═══════════════════════════════════════════════════════════
       ROUTE vs CONTENT

       Two different kinds of thing were sharing one line without a
       seam between them:

         Apps / Legal Holds    ← how you ended up here. Route.
         Board Matter 2026-04  ← what you're inside.
         Overview · Holds …    ← its components.

       The last two belong together; the first is a different class of
       information entirely. So the rule now falls between route and
       matter, and the route is set smaller and lighter — an address
       you glance at, not a label you read.
    ═══════════════════════════════════════════════════════════ */
    .mv-route{
      display:flex;align-items:center;gap:5px;flex:none;padding:0;
    }
    .mv-route .mv-trail-link{
      font-size:11.5px;font-weight:600;color:var(--ink-3);
      padding:2px 5px;border-radius:5px;
    }
    .mv-route .mv-trail-link:hover{color:var(--accent);background:var(--accent-soft)}
    .mv-route .mv-trail-sep{font-size:10.5px;color:var(--line-strong)}

    /* the seam */
    .mv-tabsbar-rule{width:1px;height:20px;background:var(--line);flex:none;margin:0 3px}

    /* the matter — the anchor of the right-hand group */
    .mv-tabsbar-title{
      flex:none;font-family:'Fraunces',serif;font-size:17px;font-weight:600;
      letter-spacing:-.015em;color:var(--ink);line-height:1.2;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch;
      margin-right:4px;
    }
    /* its components sit directly under it, visually attached */
    .mv-tabsbar .mv-tabs{margin-left:8px}

    .mv-tabsbar{gap:10px}

    /* ── whole row is the target ──
       The chevron is an affordance hint, not a hit area. Rows take the
       pointer and the hover treatment; the chevron just brightens along
       with them so it still reads as "this goes somewhere". ── */
    .list-table tbody tr{cursor:pointer}
    .list-table tbody tr:hover .list-row-name{color:var(--accent)}
    .list-row-go{pointer-events:none;transition:color .14s,transform .14s var(--std)}
    .list-table tbody tr:hover .list-row-go{color:var(--accent);transform:translateX(2px)}
    /* in-row controls keep their own pointer and stay interactive */
    .list-table tbody tr input,
    .list-table tbody tr label,
    .list-table tbody tr .list-check{cursor:default;pointer-events:auto}

    /* ═══════════════════════════════════════════════════════════
       FOUR TIERS IN THE APPS RAIL

       These aren't one flat list — they're four different kinds of
       thing, and the rail should say so before anyone clicks:

         Records     the nouns the system keeps (Matters, Employees,
                     NCDS). Reference data. Quietest — square icons,
                     neutral ink, no fill.
         Apps        where work actually happens, in custody order.
                     The loudest tier: filled accent tiles.
         Insight     reads across everything above. Green, distinct
                     from both doing and recording.
         Playbooks   orchestration — drives the workflow apps
                     automatically. Amber, and marked as a layer
                     rather than a place.
    ═══════════════════════════════════════════════════════════ */

    .bm-nav-label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .bm-nav-label-hint{
      font:500 9.5px var(--font-sans);letter-spacing:.02em;
      text-transform:none;color:var(--ink-3);opacity:.75;
    }

    /* Inside Apps: three clusters, told apart by a hairline and by the
       icon treatment alone. No sub-headings — the distinction is worth
       showing, not worth a label each. */
    .bm-nav-cluster + .bm-nav-cluster{
      margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
    }

    /* Playbooks is a genuinely separate layer, so it keeps a real break */
    .bm-nav-section + .bm-nav-section{
      margin-top:16px;padding-top:14px;border-top:1px solid var(--line-strong);
    }

    /* ── shared icon tile ── */
    .bm-nav-item-icon{
      transition:background .15s,color .15s,border-radius .15s;
    }

    /* ── 1. Records: quiet, square, neutral — things you look up ── */
    .bm-nav-item.tier-reg .bm-nav-item-icon{
      background:transparent;color:var(--ink-3);
      border:1px solid var(--line-strong);border-radius:5px;
    }
    .bm-nav-item.tier-reg:hover .bm-nav-item-icon{color:var(--ink-2);border-color:var(--ink-3)}
    .bm-nav-item.tier-reg.active .bm-nav-item-icon{color:var(--accent);border-color:var(--accent)}

    /* ── 2. Apps: filled accent — this is where work happens ── */
    .bm-nav-item.tier-work .bm-nav-item-icon{
      background:var(--accent-soft);color:var(--accent);
      border:1px solid transparent;border-radius:8px;
    }
    .bm-nav-item.tier-work:hover .bm-nav-item-icon{background:#7a4fd62e}
    .bm-nav-item.tier-work.active .bm-nav-item-icon{background:var(--accent);color:#fff}

    /* ── 3. Insight: green — reading across, not doing ── */
    .bm-nav-item.tier-insight .bm-nav-item-icon{
      background:var(--green-soft);color:var(--green);
      border:1px solid transparent;border-radius:8px;
    }
    .bm-nav-item.tier-insight.active .bm-nav-item-icon{background:var(--green);color:#fff}

    /* ── 4. Playbooks: amber, pill-shaped to read as a layer that runs
           across the apps rather than another place. Amber rather than
           the --t-play magenta, which this app already uses to mean
           risk — a nav tier must not borrow an alarm colour. ── */
    .bm-nav-item.tier-play .bm-nav-item-icon{
      background:#e0902f1f;color:var(--pb-orange);
      border:1px solid transparent;border-radius:99px;
    }
    .bm-nav-item.tier-play:hover .bm-nav-item-icon{background:#e0902f33}
    .bm-nav-item.tier-play.active .bm-nav-item-icon{background:var(--pb-orange);color:#fff}
    .bm-nav-section.tier-play .bm-nav-label{color:var(--pb-orange)}
    .bm-nav-section.tier-play .bm-nav-label-hint{color:var(--pb-orange);opacity:.7}

    /* active row tint follows its tier instead of always being purple */
    .bm-nav-item.tier-insight.active{background:var(--green-soft);color:var(--green)}
    .bm-nav-item.tier-play.active{background:#e0902f1f;color:var(--pb-orange)}

    /* ── hero tracks: composition, not just a fill ──
       A single bar only answers "how far". A segmented one answers
       "of what" — acknowledged vs pending vs silent, collected vs in
       flight — using the numbers already on the card. Richer reading,
       no new data and no decorative graphics. ── */
    .mv-stat-track.seg{display:flex;gap:2px;height:6px;background:transparent}
    .mv-stat-track.seg i{
      display:block;height:100%;border-radius:var(--r-pill);min-width:2px;
    }
    .mv-stat-track.seg.empty i{background:var(--track)}
    .mv-stat-track.seg.empty.risk i{
      background:repeating-linear-gradient(90deg,#e23d7d40 0 5px,transparent 5px 10px);
    }

    /* the scale line reads the segments out, so colour isn't the only
       carrier of meaning */
    .mv-stat-scale{
      display:flex;align-items:baseline;justify-content:space-between;gap:8px;
      font-size:10px;line-height:1.3;margin-top:-1px;
    }
    .mv-stat-scale b{color:var(--ink-2);font-weight:700;white-space:nowrap}
    .mv-stat-scale span{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .mv-stat{gap:7px}
    .mv-stat-note{margin-top:1px}

    /* ── Details: identical grid and type to the hold's fact strip, so
         a matter record and a hold record read the same. Everything
         shown at once — no reveal link. ── */
    .mv-sec .hold-fact-grid{
      grid-template-columns:repeat(4,minmax(0,1fr));gap:15px 22px;
    }
    @media (max-width:1080px){.mv-sec .hold-fact-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:760px){.mv-sec .hold-fact-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .mv-sec .hold-fact-strip-value{word-break:break-word}

    /* ── column header vs record ──
       The header and the rows were reading at nearly the same weight:
       both on near-white, both with hairline separators. The header is
       a different kind of thing — a label for the column, not data —
       so it now sits on a tinted band, closes with a firm rule, and
       the rows lighten and open up beneath it. ── */
    .list-table thead th{
      background:var(--panel-3);
      color:var(--ink-2);
      font-size:10px;letter-spacing:.07em;
      padding:9px 14px;
      border-bottom:1.5px solid var(--line-strong);
      box-shadow:inset 0 1px 0 var(--line);
    }
    .list-table tbody td{
      padding:14px;border-bottom:1px solid var(--line);
      font-size:13px;color:var(--ink-2);
    }
