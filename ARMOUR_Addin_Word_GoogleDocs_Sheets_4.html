    .studio-hero-hint{color:var(--ink-3);font-size:11.5px}
    .studio-hero-send{
      width:34px;height:34px;flex:none;border-radius:50%;color:#fff;
      background:linear-gradient(135deg,#8b5cf6,#ec4899);
      display:flex;align-items:center;justify-content:center;
    }
    .studio-hero-send svg{width:14px;height:14px}
    .studio-hero-or{text-align:center;color:var(--ink-3);font-size:12.5px;margin:22px 0}
    .studio-hero-scratch-row{display:flex;justify-content:center;margin-bottom:38px}
    .studio-hero-scratch{
      display:inline-flex;align-items:center;gap:8px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink);
      border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:600;
      box-shadow:var(--shadow-card);transition:border-color .15s;
    }
    .studio-hero-scratch:hover{border-color:var(--line-strong)}
    .studio-hero-scratch svg{width:14px;height:14px}
    .studio-template-label{
      font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:14px;
    }
    .studio-template-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .studio-template-card{
      display:flex;align-items:flex-start;gap:16px;text-align:left;
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:20px 22px;box-shadow:var(--shadow-card);
      transition:border-color .15s;
    }
    .studio-template-card:hover{border-color:var(--accent)}
    .studio-template-icon{
      width:38px;height:38px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;
      background:var(--accent-soft);color:var(--accent);margin-top:2px;
    }
    .studio-template-icon svg{width:19px;height:19px}
    .studio-template-title{font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:5px;line-height:1.3}
    .studio-template-desc{font-size:12.5px;color:var(--ink-2);line-height:1.5;font-weight:400}
    @media (max-width:760px){.studio-template-grid{grid-template-columns:1fr}}

    /* ═══ Connectors — same card shell as Templates, plus a status affordance
       (Connected badge or Connect button) that Templates doesn't need ═══ */
    .studio-connector-count{
      color:var(--ink-2);font-weight:800;background:var(--panel-3);
      padding:1px 8px;border-radius:var(--r-pill);margin-left:4px;
    }
    .studio-connector-card{align-items:center}
    .studio-connector-card.is-connected{border-color:#2fb07940;background:#2fb07908}
    .studio-connector-body{flex:1;min-width:0}
    .studio-connector-status{
      display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;
      font:700 11.5px var(--font-sans);
    }
    .studio-connector-status.connected{color:var(--green)}
    .studio-connector-status .dot{width:6px;height:6px;border-radius:99px;background:var(--green);box-shadow:0 0 0 3px #2fb07926}
    .studio-connector-connect{
      flex:none;padding:7px 15px;border-radius:var(--r-pill);border:1px solid var(--line);
      background:var(--panel);color:var(--ink);font:700 12px var(--font-sans);
      transition:border-color .15s,color .15s,background .15s;
    }
    .studio-connector-connect:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

    /* ═══ Admin — Usage tab's static bar strip ═══ */
    .usage-bar-strip{
      display:flex;align-items:flex-end;gap:6px;height:120px;padding:12px 16px;
      background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-card);
    }
    .usage-bar{
      flex:1;height:var(--h);min-height:4px;border-radius:5px 5px 2px 2px;
      background:linear-gradient(180deg,var(--accent),var(--accent) 100%);opacity:.45;
    }
    .usage-bar-today{opacity:1;background:linear-gradient(180deg,var(--accent),var(--magenta))}

    /* ═══ Agents Center — category filter pills + Skill catalog trigger, and
       vibrant, distinctly-colored icon badges per card (rather than one
       repeated tint), inspired by a more colorful agent-gallery look but
       without avatars or person names. ═══ */
    .studio-toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 28px;flex-wrap:wrap}
    .studio-category-pills{display:flex;flex-wrap:wrap;gap:6px}
    .studio-category-pill{
      padding:6px 13px;border-radius:var(--r-pill);border:1px solid var(--line);
      background:var(--panel);color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap;
      transition:background .15s,color .15s,border-color .15s;
    }
    .studio-category-pill:hover{border-color:var(--line-strong)}
    .studio-category-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .skill-hub-trigger{
      display:inline-flex;align-items:center;gap:6px;flex:none;
      padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--line);
      background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:700;
      box-shadow:var(--shadow-card);transition:border-color .15s;
    }
    .skill-hub-trigger:hover{border-color:var(--accent);color:var(--accent)}
    .skill-hub-trigger svg{width:13px;height:13px}
    .studio-template-card.filtered-out{display:none}
    .studio-icon-grad-1{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
    .studio-icon-grad-2{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
    .studio-icon-grad-3{background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff}
    .studio-icon-grad-4{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
    .studio-icon-grad-5{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff}
    .studio-icon-grad-6{background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff}
    .studio-icon-grad-7{background:linear-gradient(135deg,#10b981,#047857);color:#fff}
    .studio-icon-grad-8{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff}

    /* ═══ Skill catalog — a full modal, not a Studio tab. Left list, right
       detail, matching a "reference library" feel rather than a
       build-composer feel, since skills are consulted more than authored. ═══ */
    .skill-hub-overlay{
      display:none;position:fixed;inset:0;z-index:200;
      background:#1c1e2e4d;align-items:center;justify-content:center;padding:32px;
    }
    .skill-hub-overlay.open{display:flex}
    .skill-hub-modal{
      width:min(1100px,100%);height:min(760px,100%);background:var(--panel);
      border-radius:20px;box-shadow:0 24px 64px -20px #1c1e2e59;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .skill-hub-header{
      flex:none;display:flex;align-items:center;justify-content:space-between;
      padding:18px 24px;border-bottom:1px solid var(--line);
    }
    .skill-hub-header-title{
      display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;
      font-size:19px;font-weight:600;color:var(--ink);
    }
    .skill-hub-header-title svg{width:18px;height:18px;color:var(--accent)}
    .skill-hub-header-actions{display:flex;align-items:center;gap:10px}
    .skill-hub-intro{
      flex:none;padding:14px 24px;font-size:13.5px;color:var(--ink-2);line-height:1.5;
      background:var(--panel-3);border-bottom:1px solid var(--line);
    }
    .skill-hub-create-btn{
      display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-pill);
      background:linear-gradient(135deg,var(--accent),var(--magenta));color:#fff;
      font-size:13px;font-weight:700;
    }
    .skill-hub-create-btn svg{width:12px;height:12px}
    .skill-hub-close-btn{
      width:30px;height:30px;border-radius:9px;color:var(--ink-3);display:grid;place-items:center;
      transition:background .15s,color .15s;
    }
    .skill-hub-close-btn:hover{background:var(--panel-3);color:var(--ink)}
    .skill-hub-close-btn svg{width:14px;height:14px}
    .skill-hub-body{flex:1;min-height:0;display:flex}
    .skill-hub-sidebar{
      width:280px;flex:none;overflow-y:auto;padding:16px 10px;
      background:var(--panel-3);border-right:1px solid var(--line);
    }
    .skill-hub-group-label{
      font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);padding:0 8px;margin-bottom:8px;
    }
    .skill-hub-list-item{
      width:100%;display:flex;align-items:center;gap:10px;text-align:left;
      padding:8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);
      margin-bottom:2px;transition:background .15s,color .15s;
    }
    .skill-hub-list-item:hover{background:var(--hover)}
    .skill-hub-list-item.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-card)}
    .skill-hub-list-icon{
      width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
    }
    .skill-hub-list-icon svg{width:13px;height:13px}
    .skill-hub-detail{flex:1;min-width:0;overflow-y:auto;padding:28px 32px}
    .skill-hub-detail-pane{display:none}
    .skill-hub-detail-pane.active{display:block}
    .skill-hub-detail-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
    .skill-hub-detail-icon{
      width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;
    }
    .skill-hub-detail-icon svg{width:21px;height:21px}
    .skill-hub-detail-head h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
    .skill-hub-card{
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:18px 20px;box-shadow:var(--shadow-card);margin-bottom:16px;
    }
    .skill-hub-card-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
    .skill-hub-info-row{font-size:13px;color:var(--ink-2);margin-bottom:6px}
    .skill-hub-info-row:last-child{margin-bottom:0}
    .skill-hub-info-row b{color:var(--ink);font-weight:700}
    .skill-hub-tag{
      display:inline-block;padding:2px 9px;border-radius:var(--r-pill);
      background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;margin-right:4px;
    }
    .skill-hub-card h3{font-size:14px;font-weight:700;color:var(--ink);margin:16px 0 6px}
    .skill-hub-card h3:first-of-type{margin-top:0}
    .skill-hub-card p{font-size:13.5px;color:var(--ink-2);line-height:1.55}
    .skill-hub-card ul{margin:0;padding-left:18px}
    .skill-hub-card li{font-size:13.5px;color:var(--ink-2);line-height:1.7}

    /* Dashboards is now a true top-level section like Apps/Playbooks, so
       #bmViewsSection (its .bm-nav-items) just needs the standard section
       item spacing — no more nested-card treatment, since there's no
       longer a parent it needs to visually connect to. */
    #bmViewsSection .pinned-item{border-radius:7px}
    #bmViewsSection .pinned-item:not(:last-child){border-bottom:none}
    #bmViewsSection .pinned-item:hover{background:var(--hover)}
    .bm-nav #bmViewsSection .pinned-item:hover{background:var(--hover)}

    .bm-nav-filter-wrap{position:relative}
    .bm-nav-filter-btn{
      width:24px;height:24px;border-radius:7px;color:var(--ink-3);display:grid;place-items:center;
      transition:background .15s,color .15s;
    }
    .bm-nav-filter-btn:hover{background:var(--panel);color:var(--ink)}
    .bm-nav-filter-btn.active-filter{color:var(--accent);background:var(--accent-soft)}
    .bm-nav-filter-btn svg{width:12px;height:12px}
    .bm-nav-filter-popover{
      display:none;position:absolute;top:calc(100% + 6px);right:0;width:230px;z-index:20;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow-hover);padding:12px;
    }
    .bm-nav-filter-popover.open{display:block}
    .bm-nav-filter-group-label{
      font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--ink-3);margin:10px 0 6px;
    }
    .bm-nav-filter-group-label:first-child{margin-top:0}
    .bm-nav-filter-popover .bookmarks-filter-dropdown{width:100%}
    .bm-nav-filter-popover .bookmarks-filter-btn{width:100%;justify-content:space-between}
    .bm-nav-filter-popover .bookmarks-filter-menu{position:static;width:100%;box-shadow:none;border:none;padding:2px 0 0;margin-top:4px}

    /* search + sort/filter share one compact row now, instead of stacking
       as two separate rows with the search box on its own below */
    .bm-nav-search-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
    .bm-nav-search-row .bm-nav-search{flex:1;min-width:0;margin-bottom:0}
    .bm-nav-search-row .bm-nav-label-row-actions{flex:none}
    .bm-nav-search{
      display:flex;align-items:center;gap:6px;margin-bottom:10px;
      border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 9px;
    }
    .bm-nav-search svg{width:12px;height:12px;color:var(--ink-3);flex:none}
    .bm-nav-search input{flex:1;border:none;outline:none;background:none;color:var(--ink);font-size:12px}
    .bm-nav-search input::placeholder{color:var(--ink-3)}

    /* saved rows get a compact treatment in the nav — full row detail (tags,
       visibility) stays in the DOM for search/filter to read, just hidden
       visually so the rail stays scannable */
    /* two lines per row, not four — icon sits beside the title (which gets
       the full row width to stay legible), with time as a small line
       directly below. Still half the height of the original 4-line rows,
       and at scale (hundreds of views), title legibility matters more than
       squeezing one more line onto the same row. */
    .bm-nav .pinned-item{
      display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:2px 8px;
      padding:7px 8px;border-radius:8px;background:none;border:none;
    }
    .bm-nav .pinned-item:hover{background:var(--hover)}
    .bm-nav .pinned-item.active{background:var(--accent-soft)}
    .bm-nav .pinned-icon{width:20px;height:20px;flex:none;margin-bottom:0;margin-top:1px}
    .bm-nav .pinned-icon svg{width:10px;height:10px}
    .bm-nav .pinned-body{flex:1;min-width:0}
    .bm-nav .pinned-title{
      font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .bm-nav .pinned-tags{display:none}
    .bm-nav .pinned-right{flex:0 0 100%;display:block;margin-top:0;padding-left:28px}
    .bm-nav .pinned-visibility{display:none}
    .bm-nav .pinned-time{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
    /* stale = not opened in 90+ days — a quiet amber cue, not a loud banner.
       Housekeeping should be noticeable if you're scanning, not intrusive
       if you're not. */
    .bm-nav .pinned-time.stale{color:var(--amber);font-weight:700}
    .bm-nav .pinned-time.stale .pinned-time-icon{color:var(--amber)}
    .bm-nav .pinned-time-icon{width:9px;height:9px;flex:none;display:inline-block;color:var(--ink-3);vertical-align:-1px;margin-right:2px}
    .bm-nav .pinned-meta-sep{font-size:10.5px;color:var(--line);margin:0 4px}
    .bm-nav .pinned-visibility-compact{font-size:10.5px;font-weight:600;white-space:nowrap}
    .bm-nav .pinned-visibility-compact.private{color:var(--ink-3)}
    .bm-nav .pinned-visibility-compact.shared{color:var(--green)}
    .bm-nav .pinned-visibility-compact.public{color:var(--green)}

    .bm-content{
      flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative;
    }
    .bm-empty{
      display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;gap:10px;padding:40px;
    }
    .bm-empty-icon{
      width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);margin-bottom:4px;
    }
    .bm-empty-icon svg{width:16px;height:16px}
    .bm-empty-title{font-size:14px;font-weight:700;color:var(--ink)}
    .bm-empty-sub{font-size:12.5px;color:var(--ink-3);max-width:280px;line-height:1.5}

    .explorer-back{
      display:none;align-items:center;justify-content:center;
      width:26px;height:26px;border-radius:8px;flex:none;
      color:var(--ink-2);transition:background .15s,color .15s;
    }
    .explorer-back:hover{background:var(--panel-3);color:var(--ink)}
    .explorer-back svg{width:15px;height:15px}
    .explorer-back.show{display:flex}

    /* ═══ segment: the shared frame for all three sections — same visual language ═══ */
    .segment{max-width:1100px;margin:0 auto 14px}
    .segment-header{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow-card);padding:13px 16px;
      transition:border-color .15s;
    }
    .segment.segment-open .segment-header{border-radius:14px 14px 0 0}
    .segment-header:hover{border-color:var(--line-strong)}
    .segment-header-static{cursor:default}
    .segment-header-static:hover{border-color:var(--line)}
    .segment-header-left{display:flex;align-items:center;gap:9px}
    .segment-chevron{width:10px;height:10px;color:var(--ink-3);transition:transform .2s}
    .segment.segment-open .segment-chevron{transform:rotate(180deg)}
    .segment-title{font-size:13.5px;font-weight:700;color:var(--ink)}
    .segment-count{
      font-size:10.5px;font-weight:700;color:var(--ink-3);
      background:var(--panel-3);padding:2px 8px;border-radius:var(--r-pill);
    }
    .segment-instructions-btn{
      display:inline-flex;align-items:center;gap:6px;cursor:pointer;
      font-size:11.5px;font-weight:700;color:var(--accent);
      border:1px solid #7a4fd633;background:var(--accent-soft);
      border-radius:var(--r-pill);padding:6px 12px;
      transition:background .15s,border-color .15s;
    }
    .segment-instructions-btn:hover{background:#7a4fd624;border-color:#7a4fd655}
    .segment-instructions-btn svg{width:12px;height:12px}
    .segment-body{
      background:var(--panel);border:1px solid var(--line);border-top:none;
      border-radius:0 0 14px 14px;box-shadow:var(--shadow-card);
      padding:14px;overflow:hidden;
    }
    .pinned-empty{display:none;font-size:12.5px;color:var(--ink-3);text-align:center;padding:20px 10px}
    .pinned-empty.show{display:block}

    /* Bookmarks toolbar — search + quick filter chips, above the list */
    /* Browse — a fixed, honestly-labeled directory of the core entities.
       Distinct from Bookmarks below: no timestamp, no visibility badge,
       because nothing here was actually pinned by anyone. */
    .browse-section{padding:2px 4px 16px}
    .browse-label{
      font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:10px;
    }
    .browse-chips{display:flex;flex-wrap:wrap;gap:8px}
    .browse-chip{
      display:inline-flex;align-items:center;gap:7px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink);
      border-radius:var(--r-pill);padding:8px 14px 8px 10px;font-size:12.5px;font-weight:600;
      transition:border-color .15s,background .15s;
    }
    .browse-chip:hover{border-color:var(--accent);background:var(--accent-soft)}
    .browse-chip-icon{
      width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;
      background:#5c8fff1a;color:#5c8fff;
    }
    .browse-chip-icon svg{width:11px;height:11px}
    .saved-label{
      font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);padding:0 4px;margin-bottom:10px;border-top:1px solid var(--line);
      padding-top:16px;
    }
    .bookmarks-toolbar{display:flex;flex-direction:column;gap:10px;padding:2px 4px 14px}
    .bookmarks-search{
      display:flex;align-items:center;gap:8px;
      border:1px solid var(--line);background:var(--field);border-radius:10px;
      padding:9px 12px;transition:box-shadow var(--standard),border-color var(--standard);
    }
    .bookmarks-search:focus-within{box-shadow:0 0 0 2px var(--accent-soft);border-color:transparent}
    .bookmarks-search svg{width:14px;height:14px;color:var(--ink-3);flex:none}
    .bookmarks-search input{flex:1;border:none;outline:none;background:none;color:var(--ink);font-size:13px}
    .bookmarks-search input::placeholder{color:var(--ink-3)}
    .bookmarks-filter-row{display:flex;flex-wrap:wrap;gap:10px}
    .bookmarks-filter-dropdown{position:relative}
    .bookmarks-filter-btn{
      display:inline-flex;align-items:center;gap:7px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
      border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;
      transition:border-color .15s,color .15s;
    }
    .bookmarks-filter-btn:hover{border-color:var(--accent);color:var(--ink)}
    .bookmarks-filter-btn svg:first-child{width:13px;height:13px;color:var(--accent);flex:none}
    .bookmarks-filter-btn svg:last-child{width:10px;height:10px;color:var(--ink-3);flex:none}
    .bookmarks-filter-menu{
      display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:210px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow-hover);padding:6px;z-index:60;
    }
    .bookmarks-filter-menu.open{display:block}
    .bookmarks-filter-option{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink);
      text-align:left;transition:background .15s;
    }
    .bookmarks-filter-option:hover{background:var(--panel-3)}
    .bookmarks-filter-option.active{color:var(--accent)}
    .bookmarks-filter-check{width:12px;height:12px;flex:none;color:var(--accent);visibility:hidden}
    .bookmarks-filter-option.active .bookmarks-filter-check{visibility:visible}

    /* Needs your attention — cross-entity, always visible, no explore needed */
    .attn-list{display:flex;flex-direction:column;gap:2px}
    .attn-item{
      position:relative;display:flex;align-items:center;gap:12px;
      padding:10px 14px 10px 18px;transition:background var(--standard);
      border-radius:8px;
    }
    .attn-item:not(:last-child){border-bottom:1px solid var(--line)}
    .attn-item:hover{background:var(--panel-3)}
    .attn-item::before{
      content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
    }
    .attn-item.sev-critical::before{background:var(--magenta)}
    .attn-item.sev-warning::before{background:var(--amber)}
    .attn-item.sev-info::before{background:#5c8fff}
    .attn-item.sev-success::before{background:var(--green)}
    .attn-icon{
      width:28px;height:28px;flex:none;border-radius:8px;
      display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
    }
    .attn-icon.blue{background:#5c8fff1a;color:#5c8fff}
    .attn-icon.pink{background:var(--magenta-soft);color:var(--magenta)}
    .attn-icon svg{width:15px;height:15px}
    .attn-body{flex:1;min-width:0}
    .attn-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
    .attn-meta{font-size:11.5px;color:var(--ink-3)}
    .attn-right{display:flex;align-items:center;gap:10px;flex:none}
    .attn-tag{
      font-size:10.5px;font-weight:700;letter-spacing:.03em;
      padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap;
      background:#5c8fff1a;color:#5c8fff;
    }
    .attn-tag.tag-critical{background:var(--magenta-soft);color:var(--magenta)}
    .attn-tag.tag-warning{background:#e0902f1f;color:var(--amber)}
    .attn-tag.tag-success{background:#2fb0791a;color:var(--green)}
    .attn-time{font-size:11.5px;color:var(--ink-3);white-space:nowrap;min-width:64px;text-align:right}

    /* inside the (still fairly narrow) Needs your attention overlay, stack right-side
       content below the title/meta instead of squeezing everything into one row */
    .col-overlay .attn-item{align-items:flex-start;flex-wrap:wrap;padding:12px 14px 12px 18px}
    .col-overlay .attn-right{flex:1 1 100%;display:flex;flex-direction:row;justify-content:space-between;margin-top:6px;margin-left:40px}
    .col-overlay .attn-time{min-width:0;text-align:left}

    /* inline Instructions toggle inside the Needs your attention overlay */
    .attn-instructions-toggle{
      width:100%;display:flex;align-items:center;gap:8px;
      margin-top:16px;padding:11px 4px;border-top:1px solid var(--line);
      font-size:12.5px;font-weight:700;color:var(--accent);text-align:left;
    }
    .attn-instructions-toggle svg:first-child{width:13px;height:13px;flex:none}
    .attn-instructions-chevron{width:10px;height:10px;margin-left:auto;flex:none;transition:transform .2s}
    .attn-instructions-toggle.open .attn-instructions-chevron{transform:rotate(180deg)}
    .attn-instructions-inline{
      display:none;overflow:hidden;padding-top:4px;
    }
    .attn-instructions-inline.show{display:block}

    /* Pinned — same row-based visual language as Needs your attention */
    .pinned-list{display:flex;flex-direction:column}
    .pinned-item{
      width:100%;display:flex;align-items:center;gap:12px;text-align:left;
      padding:10px 14px 10px 18px;border-radius:8px;transition:background var(--standard);
    }
    .pinned-item:not(:last-child){border-bottom:1px solid var(--line)}
    .pinned-item:hover{background:var(--panel-3)}
    .pinned-icon{
      width:28px;height:28px;flex:none;border-radius:8px;
      display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
    }
    .pinned-icon svg{width:14px;height:14px}
    .pinned-icon-dashboard{background:color-mix(in srgb, var(--green) 16%, transparent);color:var(--green)}
    .pinned-icon-module{background:#5c8fff1a;color:#5c8fff}
    .pinned-icon-saved{background:var(--accent-soft);color:var(--accent)}
    .pinned-body{flex:1;min-width:0}
    .pinned-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px}
    .pinned-tags{display:flex;gap:6px;flex-wrap:wrap}
    .pinned-tag{
      font-size:10px;font-weight:700;color:var(--ink-2);background:var(--panel-3);
      padding:2px 8px;border-radius:var(--r-pill);
    }
    .pinned-tag-dashboard{color:var(--green);background:color-mix(in srgb, var(--green) 14%, transparent)}
    .pinned-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
    .pinned-visibility{
      font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);
      padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap;
    }
    .pinned-visibility-shared{color:var(--green);background:#2fb0791a}
    .pinned-time{font-size:11px;color:var(--ink-3);white-space:nowrap}
    .pinned-owner{
      font-size:9.5px;font-weight:700;color:var(--ink-2);background:var(--panel-3);
      width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    }

    /* dynamic view — result of a "Something else" query, not a fixed pane */
    .dynamic-view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .dynamic-view-title{font-size:13px;font-weight:700;color:var(--ink)}
    .dynamic-view-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
    .dynamic-save-btn{padding:7px 14px;font-size:11.5px}
    .dynamic-save-btn.saved{color:var(--green);border-color:#2fb07955;background:#2fb0791a}

    /* "Show query" — the transparency panel: what got resolved from the
       typed sentence into structured criteria, including where the system
       had to interpret an ambiguous term (called out explicitly, not hidden) */
    .dynamic-view-sub-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .show-query-toggle{
      display:inline-flex;align-items:center;gap:5px;
      font-size:11.5px;font-weight:700;color:var(--accent);
    }
    .show-query-toggle:hover{text-decoration:underline}
    .show-query-chevron{width:9px;height:9px;transition:transform .2s}
    .show-query-toggle.open .show-query-chevron{transform:rotate(180deg)}
    .show-query-panel{
      display:none;margin:0 16px 14px;padding:14px 16px;
      background:var(--panel-3);border:1px solid var(--line);border-radius:12px;
    }
    .show-query-panel.open{display:block}
    .show-query-row{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:10px}
    .show-query-row:last-child{margin-bottom:0}
    .show-query-label{
      flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--ink-3);width:100%;margin-bottom:2px;
    }
    .show-query-chip{
      display:inline-flex;align-items:center;gap:5px;
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-pill);
      padding:5px 10px;font-size:11.5px;color:var(--ink);
    }
    .show-query-chip b{font-weight:700}
    .show-query-chip .op{color:var(--ink-3);font-weight:600}
    .show-query-interpreted{
      display:flex;align-items:flex-start;gap:7px;
      background:#e0902f14;border:1px solid #e0902f3a;border-radius:9px;
      padding:8px 10px;font-size:11.5px;color:var(--ink);line-height:1.5;margin-top:2px;
    }
    .show-query-interpreted svg{width:12px;height:12px;color:var(--amber);flex:none;margin-top:2px}
    .show-query-empty{font-size:12px;color:var(--ink-3);line-height:1.5}

    /* dashboards — a grid of small self-contained widgets, built the same
       way a table is (staged narration + skeleton), just a different output shape */
    .dash-head{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      margin-bottom:14px;
    }
    .dash-head-title{font-size:14px;font-weight:700;color:var(--ink)}
    .dash-head-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
    .dash-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;
    }
    .dash-widget{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      box-shadow:var(--shadow-card);padding:16px;
    }
    .dash-widget-wide{grid-column:span 2}
    @media (max-width:700px){ .dash-widget-wide{grid-column:span 1} }
    .dash-widget-title{
      font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:10px;
    }
    .dash-widget-value{font-size:28px;font-weight:700;color:var(--ink);line-height:1.1}
    .dash-widget-sub{font-size:11.5px;color:var(--ink-3);margin-top:6px}
    .dash-widget-rate-row{display:flex;align-items:center;gap:10px}
    .dash-widget-ring{
      width:40px;height:40px;flex:none;border-radius:50%;
      background:conic-gradient(var(--ring-color) calc(var(--pct)*1%), var(--panel-3) 0);
      -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
      mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    }
    .dash-widget-rate-num{font-size:22px;font-weight:700;color:var(--ink)}
    .dash-dist-list{display:flex;flex-direction:column;gap:9px}
    .dash-dist-row{display:flex;align-items:center;gap:10px}
    .dash-dist-label{flex:none;width:64px;font-size:11.5px;color:var(--ink-2);font-weight:600}
    .dash-dist-bar-track{flex:1;height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
    .dash-dist-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#7a4fd6,#e23d7d)}
    .dash-dist-value{flex:none;width:36px;text-align:right;font-size:11.5px;font-weight:700;color:var(--ink)}
    .dash-sparkline{width:100%;height:60px;display:block}
    .dash-sparkline-labels{
      display:flex;justify-content:space-between;margin-top:4px;
      font-size:9.5px;color:var(--ink-3);
    }

    /* the "building" state — shown while the agent's staged progress plays out on the left */
    .dynamic-skeleton{
      display:none;background:var(--panel);border:1px solid var(--line);
      border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px;
    }
    .dynamic-skeleton.show{display:block}
    .dynamic-skeleton-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .skeleton-bar,.skeleton-row{
      border-radius:8px;
      background:linear-gradient(90deg,var(--panel-3) 25%,var(--line) 37%,var(--panel-3) 63%);
      background-size:400% 100%;
      animation:skeletonShimmer 1.4s ease-in-out infinite;
    }
    .skeleton-row{height:40px;margin-bottom:10px}
    .skeleton-row:last-child{margin-bottom:0}
    @keyframes skeletonShimmer{0%{background-position:100% 50%}100%{background-position:0% 50%}}

    .sum-pref-field{margin-bottom:10px}
    .sum-pref-field:last-of-type{margin-bottom:0}
    .sum-pref-field-label{
      font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:5px;
    }
    .sum-pref-input{
      flex:1;border:1px solid var(--line);background:var(--field);color:var(--ink);
      border-radius:9px;padding:8px 10px;font-size:12.5px;outline:none;
    }
    .sum-pref-input:focus{box-shadow:0 0 0 2px var(--accent-soft);border-color:transparent}
    .sum-pref-input::placeholder{color:var(--ink-3)}

    /* pane entrance — a plain crossfade + gentle scale, not a literal
       geometric FLIP. Scaling real text by 15x+ (row height → full table)
       renders blurry for the whole transition then snaps sharp at the end,
       which reads as janky. A parallel crossfade stays sharp throughout.
       Panes now swap in place within the persistent Bookmarks nav, so
       there's no separate "exit" animation — the next pane's entrance is
       the only motion needed. */
    .explorer-pane.active{transition:opacity .28s var(--enter),transform .28s var(--enter)}
    .explorer-pane.pane-enter{opacity:0;transform:translateY(8px) scale(.985)}
    .explorer-pane.pane-exit{opacity:0;transform:translateY(6px) scale(.99)}

    /* the expanding pane itself — FLIP animation is applied via inline transform in JS */
    .explorer-pane-wrap{margin-top:0;width:100%;display:flex;flex-direction:column;flex:1;min-height:0}
    .explorer-pane{display:none;width:100%;transform-origin:top left;will-change:transform,opacity}
    .explorer-pane.active{display:flex;flex-direction:column;flex:1;min-height:0}

    /* ═══════════════════════════════════════
       LIST-STYLE PANE CONTENT — shared by every Explorer pane
       (ask bar, [bulk bar], then one unified card:
        chips + count as its header, dense table as its body)
    ═══════════════════════════════════════ */

    /* two-column layout: a persistent chat sidebar for refining, and the table
       itself. The ask bar is no longer a one-shot input above the table — it's
       a running conversation you keep building on. Stretch so the sidebar
       always matches the table's full height, not just its own content. */
    .pane-split{display:flex;width:100%;gap:0;align-items:stretch;flex:1;min-height:0}
    .pane-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--panel);padding:16px}
    /* while scoped to a real list/hold, there's no "fresh view" to show in
       the middle — collapse that whole pane away instead of leaving an
       empty gap between chat and the table it's actually scoped to */
    .pane-split.scope-mid-hidden > .pane-main,
    .pane-split.scope-mid-hidden > .pane-resize-handle{display:none}
    /* The session's "fresh view" pane only has something in it once a query
       builds a table. Until then it's an empty column stealing width from
       chat — so it collapses, and chat gets the full page the way it does
       before any artifact exists. */
    .pane-split.mid-empty > #armourSessionPaneMain,
    .pane-split.mid-empty > .pane-resize-handle{display:none}
    /* the ARMOUR session sits inside the Library layout, which already has
       its own chat ↔ table handle. Its internal chat ↔ middle-pane handle
       is a second, redundant divider a few pixels away, and with the middle
       pane hidden it has nothing left to resize — so it's never shown.
       Keyed off the element itself rather than an ancestor class, so it
       can't be defeated by DOM nesting surprises. */
    #armourSessionChatPanel + .pane-resize-handle{display:none}

    .pane-chat{
      flex:none;width:270px;
      background:var(--panel);
      border:none;border-right:1px solid var(--line);
      border-radius:0;box-shadow:none;
      display:flex;flex-direction:column;overflow:hidden;
      transition:width .28s var(--enter);
    }
    .pane-chat-head{
      flex:none;display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;border-bottom:1px solid var(--line);
      background:none;
    }
    .pane-chat-head-title{
      display:flex;align-items:center;gap:6px;
      font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
      color:var(--ink-3);white-space:nowrap;
    }
    .pane-chat-head-title svg{width:12px;height:12px;color:var(--ink-3);flex:none}
    /* "Chat about this list/hold" — lives in the list-card header or
       hold-detail's own header, not the chat panel. "Chat about this
       list" before engagement, "Chatting about Holds" once clicked, so
       the chat's own wording changes to match rather than a separate
       always-on badge inside the chat itself. */
    /* the primary action on a list — solid accent so it outranks "+ New",
       since connecting a list to ARMOUR Chat is the more common intent */
    .list-chat-scope-cta{
      display:inline-flex;align-items:center;gap:7px;margin-right:8px;padding:8px 16px;
      border-radius:var(--r-pill);position:relative;
      font:800 12.5px var(--font-sans);letter-spacing:0;
      color:#fff;background:linear-gradient(115deg,var(--accent) 0%,#9b5cf0 45%,var(--magenta) 100%);
      white-space:nowrap;border:none;cursor:pointer;
      box-shadow:0 4px 14px -4px #7a4fd680, 0 0 0 0 #7a4fd659;
      animation:ctaGlow 2.6s var(--enter) infinite;
      transition:filter .15s,box-shadow .15s,transform .15s;
    }
    /* a slow ambient pulse — enough to read as "this is the AI action"
       without becoming a distraction while you're reading the table */
    @keyframes ctaGlow{
      0%,100%{box-shadow:0 4px 14px -4px #7a4fd680, 0 0 0 0 #7a4fd659}
      50%    {box-shadow:0 4px 18px -4px #7a4fd6a6, 0 0 0 5px #7a4fd600}
    }
    @media (prefers-reduced-motion:reduce){
      .list-chat-scope-cta{animation:none}
    }
    .list-chat-scope-cta::before{
      content:"";width:13px;height:13px;flex:none;background:currentColor;
      -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.5L9.4 5.8 13.7 7.2 9.4 8.6 8 12.9 6.6 8.6 2.3 7.2 6.6 5.8 8 1.5Z'/></svg>") center/contain no-repeat;
              mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.5L9.4 5.8 13.7 7.2 9.4 8.6 8 12.9 6.6 8.6 2.3 7.2 6.6 5.8 8 1.5Z'/></svg>") center/contain no-repeat;
    }
        .list-chat-scope-cta:hover{
      filter:brightness(1.07);transform:translateY(-1px);animation:none;
      box-shadow:0 8px 22px -6px #7a4fd6cc, 0 0 0 4px #7a4fd626;
    }
    .list-chat-scope-cta.active{
      color:var(--green);background:#2fb0791a;cursor:default;box-shadow:none;
      animation:none;transform:none;font-weight:700;
    }
    .list-chat-scope-cta.active:hover{background:#2fb0791a;color:var(--green);filter:none;box-shadow:none;transform:none}
    .list-chat-scope-cta.active::before{
      width:5px;height:5px;border-radius:99px;-webkit-mask:none;mask:none;
      background:var(--green);
    }
    .pane-chat-collapse{
      width:24px;height:24px;flex:none;border-radius:7px;color:var(--ink-3);
      display:grid;place-items:center;transition:background .15s,color .15s,transform .2s;
    }
    .pane-chat-collapse:hover{background:var(--panel-3);color:var(--ink)}
    .pane-chat-collapse svg{width:11px;height:11px}

    .pane-chat-log,
    .pane-chat-composer{transition:opacity .15s var(--enter)}
    .pane-chat-disclaimer{
      flex:none;padding:0 12px 10px;font-size:10.5px;color:var(--ink-3);
      text-align:center;line-height:1.4;
    }
    .pane-chat.collapsed .pane-chat-disclaimer{display:none}

    /* ═══ Dynamic-view "Edit" — replaces "Chat about this list" for
       ARMOUR-built custom views: swaps the chat pane for a field/filter
       builder instead of opening a new conversation, since you're already
       chatting. Same sliding-panes technique as elsewhere in this app. ═══ */
    .dynamic-chat-pane{position:relative;overflow:hidden}
    .dv-slide{
      position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;
      transition:transform .32s var(--enter),opacity .24s var(--enter);
    }
    .dv-slide-chat{transform:translateX(0);opacity:1}
    .dv-slide-edit{transform:translateX(100%);opacity:0;pointer-events:none}
    .dynamic-chat-pane.editing .dv-slide-chat{transform:translateX(-100%);opacity:0;pointer-events:none}
    .dynamic-chat-pane.editing .dv-slide-edit{transform:translateX(0);opacity:1;pointer-events:auto}

    .dv-edit-head{
      flex:none;display:flex;align-items:center;justify-content:space-between;
      padding:10px 12px;border-bottom:1px solid var(--line);
    }
    .dv-edit-title{font:800 13px var(--font-sans);color:var(--ink)}
    .dv-edit-back{
      display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--font-sans);
      color:var(--ink-2);padding:5px 8px;border-radius:7px;
    }
    .dv-edit-back:hover{background:var(--panel-3);color:var(--ink)}
    .dv-edit-back svg{width:10px;height:10px}
    .dv-edit-body{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:18px}
    .dv-section-label{
      font:800 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:8px;
    }
    .dv-field-chip-row{display:flex;flex-wrap:wrap;gap:6px}
    .dv-field-chip{
      display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r-pill);
      border:1px dashed var(--line-strong);background:var(--panel);font:700 11.5px var(--font-sans);
      color:var(--ink-2);cursor:grab;transition:border-color .15s,background .15s,color .15s;
    }
    .dv-field-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .dv-field-chip svg{width:9px;height:9px}
    .dv-field-chip.dragging{opacity:.35}
    .dv-shown-list{
      display:flex;flex-direction:column;gap:6px;min-height:40px;padding:7px;
      border:1px solid var(--line);border-radius:10px;background:var(--panel-3);
    }
    .dv-shown-list.drop-hover{border-color:var(--accent);background:var(--accent-soft)}
    .dv-shown-item{
      display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;background:var(--panel);
      border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink);cursor:grab;
    }
    .dv-shown-item.dragging{opacity:.35}
    .dv-grip{color:var(--ink-3);flex:none;display:flex}
    .dv-grip svg{width:10px;height:10px}
    .dv-remove{margin-left:auto;width:17px;height:17px;border-radius:5px;color:var(--ink-3);display:grid;place-items:center;flex:none}
    .dv-remove:hover{background:var(--magenta-soft);color:var(--magenta)}
    .dv-remove svg{width:8px;height:8px}
    .dv-filter-chip{
      display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;
      background:var(--accent-soft);font-size:11.5px;color:var(--accent-deep,var(--accent));font-weight:700;
    }
    .dv-add-filter-btn{
      display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;
      border:1px dashed var(--line-strong);font:700 11.5px var(--font-sans);color:var(--ink-2);
      margin-top:6px;align-self:flex-start;
    }
    .dv-add-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
    .dv-add-filter-btn svg{width:10px;height:10px}
    .dv-new-filter-row{display:flex;gap:5px;margin-top:6px}
    .dv-new-filter-row select{
      flex:1;min-width:0;padding:6px 7px;border-radius:6px;border:1px solid var(--line);
      font:600 11px var(--font-sans);color:var(--ink);background:var(--panel);
    }
    .dv-sort-select{
      padding:8px 10px;border-radius:9px;border:1px solid var(--line);font:700 11.5px var(--font-sans);
      color:var(--ink);background:var(--panel);width:100%;
    }
    .dv-edit-foot{flex:none;padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
    .dv-edit-foot .dash-btn{flex:1;text-align:center;justify-content:center}
    .dynamic-view-editing-banner{
      display:none;align-items:center;gap:7px;padding:8px 22px;background:var(--accent-soft);color:var(--accent);
      font:700 11.5px var(--font-sans);border-bottom:1px solid var(--line);
    }
    .dynamic-view-editing-banner svg{width:11px;height:11px}
    .list-card.dv-editing .dynamic-view-editing-banner{display:flex}
    /* Edit is a plain, common button (dash-btn) — not the AI-gradient
       style used for "Work with ARMOUR Chat". Its "active" state means
       "currently editing" (reversible), so it inverts to solid ink
       rather than looking like a confirmed/connected state. */
    #dynamicEditBtn.active, #armourEditBtn.active{
      color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:none;
    }
    #dynamicEditBtn.active:hover, #armourEditBtn.active:hover{background:var(--ink);color:#fff;transform:none;box-shadow:none}

    /* structured, bubble-free summary — for the moment the agent delivers a
       finished result, not a single sentence in a bubble but a short scannable
       header + bullet list, each line sparkle-marked */
    .pane-chat-summary{padding:2px 4px 4px}
    .pane-chat-summary-header{
      display:flex;align-items:flex-start;gap:7px;
      font-size:13px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:6px;
    }
    .pane-chat-summary-header svg{width:12px;height:12px;color:var(--accent);flex:none;margin-top:3px}
    .pane-chat-summary-list{display:flex;flex-direction:column;gap:4px}
    .pane-chat-summary-item{
      display:flex;align-items:flex-start;gap:7px;
      font-size:13px;color:var(--ink-2);line-height:1.5;
    }
    .pane-chat-summary-item svg{width:10px;height:10px;color:var(--accent);flex:none;margin-top:4px}
    .pane-chat.collapsed{width:10px;cursor:pointer;background:var(--line);transition:background .15s,width .15s}
    .pane-chat.collapsed:hover{background:var(--accent)}
    .pane-chat.collapsed .pane-chat-log,
    .pane-chat.collapsed .pane-chat-suggest-bar,
    .pane-chat.collapsed .pane-chat-composer,
    .pane-chat.collapsed .pane-chat-head{display:none}
    /* the "ARMOUR" label above the session chat is redundant in wide mode
       — the whole column is obviously ARMOUR — so only the scope chip
       stays, and just when there's actually a scope to show */
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-head,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-head{
      border-bottom:none;padding:14px 22px 0;max-width:820px;margin:0 auto;width:100%;
    }
    .wsrow:not(.wsrow-lib-table) #armourSessionChatPanel .pane-chat-head-title,
    .pane-split.mid-empty #armourSessionChatPanel .pane-chat-head-title{display:none}

    .pane-chat-log{
      flex:1;min-height:80px;overflow-y:auto;
      padding:16px 16px 6px;display:flex;flex-direction:column;gap:16px;
    }
    .pane-chat-suggest-bar{flex:none;padding:12px 14px;border-top:1px solid var(--line)}
    .pane-chat-suggest-label{
      font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:8px;
    }
    .pane-chat-suggestions{display:flex;flex-wrap:wrap;gap:6px}
    .pane-chat-suggestion{
      border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
      border-radius:var(--r-pill);padding:5px 10px;font-size:11px;font-weight:600;
      transition:border-color .15s,color .15s;
    }
    .pane-chat-suggestion:hover{border-color:var(--accent);color:var(--accent)}
    .pane-chat-msg{display:flex;gap:8px;align-items:flex-start}
    .pane-chat-msg-user{flex-direction:row-reverse}
    .pane-chat-avatar{
      width:auto;height:auto;flex:none;margin-top:3px;
      background:none;color:var(--accent);
      display:grid;place-items:center;
    }
    .pane-chat-avatar svg{width:12px;height:12px;color:var(--accent)}
    .pane-chat-bubble{
      font-size:13px;line-height:1.5;color:var(--ink);max-width:200px;
    }
    .pane-chat-msg-user .pane-chat-bubble{
      background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;
      padding:9px 14px;border-radius:14px;font-weight:600;
    }
    .pane-chat-msg-user .pane-chat-bubble{border-top-right-radius:4px}

    .pane-chat-typing .pane-chat-bubble{display:flex;align-items:center;gap:4px;height:16px}
    .pane-chat-typing-dot{
      width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.3;
      animation:paneTypingDot 1.1s ease-in-out infinite;
    }
    .pane-chat-typing-dot:nth-child(2){animation-delay:.18s}
    .pane-chat-typing-dot:nth-child(3){animation-delay:.36s}
    @keyframes paneTypingDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

    .pane-chat-composer{
      flex:none;border-top:1px solid var(--line);padding:10px;
      display:flex;align-items:flex-end;gap:8px;
    }
    .pane-chat-input{
      flex:1;border:1px solid var(--line);background:var(--field);color:var(--ink);
      border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;
      outline:none;resize:none;min-height:76px;max-height:160px;
      transition:box-shadow var(--standard),border-color var(--standard);
    }
    .pane-chat-input:focus{box-shadow:0 0 0 2px var(--accent-soft);border-color:transparent}
    .pane-chat-input::placeholder{color:var(--ink-3)}
    .pane-chat-send{
      cursor:pointer;color:#fff;flex:none;
      background:linear-gradient(135deg,#8b5cf6,#ec4899);
      border-radius:50%;width:28px;height:28px;display:grid;place-items:center;
    }
    .pane-chat-send svg{width:13px;height:13px}

    /* the "organizing" transition — rows leaving/entering fade+scale instead of snapping */
    .list-table tbody tr{transition:opacity .28s var(--enter),transform .28s var(--enter)}
    .list-table tbody tr.row-leaving{opacity:0;transform:scale(.98) translateY(-2px)}
    .list-table tbody tr.row-entering{opacity:0;transform:scale(.98) translateY(4px)}
    .dash-widget{transition:opacity .28s var(--enter),transform .28s var(--enter)}
    .dash-widget.row-entering{opacity:0;transform:scale(.98) translateY(4px)}

    /* pagination footer — shared by every table */
    .list-pagination{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:11px 16px;border-top:1px solid var(--line);
    }
    .list-pagination-text{font-size:11.5px;color:var(--ink-3)}
    .list-pagination-btns{display:flex;align-items:center;gap:6px}
    .list-page-btn{
      display:grid;place-items:center;width:26px;height:26px;border-radius:8px;
      border:1px solid var(--line);color:var(--ink-2);transition:background .15s,color .15s,opacity .15s;
    }
    .list-page-btn:hover:not(:disabled){background:var(--panel-3);color:var(--ink)}
    .list-page-btn:disabled{opacity:.35;cursor:default}
    .list-page-btn svg{width:12px;height:12px}
    .list-page-current{font-size:11.5px;font-weight:700;color:var(--ink);min-width:16px;text-align:center}

    @media (max-width:900px){
      .pane-split{flex-direction:column}
      .pane-chat{width:100%;max-height:280px;position:static}
      .pane-chat.collapsed{width:100%;max-height:10px}
    }

    .list-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .list-chip{
      border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
      border-radius:var(--r-pill);padding:6px 11px;font-size:11.5px;font-weight:600;
      transition:border-color .15s,color .15s;
    }
    .list-chip:hover{border-color:var(--accent);color:var(--accent)}
    .list-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}


    /* attachment is already communicated by the "Working on · X" chip and
       the context note — a colored seam on top of that read as chat and
       the table being two separate boxes stitched together rather than
       one continuous, interconnected surface. Plain divider, same as any
       other panel boundary in the app. */

    /* ═══ chat-emitted filters are the SAME artifact as manual ones —
       inspectable, removable, stackable. Chat drives the controls that
       already exist instead of running a parallel invisible system. ═══ */
    .active-filter-row{
      display:none;align-items:center;flex-wrap:wrap;gap:7px;
      padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel-3);
    }
    .active-filter-row.has-filters{display:flex}
    .active-filter-label{
      font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-3);margin-right:2px;
    }
    .filter-pill{
      display:inline-flex;align-items:center;gap:6px;padding:5px 7px 5px 11px;
      border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);
      font:700 11.5px var(--font-sans);
    }
    .filter-pill.from-chat::before{
      content:"";width:11px;height:11px;flex:none;
      background:currentColor;opacity:.75;
      -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.5L9.4 5.8 13.7 7.2 9.4 8.6 8 12.9 6.6 8.6 2.3 7.2 6.6 5.8 8 1.5Z'/></svg>") center/contain no-repeat;
              mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.5L9.4 5.8 13.7 7.2 9.4 8.6 8 12.9 6.6 8.6 2.3 7.2 6.6 5.8 8 1.5Z'/></svg>") center/contain no-repeat;
    }
    .filter-pill-x{
      width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
      color:var(--accent);opacity:.55;flex:none;transition:opacity .15s,background .15s;
    }
    .filter-pill-x:hover{opacity:1;background:#ffffff8c}
    .filter-pill-x svg{width:8px;height:8px}
    .filter-clear-all{
      font:700 11px var(--font-sans);color:var(--ink-3);
      padding:4px 8px;border-radius:var(--r-pill);margin-left:2px;
    }
    .filter-clear-all:hover{background:var(--hover);color:var(--ink)}

    /* a view-changing turn is a receipt, not prose — visibly different
       from an answer, so "what it did" never reads like "what it said" */
    .chat-receipt{
      display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;
      background:var(--panel-3);border:1px solid var(--line);
      font:600 12px var(--font-sans);color:var(--ink-2);margin:2px 0;
    }
    .chat-receipt-icon{display:flex;flex:none;color:var(--accent)}
    .chat-receipt-icon svg{width:12px;height:12px}
    .chat-receipt-count{margin-left:auto;font-weight:700;color:var(--ink);white-space:nowrap}
    .chat-receipt-undo{
      font:700 11px var(--font-sans);color:var(--accent);
      padding:3px 8px;border-radius:var(--r-pill);flex:none;
    }
    .chat-receipt-undo:hover{background:var(--accent-soft)}

    /* bulk action bar — appears when rows are selected, itself agentic */
    .list-bulkbar{
      display:none;align-items:center;gap:10px;
      background:var(--ink);color:#fff;border-radius:14px;
      padding:10px 10px 10px 16px;margin-top:14px;
    }
    .list-bulkbar.show{display:flex}
    .list-bulkbar-count{font-size:12.5px;font-weight:700;white-space:nowrap}
    .list-bulkbar input{
      flex:1;border:1px solid #ffffff33;background:#ffffff14;border-radius:9px;
      color:#fff;font-size:12.5px;padding:7px 10px;outline:none;
    }
    .list-bulkbar input::placeholder{color:#ffffff8c}
    .list-bulkbar-actions{display:flex;gap:6px;flex:none}
    .list-bulkbar-btn{
      font-size:11.5px;font-weight:700;color:#fff;border:1px solid #ffffff33;
      border-radius:8px;padding:6px 10px;white-space:nowrap;transition:background .15s;
    }
    .list-bulkbar-btn:hover{background:#ffffff1f}

    /* unified card: chips+count header, table as body — one bounded component */
    .list-card{
      margin-top:0;background:var(--panel);border:1px solid var(--line);
      border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;
      display:flex;flex-direction:column;flex:1;min-height:0;
    }
    .list-card-head{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:12px 16px;border-bottom:1px solid var(--line);
    }
    .list-card-head .list-chips{margin-top:0}

    /* ═══ Inline "Ask about this list" — opens in place, right where the
       table already is. No view switch, no relocation, nothing "opens
       elsewhere." Minimized to a single input row until a real question
       is asked; only then does a history entry appear, and the answer
       visibly acts on the table itself instead of just describing it. ═══ */
    .list-inline-ask{
      display:none;flex-direction:column;border-bottom:1px solid var(--line);
      background:var(--panel-3);
    }
    .list-inline-ask.open{display:flex}
    .list-inline-ask-thread{
      display:none;flex-direction:column;gap:10px;padding:12px 16px;
      max-height:220px;overflow-y:auto;
    }
    .list-inline-ask-turn{display:flex;flex-direction:column;gap:6px}
    .list-inline-ask-q{
      align-self:flex-end;max-width:82%;padding:8px 12px;border-radius:12px 12px 3px 12px;
      background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;
    }
    .list-inline-ask-a{
      align-self:flex-start;max-width:88%;padding:8px 12px;border-radius:12px 12px 12px 3px;
      background:var(--panel);border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;
      display:flex;align-items:center;gap:7px;
    }
    .list-inline-ask-a svg{width:12px;height:12px;color:var(--accent);flex:none}
    .list-inline-ask-row{display:flex;align-items:center;gap:9px;padding:11px 16px}
    .list-inline-ask-row .agent-icon{width:14px;height:14px;color:var(--ink-3);flex:none}
    .list-inline-ask-row input{
      flex:1;min-width:0;border:none;outline:none;font-size:12.5px;color:var(--ink);
      background:none;font-family:inherit;
    }
    .list-inline-ask-row input::placeholder{color:var(--ink-3)}
    .list-inline-ask-send{
      width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;
      background:linear-gradient(135deg,var(--accent),var(--magenta));
    }
    .list-inline-ask-send svg{width:11px;height:11px}
    /* the answer acting on the table — matching rows highlight, the rest
       fade back, rather than the change only being described in chat text */
    tr.ask-match, .cust-row.ask-match{background:var(--accent-soft) !important}
    tr.ask-dim, .cust-row.ask-dim{opacity:.32}
    /* real filter animation on the actual table — non-matches collapse
       away and the survivors close ranks, rather than leaving invisible
       rows behind as blank gaps.
       NOTE: a <tr> ignores max-height/transform, so hiding one has to be
       done with display:none — animating the cells' own padding first,
       then removing the row from layout once that transition finishes. */
    tr.ask-filtering > td, .cust-row.ask-filtering{
      transition:opacity .22s var(--enter),padding .22s var(--enter);
    }
    tr.ask-leaving > td{opacity:0;padding-top:0;padding-bottom:0;border:none}
    tr.ask-filtered-out{display:none}
    .cust-row.ask-filtered-out{
      display:none;
    }
    .list-card-head-right{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
    .list-card-count{font-family:'Fraunces',serif;color:var(--ink);font-size:17px;font-weight:560;white-space:nowrap}
    .list-icon-btn{
      width:26px;height:26px;flex:none;border-radius:8px;color:var(--ink-3);
      display:grid;place-items:center;transition:background .15s,color .15s;
    }
    .list-icon-btn:hover{background:var(--panel-3);color:var(--ink)}
    .list-icon-btn svg{width:14px;height:14px}

    /* ── column personalize / sort overlay — one shared panel, reused per table ── */
    .col-overlay-backdrop{
      position:fixed;inset:0;background:#1c1e2e33;z-index:70;
      opacity:0;pointer-events:none;transition:opacity .2s var(--enter);
    }
    .col-overlay-backdrop.open{opacity:1;pointer-events:auto}

    /* near-duplicate save warning — a toast, not a full modal, since this is
       a "you might not need to" nudge, not a blocking decision */
    .bm-dupe-toast{
      position:fixed;top:20px;left:50%;transform:translate(-50%,-14px);width:min(460px,92vw);
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow-hover);padding:14px 16px;z-index:90;
      display:flex;gap:11px;align-items:flex-start;
      opacity:0;pointer-events:none;transition:opacity .18s var(--enter),transform .18s var(--enter);
    }
    .bm-dupe-toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .bm-dupe-toast-icon{
      flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
      background:#e0902f1f;color:var(--amber);margin-top:1px;
    }
    .bm-dupe-toast-icon svg{width:14px;height:14px}
    .bm-dupe-toast-body{flex:1;min-width:0}
    .bm-dupe-toast-title{font-size:13px;font-weight:700;color:var(--ink)}
    .bm-dupe-toast-text{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:3px}
    .bm-dupe-toast-text b{color:var(--ink);font-weight:700}
    .bm-dupe-toast-actions{flex:none;display:flex;flex-direction:column;gap:6px}
    .bm-dupe-toast-actions .dash-btn{padding:6px 12px;font-size:11.5px;white-space:nowrap}

    .col-overlay{
      position:fixed;top:0;right:0;bottom:0;width:360px;max-width:92vw;
      background:var(--panel);border-left:1px solid var(--line);
      box-shadow:-16px 0 44px -14px #1c1e2e2e;z-index:71;
      display:flex;flex-direction:column;
      transform:translateX(100%);transition:transform .28s var(--enter);
    }
    .col-overlay.col-overlay-wide{width:460px}
    .col-overlay.hold-overlay-wide{width:min(1300px,94vw)}

    /* hold-detail no longer opens as a viewport overlay — it loads in
       place within the Holds pane itself, swapping in for the table.
       This resets the shared overlay positioning back to a normal
       in-flow block that just fills whatever container it's moved into. */
    .col-overlay.hold-overlay-embedded{
      position:static;width:100%;max-width:none;height:100%;
      transform:none;box-shadow:none;border-left:none;z-index:auto;
      display:none; /* only .open makes it visible — no more transform/fixed
                        trick to hide it off-screen now that it's in-flow */
    }
    .col-overlay.hold-overlay-embedded.open{display:flex}
    .hold-back-arrow{
      display:inline-flex;align-items:center;justify-content:center;flex:none;
      width:28px;height:28px;border-radius:8px;color:var(--ink-2);margin-right:2px;
    }
    .hold-back-arrow:hover{background:var(--hover);color:var(--ink)}
    .hold-back-arrow svg{width:15px;height:15px}

    /* ═══ Hold detail — full page brought over from the Legal Hold Detail
       reference: header + KPI strip + 8 tabs (Custodians, Notice,
       Interviews, Notes, Documents, Phone log, Activity log, More
       details), each tab a genuinely different information shape rather
       than one repeated template. Content adapted to this app's existing
       RIF 2026 hold (K. Simmons, J. Ward, 345 custodians, 38% ack'd)
       rather than swapping in the reference's own example data, so it
       stays consistent with the rest of the Holds table. ═══ */
    .hold-overlay-body{padding:0;overflow-y:auto;display:flex;flex-direction:column;background:var(--panel)}
    .hold-overlay-head{gap:20px}
    .hold-overlay-head-title{flex:none}
    /* the generic .pane-main is grey by design elsewhere (a canvas for
       white cards to float on) — hold-detail's own inner content wants a
       clean white surface instead, now that it's embedded rather than a
       viewport overlay with its own separate background handling */
    #holdOverlay .pane-main{background:var(--panel)}

    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}

    /* ═══════════════════════════════════════════════════════════════════
       HOLD DETAIL — REDESIGN

       Principles applied:
       1. ONE THING TO FOCUS ON. A legal hold succeeds or fails on one
          number: has everyone acknowledged? That gets a dedicated hero
          band with a progress bar — not a badge lost among six metadata
          items. Everything else is subordinate to it.
       2. TRIAGE OVER INVENTORY. Right under the number, the three counts
          that imply action (acknowledged / pending / silent), each
          clickable to filter. The page opens by telling you what to do,
          not by listing what exists.
       3. IDENTITY vs. STATE vs. CONTENT. Three distinct zones instead of
          one dense header: who this hold is (title bar), how it's doing
          (hero band), what's in it (sections below).
       4. SCROLL, NOT TABS. Eight tabs hid seven-eighths of the page and
          made the user hunt. Now every section is on one scrollable
          canvas with a sticky jump-nav that tracks position — the shape
          of the whole record is visible, and nothing is more than a
          click away. Each section gets real breathing room and its own
          clear header, so density never blurs the boundaries.
       5. COLD METADATA GOES LAST. Matter numbers and cost centers are
          reference material, not the point — they live at the bottom in
          a quiet grid instead of competing at the top.
    ═══════════════════════════════════════════════════════════════════ */

    /* ── zone 1: identity ── */
    .hd-idbar{
      flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:16px 30px;background:var(--panel);border-bottom:1px solid var(--line);
    }
    .hd-title{
      font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.015em;
      color:var(--ink);line-height:1.2;margin-right:2px;
    }
    .hd-status{
      display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);
      font:700 11.5px var(--font-sans);background:#2fb0791a;color:var(--green);flex:none;
    }
    .hd-status .dot{width:6px;height:6px;border-radius:99px;background:var(--green);box-shadow:0 0 0 3px #2fb07926}
    .hd-idbar-spacer{flex:1}
    .hd-idbar-actions{display:flex;align-items:center;gap:9px;flex:none}

    /* ── zone 2: the hero metric ── */
    .hd-hero{
      flex:none;display:flex;align-items:center;gap:34px;flex-wrap:wrap;
      padding:24px 30px 22px;background:var(--panel-3);border-bottom:1px solid var(--line);
    }
    .hd-hero-main{flex:1;min-width:280px}
    .hd-hero-label{
      font:700 10.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:7px;
    }
    .hd-hero-figure{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
    .hd-hero-pct{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.02em}
    .hd-hero-of{font:600 13.5px var(--font-sans);color:var(--ink-2)}
    .hd-hero-track{height:8px;border-radius:99px;background:var(--track);overflow:hidden;max-width:520px}
    .hd-hero-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--magenta))}
    .hd-hero-note{margin-top:9px;font:600 12.5px var(--font-sans);color:var(--ink-2)}
    .hd-hero-note strong{color:var(--magenta)}

    /* triage counts — the actionable split, each one a filter */
    .hd-triage{display:flex;gap:10px;flex:none;flex-wrap:wrap}
    .hd-triage-item{
      min-width:104px;padding:12px 16px;border-radius:var(--r-lg);
      background:var(--panel);border:1px solid var(--line);text-align:left;
      transition:border-color .15s,box-shadow .15s,transform .15s;
    }
    .hd-triage-item:hover{border-color:var(--accent);box-shadow:var(--shadow-card);transform:translateY(-1px)}
    .hd-triage-num{font:700 21px var(--font-sans);color:var(--ink);line-height:1.1}
    .hd-triage-item.warn .hd-triage-num{color:var(--orange)}
    .hd-triage-item.risk .hd-triage-num{color:var(--magenta)}
    .hd-triage-label{
      margin-top:3px;font:600 11.5px var(--font-sans);color:var(--ink-2);
      display:flex;align-items:center;gap:5px;
    }

    /* ── zone 3: scrollable canvas + sticky jump nav ── */
    .hd-body{flex:1;min-height:0;display:flex;overflow:hidden}
    .hd-jump{
      flex:none;width:184px;padding:20px 12px 20px 22px;overflow-y:auto;
      border-right:1px solid var(--line);background:var(--panel);
    }
    .hd-jump-head{
      display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;margin-bottom:8px;
    }
    .hd-jump-label{
      flex:1;font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);
    }
    /* reading-mode preference — deliberately quiet. Section-at-a-time suits
       scanning one area; continuous scroll suits reading the record end to
       end. Neither is right for everyone, so it's a preference rather than
       a decision imposed on the user, and it's remembered. */
    .hd-mode-toggle{
      width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;
      color:var(--ink-3);opacity:.55;transition:opacity .15s,background .15s,color .15s;
    }
    .hd-jump:hover .hd-mode-toggle{opacity:1}
    .hd-mode-toggle:hover{background:var(--hover);color:var(--ink-2)}
    .hd-mode-toggle svg{width:13px;height:13px}
    .hd-mode-ic-scroll{display:none}
    .hd-body.mode-scroll .hd-mode-ic-sections{display:none}
    .hd-body.mode-scroll .hd-mode-ic-scroll{display:block}

    /* continuous mode: every section on one canvas, dividers restored, and
       enough trailing room that the last section can still reach the top */
    .hd-body.mode-scroll .hd-section{display:block;border-top:1px solid var(--line)}
    .hd-body.mode-scroll .hd-section:first-child{border-top:none}
    .hd-body.mode-scroll .hd-scroll{scroll-behavior:smooth;padding-bottom:40vh}
    .hd-jump-item{
      display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:9px;
      font:600 12.5px var(--font-sans);color:var(--ink-2);text-align:left;
      transition:background .15s,color .15s;
    }
    .hd-jump-item:hover{background:var(--hover);color:var(--ink)}
    .hd-jump-item.current{background:var(--accent-soft);color:var(--accent);font-weight:700}
    .hd-jump-count{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:700}
    .hd-jump-item.current .hd-jump-count{color:var(--accent)}

    .hd-scroll{flex:1;min-width:0;overflow-y:auto;padding:0 30px 48px}
    /* generous, consistent rhythm — every section gets real room, and the
       trailing space above lets even the last section scroll to the top */
    .hd-section{padding:24px 0 4px}
    .hd-section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
    .hd-section-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
    .hd-section-count{font:700 12px var(--font-sans);color:var(--ink-3)}
    .hd-section-sub{font:500 12.5px var(--font-sans);color:var(--ink-3);margin-bottom:16px;line-height:1.5}
    .hd-section-actions{margin-left:auto;display:flex;gap:8px;align-self:center}

    /* preservation criteria — reference, kept compact and scannable */
    .hd-criteria-strip{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:14px 16px;border-radius:var(--r-lg);background:var(--panel-3);border:1px solid var(--line);
    }
    .hd-criteria-range{font:700 12.5px var(--font-sans);color:var(--ink);white-space:nowrap}
    .hd-criteria-sep{width:1px;height:16px;background:var(--line-strong)}

    /* ═══════════════════════════════════════════════════════════════════
       SUBPOENA PLAYBOOK DETAIL

       Design position: the PAGE is the workspace, chat is the assistant.
       A subpoena response spans court deadlines, external collection, and
       a redaction pass — it is not one sitting. So "where things stand"
       must be a place you can return to, not a position in a transcript.

       Each step is a proposal card in one of four states:
         waiting   — agent hasn't produced anything yet (locked, greyed)
         review    — agent produced something; the real editable content
                     is here, with an Approve action. This is where the
                     actual work happens.
         running   — system doing work, progress shown
         done      — collapses to a one-line receipt, still expandable

       Chat never restates what these cards show. It acts on them
       ("approve this"), edits them ("drop Elena"), or answers reasoning
       the page can't ("why these four custodians").
    ═══════════════════════════════════════════════════════════════════ */
    /* ═══════════════════════════════════════════════════════════════════
       SUBPOENA TIMELINE — the persisted record.
       The page does ONE job: show the sequence of steps and their
       outcomes, top to bottom. Native steps (Extraction, Validation)
       show their content with a working approve if still pending.
       Every other step is a receipt + link into the real record that
       owns it (Matter, Collection, Review, Production). No workspace,
       no strip — a chronology you can scan and resume from. ═══════════ */
    /* ═══════════════════════════════════════════════════════════════════
       AUDIT LOG — the subpoena detail view.

       This is a legal record first and a status view second. That drives
       every choice here: entries are chronological EVENTS (not step
       states), each carries an explicit timestamp and actor, nothing is
       ever hidden or collapsed away by default, and every entry links
       back to the conversation where the decision was actually made.
    ═══════════════════════════════════════════════════════════════════ */
    .al-head{
      flex:none;padding:18px 30px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    }
    .al-head-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
    .al-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);line-height:1.2}
    .al-sub{font:500 12.5px var(--font-sans);color:var(--ink-3);margin-top:4px}
    .al-sub .due{color:var(--magenta);font-weight:700}
    .al-actions{margin-left:auto;display:flex;gap:8px;flex:none}
    /* the case facts strip — reference data an auditor needs at a glance */
    .al-facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .al-fact-lab{font:700 9.5px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
    .al-fact-val{font:600 12.5px var(--font-sans);color:var(--ink)}

    .al-toolbar{
      flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      padding:10px 30px;background:var(--panel-3);border-bottom:1px solid var(--line);
      font:600 12px var(--font-sans);color:var(--ink-3);
    }
    .al-count{font-weight:700;color:var(--ink-2)}
    .al-filter{
      padding:4px 10px;border-radius:var(--r-pill);background:var(--panel);
      border:1px solid var(--line);color:var(--ink-2);font:700 11.5px var(--font-sans);
    }
    .al-filter.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .al-filter:hover{border-color:var(--line-strong)}

    .al-scroll{flex:1;min-height:0;overflow-y:auto;padding:20px 30px 60px}
    .al-wrap{max-width:820px;margin:0 auto}
    /* a date divider — an audit log is read by date first */
    .al-daysep{
      display:flex;align-items:center;gap:12px;margin:22px 0 12px;
      font:800 10.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    }
    .al-daysep:first-child{margin-top:0}
    .al-daysep::after{content:"";flex:1;height:1px;background:var(--line)}

    .al-entry{
      display:flex;gap:14px;padding:12px 14px;border-radius:var(--r-lg);
      border:1px solid transparent;transition:background .15s,border-color .15s;
    }
    .al-entry:hover{background:var(--panel-3);border-color:var(--line)}
    .al-entry.clickable{cursor:pointer}
    /* the entry whose step chat is currently showing — keeps the two
       surfaces visibly in agreement while both stay open */
    .al-entry.is-viewing{background:var(--accent-soft);border-color:rgba(122,79,214,.28)}
    /* timestamp column — fixed width so the log reads as a ledger */
    .al-time{
      flex:none;width:66px;padding-top:1px;text-align:right;
      font:600 11.5px var(--font-mono);color:var(--ink-3);
    }
    .al-icon{
      flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-3);margin-top:-1px;
    }
    .al-icon svg{width:13px;height:13px}
    .al-entry.ok .al-icon{background:#2fb0791a;color:var(--green)}
    .al-entry.action .al-icon{background:var(--accent-soft);color:var(--accent)}
    .al-entry.pending .al-icon{background:#e0902f1f;color:var(--amber)}
    .al-body{flex:1;min-width:0}
    .al-line{font:600 13px var(--font-sans);color:var(--ink);line-height:1.5}
    .al-line b{font-weight:800}
    .al-meta{font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:3px}
    .al-actor{font-weight:700;color:var(--ink-2)}
    /* the recorded detail — always visible, never collapsed. An audit log
       that hides its contents behind a chevron isn't an audit log. */
    .al-detail{
      margin-top:9px;padding:10px 12px;border-radius:9px;
      background:var(--panel-3);border:1px solid var(--line);
    }
    .al-entry:hover .al-detail{background:var(--panel)}
    .al-kv{display:flex;flex-wrap:wrap;gap:7px 20px}
    .al-kv-item{display:flex;flex-direction:column;gap:1px}
    .al-kv-lab{font:700 9.5px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
    .al-kv-val{font:600 12px var(--font-sans);color:var(--ink)}
    .al-note{font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.6}
    .al-jump{
      display:inline-flex;align-items:center;gap:6px;margin-top:9px;
      font:700 11.5px var(--font-sans);color:var(--accent);
    }
    .al-jump svg{width:11px;height:11px}
    .al-jump:hover{text-decoration:underline}
    .al-openrec{
      display:inline-flex;align-items:center;gap:7px;margin-top:9px;margin-left:14px;
      font:700 11.5px var(--font-sans);color:var(--ink-2);
    }
    .al-openrec:hover{color:var(--ink);text-decoration:underline}
    .al-openrec svg{width:11px;height:11px}
    /* not-yet-happened steps, listed after the log so the reader can see
       what remains without them masquerading as recorded events */
    /* ═══ MANUAL LOG COMPOSER — pinned below the timeline, always
       visible regardless of scroll. Deliberately NOT styled like the
       chat composer — this records something that already happened,
       it doesn't ask the agent to do anything. Whatever's logged here
       appends as a real, timestamped entry in the same chronological
       list, not a separate panel. ═══ */
    .al-composer{
      flex:none;padding:12px 30px 16px;background:var(--panel);border-top:1px solid var(--line);
    }
    .al-composer-tabs{display:flex;gap:6px;margin-bottom:9px}
    .al-composer-tab{
