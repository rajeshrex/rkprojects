      all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line);
      font:700 11.5px var(--font-sans);color:var(--ink-3);
    }
    .al-composer-tab svg{width:12px;height:12px}
    .al-composer-tab:hover{border-color:var(--line-strong);color:var(--ink)}
    .al-composer-tab.on{background:var(--panel-3);border-color:var(--line-strong);color:var(--ink)}
    .al-composer-row{display:flex;gap:8px;max-width:820px;margin:0 auto}
    .al-composer-in{
      flex:1;border:1px solid var(--line);border-radius:10px;background:var(--field);
      padding:9px 12px;font:500 13px var(--font-sans);color:var(--ink);resize:none;
    }
    .al-composer-in:focus{outline:none;border-color:var(--line-strong)}
    .al-composer-send{
      flex:none;padding:9px 16px;border-radius:10px;border:none;background:var(--ink);color:#fff;
      font:700 12.5px var(--font-sans);
    }
    .al-composer-send:hover{background:#000}
    .al-composer-send:disabled{opacity:.35;cursor:default}

    .al-upcoming{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
    .al-upcoming-lab{font:800 10.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
    .al-up-item{
      display:flex;align-items:center;gap:11px;padding:9px 14px;
      font:600 12.5px var(--font-sans);color:var(--ink-3);
    }
    .al-up-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none;margin-left:9px}

    /* ═══ INTAKE FLOW — the part that happens in chat, before the record
       exists. Once the extraction is approved the record is created and
       everything moves to the page; nothing below is used after that. ═══ */
    .ci-file{
      display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;
      background:var(--panel-3);border:1px solid var(--line);
      font:600 12.5px var(--font-sans);color:var(--ink);
    }
    .ci-file svg{width:14px;height:14px;flex:none;color:var(--accent)}
    .ci-think{
      display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;
      background:var(--panel-3);border:1px solid var(--line);
      font:600 13.5px var(--font-sans);color:var(--ink-2);
    }
    .ci-spin{
      width:12px;height:12px;flex:none;border-radius:50%;
      border:2px solid var(--line-strong);border-top-color:var(--accent);
      animation:ciSpin .7s linear infinite;
    }
    @keyframes ciSpin{to{transform:rotate(360deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ci-think.done .ci-spin{border:none;background:none;animation:none}
    .ci-think-toggle{
      margin-left:auto;flex:none;font:700 11px var(--font-sans);color:var(--accent);
    }
    .ci-think-body{
      display:none;margin-top:8px;padding:11px 12px;border-radius:9px;
      background:var(--panel);border:1px solid var(--line);
      font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.6;
    }
    .ci-think-body.open{display:block}

    /* the playbook offer — this is a real decision (commit to an 8-step
       workflow, or just parse the file), so it gets an explicit ask */
    .ci-offer{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
    .ci-offer-top{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line)}
    .ci-offer-ic{
      width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);
    }
    .ci-offer-ic svg{width:15px;height:15px}
    .ci-offer-name{font:700 14px var(--font-sans);color:var(--ink)}
    .ci-offer-type{font:500 12.5px var(--font-sans);color:var(--ink-3);margin-top:3px}
    .ci-offer-conf{
      flex:none;font:700 10.5px var(--font-sans);color:var(--accent);
      background:var(--accent-soft);border-radius:var(--r-pill);padding:3px 9px;
    }
    .ci-offer-body{padding:13px 14px}
    .ci-offer-desc{font:500 13.5px var(--font-sans);color:var(--ink-2);line-height:1.6;margin-bottom:14px}
    .ci-offer-steps{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;margin-bottom:16px}
    .ci-offer-step{display:flex;align-items:center;gap:8px;font:600 12.5px var(--font-sans);color:var(--ink-2)}
    .ci-offer-step i{
      width:16px;height:16px;flex:none;border-radius:50%;border:1.4px solid var(--line);
      display:grid;place-items:center;font-style:normal;font-size:8.5px;font-weight:800;
    }
    .ci-btn-row{display:flex;gap:8px;flex-wrap:wrap}
    .ci-btn{
      padding:9px 15px;border-radius:var(--r-pill);border:none;color:#fff;
      background:linear-gradient(115deg,var(--accent) 0%,#9b5cf0 45%,var(--magenta) 100%);
      font:800 12.5px var(--font-sans);box-shadow:0 4px 14px -4px #7a4fd680;
    }
    .ci-btn:hover{filter:brightness(1.07)}
    .ci-btn.ghost{
      background:var(--panel);color:var(--ink-2);border:1px solid var(--line);box-shadow:none;font-weight:700;
    }
    .ci-btn.ghost:hover{border-color:var(--line-strong);color:var(--ink)}

    /* extraction result — the one full card that lives in chat, because
       the record it would otherwise live on doesn't exist yet */
    .ci-extract{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:14px}
    .ci-extract-title{font:700 13.5px var(--font-sans);color:var(--ink);margin-bottom:13px}
    .ci-ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px}
    .ci-ex-f{display:flex;flex-direction:column;gap:4px;min-width:0}
    .ci-ex-lab{display:flex;align-items:center;gap:6px}
    .ci-ex-lab span{font:700 9.5px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
    .ci-ex-in{
      width:100%;border:1px solid var(--line);border-radius:7px;background:var(--field);
      padding:6px 9px;font:600 12px var(--font-sans);color:var(--ink);
    }
    .ci-ex-in:focus{outline:none;border-color:var(--accent)}
    /* ═══ STEP BLOCKS — chat as an execution log, not loose messages.
       Each step is one self-contained block: header (number + name +
       state), collapsible thinking, a short summary of what it produced,
       and a card linking to where the real output lives on the right.
       Selecting a step in either surface highlights it in the other. ═══ */
    /* ═══ STEP TRACKER — pinned at the top of the chat during a playbook
       run. One chip per step, live state, click to scroll to that step's
       card. Mirrors the reference's step strip. ═══ */
    /* ═══ STEP RAIL — ported exactly from the reference build.
       Sticky segmented progress bar above the chat. Segment states:
       done = solid green, running = accent with shimmer, needs-review =
       orange with pulse, future = dimmed line. Completed/current
       segments are clickable and grow on hover. ═══ */
    .run-tracker{
      display:none;position:sticky;top:0;z-index:40;flex:0 0 auto;
      background:var(--panel);border-bottom:1px solid var(--line);
      padding:12px 20px 11px;
    }
    .run-tracker.show{display:block}
    @keyframes pbSegShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @keyframes pbSegReviewPulse{0%,100%{opacity:1}50%{opacity:.5}}

    /* intro line that opens each step */
    /* step intro — reference invStepIntro: circular accent icon, uppercase
       "Step N of 10" eyebrow, then the intro sentence at 13.5px */
    /* ═══ STEP GROUPS — each step is one collapsible container. The
       running step is expanded; when the next begins, the previous
       collapses to a one-line summary the user can re-expand. Keeps a
       long run scannable instead of an endless scroll. ═══ */
    .sg{
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      margin:10px 0;overflow:hidden;transition:border-color .18s;
    }
    .sg.active{border-color:rgba(122,79,214,.35);box-shadow:0 0 0 3px #7a4fd614}
    .sg-head{
      all:unset;box-sizing:border-box;cursor:pointer;width:100%;
      display:flex;align-items:center;gap:10px;padding:12px 14px;
    }
    .sg-head:hover{background:var(--panel-3)}
    .sg.active .sg-head:hover{background:transparent}
    .sg-ic{
      width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-3);
    }
    .sg-ic svg{width:13px;height:13px}
    .sg.active .sg-ic{background:var(--accent-soft);color:var(--accent)}
    .sg.done .sg-ic{background:var(--green-soft);color:var(--green)}
    .sg-txt{flex:1;min-width:0;text-align:left}
    .sg-eyebrow{
      font:800 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-3);display:block;margin-bottom:2px;
    }
    .sg.active .sg-eyebrow{color:var(--accent)}
    .sg-name{font:700 13.5px var(--font-sans);color:var(--ink);display:block}
    .sg-summary{
      font:500 11.5px var(--font-sans);color:var(--ink-3);display:none;margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sg.collapsed .sg-summary{display:block}
    .sg-state{font:700 11px var(--font-sans);flex:none;color:var(--ink-3);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
    .sg.active .sg-state{color:var(--accent)}
    .sg.done .sg-state{color:var(--green)}
    /* who a pending step is assigned to — muted regardless of the state
       colour above it, since it's identity, not status */
    .sg-assignee{font-size:9.5px;font-weight:700;color:var(--ink-3);letter-spacing:.01em}
    .sg-chev{flex:none;color:var(--ink-3);transition:transform .18s}
    .sg-chev svg{width:13px;height:13px;display:block}
    .sg.collapsed .sg-chev{transform:rotate(-90deg)}
    .sg-body{padding:0 14px 14px;border-top:1px solid var(--line)}
    .sg.collapsed .sg-body{display:none}
    .sg-body-inner{padding-top:13px}

    .ci-intro{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .ci-intro-ic{
      width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
      display:flex;align-items:center;justify-content:center;flex:0 0 26px;color:var(--accent);
    }
    .ci-intro-ic svg{width:13px;height:13px}
    .ci-intro-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
    .ci-intro-text{font-size:13.5px;line-height:1.6;color:var(--ink);margin:0}
    /* thinking row — reference .think-row / .think-toggle / .think-body */
    .ci-think-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
    .ci-mini-spin{
      width:15px;height:15px;border-radius:50%;border:2px solid var(--line-strong);
      border-top-color:var(--accent);animation:spin .7s linear infinite;flex:0 0 auto;
    }
    .ci-think-toggle{
      all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
      font-size:11.5px;font-weight:600;color:var(--accent);padding:2px 8px;
      border:1px solid rgba(122,79,214,.2);border-radius:var(--r-pill);background:var(--accent-soft);
      transition:.12s;white-space:nowrap;margin-left:4px;
    }
    .ci-think-toggle svg{width:11px;height:11px}
    .ci-think-toggle.open svg{transform:rotate(180deg)}
    .ci-think-body{
      margin-top:10px;padding:12px 14px;background:var(--panel-3);border:1px solid var(--line);
      border-radius:var(--r-md);font-size:12.5px;color:var(--ink-2);line-height:1.7;display:none;position:relative;
    }
    .ci-think-body.open{display:block}

    /* ═══════════════════════════════════════════════════════════════════
       STEP BLOCK — four zones, fixed order, generous air between them:
         1 status header  (sg-head, present-participle status)
         2 plan           (.ci-plan — collapsed sub-step list)
         3 outcome        (.ci-outcome — one factual sentence)
         4 detail card    (.ci-sb-link — always last, always one)
       There is no approve in chat. Every confirmation lives on the right,
       next to the thing being confirmed — you shouldn't be able to
       approve something without having looked at it.
    ═══════════════════════════════════════════════════════════════════ */
    .sg-body-inner{padding-top:15px}
    .sg-body-inner > * + *{margin-top:20px}
    .pane-chat-msg-agent + .pane-chat-msg-agent{margin-top:12px}

    /* zone 2 — the plan. Toggle reads live status while running, then
       collapses to a step count once every sub-step has landed. */
    .ci-plan-toggle{
      all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
      font:600 12.5px var(--font-sans);color:var(--ink-2);
    }
    .ci-plan-toggle:hover{color:var(--ink)}
    .ci-plan-toggle .ci-plan-chev{width:13px;height:13px;flex:none;transition:transform .18s;color:var(--ink-3)}
    .ci-plan-toggle.open .ci-plan-chev{transform:rotate(180deg)}
    .ci-plan-body{display:none;margin-top:11px}
    .ci-plan-body.open{display:block}
    /* the vertical rule is what makes these read as nested under the
       step rather than as a flat list of findings */
    .ci-sub-rail{border-left:1px solid var(--line);margin-left:7px;padding-left:19px}
    .ci-sub-row{
      display:flex;align-items:flex-start;gap:10px;padding:7px 0;
      font:500 12.5px var(--font-sans);line-height:1.55;color:var(--ink-2);
      opacity:0;transform:translateY(-2px);transition:opacity .3s,transform .3s;
    }
    .ci-sub-row.in{opacity:1;transform:none}
    .ci-sub-mark{width:14px;height:14px;flex:none;margin-top:1px;display:grid;place-items:center}
    .ci-sub-mark svg{width:11px;height:11px;color:var(--green)}
    .ci-sub-dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}

    /* zone 3 — the outcome sentence. Reads as the answer, so it gets
       full ink and a slightly larger size than the sub-steps. */
    .ci-outcome{font:500 13.5px var(--font-sans);line-height:1.65;color:var(--ink);margin:0}
    .ci-outcome b{font-weight:700}

    /* inline step card (formcard equivalent) */
    /* ═══ RUN CARDS — ported from the reference build (.formcard, .fields,
       .finput, .btn, .badge-ok, .sc-confidence). Same paddings, radii,
       font sizes, focus rings and colours so the run renders identically. ═══ */
    .ci-formcard{
      border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-card);
      border-radius:var(--r-lg);padding:6px 22px 20px;margin-top:6px;
    }
    .ci-formcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:16px 0 18px}
    .ci-formcard-headL{display:flex;align-items:center;gap:10px;min-width:0}
    .ci-formcard-ic{
      width:28px;height:28px;border-radius:8px;background:var(--accent-soft);
      display:flex;align-items:center;justify-content:center;flex:0 0 28px;color:var(--accent);
    }
    .ci-formcard-ic svg{width:14px;height:14px}
    /* caps any icon dropped inline without its own sized wrapper —
       raw SVG_ICONS markup has no width/height, so anywhere it's used
       outside an existing sized class (ci-formcard-ic, ci-sb-link-ic,
       etc.) needs this or it renders at browser-default intrinsic size */
    .ci-icon-cap{width:15px;height:15px;flex:none;display:inline-flex}
    .ci-icon-cap svg{width:100%;height:100%;display:block}
    .ci-formcard-title{letter-spacing:-.4px;color:var(--ink);font-size:17px;font-weight:800;margin:0;font-family:Fraunces,serif}
    .ci-formcard-sub{font-size:11.5px;color:var(--ink-3);margin:2px 0 0}
    .ci-formcard-tag{
      letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);
      border-radius:var(--r-pill);flex:none;padding:3px 9px;font-size:10px;font-weight:700;white-space:nowrap;
    }
    /* who owns confirming this card — sits above the step tag/confidence
       so it reads before the mechanics of the step, not after */
    .ci-formcard-headR{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
    .ci-assignee{
      display:inline-flex;align-items:center;gap:5px;font:700 10.5px var(--font-sans);
      color:var(--ink-3);background:var(--panel-3);border:1px solid var(--line);
      border-radius:var(--r-pill);padding:2px 9px 2px 6px;white-space:nowrap;
    }
    .ci-assignee svg{width:10px;height:10px;flex:none}
    .ci-fc-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
    .ci-fc-f{min-width:0}
    .ci-fc-f.full{grid-column:1/-1}
    .ci-fc-lab{
      display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      margin-bottom:8px;font-size:12.5px;font-weight:600;color:var(--ink);
    }
    .ci-fc-lab > span:first-child{display:inline-flex;align-items:baseline;gap:8px;min-width:0}
    .ci-fc-in,.ci-fc-ta{
      all:unset;box-sizing:border-box;width:100%;color:var(--ink);background:var(--panel);
      border:1px solid var(--line-strong);border-radius:12px;padding:10px 13px;
      font-family:inherit;font-size:13.5px;font-weight:500;
      transition:border-color .16s,box-shadow .16s;
    }
    .ci-fc-in:focus,.ci-fc-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .ci-fc-ta{resize:vertical;min-height:64px;line-height:1.5}
    /* the "AI" suggestion tag — reference uses accent text, no chip bg */
    .ci-fc-sug{
      letter-spacing:.04em;text-transform:uppercase;border-radius:var(--r-pill);
      display:inline-flex;align-items:center;gap:3px;padding:0;font-size:9px;font-weight:800;
      line-height:1.5;white-space:nowrap;color:var(--accent);background:transparent;
    }
    /* ═══ CITATIONS — every extracted field links back to where in the
       source document it came from. A legal record that can't show its
       own sourcing isn't trustworthy; this is the difference between
       "the agent said so" and "here's the actual clause." ═══ */
    .cite-mark{
      all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:3px;
      font-size:10px;font-weight:700;color:var(--ink-3);background:var(--panel-3);
      border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 7px;margin-left:6px;
      transition:.12s;
    }
    .cite-mark:hover{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
    .cite-mark svg{width:9px;height:9px}
    /* evidence checklist — Validation's card gets its own citable proof,
       not just the extraction card's, so an approver never has to know
       a different step's card holds the source document */
    .ci-evid{margin-bottom:16px}
    .ci-evid-head{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
    .ci-evid-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
    .ci-evid-row:first-of-type{border-top:none}
    .ci-evid-check{width:16px;height:16px;border-radius:50%;background:var(--green-soft);color:var(--green);flex:none;display:grid;place-items:center}
    .ci-evid-check svg{width:9px;height:9px}
    .ci-evid-lab{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink)}
    .ci-evid-note{font-size:11px;font-weight:600;color:var(--ink-3)}
    /* side panel, same slide-in mechanics as .col-overlay — the rest of
       the UI stays visible and interactive, unlike a modal */
    .cite-panel{
      position:fixed;right:20px;width:400px;max-width:88vw;max-height:min(58vh,460px);
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      box-shadow:0 20px 48px -14px #1c1e2e33;z-index:200;
      display:flex;flex-direction:column;overflow:hidden;
      opacity:0;transform:translateY(-8px);pointer-events:none;
      transition:opacity .18s var(--enter),transform .18s var(--enter);
      /* top is set in JS to sit just under the rail, not stretched to it */
    }
    .cite-panel.open{opacity:1;transform:none;pointer-events:auto}
    .cite-modal-head{
      flex:none;display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);
    }
    .cite-modal-ic{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
    .cite-modal-ic svg{width:13px;height:13px}
    .cite-modal-doc{font:700 12.5px var(--font-sans);color:var(--ink)}
    .cite-modal-page{font:600 11px var(--font-sans);color:var(--ink-3)}
    .cite-modal-close{
      all:unset;box-sizing:border-box;cursor:pointer;margin-left:auto;width:24px;height:24px;
      border-radius:7px;display:grid;place-items:center;color:var(--ink-3);flex:none;
    }
    .cite-modal-close:hover{background:var(--hover);color:var(--ink)}
    .cite-modal-close svg{width:12px;height:12px}
    .cite-modal-field{
      flex:none;padding:10px 16px;background:var(--panel-3);border-bottom:1px solid var(--line);
      font:700 10px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
    }
    .cite-modal-body{
      flex:1;overflow-y:auto;padding:18px 20px;font:500 13.5px var(--font-sans);
      color:var(--ink-2);line-height:1.8;background:repeating-linear-gradient(var(--panel),var(--panel));
    }
    .cite-modal-body mark{
      background:#7a4fd633;color:var(--ink);font-weight:700;border-radius:3px;padding:0 2px;
    }
    .cite-modal-foot{
      flex:none;padding:10px 16px;border-top:1px solid var(--line);
      font:500 11px var(--font-sans);color:var(--ink-3);
    }
    /* scalable disambiguation — reads real holds, filters live, caps
       what's rendered. Never lists every hold; that breaks the moment
       there are more than a handful. */
    /* ═══ QUESTIONNAIRE — for requests with multiple real gaps (e.g.
       "release a custodian" with neither hold nor person named). One
       compact card, fields reveal progressively as each is answered,
       single submit at the end. For a single gap (just "which hold"),
       the lighter search-only resolver above is used instead — this is
       reserved for when there's genuinely more than one thing missing. ═══ */
    .qn-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow-card);padding:16px 18px;margin-top:4px}
    .qn-title{font:700 13.5px var(--font-sans);color:var(--ink);margin-bottom:2px}
    .qn-sub{font:500 12px var(--font-sans);color:var(--ink-3);margin-bottom:14px}
    .qn-field{margin-bottom:14px}
    .qn-field:last-of-type{margin-bottom:0}
    .qn-label{font:700 10.5px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
    .qn-chip{
      display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r-pill);
      background:var(--accent-soft);border:1px solid rgba(122,79,214,.22);
      font:700 12.5px var(--font-sans);color:var(--ink);
    }
    .qn-chip svg{width:11px;height:11px;color:var(--accent)}
    .qn-chip-edit{
      all:unset;box-sizing:border-box;cursor:pointer;color:var(--accent);font:700 11px var(--font-sans);
      margin-left:4px;
    }
    .qn-opt-row{display:flex;flex-direction:column;gap:5px}
    .qn-opt{
      all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;
      padding:8px 10px;border-radius:9px;border:1px solid var(--line);
    }
    .qn-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
    .qn-opt-ic{width:22px;height:22px;border-radius:50%;background:var(--panel-3);color:var(--ink-3);display:grid;place-items:center;flex:none;font:700 10px var(--font-sans)}
    .qn-opt-name{font:600 12.5px var(--font-sans);color:var(--ink);flex:1}
    .qn-opt-sub{font:500 11px var(--font-sans);color:var(--ink-3)}
    .qn-note{font:500 11.5px var(--font-sans);color:var(--ink-3);line-height:1.5;margin-top:4px}
    .qn-fade{animation:qnFade .22s var(--enter)}
    @keyframes qnFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

    .hr-search{
      width:100%;border:1px solid var(--line);border-radius:10px;background:var(--field);
      padding:9px 12px;font:500 13px var(--font-sans);color:var(--ink);margin-bottom:10px;
    }
    .hr-search:focus{outline:none;border-color:var(--accent)}
    .hr-results{display:flex;flex-direction:column;gap:5px}
    .hr-row{
      all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;
      padding:8px 10px;border-radius:9px;border:1px solid transparent;
    }
    .hr-row:hover{background:var(--hover)}
    .hr-row-ic{width:22px;height:22px;border-radius:6px;background:var(--panel-3);color:var(--ink-3);display:grid;place-items:center;flex:none}
    .hr-row-ic svg{width:11px;height:11px}
    .hr-row-name{font:600 12.5px var(--font-sans);color:var(--ink);flex:1;min-width:0;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hr-more{font:600 11.5px var(--font-sans);color:var(--ink-3);padding:4px 10px}
    .hr-empty{font:500 12.5px var(--font-sans);color:var(--ink-3);padding:8px 10px}

    /* approval row — reference .choice-row + .btn */
    .ci-approve{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
    .ci-approve-text{flex:1;min-width:170px;font-size:13px;color:var(--ink-2);line-height:1.55}
    .ci-approve-btn{
      all:unset;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
      border-radius:var(--r-pill);padding:7px 14px;transition:.15s;box-sizing:border-box;
      background:var(--accent);color:#fff;
    }
    .ci-approve-btn:hover{background:#6a3fc4}
    .ci-approve-ghost{
      all:unset;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
      border-radius:var(--r-pill);padding:7px 14px;transition:.15s;box-sizing:border-box;
      background:var(--panel-3);color:var(--ink-2);
    }
    .ci-approve-ghost:hover{background:var(--hover);color:var(--ink)}
    .ci-approved-badge{
      display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green);
      font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:var(--r-pill);
    }
    .ci-approved-badge svg{width:13px;height:13px}
    .ci-radio-row{display:flex;gap:20px;margin-bottom:14px}
    .ci-radio{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
    .ci-radio input{accent-color:var(--green);width:15px;height:15px}
    .ci-conf{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:#d1fae5;color:#065f46}

    .ci-stepblock{
      border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);
      overflow:hidden;transition:border-color .18s,box-shadow .18s;
    }
    .ci-stepblock.active{border-color:var(--accent);box-shadow:0 0 0 3px #7a4fd614}
    .ci-sb-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
    .ci-sb-num{
      width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;
      font:800 11px var(--font-sans);
      background:var(--panel-3);color:var(--ink-3);border:1.5px solid var(--line);
    }
    .ci-stepblock.running .ci-sb-num{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
    .ci-stepblock.review  .ci-sb-num{background:var(--accent);color:#fff;border-color:var(--accent)}
    .ci-stepblock.done    .ci-sb-num{background:var(--green);color:#fff;border-color:var(--green)}
    .ci-sb-num svg{width:12px;height:12px}
    .ci-sb-name{flex:1;min-width:0;font:700 13.5px var(--font-sans);color:var(--ink)}
    .ci-sb-state{
      flex:none;font:700 11px var(--font-sans);display:flex;align-items:center;gap:6px;
    }
    .ci-stepblock.running .ci-sb-state{color:var(--accent)}
    .ci-stepblock.review  .ci-sb-state{color:var(--accent)}
    .ci-stepblock.done    .ci-sb-state{color:var(--green)}
    .ci-sb-body{padding:0 14px 13px;display:flex;flex-direction:column;gap:10px}

    /* collapsible reasoning — present, but folded away by default so the
       log stays scannable */
    .ci-sb-think-btn{
      display:flex;align-items:center;gap:6px;align-self:flex-start;
      font:700 11.5px var(--font-sans);color:var(--ink-3);
      padding:4px 9px;border-radius:var(--r-pill);background:var(--panel-3);
    }
    .ci-sb-think-btn:hover{color:var(--ink);background:var(--hover)}
    .ci-sb-think-btn svg{width:10px;height:10px;transition:transform .18s}
    .ci-sb-think-btn.open svg{transform:rotate(90deg)}
    .ci-sb-think{
      display:none;padding:11px 13px;border-radius:9px;
      background:var(--panel-3);border:1px solid var(--line);
      font:500 12.5px var(--font-sans);color:var(--ink-2);line-height:1.65;
    }
    .ci-sb-think.open{display:block}

    /* ── In-chat progress: the agent works HERE, visibly, while the panel
       on the right stays stable. Status lines appear one at a time, tick
       off as they complete, then the summary and the result card land.
       Building in the panel instead meant watching the wrong side of the
       screen while chat sat idle. ── */
    .ci-sb-steps{display:flex;flex-direction:column;gap:9px}
    .ci-sb-line{
      display:flex;align-items:center;gap:9px;
      font:600 12.5px var(--font-sans);color:var(--ink-3);
      opacity:0;transform:translateY(3px);
      transition:opacity .32s var(--enter),transform .32s var(--enter),color .32s;
    }
    .ci-sb-line.in{opacity:1;transform:none}
    .ci-sb-line.active{color:var(--ink)}
    .ci-sb-line.done{color:var(--ink-2)}
    .ci-sb-line-ic{
      width:16px;height:16px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-3);
    }
    .ci-sb-line.active .ci-sb-line-ic{background:var(--accent-soft);color:var(--accent)}
    .ci-sb-line.done .ci-sb-line-ic{background:#2fb0791f;color:var(--green)}
    .ci-sb-line-ic svg{width:9px;height:9px}
    .ci-sb-line-ic .ci-spin{width:9px;height:9px;border-width:1.5px}
    /* summary and card arrive after the work, each fading in on its own */
    .ci-fade{animation:ciFade .4s var(--enter)}
    @keyframes ciFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .ci-sb-status{display:flex;align-items:center;gap:9px;font:600 12.5px var(--font-sans);color:var(--ink-2)}
    .ci-sb-status .ci-spin{width:11px;height:11px;border-width:1.6px;flex:none}
    .ci-sb-summary{font:500 13.5px var(--font-sans);color:var(--ink);line-height:1.6}
    .ci-sb-summary b{font-weight:700}

    /* the handoff card — chat says what it did, this points at where the
       real, editable output actually lives */
    /* ═══ LINK HIERARCHY — three weights, so "the thing to do now" never
       looks like "a record you could open sometime."
         .ci-sb-link            → quiet default: reference / already-done
         .ci-sb-link.is-action  → loud: the one thing awaiting the user
       Previously everything used one accent-filled style, which made a
       passive case-record link and a pending approval indistinguishable. ═══ */
    .ci-sb-link{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      padding:10px 12px;border-radius:10px;
      background:var(--panel);border:1px solid var(--line);
      transition:border-color .15s,background .15s;
    }
    .ci-sb-link:hover{border-color:var(--line-strong);background:var(--panel-3)}
    .ci-sb-link-ic{
      width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-3);
    }
    .ci-sb-link-ic svg{width:13px;height:13px}
    .ci-sb-link-t{font:700 12.5px var(--font-sans);color:var(--ink)}
    .ci-sb-link-s{font:500 11px var(--font-sans);color:var(--ink-3);margin-top:1px}
    .ci-sb-link-go{margin-left:auto;flex:none;color:var(--ink-3)}
    .ci-sb-link-go svg{width:13px;height:13px;display:block}
    /* the action variant — accent fill, ring, and a nudging arrow */
    .ci-sb-link.is-action{
      background:var(--accent-soft);border-color:transparent;
      box-shadow:0 0 0 2px var(--accent) inset;
    }
    .ci-sb-link.is-action:hover{background:#7a4fd62e}
    .ci-sb-link.is-action .ci-sb-link-ic{background:var(--accent);color:#fff}
    .ci-sb-link.is-action .ci-sb-link-s{color:var(--accent);font-weight:700}
    .ci-sb-link.is-action .ci-sb-link-go{color:var(--accent);animation:ciNudge 1.6s ease-in-out infinite}
    @keyframes ciNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
    /* Completed steps used to fade to .62 opacity so the live one stood
       out. In practice a dimmed block sitting directly above the one
       that's running reads as broken or disabled, not "done" — done
       steps already say so via their check icon, green state label, and
       collapsed summary, so no extra visual demotion is needed. */
    /* the step awaiting the user gets a warm ring, distinct from the
       accent ring used for "currently running" */
    .sg.awaiting{border-color:rgba(224,144,47,.5);box-shadow:0 0 0 3px #e0902f1f}
    .sg.awaiting .sg-ic{background:var(--pb-orange-soft);color:var(--pb-orange)}
    .sg.awaiting .sg-eyebrow{color:var(--pb-orange)}
    /* brief pulse when the other surface points at this step */
    @keyframes ciFlash{0%,100%{box-shadow:0 0 0 3px #7a4fd600}35%{box-shadow:0 0 0 4px #7a4fd63d}}
    .ci-flash{animation:ciFlash 1.1s var(--enter)}

    .ci-step-label{
      font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--accent);margin-bottom:7px;
    }
    /* the created-record chip — the handoff moment */
    .ci-record{
      display:flex;align-items:center;gap:10px;width:100%;text-align:left;
      padding:11px 13px;border-radius:var(--r-lg);
      background:var(--accent-soft);border:1px solid #7a4fd63d;
    }
    .ci-record:hover{border-color:var(--accent)}
    .ci-record-ic{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff}
    .ci-record-ic svg{width:14px;height:14px}
    .ci-record-name{font:700 13.5px var(--font-sans);color:var(--ink)}
    .ci-record-sub{font:500 11px var(--font-sans);color:var(--ink-3);margin-top:1px}
    .ci-record-go{margin-left:auto;flex:none;color:var(--accent)}
    .ci-record-go svg{width:13px;height:13px;display:block}

    .holdpage-head{
      display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap;
      padding:22px 28px 26px;background:var(--panel);border-bottom:1px solid var(--line);
    }
    .holdpage-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .holdpage-title{font-family:'Fraunces',serif;font-size:28px;font-weight:560;line-height:1.25;color:var(--ink);letter-spacing:-.01em}
    .hp-ack-badge{
      display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:var(--r-pill);flex:none;
      font:700 13px var(--font-sans);background:var(--accent-soft);color:var(--accent);
    }
    .hp-ack-dot{width:6px;height:6px;border-radius:99px;background:var(--accent)}
    .holdpage-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--ink-2);row-gap:8px}
    .holdpage-meta .dim{color:var(--ink-3)}
    .hp-criteria-label{font:700 11px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
    .hp-criteria-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px}
    .hp-criteria-range{font-weight:700;color:var(--ink-2);white-space:nowrap}
    .status-pill{
      display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-pill);
      font:700 12.5px var(--font-sans);background:#2fb0791a;color:var(--green);
    }
    .status-pill .dot{width:7px;height:7px;border-radius:99px;background:var(--green);box-shadow:0 0 0 3px #2fb07926}
    .holdpage-actions{display:flex;gap:12px;flex:none;margin-top:2px}

    .kpi-strip{margin:0 24px 14px;padding:16px 22px;display:flex;align-items:stretch;flex:none}
    .kpi-tile{flex:1;display:flex;align-items:flex-start;gap:11px;min-width:0;padding:0 6px}
    .kpi-divider{width:1px;background:var(--line);margin:2px 8px}
    .kpi-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;box-shadow:inset 0 1px 0 #ffffff59}
    .kpi-icon svg{width:14px;height:14px}
    .kpi-body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
    .kpi-label{font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .kpi-value-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
    .kpi-value{font:800 22px/1 var(--font-sans);color:var(--ink);letter-spacing:-.01em}
    .kpi-sub{font:600 11px var(--font-sans);color:var(--ink-3)}
    .kpi-foot{font:500 11px var(--font-sans);color:var(--ink-3)}
    .kpi-tile .hero-bar-track{margin-top:1px}
    .hero-bar-track{height:5px;border-radius:99px;background:var(--track);overflow:hidden}
    .hero-bar-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--magenta))}
    .hero-link{font:700 12px var(--font-sans);color:var(--accent);cursor:pointer;display:inline-block;margin-top:6px}
    .hero-link:hover{text-decoration:underline}
    .scope-range{display:flex;align-items:center;gap:10px;font:700 13px var(--font-sans);color:var(--ink)}
    .scope-line{flex:1;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--magenta));max-width:280px}
    .criteria-tags{display:flex;flex-wrap:wrap;gap:6px}
    .criteria-tag{padding:5px 12px;border-radius:7px;font:700 12px var(--font-sans);background:var(--accent-soft);color:var(--accent)}
    .criteria-tag.risk{background:var(--magenta-soft);color:var(--magenta)}

    /* ═══ New hold — crisp two-option choice (form vs chat), anchored as a
       popover just under the "+ New" button rather than a centered modal ═══ */
    .hold-create-choice-overlay{
      display:none;position:fixed;inset:0;z-index:200;background:transparent;
    }
    .hold-create-choice-overlay.open{display:block}
    .hold-create-choice-card{
      position:absolute;width:480px;max-width:92vw;max-height:80vh;overflow-y:auto;background:var(--panel);
      border:1px solid var(--line);border-radius:var(--r-xl);
      box-shadow:var(--shadow-hover);padding:24px 26px 20px;
      animation:hccIn .16s var(--enter);
    }
    @keyframes hccIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
    .hold-create-choice-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
    .hold-create-choice-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:4px}
    .hold-create-choice-sub{font:500 13px var(--font-sans);color:var(--ink-2)}
    .hold-create-choice-x{
      flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
      color:var(--ink-3);transition:background .15s,color .15s;
    }
    .hold-create-choice-x:hover{background:var(--hover);color:var(--ink)}
    .hold-create-choice-x svg{width:13px;height:13px}

    /* two primary input methods, presented as equal peer cards — pick one,
       provide input, then Continue in chat. Neither is pre-selected. */
    .hold-create-choice-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
    .hold-create-choice-opt{
      display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px 16px;
      border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--surface);
      text-align:left;transition:border-color .15s,background .15s,box-shadow .15s;
    }
    .hold-create-choice-opt:hover{border-color:var(--line-strong)}
    .hold-create-choice-opt.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px #7a4fd61a}
    .hold-create-choice-opt-icon{
      flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
      background:var(--panel-3);color:var(--ink-2);
    }
    .hold-create-choice-opt.selected .hold-create-choice-opt-icon{background:var(--accent);color:#fff}
    .hold-create-choice-opt-icon svg{width:16px;height:16px}
    .hold-create-choice-opt-title{font:700 13.5px var(--font-sans);color:var(--ink)}
    .hold-create-choice-opt-desc{font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.45}

    /* input area — swaps between an upload dropzone and a textarea
       depending on which option is selected; hidden until one is picked */
    .hold-create-choice-input{display:none;margin-bottom:18px}
    .hold-create-choice-input.show{display:block}
    .hold-create-choice-dropzone{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
      padding:26px 16px;border-radius:var(--r-lg);border:1.5px dashed var(--line-strong);
      background:var(--panel-3);text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
    }
    .hold-create-choice-dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
    .hold-create-choice-dropzone svg{width:20px;height:20px;color:var(--ink-3)}
    .hold-create-choice-dropzone-title{font:700 12.5px var(--font-sans);color:var(--ink)}
    .hold-create-choice-dropzone-sub{font:500 11.5px var(--font-sans);color:var(--ink-3)}
    .hold-create-choice-textarea{
      width:100%;min-height:96px;border-radius:var(--r-lg);border:1px solid var(--line);
      background:var(--field);padding:12px 14px;font:500 13px var(--font-sans);
      color:var(--ink);resize:vertical;
    }
    .hold-create-choice-textarea:focus{outline:none;border-color:var(--accent)}
    .hold-create-choice-file-chip{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-lg);
      background:var(--accent-soft);border:1px solid var(--accent);font:600 12.5px var(--font-sans);color:var(--accent);
    }
    .hold-create-choice-file-chip svg{width:13px;height:13px;flex:none}
    .hold-create-choice-file-x{margin-left:4px;opacity:.7}
    .hold-create-choice-file-x:hover{opacity:1}

    .hold-create-choice-continue{
      display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
      padding:12px;border-radius:var(--r-pill);border:none;
      background:var(--line-strong);color:var(--ink-3);
      font:700 13.5px var(--font-sans);cursor:not-allowed;
      transition:background .15s,color .15s,box-shadow .15s;
    }
    .hold-create-choice-continue.enabled{
      background:linear-gradient(115deg,var(--accent) 0%,#9b5cf0 45%,var(--magenta) 100%);
      color:#fff;cursor:pointer;box-shadow:0 4px 14px -4px #7a4fd680;
    }
    .hold-create-choice-continue.enabled:hover{filter:brightness(1.06)}
    .hold-create-choice-continue svg{width:13px;height:13px}

    .hold-create-choice-divider{
      display:flex;align-items:center;gap:10px;margin:18px 0 14px;
      font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    }
    .hold-create-choice-divider::before,.hold-create-choice-divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .hold-create-choice-scratch{
      display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;
      border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel);
      font:700 12.5px var(--font-sans);color:var(--ink-2);transition:border-color .15s,color .15s;
    }
    .hold-create-choice-scratch:hover{border-color:var(--line-strong);color:var(--ink)}
    .hold-create-choice-scratch svg{width:13px;height:13px}

    .holdpage-tabs{
      display:flex;flex:none;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);
      overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    }
    .holdpage-tabs::-webkit-scrollbar{display:none}
    .holdpage-tab{padding:13px 14px;border:0;background:none;cursor:pointer;font:700 13.5px var(--font-sans);color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap;flex:none;transition:color .15s}
    .holdpage-tab:hover{color:var(--ink)}
    .holdpage-tab .count{color:var(--ink-3);font-weight:700;margin-left:4px}
    .holdpage-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
    .holdpage-tab.active .count{color:var(--accent)}
    .holdpage-pane{display:none;padding:22px 24px 40px}
    /* One section at a time, selected from the jump nav. Scroll-spy on a
       single long canvas meant the nav could disagree with what you were
       reading, and opening the record scrolled you somewhere you hadn't
       asked to be. Showing only the chosen section makes the nav exact:
       what it highlights is definitionally what's on screen. */
    .hd-section{display:none}
    .hd-section.current{display:block}
    .holdpage-pane.active{display:block;flex:1;min-height:0;overflow-y:auto}

    .table-eyebrow{font:700 10px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:block}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    /* the placeholder needs ~380px; at 280px it wrapped to two lines and
       grew taller than the pills beside it. Flexible width with a floor,
       and a single non-wrapping line that ellipses if space runs out. */
    .search-field{
      flex:1 1 300px;min-width:0;max-width:420px;
      border:1px solid var(--line);border-radius:var(--r-pill);
      padding:7px 14px;height:34px;display:flex;align-items:center;
      font:500 13px var(--font-sans);color:var(--ink-3);background:var(--field);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .select-field{height:34px;display:inline-flex;align-items:center;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);font:700 12px var(--font-sans);color:var(--ink-2);background:var(--field);white-space:nowrap;flex:none}
    .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .filter-chip{padding:5px 11px;border-radius:7px;font:700 11.5px var(--font-sans);cursor:pointer;background:var(--panel-3);color:var(--ink-2)}

    /* ═══ Matters overview stat bar — four at-a-glance metrics above the
       list, each a number, a light secondary stat, a progress bar, and a
       one-line caption. Sits on the pane's own panel-3 wash, like the hold
       detail's hero band. ═══ */
    .mx-statbar{
      display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
      padding:16px;margin-bottom:18px;border-radius:var(--r-xl);
      background:var(--panel-3);border:1px solid var(--line);
    }
    .mx-stat-card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      padding:14px 16px;display:flex;flex-direction:column;gap:8px;
    }
    .mx-stat-label{
      font:700 10px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    }
    .mx-stat-figure{display:flex;align-items:baseline;gap:6px}
    .mx-stat-num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--ink);line-height:1}
    .mx-stat-of{font:600 12.5px var(--font-sans);color:var(--ink-3)}
    .mx-stat-track{height:5px;border-radius:99px;overflow:hidden;background:var(--track);display:flex}
    .mx-stat-caption{font:600 11px var(--font-sans);color:var(--ink-3)}
    .mx-stat-caption .warn{color:var(--magenta);font-weight:700}
    @media (max-width:900px){.mx-statbar{grid-template-columns:1fr 1fr}}
    .filter-chip.on{background:var(--accent);color:#fff}

    .pane-toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .add-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel);font:700 12px var(--font-sans);color:var(--ink-2);cursor:pointer;flex:none;white-space:nowrap}
    .add-btn:hover{border-color:var(--accent);color:var(--accent)}
    .add-btn svg{width:12px;height:12px}
    /* renamed from the reference's ".composer" — that name is already the
       ARMOUR landing page's main input box in this app; this is the small
       inline add-note/add-custodian/log-a-call form instead */
    .hp-composer{display:none;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;background:var(--field);margin-bottom:14px}
    .hp-composer.open{display:flex}
    .hp-composer textarea,.hp-composer input{
      border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:500 13px var(--font-sans);
      color:var(--ink);background:var(--panel);resize:vertical;width:100%;
    }
    .hp-composer textarea{min-height:64px}
    .hp-composer-row{display:flex;gap:10px;flex-wrap:wrap}
    .hp-composer-row > *{flex:1;min-width:140px}
    .hp-composer-actions{display:flex;justify-content:flex-end;gap:8px}

    .cust-card{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--panel)}
    .cust-row{display:grid;grid-template-columns:20px 18px 1.6fr 0.85fr 0.8fr 0.55fr 0.5fr 0.75fr 0.85fr 1fr;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
    .cust-row:last-child{border-bottom:none}
    .cust-row:hover{background:var(--hover)}
    .cust-row.head{cursor:default;background:var(--panel-3);font:700 9.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 14px}
    .cust-row.head:hover{background:var(--panel-3)}
    .cust-caret{color:var(--ink-3);font-size:10px;transition:transform .15s}
    .cust-caret.open{transform:rotate(90deg)}
    .cust-check{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
    .cust-person{display:flex;align-items:center;gap:9px}
    .cust-name{font:700 13px var(--font-sans);color:var(--ink)}
    .cust-role{font:500 11px var(--font-sans);color:var(--ink-3)}
    .cust-dept,.cust-manager{font:600 12.5px var(--font-sans);color:var(--ink-2)}
    .cust-region{font:600 12px var(--font-sans);color:var(--ink-3)}
    .cust-sources{font:700 12.5px var(--font-sans);color:var(--ink-2)}
    .cust-reminders{font:600 12px var(--font-sans);color:var(--ink-2)}
    .cust-days{font:600 12px/1.4 var(--font-sans);color:var(--ink-2)}
    .cust-days b{font-weight:700}
    .cust-expand{display:none;padding:2px 14px 14px;background:var(--panel-3)}
    .cust-expand.open{display:block}
    .cust-expand-grid{display:grid;grid-template-columns:1fr;gap:18px;padding-top:10px}
    .cust-expand-section{display:flex;flex-direction:column;gap:6px}
    .cust-expand-label{font:700 9.5px var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
    .cust-activity{display:flex;gap:7px;font:600 11.5px/1.4 var(--font-sans);color:var(--ink-2)}
    .cust-activity-dot{width:6px;height:6px;border-radius:99px;margin-top:5px;flex:none}
    .cust-expand-actions{display:flex;gap:7px;padding-top:4px}
    .cust-expand-actions .dash-btn{padding:6px 12px;font-size:11.5px}

    .bulk-bar{display:none;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);border-radius:var(--r-md);padding:10px 16px;margin-bottom:12px}
    .bulk-bar.show{display:flex}
    .bulk-count{font:700 13px var(--font-sans);color:#fff;white-space:nowrap}
    .bulk-actions{display:flex;gap:8px;flex-wrap:wrap;flex:1}
    .bulk-btn{padding:7px 13px;border-radius:8px;font:700 12px var(--font-sans);cursor:pointer;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
    .bulk-btn:hover{background:rgba(255,255,255,.2)}
    .bulk-btn.danger{background:var(--magenta);border-color:var(--magenta)}
    .bulk-clear{font:600 12px var(--font-sans);color:rgba(255,255,255,.7);cursor:pointer;white-space:nowrap}
    .bulk-clear:hover{color:#fff}
    .bulk-toast{font:600 12px var(--font-sans);color:#9ee6c4;white-space:nowrap}

    .footer-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 0;font:600 12px var(--font-sans);color:var(--ink-3)}

    .simple-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
    .simple-item{display:flex;justify-content:space-between;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
    /* the record just changed — a brief highlight on whatever was just
       added, so landing on the record after a Command Center action
       shows you exactly what happened, not just that something did */
    .simple-item.just-added{animation:justAddedFade 2.4s var(--enter)}
    .al-entry.just-added{animation:justAddedFade 2.4s var(--enter);border-radius:var(--r-lg)}
    @keyframes justAddedFade{
      0%{background:var(--accent-soft)}
      70%{background:var(--accent-soft)}
      100%{background:transparent}
    }
    .simple-item:last-child{border-bottom:0}
    .simple-title{font:700 14px var(--font-sans);color:var(--ink);margin-bottom:3px}
    .simple-sub{font:500 12.5px var(--font-sans);color:var(--ink-3)}
    .simple-side{text-align:right;font:600 12.5px var(--font-sans);color:var(--ink-3);white-space:nowrap}

    .notice-layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
    .notice-main{padding:20px 24px}
    .notice-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
    .notice-version-badge{display:inline-block;font:700 10.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:var(--r-pill);margin-bottom:8px}
    .notice-title{font:800 17px var(--font-sans);color:var(--ink);letter-spacing:-.005em;margin-bottom:4px}
    .notice-meta{font:600 12px var(--font-sans);color:var(--ink-3)}
    .notice-diff-key{display:flex;align-items:center;gap:7px;font:600 11.5px var(--font-sans);color:var(--ink-3);margin-bottom:14px}
    .diff-swatch{width:12px;height:12px;border-radius:4px;display:inline-block}
    .diff-swatch.add{background:#2fb0791a;border:1px solid #2fb07955}
    .notice-body{font:500 13.5px/1.8 var(--font-sans);color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
    .notice-body p{margin-bottom:12px}
    .notice-body p:last-child{margin-bottom:0}
    .notice-body mark.diff-add{background:#2fb07926;color:var(--ink);border-radius:3px;padding:0 2px;text-decoration:none;box-shadow:0 0 0 1px #2fb07940}
    .notice-versions{padding:16px 16px;display:flex;flex-direction:column;gap:8px}
    .version-item{border:1px solid var(--line);border-left:3px solid transparent;border-radius:var(--r-md);padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
    .version-item:hover{border-color:var(--line-strong)}
    .version-item.active{border-color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 8px -3px #7a4fd640}
    .version-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .version-num{font:800 13px var(--font-sans);color:var(--ink)}
    .version-item.active .version-num{color:var(--accent)}
    .version-date{font:600 11px var(--font-sans);color:var(--ink-3)}
    .version-desc{font:500 12px/1.4 var(--font-sans);color:var(--ink-2);margin-bottom:5px}
    .version-stat{font:600 11px var(--font-sans);color:var(--ink-3)}

    .interview-layout{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
    .interview-summary{padding:20px 24px}
    .interview-summary-head{display:flex;align-items:center;gap:9px;margin-bottom:16px}
    .summary-icon{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
    .summary-icon svg{width:12px;height:12px}
    .summary-label{font:700 10.5px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .qa-block{margin-bottom:16px}
    .qa-block:last-child{margin-bottom:0}

    /* these two were part of the original card-grid design and are still
       needed here — Activity log's connected timeline, and More details'
       fact grid — accidentally dropped when that old CSS block was
       replaced, since they were mixed in among the code being removed */
    .hold-fact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px}
    .hold-fact-strip-label{
      display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--ink-3);margin-bottom:2px;
    }
    .hold-fact-strip-value{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.35}

    .hold-timeline{display:flex;flex-direction:column}
    .hold-timeline-item{display:flex;gap:11px;padding-bottom:14px;position:relative}
    .hold-timeline-item:last-child{padding-bottom:0}
    .hold-timeline-item:not(:last-child)::before{
      content:"";position:absolute;left:4px;top:14px;bottom:0;width:1px;background:var(--line);
    }
    .hold-timeline-dot{
      width:9px;height:9px;border-radius:50%;flex:none;margin-top:3px;
      background:var(--panel-3);border:2px solid var(--ink-3);
    }
    .hold-timeline-dot.agent{background:var(--accent-soft);border-color:var(--accent)}
    .hold-timeline-body{min-width:0}
    .hold-timeline-head{display:flex;align-items:baseline;gap:7px;font-size:12px;margin-bottom:2px}
    .hold-timeline-head b{color:var(--ink);font-weight:700}
    .hold-timeline-head span{color:var(--ink-3);font-size:10.5px}
    .hold-timeline-text{font-size:12px;color:var(--ink-2);line-height:1.5}

    .qa-q{font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.4;margin-bottom:6px;padding-left:10px;border-left:2px solid var(--accent-soft)}
    .qa-a{font:500 13px/1.75 var(--font-sans);color:var(--ink-2)}
    .citation{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:700 12px var(--font-sans);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
    .citation:hover{background:var(--accent);color:#fff}
    .interview-list{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px}
    .interview-item{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;cursor:pointer;transition:border-color .15s,box-shadow .2s}
    .interview-item:hover{border-color:var(--line-strong)}
    .interview-item.active{border-color:var(--accent)}
    .interview-item.flash{box-shadow:0 0 0 3px var(--accent-soft)}
    .interview-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .interview-name{font:700 13px var(--font-sans);color:var(--ink)}
    .interview-status{font:700 10px var(--font-sans);padding:2px 8px;border-radius:99px;white-space:nowrap}
    .interview-status.done{background:#2fb0791a;color:var(--green)}
    .interview-status.scheduled{background:var(--panel-3);color:var(--ink-3)}
    .interview-sub{font:500 11.5px var(--font-sans);color:var(--ink-3);margin-top:2px}
    .interview-body{display:none;flex-direction:column;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
    .interview-body.open{display:flex}
    .interview-qa-item{display:flex;flex-direction:column;gap:3px}
    .interview-qa-q{font:700 11px var(--font-sans);color:var(--ink-3)}
    .interview-qa-a{font:500 12px/1.6 var(--font-sans);color:var(--ink-2)}
    .privilege-note{font:700 10.5px var(--font-sans);color:var(--magenta);background:var(--magenta-soft);padding:5px 9px;border-radius:7px;align-self:flex-start}

    @media (max-width:900px){
      .kpi-strip{flex-direction:column;gap:12px}
      .kpi-divider{display:none}
      .cust-row{grid-template-columns:20px 20px 1.6fr 1fr}
      .cust-row .cust-dept,.cust-row .cust-manager,.cust-row .cust-region,.cust-row .cust-sources,.cust-row .cust-reminders,.cust-row .cust-days{display:none}
      .notice-layout{grid-template-columns:1fr}
      .interview-layout{grid-template-columns:1fr}
    }
    .col-overlay.open{transform:translateX(0)}
    .col-overlay-head{
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      padding:18px 18px 14px;border-bottom:1px solid var(--line);flex:none;
    }
    .col-overlay-title{font-size:14.5px;font-weight:700;color:var(--ink)}
    .col-overlay-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
    .col-overlay-close{
      width:28px;height:28px;flex:none;border-radius:8px;color:var(--ink-3);
      display:grid;place-items:center;transition:background .15s,color .15s;
    }
    .col-overlay-close:hover{background:var(--panel-3);color:var(--ink)}
    .col-overlay-close svg{width:13px;height:13px}
    .col-overlay-body{flex:1;overflow-y:auto;padding:18px}

    .col-overlay-section{margin-bottom:24px}
    .col-overlay-section .eyebrow{margin-bottom:10px}
    .col-overlay-hint{font-size:11.5px;color:var(--ink-3);margin:-4px 0 10px}

    .col-item{
      display:flex;align-items:center;gap:8px;
      padding:7px 8px;border-radius:8px;transition:background .15s,opacity .15s;
      background:var(--panel);
    }
    .col-item:hover{background:var(--panel-3)}
    .col-item.dragging{opacity:.4}
    .col-item.drag-over{box-shadow:0 -2px 0 0 var(--accent)}
    .col-item-handle{
      width:16px;height:20px;flex:none;color:var(--ink-3);display:grid;place-items:center;
      cursor:grab;border-radius:3px;transition:color .15s;
    }
    .col-item-handle:hover{color:var(--ink)}
    .col-item-handle svg{width:10px;height:14px}
    .col-item-check{display:flex;align-items:center;gap:9px;flex:1;cursor:pointer}
    .col-item-check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
    .col-item-check span{font-size:13px;color:var(--ink);font-weight:600}

    .col-sort-row{display:flex;gap:8px}
    .col-sort-row select{
      flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);
      border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;
    }
    .col-sort-dir{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
    .col-sort-dir-btn{padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--panel)}
    .col-sort-dir-btn.active{background:var(--accent-soft);color:var(--accent)}

    .col-overlay-foot{
      flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:14px 18px;border-top:1px solid var(--line);
    }
    .col-overlay-reset{font-size:12px;font-weight:700;color:var(--accent)}
    .col-overlay-reset:hover{text-decoration:underline}
    .col-overlay-apply{
      color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;
      font-size:12.5px;font-weight:700;background:linear-gradient(135deg,#7a4fd6,#e23d7d);
    }
    .col-overlay-apply:hover{opacity:.92}

    /* table */
    .list-table-wrap{flex:1;min-height:0;overflow-y:auto;overflow-x:auto}
    .list-table{width:100%;border-collapse:collapse}
    .list-table th{
      text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-3);padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel-3);
      position:sticky;top:0;z-index:1;
    }
    .list-table td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);vertical-align:middle}
    .list-table tbody tr:last-child td{border-bottom:none}
    .list-table tbody tr{transition:background .12s}
    .list-table tbody tr:hover{background:var(--hover)}
    .list-table tbody tr.selected{background:var(--accent-soft)}
    .list-row-name{font-weight:700}
    /* Vault's icon+name needs a guaranteed same-line pairing — inline SVG
       next to text can wrap onto its own line once a column narrows, so
       this pins them into an explicit row instead of relying on default
       inline flow. Scoped to Vault rather than changing the shared
       .list-row-name, which many other tables use without an icon. */
    .vault-doc-name{display:flex;align-items:center;gap:7px;font-weight:700}
    .vault-doc-name svg{flex:none}
    .list-row-sub{color:var(--ink-3);font-size:11.5px;margin-top:1px}
    .list-check{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
    /* ═══════════════════════════════════════════════════════════════════
       MATTERS ROW ANALYTICS — Legal Holds / Collections / Interviews as
       inline progress+breakdown widgets instead of a single status pill.
       Each cell: bold headline stat, a segmented progress bar, and a small
       legend line naming what the segments mean. ═══════════════════════ */
    .mx-cell{display:flex;flex-direction:column;gap:5px;min-width:150px}
    .mx-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
    .mx-headline{font:700 13px var(--font-sans);color:var(--ink)}
    .mx-sub{font:600 11px var(--font-sans);color:var(--ink-3)}
    .mx-status-inline{display:flex;align-items:center;gap:5px;font:700 11px var(--font-sans)}
    .mx-status-inline .dot{width:5px;height:5px;border-radius:99px;flex:none}
    .mx-status-inline.running{color:var(--accent)}
    .mx-status-inline.running .dot{background:var(--accent)}
    .mx-status-inline.failed{color:var(--magenta)}
    .mx-status-inline.failed .dot{background:var(--magenta)}
    .mx-status-inline.done{color:var(--ink-3)}
    .mx-status-inline.done .dot{background:var(--ink-3)}

    .mx-track{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--track)}
    .mx-seg{height:100%}
    .mx-seg-ack{background:var(--ink-3)}
    .mx-seg-pending{background:var(--accent)}
    .mx-seg-overdue{background:var(--magenta)}
    .mx-seg-fill{background:linear-gradient(90deg,var(--accent),#9b5cf0)}
    .mx-seg-empty{background:var(--track)}

    .mx-legend{display:flex;flex-wrap:wrap;gap:8px;font:600 10.5px var(--font-sans);color:var(--ink-3)}
    .mx-legend b{font-weight:700}
    .mx-legend .overdue{color:var(--magenta);font-weight:700}
    .mx-legend .pending{color:var(--accent);font-weight:700}

    .mx-interview-track{display:flex;gap:3px}
    .mx-interview-seg{flex:1;height:6px;border-radius:3px;background:var(--track)}
    .mx-interview-seg.done{background:linear-gradient(90deg,var(--accent),#9b5cf0)}

    .mx-type-pill{
      display:inline-flex;padding:4px 10px;border-radius:var(--r-pill);background:var(--panel-3);
      font:700 11px var(--font-sans);color:var(--ink-2);white-space:nowrap;
    }
    .mx-team{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .mx-team-badge{
      width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
      font:800 9.5px var(--font-sans);background:var(--accent-soft);color:var(--accent);
    }
    .mx-team-name{font:600 12px var(--font-sans);color:var(--ink-2)}

    .list-status{

      display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
      padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;
    }
    .list-status.critical{background:var(--magenta-soft);color:var(--magenta)}
    .list-status.warning{background:#e0902f1f;color:var(--amber)}
    /* Vault privilege pills — Confidential reuses the standard critical
       (magenta) tone; Trade Secret gets its own purple so the two
       privilege types stay visually distinct from each other, matching
       the reference. */
    .list-status.priv-confidential{background:var(--magenta-soft);color:var(--magenta)}
    .list-status.priv-tradesecret{background:var(--accent-soft);color:var(--accent)}
    .list-status.success{background:#2fb0791a;color:var(--green)}
    .list-status.info{background:#5c8fff1a;color:#5c8fff}
    .list-status.neutral{background:var(--panel-3);color:var(--ink-2)}
    .list-pct-bar{width:64px;height:5px;border-radius:var(--r-pill);background:var(--track);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px}
    .list-pct-bar i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--accent),var(--magenta))}
    .list-row-go{width:24px;height:24px;color:var(--ink-3);border-radius:8px;display:grid;place-items:center}
    .dept-agg-link{font:700 13px var(--font-sans);color:var(--accent);text-align:left}
    .dept-agg-link:hover{text-decoration:underline}
    tr.dash-row{cursor:pointer}
    tr.dash-row:hover{background:var(--hover)}

    /* ═══════════════════════════════════════════════════════════════════
       EXPANDABLE ROWS — Matters / Employees / NCDS. Clicking a row's
       chevron unfolds a sub-grid beneath it: the linked Legal Holds,
       Interviews, Collections, and Productions for that record. Only
       Legal Holds items are live for now — they open the real hold detail
       page — everything else is a preview of the pattern, not yet wired.
    ═══════════════════════════════════════════════════════════════════ */
    tr.list-row-expandable{cursor:pointer}
    tr.list-row-expandable:hover{background:var(--hover)}
    .list-row-go.expand-toggle{transition:transform .18s var(--enter),background .15s,color .15s}
    tr.list-row-expandable:hover .expand-toggle{background:var(--panel-3);color:var(--ink)}
    tr.list-row-expanded .expand-toggle{transform:rotate(90deg);color:var(--accent)}

    tr.subgrid-row > td{padding:12px 14px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
    /* the panel is docked, not a slab — inset border + soft shadow so it
       reads as attached to the row above rather than a separate section */
    .subgrid{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
      box-shadow:inset 0 1px 0 #fff, 0 1px 3px -1px #1c1e2e14;
      animation:subgridIn .16s var(--enter);overflow:hidden;
    }
    .subgrid-cols{display:flex}
    @keyframes subgridIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    .subgrid-col{flex:1;min-width:0;padding:14px 18px}
    /* a hairline instead of a hard rule — spacing carries the separation,
       the line is just a faint hint, not a spreadsheet grid */
    .subgrid-col + .subgrid-col{border-left:1px solid var(--line);background:linear-gradient(90deg,#1c1e2e05,transparent 24px)}
    .subgrid-col-head{
      display:flex;align-items:center;gap:6px;margin-bottom:10px;
      font:700 10.5px var(--font-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
    }
    .subgrid-col-head svg{width:12px;height:12px;color:var(--ink-3);flex:none}
    .subgrid-col-count{
      margin-left:auto;color:var(--ink-3);font-weight:800;background:var(--panel-3);
      padding:1px 7px;border-radius:var(--r-pill);font-size:10px;
    }
    /* the live column gets the accent — visually distinct as "the one that
       works," rather than a caption underneath explaining the difference */
    .subgrid-col.is-live .subgrid-col-head{color:var(--accent)}
    .subgrid-col.is-live .subgrid-col-head svg{color:var(--accent)}
    .subgrid-col.is-live .subgrid-col-count{color:var(--accent);background:var(--accent-soft)}
    .subgrid-list{display:flex;flex-direction:column;gap:2px}
    /* flat rows with a hover state, not bordered boxes — matches the rest
       of this app's list rows instead of looking like disabled form fields */
    .subgrid-item{
      display:block;width:100%;text-align:left;padding:7px 8px;border-radius:7px;
      font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;border:none;
    }
    .subgrid-item-sub{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
    button.subgrid-item{
      cursor:pointer;color:var(--ink);position:relative;padding-right:22px;
      transition:background .15s,color .15s,padding-left .15s;
    }
    button.subgrid-item::after{
      content:"";position:absolute;right:8px;top:50%;width:6px;height:6px;
      border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);
      transform:translateY(-65%) rotate(-45deg);opacity:0;transition:opacity .15s,right .15s;
    }
    button.subgrid-item:hover{background:var(--accent-soft);color:var(--accent);padding-left:11px}
    button.subgrid-item:hover::after{opacity:1;right:6px}
    .subgrid-empty{font-size:12px;color:var(--ink-3);font-style:italic;padding:6px 8px}
    /* one honest note for the whole panel instead of the same caption
       repeated under three separate columns */
    .subgrid-soon{
      display:flex;align-items:center;gap:6px;padding:10px 18px;
      font:600 11px var(--font-sans);color:var(--ink-3);border-top:1px solid var(--line);
      background:var(--panel-3);
    }
    .subgrid-soon svg{width:12px;height:12px;flex:none;color:var(--ink-3)}
    .list-table tbody tr:hover .list-row-go{color:var(--ink);background:var(--panel-3)}
    .list-row-go svg{width:13px;height:13px}
    /* ═══════════════════════════════════════════════════════════════════
       APP CREATION PAGE + single-step panel. Setting a record up is not
       the same page as looking one up: there is no history to show, no
       status to read, nothing to link to yet. One column, the draft,
       and a decision.
    ═══════════════════════════════════════════════════════════════════ */
    .hd-status.draft{color:var(--pb-orange)}
    .hd-status.draft .dot{background:var(--pb-orange)}
    .asetup-scroll{flex:1;min-height:0;overflow-y:auto;padding:34px 30px 60px;background:var(--surface)}
    .asetup-wrap{max-width:720px;margin:0 auto}
    .asetup-eyebrow{
      font:700 10px var(--font-sans);letter-spacing:.09em;text-transform:uppercase;
      color:var(--accent);margin-bottom:9px;
    }
    .asetup-title{
      font-family:'Fraunces',serif;font-size:27px;font-weight:600;color:var(--ink);
      letter-spacing:-.015em;line-height:1.2;margin:0;
    }
    .asetup-desc{
      font:500 13.5px var(--font-sans);color:var(--ink-2);line-height:1.65;
      margin:11px 0 0;max-width:600px;
    }
    .asetup-prov{
      display:flex;align-items:center;gap:9px;margin:22px 0 20px;padding:11px 14px;
      border-radius:var(--r-lg);background:var(--accent-soft);border:1px solid #7a4fd62e;
      font:500 12px var(--font-sans);color:var(--ink-2);line-height:1.5;
    }
    /* the provenance mark is a raw inline SVG with no intrinsic size —
       without this it renders at full container width */
    .asetup-prov > svg{width:14px;height:14px;flex:none;color:var(--accent)}
    .asetup-prov b{color:var(--ink);font-weight:700}
    .asetup-prov-go{
      margin-left:auto;flex:none;padding:4px 11px;border-radius:99px;background:var(--panel);
      border:1px solid #7a4fd63d;font:700 11px var(--font-sans);color:var(--accent);
    }
    .asetup-prov-go:hover{background:var(--panel-3)}
    .asetup-body .ci-formcard{box-shadow:var(--shadow-card)}
    .asetup-cta{
      margin:16px 0 0;font:500 12px var(--font-sans);color:var(--ink-3);
      text-align:center;line-height:1.55;
    }

    /* ═══════════════════════════════════════════════════════════════════
       MATTER VIEW — the container everything else lives inside.

       One rule the layout has to carry visually: the matter-level strip
       above the scope filter is always the full picture; everything
       below the filter narrows. Position states it, so no one has to
       read a label to know which rule applies where.

       Sections come from the matter TYPE, not a global order — a
       subpoena matter and a DSAR matter list different sections in a
       different sequence. Process sections render as collapsible cards
       (many per matter, one per work item); entity sections render as
       rows that drill one level in.
    ═══════════════════════════════════════════════════════════════════ */
    .mv-host{display:none;flex-direction:column;flex:1;min-height:0}
    .mv-scroll{flex:1;min-height:0;overflow-y:auto}

    .mv-idbar{
      flex:none;display:flex;align-items:center;gap:11px;padding:14px 26px;
      border-bottom:1px solid var(--line);background:var(--panel);
    }
    .mv-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
    .mv-typepill{
      font:700 10.5px var(--font-sans);padding:3px 10px;border-radius:99px;
      background:var(--accent-soft);color:var(--accent);
    }
    .mv-idbar-spacer{flex:1}
    .mv-meta{
      display:inline-flex;align-items:center;gap:7px;font:600 11.5px var(--font-sans);
      color:var(--ink-3);background:none;padding:4px 9px;border-radius:var(--r-md);
    }
    .mv-meta:hover{background:var(--hover);color:var(--ink-2)}
    .mv-meta svg{width:11px;height:11px;transition:transform .18s}
    .mv-meta.open svg{transform:rotate(180deg)}
    /* matter identity expands here rather than being a tile you drill
       into — a record's own fields aren't a child record */
    .mv-identity{display:none;padding:14px 26px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
    .mv-identity.open{display:block}

    .mv-strip{
      flex:none;padding:13px 26px 15px;border-bottom:1px solid var(--line);background:var(--panel-3);
    }
    .mv-strip-lab{
      font:600 10.5px var(--font-sans);color:var(--ink-3);margin-bottom:9px;
    }
    .mv-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
    .mv-tile{
      display:flex;align-items:center;gap:9px;padding:10px 12px;text-align:left;
      background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
    }
    .mv-tile:hover{border-color:var(--line-strong);background:var(--hover)}
    .mv-tile-ic{flex:none;width:16px;height:16px;color:var(--ink-3)}
    .mv-tile-ic svg{width:16px;height:16px}
    .mv-tile-lab{flex:1;min-width:0;font:600 12px var(--font-sans);color:var(--ink-2)}
    .mv-tile-n{font:700 13px var(--font-sans);color:var(--ink)}

    .mv-scopebar{
      flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:11px 26px;border-bottom:1px solid var(--line);background:var(--panel);
    }
    .mv-scope-lab{font:600 11.5px var(--font-sans);color:var(--ink-3)}
    .mv-scope-btn{
      font:700 11.5px var(--font-sans);color:var(--ink-2);
      border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 13px;background:var(--panel);
    }
    .mv-scope-btn:hover{border-color:var(--line-strong);color:var(--ink)}
    .mv-scope-btn.on{background:var(--accent-soft);border-color:#7a4fd63d;color:var(--accent)}

    .mv-body{padding:20px 26px 44px}
    .mv-sec{margin-bottom:22px}
    .mv-sec.hide{display:none}
    .mv-sechead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
    .mv-sechead-ic{flex:none;width:16px;height:16px;color:var(--ink-3)}
    .mv-sechead-ic svg{width:16px;height:16px}
    .mv-secname{font:700 13px var(--font-sans);color:var(--ink)}
    .mv-ct{
      font:700 10.5px var(--font-sans);color:var(--ink-3);
      background:var(--panel-3);border-radius:99px;padding:2px 8px;
    }
    .mv-add{
      margin-left:auto;font:700 11px var(--font-sans);color:var(--ink-3);
      border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;background:var(--panel);
    }
    .mv-add:hover{border-color:var(--line-strong);color:var(--ink-2)}

    /* entity rows — drill one level in, same as a global list row */
    .mv-row{
      display:flex;align-items:center;gap:11px;width:100%;text-align:left;
      padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-md);
      margin-bottom:5px;background:var(--panel);
    }
    .mv-row:hover{background:var(--hover);border-color:var(--line-strong)}
    .mv-row-name{font:700 12.5px var(--font-sans);color:var(--ink)}
    .mv-row-meta{flex:1;min-width:0;font:600 11.5px var(--font-sans);color:var(--ink-3)}
